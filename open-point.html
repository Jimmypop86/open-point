<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: control-room desk. Status strip on top, network board left, operator panel right; stacks on phones. */
:root{
  --bg:#e7ecea; --panel:#f8faf9; --ink:#14201d; --muted:#5a6a66; --rule:#cdd6d2; --grid:#e2e8e5;
  --accent:#0c6a62; --accent-ink:#ffffff;
  --f1:#cc650a; --f2:#1b62c2; --f3:#8236bf; --f4:#0f8a6e; --f5:#b8327a; --f6:#6b7d12; --f7:#0e8aa8; --f8:#8a5a2b;
  --dead:#98a7a3; --fault:#cc2424; --ok:#14804a; --warn:#b3741a;
  --ground:#e2e8df; --road:#fbfcfa; --road-edge:#c8d0c6; --water:#b3d0e2; --park:#cbe0c0; --block:#d0d7ce;
  --water-edge:#9cc0d6; --tree:#a7cb98; --block-shadow:#bcc5bb; --grid-major:#d2dbd7;
  --sea:#c9dde8; --coast:#9fbccb; --contour:#c3cfbf; --paper:#fbf7ec; --paper-ink:#2b2a26;
  /* illustrated map, daytime */
  --land:#d7e8b9; --sand:#efdca9; --shallow:#b4def0; --sea:#8cc7de; --wave:#eaf7fc;
  --field-a:#c8e09b; --field-b:#e6e4a4; --field-c:#b3d58d; --hedge:#93b96c;
  --hill1:#b1d48a; --hill2:#9ac677; --hill3:#84b764; --peak:#73a157; --peak-l:#a8cd86;
  --wood:#a6cf85; --tree:#5e9f4c; --tree-d:#447c39; --trunk:#8a6a44;
  --wall:#fbf4e4; --roof:#d9684c; --roof2:#a9584a; --window:#8fcbe6; --window-off:#5b6468; --hshadow:rgba(60,70,40,.2);
  --water:#7cc0dc; --water-edge:#5aa9c9; --river-h:#d8f0f8; --road:#fffaf0; --road-edge:#d1bd8c; --water-deep:#66b2d3;
  --desk:#15242a; --desk-ink:#e6efec; --desk-muted:#91a7a2; --desk-rule:#2c4046; --desk-alarm:#ff6a5c; --desk-ok:#4fd18b;
  --display:'Saira Condensed','Arial Narrow',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1416; --panel:#132024; --ink:#e2ebe8; --muted:#8ea19c; --rule:#243538; --grid:#182a2e;
  --accent:#3dbfb2; --accent-ink:#06211e;
  --f1:#f39a3e; --f2:#5aa2f5; --f3:#b884f2; --f4:#3fcf9f; --f5:#f06aae; --f6:#b5c73a; --f7:#4cc9e6; --f8:#c9935c;
  --dead:#4b5d5a; --fault:#ff5a52; --ok:#43cf83; --warn:#e3a33f;
  --ground:#101b1d; --road:#22343a; --road-edge:#1a292d; --water:#123349; --park:#14291d; --block:#1a282b;
  --water-edge:#0c2536; --tree:#1d3d29; --block-shadow:#0b1416; --grid-major:#21373b;
  --sea:#08161f; --coast:#1c3a48; --contour:#21382b; --paper:#e9e3d2; --paper-ink:#24221d;
  /* illustrated map, night: windows glow where there is power */
  --land:#1c3324; --sand:#3a3928; --shallow:#11344a; --sea:#0a2131; --wave:#234f68;
  --field-a:#22402a; --field-b:#2e4a2c; --field-c:#1e3a27; --hedge:#2f5634;
  --hill1:#24442d; --hill2:#2b5135; --hill3:#335d3e; --peak:#3b6a45; --peak-l:#4b7c54;
  --wood:#203f29; --tree:#2e693b; --tree-d:#21512d; --trunk:#4a3a28;
  --wall:#3a3c36; --roof:#6d3a2d; --roof2:#55302a; --window:#ffd36b; --window-off:#161b1c; --hshadow:rgba(0,0,0,.35);
  --water:#15415a; --water-edge:#0f3347; --river-h:#2b6a88; --road:#4a4a3e; --road-edge:#2c2d26; --water-deep:#103750;
  --desk:#071012; --desk-ink:#e6efec; --desk-muted:#8197a0; --desk-rule:#22363b; --desk-alarm:#ff6a5c; --desk-ok:#4fd18b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1416; --panel:#132024; --ink:#e2ebe8; --muted:#8ea19c; --rule:#243538; --grid:#182a2e;
  --accent:#3dbfb2; --accent-ink:#06211e;
  --f1:#f39a3e; --f2:#5aa2f5; --f3:#b884f2; --f4:#3fcf9f; --f5:#f06aae; --f6:#b5c73a; --f7:#4cc9e6; --f8:#c9935c;
  --dead:#4b5d5a; --fault:#ff5a52; --ok:#43cf83; --warn:#e3a33f;
  --ground:#101b1d; --road:#22343a; --road-edge:#1a292d; --water:#123349; --park:#14291d; --block:#1a282b;
  --water-edge:#0c2536; --tree:#1d3d29; --block-shadow:#0b1416; --grid-major:#21373b;
  --sea:#08161f; --coast:#1c3a48; --contour:#21382b; --paper:#e9e3d2; --paper-ink:#24221d;
  /* illustrated map, night: windows glow where there is power */
  --land:#1c3324; --sand:#3a3928; --shallow:#11344a; --sea:#0a2131; --wave:#234f68;
  --field-a:#22402a; --field-b:#2e4a2c; --field-c:#1e3a27; --hedge:#2f5634;
  --hill1:#24442d; --hill2:#2b5135; --hill3:#335d3e; --peak:#3b6a45; --peak-l:#4b7c54;
  --wood:#203f29; --tree:#2e693b; --tree-d:#21512d; --trunk:#4a3a28;
  --wall:#3a3c36; --roof:#6d3a2d; --roof2:#55302a; --window:#ffd36b; --window-off:#161b1c; --hshadow:rgba(0,0,0,.35);
  --water:#15415a; --water-edge:#0f3347; --river-h:#2b6a88; --road:#4a4a3e; --road-edge:#2c2d26; --water-deep:#103750;
  --desk:#071012; --desk-ink:#e6efec; --desk-muted:#8197a0; --desk-rule:#22363b; --desk-alarm:#ff6a5c; --desk-ok:#4fd18b;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
body.mode-edit .play-only,body.mode-play .edit-only{display:none!important}
.app{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* status strip */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;background:var(--desk);color:var(--desk-ink);border-radius:8px;padding:14px 18px;
  box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--accent) 55%,var(--desk))}
.bar .brand p,.bar .stat label{color:var(--desk-muted)}
.bar .stat b{text-shadow:0 0 12px color-mix(in srgb,currentColor 35%,transparent)}
.bar .stat.off b{color:var(--desk-alarm)}
.bar .stat.off.zero b{color:var(--desk-ok)}
.bar .seg{background:transparent;border-color:var(--desk-rule)}
.bar .seg button{color:var(--desk-muted)}
.bar .seg button[aria-pressed="true"]{background:var(--desk-ink);color:var(--desk)}
.bar .ghost{background:transparent;border-color:var(--desk-rule);color:var(--desk-ink)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font:700 30px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.brand p{margin:2px 0 0;font:12px var(--mono);color:var(--muted);letter-spacing:.04em}
.bar .brand p.byline{font:600 13px var(--body);letter-spacing:.02em;color:var(--desk-ink);opacity:.9;margin-top:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px}
.stat label{display:block;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat b{font:600 22px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.stat.off b{color:var(--fault)}
.stat.off.zero b{color:var(--ok)}
.dn{font:700 10px var(--mono);letter-spacing:.08em;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:4px;color:#1d1405}
.dn.Day{background:#f2d43d}
.dn.Dusk{background:#f29a5a}
.dn.Dawn{background:#f6b98a}
.dn.Night{background:#2c3f78;color:#dfe6ff}
#pz{font:700 10px var(--mono);letter-spacing:.08em;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;padding:2px;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.ghost{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.ghost:hover{border-color:var(--accent)}

/* main */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.board{min-width:0;display:flex;flex-direction:column;gap:8px}
.stage-shell{position:relative}
.stage-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
.stage{position:relative;min-width:720px}
#svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
#svg.is-edit{touch-action:none}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:min(560px,90%);background:var(--ink);color:var(--panel);
  padding:9px 14px;border-radius:6px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:2}
#toast[hidden]{display:none}
#pausedPill{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);font:700 12px var(--mono);letter-spacing:.06em;background:var(--warn);color:#1d1405;border:0;border-radius:4px;padding:5px 10px;cursor:pointer}
#pausedPill[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:14px;flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .tb{border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer}
.toolbar .tb[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.toolhint{flex-basis:100%;font-size:13px;color:var(--muted)}

/* overlay */
#overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow-y:auto;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#overlay[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px 24px;max-width:480px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.mbox h2{font:700 30px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;text-wrap:balance}
.stars{font-size:26px;letter-spacing:4px;color:var(--warn);margin:6px 0 10px}
.stars i{font-style:normal;color:var(--rule)}
.mgrid{display:grid;grid-template-columns:1fr auto;gap:5px 16px;margin:12px 0;font-size:14px}
.mgrid b{font:600 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.mbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
textarea{width:100%;min-height:220px;font:12px/1.4 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:8px;resize:vertical}

/* side panel */
.side{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);border-radius:6px;min-width:0}
.side section{padding:14px 16px;border-top:1px solid var(--rule)}
.side section:first-child{border-top:0}
.side h2{font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.side h3,.h3{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.ph{display:flex;gap:10px;align-items:flex-start}
.ph .code{font:600 13px var(--mono);border:2px solid var(--ink);border-radius:4px;padding:2px 6px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;margin:10px 0 4px;
  background:color-mix(in srgb,var(--c) 15%,var(--panel));color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 50%,var(--panel))}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.trip{color:var(--fault);font-weight:700}
.note{margin:10px 0 0;font-size:13px;color:var(--muted)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.swrow:first-of-type{border-top:0}
.swrow.hl{background:color-mix(in srgb,var(--accent) 10%,transparent);margin:0 -8px;padding:8px;border-radius:4px}
.swname{font-size:14px;font-weight:700}
.swstate{font:12px var(--mono);color:var(--muted)}
.swstate.c::before{content:"■ "}
.swstate.o::before{content:"□ "}
.swstate .abn{color:var(--warn)}
.tag{font:600 10px var(--mono);border:1px solid var(--muted);border-radius:3px;padding:0 4px;color:var(--muted);margin-left:4px;vertical-align:2px}
.btn{border:0;border-radius:5px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;text-align:right;line-height:1.2}
.btn small{display:block;font-weight:400;font-size:11px;opacity:.85}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.danger{background:transparent;color:var(--fault);border:1.5px solid var(--fault)}
.btn.wide{width:100%;text-align:center;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{text-align:center}
.steps{margin:10px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted);font-size:13px}
.lead{margin:8px 0 0}
.phases{list-style:none;display:flex;gap:4px;padding:0;margin:12px 0 4px;font-size:12px}
.phases li{flex:1;padding:6px 8px;border-radius:4px;background:var(--grid);color:var(--muted);font-weight:700;line-height:1.2}
.phases li.now{background:var(--ink);color:var(--panel)}
.phases li.done{background:color-mix(in srgb,var(--ok) 22%,var(--panel));color:var(--ink)}
.todo{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;font-size:14px}
.load{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.load:last-child{margin-bottom:0}
.lh{display:flex;align-items:baseline;gap:8px;font-size:14px}
.lh .sw{width:10px;height:10px;border-radius:2px;flex:none;align-self:center}
.lh .nm{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh .num{margin-left:auto;font:600 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.lh .num.bad{color:var(--fault)}
.barl{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.barl i{display:block;height:100%}
.crews{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.cr-h{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.badge{font:700 11px var(--mono);background:var(--warn);color:#1d1405;border-radius:3px;padding:2px 5px;flex:none;margin-top:1px}
.q{margin:4px 0 0 34px;padding:0;list-style:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.q li{display:flex;gap:4px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 4px;margin-left:auto}
.x:hover{color:var(--fault)}
.seg.small button{font-size:12px;padding:4px 9px}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto;font-size:13px}
#log li{display:grid;grid-template-columns:42px 1fr;gap:8px}
#log time{font:12px var(--mono);color:var(--muted);padding-top:1px}
#log li.bad span{color:var(--fault);font-weight:700}
#log li.good span{color:var(--ok);font-weight:700}
#log li.warn span{color:var(--warn);font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.fld>span{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.fld input,.fld select{font:14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks,.tips{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.checks .e{color:var(--fault)}
.checks .w{color:var(--warn)}
.checks .ok{color:var(--ok);font-weight:700}

/* svg */
svg text{font-family:var(--body)}
.cable{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.cable.dead{stroke-dasharray:7 6}
.is-map .cable{stroke-width:3.5}
.hit{fill:none;stroke:transparent;stroke-width:22;cursor:pointer;stroke-linecap:round}
.halo{fill:none;stroke:var(--accent);stroke-opacity:.3;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.swm{cursor:pointer}
.swm .hb{fill:transparent}
.swm .m{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.swm.closed .m{fill:var(--ink)}
.swm:hover .m,.swm.sel .m{stroke:var(--accent);stroke-width:3}
.swm.sel.closed .m{fill:var(--accent)}
.swm .ab{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:3 2}
.swm .pr{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:3 3}
.swl{font:600 10px var(--mono);fill:var(--muted)}
.node{cursor:pointer;outline:none}
.node .box{stroke-width:2.5}
.node:hover .box,.node:focus-visible .box{stroke:var(--accent)!important}
.selring{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.pendring{fill:none;stroke:var(--accent);stroke-width:3}
.code{font:600 12px var(--mono);text-anchor:middle;fill:var(--ink)}
.lbl{font-weight:700;font-size:13px;fill:var(--ink)}
.lbl2{font:11px var(--mono);fill:var(--muted)}
.is-map .lbl,.is-map .lbl2{paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
.fpi line{stroke:var(--ink);stroke-width:1.5}
.fpi.trip path{fill:var(--fault)}
.fpi.clear path{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.fpi.unk text{font:700 12px var(--mono);fill:var(--muted)}
.rdot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.bus{fill:var(--ink)}
.plbl{font:700 15px var(--display);letter-spacing:.05em;text-transform:uppercase;fill:var(--ink)}
.fmark circle{fill:var(--fault)}
.fmark path{fill:#fff}
.okmark circle{fill:var(--ok)}
.okmark path{fill:none;stroke:#fff;stroke-width:2}

.river{fill:none;stroke:var(--water);stroke-width:16;stroke-linecap:round}
.park{fill:var(--park)}
.blk{fill:var(--block)}

.depot{fill:var(--muted)}

.ecable{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* living diagram: power flow, alarms, map detail */
.flow{fill:none;stroke:var(--panel);stroke-opacity:.9;stroke-width:1.6;stroke-dasharray:2 12;stroke-linecap:round;animation:flow 1.1s linear infinite;pointer-events:none}
.is-map .flow{stroke-width:1.3}
@keyframes flow{to{stroke-dashoffset:-14}}
.node .box{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.2))}
.alarm{fill:none;stroke:var(--fault);stroke-width:2;animation:alarm 1.6s ease-in-out infinite;pointer-events:none}
@keyframes alarm{0%,100%{opacity:.12}50%{opacity:.75}}
.lbl2.offc{fill:var(--fault);font-weight:600}
.swm.cbtrip .ab{stroke:var(--fault);stroke-dasharray:none;stroke-width:2.2;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.fmark .ring{fill:none;stroke:var(--fault);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(2.3);opacity:0}}
.van .body{fill:var(--warn);stroke:var(--panel);stroke-width:1.5;stroke-linejoin:round}
.van .wheel{fill:var(--ink);stroke:var(--panel);stroke-width:1}
.van text{font:700 8px var(--mono);fill:#1d1405;text-anchor:middle}
.river-e{fill:none;stroke:var(--water-edge);stroke-width:21;stroke-linecap:round}
.tree{fill:var(--tree)}
.blk-s{fill:var(--block-shadow)}
.sea{fill:var(--sea)}
.coast{fill:var(--ground);stroke:var(--coast);stroke-width:4;stroke-linejoin:round}
.contour{fill:none;stroke:var(--contour);stroke-width:1.4}
.townt{font:700 26px var(--display);letter-spacing:.22em;fill:var(--ink);opacity:.55;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.seat{font:italic 600 18px 'Kalam',cursive;letter-spacing:.12em;fill:var(--wave);opacity:.95}
/* illustrated map */
.land{fill:var(--land)}
.sand{fill:var(--sand);stroke:var(--sand);stroke-width:18;stroke-linejoin:round}
.shallow{fill:none;stroke:var(--shallow);stroke-width:60;stroke-linejoin:round}
.wave{fill:none;stroke:var(--wave);stroke-width:1.6;stroke-linecap:round;opacity:.75}
.fa{fill:var(--field-a)} .fb{fill:var(--field-b)} .fc{fill:var(--field-c)}
.field{stroke:var(--hedge);stroke-width:2.2;stroke-linejoin:round}
.furrow{stroke:var(--hedge);stroke-width:1;opacity:.55}
.hill1{fill:var(--hill1)} .hill2{fill:var(--hill2)} .hill3{fill:var(--hill3)}
.peak{fill:var(--peak)} .peak-l{fill:var(--peak-l)}
.wood{fill:var(--wood)}
.tr-c{fill:var(--tree)} .tr-d{fill:var(--tree-d)} .tr-t{fill:var(--trunk)}
.river-b{fill:var(--water-edge)}
.river-w{fill:var(--water)}
.river-d{fill:var(--water-deep)}
.sandbar{fill:var(--sand)}
.shallow-fill{fill:var(--shallow)}
.reed{fill:none;stroke:var(--tree-d);stroke-width:1.1;stroke-linecap:round}
.hs{fill:var(--hshadow)} .wall{fill:var(--wall)} .roof{fill:var(--roof)} .roof2{fill:var(--roof2)}
.win{fill:var(--window)}
.hood.off .win{fill:var(--window-off)}
/* The map is an illustration with its own palette; the game clock, not the device theme, decides day or night.
   --night (0..1) and --dusk (0..1) are set on the svg from the time of day. */
#svg.is-map{
  --land:#d7e8b9; --sand:#efdca9; --shallow:#b4def0; --sea:#8cc7de; --wave:#eaf7fc;
  --field-a:#c8e09b; --field-b:#e6e4a4; --field-c:#b3d58d; --hedge:#93b96c;
  --hill1:#b1d48a; --hill2:#9ac677; --hill3:#84b764; --peak:#73a157; --peak-l:#a8cd86;
  --wood:#a6cf85; --tree:#5e9f4c; --tree-d:#447c39; --trunk:#8a6a44;
  --wall:#fbf4e4; --roof:#d9684c; --roof2:#a9584a; --window:#8fcbe6; --window-off:#5b6468; --hshadow:rgba(60,70,40,.2);
  --water:#7cc0dc; --water-edge:#5aa9c9; --river-h:#d8f0f8; --road:#fffaf0; --road-edge:#d1bd8c; --water-deep:#66b2d3;
  --ink:#14201d; --muted:#5a6a66; --panel:#f8faf9; --dead:#98a7a3; --fault:#cc2424; --warn:#b3741a; --ok:#14804a; --accent:#0c6a62; --accent-ink:#ffffff;
  --f1:#cc650a; --f2:#1b62c2; --f3:#8236bf; --f4:#0f8a6e; --f5:#b8327a; --f6:#6b7d12; --f7:#0e8aa8; --f8:#8a5a2b;
}

.runway{fill:#5b6064}
.rw-c{stroke:#fbfbf7;stroke-width:1.3;stroke-dasharray:8 6}
.rw-m{fill:#fbfbf7}

.taxi{fill:#7a7f83}

.term-r{fill:#58707c}
.term-w{fill:#7fc4e2}
.tower{fill:#58707c}
.plane{fill:#fbfbf9;stroke:#4f5559;stroke-width:.6}
.rw-l{fill:#ffe9a3} .rw-g{fill:#5be38a} .lt-r{fill:#ff5a4a}
.quay{fill:#b9b5aa;stroke:#8f8a7e;stroke-width:1}
.breakwater{fill:none;stroke:#a7a296;stroke-width:7;stroke-linecap:round}

.crane{fill:none;stroke:#e0782f;stroke-width:1.6;stroke-linecap:round}

.deck{fill:#d9d5cb}
.ctr{stroke:rgba(0,0,0,.25);stroke-width:.4}
.c1{fill:#d84d3c} .c2{fill:#2f78c4} .c3{fill:#e7b13a} .c4{fill:#3d9a6a}
.ware{fill:#c9c7c0;stroke:#8f8a7e;stroke-width:.7} .ware-r{fill:#8e9aa0}
.rail-b{fill:none;stroke:#3a3d3f;stroke-width:4;stroke-linejoin:round}
.rail-t{fill:none;stroke:#fbfbf7;stroke-width:2;stroke-dasharray:6 6;stroke-linejoin:round}
.station{fill:#f3efe4;stroke:#3a3d3f;stroke-width:.8} .station-r{fill:#b4513e}
.yard{fill:#e2d6b0;stroke:#c9b98a;stroke-width:.8}
.barn{fill:#b5443a} .barn-r{fill:#7e2f28}
.silo{fill:#c9cdd0;stroke:#8d9397;stroke-width:.7} .silo-t{fill:#a7adb1}
.sheep{fill:#fbfaf4;stroke:#9b9a90;stroke-width:.5} .sh-h{fill:#3b3b38}
.cow{fill:#fbfaf4;stroke:#55534e;stroke-width:.5} .cow-s{fill:#2f2e2b}
.bale{fill:#e4c766;stroke:#b99a3e;stroke-width:.7}

.nightshade{fill:#061328;opacity:calc(var(--night,0)*.62);pointer-events:none}

.warnmark polygon{fill:var(--warn);stroke:var(--panel);stroke-width:1.5;stroke-linejoin:round}
.warnmark text{font:800 10px var(--mono);fill:#1d1405;text-anchor:middle}
.warnmark .ring{fill:none;stroke:var(--warn);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
/* control room home */
.mbox.wide{max-width:660px}
.fld .seg{flex-wrap:wrap}
.eyebrow{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 4px}
.letter{background:var(--paper);color:var(--paper-ink);font:17px/1.5 'Kalam',cursive;padding:18px 22px;border-radius:4px;margin:14px 0;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12);transform:rotate(-.4deg)}
.letter p{margin:0 0 10px}
.letter ul{margin:0 0 10px;padding-left:20px}

.shifts{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.brief{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--rule));background:color-mix(in srgb,var(--warn) 9%,var(--panel));border-radius:6px;padding:10px 12px;margin:12px 0 0;font-size:14px}
.brief b{display:block;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--warn);margin-bottom:2px}
/* storms, assessors, newsroom */
.pole{fill:var(--ink);opacity:.55;pointer-events:none}
.crew.as rect{fill:var(--accent)}
.crew.as text{fill:var(--accent-ink)}
.van.as .body{fill:var(--accent)}
.van.as text{fill:var(--accent-ink)}
.badge.as{background:var(--accent);color:var(--accent-ink)}
.wx-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wx-name{font:700 20px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}

.wlevel.Yellow{background:#f2d43d}
.wlevel.Amber{background:#f29a2e}
.wlevel.Red{background:#e2402f;color:#fff}
.gust{font:600 30px/1 var(--mono);font-variant-numeric:tabular-nums;margin-top:8px}
.gust small{font:13px var(--body);color:var(--muted);margin-left:6px}
.wxspark{width:100%;height:auto;display:block;margin-top:8px}
.wxspark .ln{fill:none;stroke:var(--ink);stroke-width:1.6}
.wxspark .ar{fill:color-mix(in srgb,var(--accent) 16%,transparent)}
.wxspark .lim{stroke:var(--fault);stroke-width:1;stroke-dasharray:4 3}
.wxspark .now{stroke:var(--accent);stroke-width:2}
.wxspark text{font:10px var(--mono);fill:var(--muted)}
.restrict{margin:8px 0 0;font-size:13px;padding:8px 10px;border-radius:5px;border:1px solid color-mix(in srgb,var(--fault) 45%,var(--rule));background:color-mix(in srgb,var(--fault) 8%,var(--panel))}
.restrict.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--rule));background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.conf{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:10px}

.req{border:1px solid color-mix(in srgb,var(--warn) 50%,var(--rule));border-radius:6px;padding:10px 12px;margin-bottom:10px;background:color-mix(in srgb,var(--warn) 7%,var(--panel))}

/* ---- help for new players ---- */
.term{text-decoration:underline dotted color-mix(in srgb,var(--accent) 70%,transparent);text-underline-offset:3px;cursor:help}
.tip{position:fixed;z-index:40;max-width:280px;background:var(--ink);color:var(--panel);font-size:13px;line-height:1.4;padding:8px 10px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.tip[hidden]{display:none}
.whybox,.hintbox{border-radius:6px;padding:10px 12px;margin:0 0 12px;font-size:14px;position:relative}
.whybox{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--rule));background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.hintbox{border:1px solid color-mix(in srgb,var(--warn) 50%,var(--rule));background:color-mix(in srgb,var(--warn) 9%,var(--panel))}
.whybox b,.hintbox b{display:block;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px}
.whybox b{color:var(--accent)} .hintbox b{color:var(--warn)}

.objs li.done .ob-i{color:var(--ok)} .objs li.failed{color:var(--muted)} .objs li.failed .ob-i{color:var(--fault)} .objs li.pending .ob-i{color:var(--muted)}
.prev{position:absolute;right:12px;top:56px;max-width:320px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:9px 11px;font-size:13px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:3;display:flex;flex-direction:column;gap:3px}

.pv-good{color:var(--ok);font-weight:700} .pv-bad{color:var(--fault);font-weight:700} .pv-warn{color:var(--warn);font-weight:700}

.hintring{fill:none;stroke:var(--warn);stroke-width:3;animation:alarm 1.2s ease-in-out infinite}
.coachring{fill:none;stroke:var(--warn);stroke-width:4;stroke-dasharray:6 4;animation:alarm 1s ease-in-out infinite}
.coach{position:absolute;left:12px;top:56px;width:min(340px,calc(100% - 24px));background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:4;font-size:14px}

.achs .medal{font-size:20px;color:var(--warn);line-height:1}

.money{margin:12px 0;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--bg)}
.money h3{margin:0 0 6px}

table.acct tr.good td{color:var(--ok)} table.acct tr.bad td{color:var(--fault)}
.promo{margin:10px 0;padding:10px 12px;border-radius:6px;background:color-mix(in srgb,var(--ok) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 45%,var(--rule));font-size:15px}
.gotach{margin:8px 0 0;font-size:14px} .gotach b{color:var(--ink)}
.share{margin:12px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px}

.mbox.msg .ph{display:flex;gap:12px;align-items:center}
.mbox.msg h2{margin:0}
.msgtext{font-size:16px;line-height:1.5;margin:14px 0 0}
.avatar{flex:none;border-radius:50%}
.btn.danger{color:var(--fault)}

.genbadge.enroute rect{stroke-dasharray:3 2;fill-opacity:.6}
.route.gen{stroke:#d9a514}
.badge.gn{background:#f2c230;color:#2a2205}
.btn.gen{background:#f2c230;color:#2a2205;border-color:#c99a12}

.genbox>b{display:block;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:#8a6a0a;margin-bottom:3px}
.genbox .btn{margin-top:8px}
.genunit .fan{animation:alarm 1s ease-in-out infinite}
.copyright{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.mbox.press{max-width:520px;border-top:5px solid var(--warn)}
.press-h{display:flex;gap:12px;align-items:center;margin-top:4px}
.press-h h2{margin:0}
.press-ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn);animation:ring .5s ease-in-out 4}

.press-q{margin:14px 0 10px;padding:10px 14px;border-left:3px solid var(--warn);background:var(--bg);font-size:16px;line-height:1.45;font-style:italic}
.press-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.press-btns .btn{flex:1 1 120px;text-align:center}

.rain{pointer-events:none;opacity:calc(var(--rain,0)*.55)}
.rain rect{animation:rainfall .5s linear infinite}
@keyframes rainfall{to{transform:translate(0,40px)}}
.flash{pointer-events:none;fill:#fff;opacity:0;animation:lightning 9s linear infinite}
@keyframes lightning{0%,93%,100%{opacity:0}94%{opacity:.35}95%{opacity:.05}96%{opacity:.28}97%{opacity:0}}

@keyframes sway{from{transform:translateX(-1.6px)}to{transform:translateX(1.6px)}}
.workicon{pointer-events:none}
.workicon .spark{animation:alarm .5s ease-in-out infinite}
.workicon .arm{animation:boom 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
@keyframes boom{from{transform:rotate(-8deg)}to{transform:rotate(6deg)}}
.flooded-water{fill:#4f8fc0;opacity:.55;pointer-events:none;animation:floodpulse 3s ease-in-out infinite}
@keyframes floodpulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function plen(path){ let L=0; for(let i=0;i<path.length-1;i++) L+=dist(path[i],path[i+1]); return L; }
function pointAlong(path,k){

  for(let i=0;i<path.length-1;i++){ const l=dist(path[i],path[i+1]); if(target<=l){ const f=l?target/l:0; return [path[i][0]+(path[i+1][0]-path[i][0])*f,path[i][1]+(path[i+1][1]-path[i][1])*f]; } target-=l; }

// Flood-fill from each closed breaker through cables closed at both ends. Islands fed by
// several breakers (a loop on one primary) share their load equally.
function solve(sw=S.sw){
  const feed={}, cab={}, parent={}, island={}, islands=[];
  for(const id of CBIDS){
    if(!sw[id]) continue;
    const c=CBL[id.split(':')[0]], fe=other(CB[id].end), start=c[fe];
    if(!cab[c.id]) cab[c.id]=id;
    if(!sw[c.id+':'+fe]) continue;
    if(island[start]!=null){ islands[island[start]].cbs.push(id); continue; }
    const k=islands.length, isl={cbs:[id],nodes:[start]}; islands.push(isl);
    island[start]=k; feed[start]=id; parent[start]={from:null,cable:c.id};
    const q=[start];
    while(q.length){
      const n=q.shift();
      for(const {c:cc,end} of INC[n]){
        if(!sw[cc.id+':'+end]) continue;
        if(!cab[cc.id]) cab[cc.id]=id;
        const oe=other(end), on=cc[oe];
        if(N[on].kind==='primary'||!sw[cc.id+':'+oe]||island[on]!=null) continue;
        island[on]=k; feed[on]=id; parent[on]={from:n,cable:cc.id}; isl.nodes.push(on); q.push(on);
      }
    }
  }
  return {feed,cab,parent,island,islands};
}
const islandOfCB = (sol,id)=>{ for(let k=0;k<sol.islands.length;k++) if(sol.islands[k].cbs.includes(id)) return k; return null; };
// load follows the time of day; f overrides it (the editor checks against the evening peak)
function cbLoad(sol,id,f){
  const k=islandOfCB(sol,id); if(k==null) return 0;
  const isl=sol.islands[k], mult=f!=null?f:(S?demand(S.t)*(S.heat?1.12:1)*(S.season==='Winter'?1.06:1):1);
  // a festival adds its own load while it is running
  const ev=f==null&&S&&S.festival&&S.t>=S.festival.from&&S.t<S.festival.to&&isl.nodes.includes(S.festival.node)?S.festival.amps:0;
  return (isl.nodes.reduce((a,n)=>a+N[n].cust,0)*AMPS*mult+ev)/isl.cbs.length;
}
// breaker rating, lowered in a heatwave because hot cables can carry less
function rat(id){ return Math.round(CB[id].rating*(S&&S.heat?0.88:1)); }
// seeded randomness, so a daily challenge plays out the same for everyone
let SEED=null;
function rand(){ if(SEED==null) return Math.random(); SEED=(SEED*16807)%2147483647; return (SEED-1)/2147483646; }
function seedFrom(str){ let h=2166136261; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return (Math.abs(h)%2147483646)+1; }

// ---------- Time of day ----------
const hourOf = t=>(((t%1440)+1440)%1440)/60;
// 0 in full daylight, 1 in full dark, with two-hour dusk and dawn
function darkness(t){ const h=hourOf(t); if(h>=21||h<5) return 1; if(h>=7&&h<19) return 0; return h>=19?(h-19)/2:1-(h-5)/2; }
// a warm glow centred on sunset and sunrise
function twilight(t){ const h=hourOf(t); return Math.max(0,1-Math.abs(h-20)/1.2,1-Math.abs(h-6)/1.2); }
function dayPhase(t){ const d=darkness(t); return d>=1?'Night':d<=0?'Day':hourOf(t)<12?'Dawn':'Dusk'; }
// share of the evening-peak demand, hour by hour
const DEMAND=[[0,.58],[4,.5],[6,.6],[8,.86],[11,.78],[15,.78],[17,.92],[18.5,1],[19.5,1],[21,.85],[22.5,.7],[24,.58]];
function demand(t){ const h=hourOf(t); for(let i=0;i<DEMAND.length-1;i++){ const [h0,v0]=DEMAND[i],[h1,v1]=DEMAND[i+1]; if(h>=h0&&h<=h1) return v0+(v1-v0)*(h-h0)/(h1-h0); } return 1; }
const nightWork = t=>darkness(t)>0.5;
function sidePrim(sol,n){ if(N[n].kind==='primary') return n; const k=sol.island[n]; return k==null?null:CB[sol.islands[k].cbs[0]].prim; }
function feedersOf(sol,cid){
  const c=CBL[cid], out=new Set();
  ['a','b'].forEach(e=>{
    const sid=cid+':'+e; if(!S.sw[sid]) return;
    if(CB[sid]){ out.add(sid); return; }
    const k=sol.island[c[e]]; if(k!=null) sol.islands[k].cbs.forEach(x=>out.add(x));
  });
  return [...out];
}
const offCount = ()=>RMUS.reduce((s,n)=>s+(S.on[n]?0:N[n].cust),0);
const crewOnSite = n=>S.crews.some(cr=>cr.at===n);
const faultOn = cid=>S.faults.find(f=>f.cable===cid&&f.active);
function log(text,kind=''){ S.log.unshift({t:S.t,text,kind}); if(S.log.length>120) S.log.pop(); }

// Protection: trip every breaker feeding an energised fault, then any breaker over its rating.
function protect(natural){
  const res={tripped:[],fault:false};
  for(let g=0;g<24;g++){
    const sol=solve(); let acted=false;
    for(const f of S.faults){
      if(!f.active) continue;
      const fe=feedersOf(sol,f.cable); if(!fe.length) continue;
      if(f.transient&&f.trips>0){
        f.active=false; acted=true;
        log(`No fault current on reclose. The fault on ${cableName(CBL[f.cable])} was transient and has cleared.`,'good');
        break;
      }
      const c=CBL[f.cable], path=new Set(), reset=new Set();
      fe.forEach(cb=>{ const k=islandOfCB(sol,cb); if(k!=null) sol.islands[k].nodes.forEach(n=>reset.add(n)); });
      ['a','b'].forEach(e=>{
        const n=c[e];
        // fault current flows out of the node feeding the cable, not the one downstream of it
        if(N[n].kind==='primary'||!S.sw[c.id+':'+e]||sol.island[n]==null||sol.parent[n].cable===c.id) return;
        let x=n; while(x){ path.add(x); x=sol.parent[x].from; }
      });
      // trainees see every flag; on the hardest level the odd indicator misreads, as real ones sometimes do
      reset.forEach(n=>{
        let trip=path.has(n); if(S.diff==='control'&&Math.random()<0.12) trip=!trip;
        S.fpi[n]={trip,known:S.diff==='trainee'||!!(S.upg&&S.upg.fpi)||!!N[n].remote||crewOnSite(n),t:S.t};
      });
      // the fault current's route, for the red pulse on the diagram: breaker cable, the path down, then the faulty cable
      const pc=new Set([f.cable]); fe.forEach(cb=>pc.add(cb.split(':')[0]));
      path.forEach(n=>{ if(sol.parent[n]&&sol.parent[n].cable) pc.add(sol.parent[n].cable); });
      UI.pulse={cables:[...pc],until:performance.now()+3800};
      fe.forEach(cb=>S.sw[cb]=false);
      f.trips++; res.tripped.push(...fe); res.fault=true; acted=true;
      if(!natural) S.faultTrips++;
      const names=fe.map(cb=>`CB ${CB[cb].name}`).join(' and ');
      log(natural?`${names} at ${N[CB[fe[0]].prim].name} tripped on earth fault protection.`:`${names} tripped. That operation energised a fault.`,'bad');
      setWhy(natural?`A fault on the network sent a surge of current through ${names}, so the breaker tripped to protect everything. All the customers it fed are off. The red pulse shows the path the fault current took.`
        :`That switching put power back onto the faulty cable, so ${names} tripped again. Cut the fault off from both sides before you switch anything back on.`);
      sfx('trip');
      break;
    }
    if(acted) continue;
    let tripped=false;
    for(const id of CBIDS){
      if(!S.sw[id]) continue;
      const a=cbLoad(sol,id);
      if(a>rat(id)+0.01){
        // trainees get a warning instead of a trip
        if(S.diff==='trainee'){ if(!S.ovWarned||S.ovWarned!==id){ S.ovWarned=id; setWhy(`${CB[id].name} ${CB[id].feeder} is overloaded (${Math.round(a)} A on a ${rat(id)} A breaker). On harder levels it would trip. Move some customers to another circuit.`); } continue; }
        S.sw[id]=false; S.overloads++; tripped=true; res.tripped.push(id);
        log(`CB ${CB[id].name} tripped on overcurrent: ${Math.round(a)} A against a ${rat(id)} A rating.`,'bad');
        setWhy(`${CB[id].name} ${CB[id].feeder} was asked to carry ${Math.round(a)} A, more than its ${rat(id)} A rating, so its breaker tripped. Split the load: feed some customers from one neighbour and the rest from another.`);
        sfx('trip');
        break;
      }
    }
    if(!tripped) break;
  }
  return res;
}
function updateOn(){
  const sol=solve();
  RMUS.forEach(n=>{
    // stolen low-voltage cables keep a substation's customers off even when the 11 kV side is live
    let fed=sol.island[n]!=null;
    // a backup generator carries its site for a while after the mains goes
    if(N[n].backup&&S.bkStart){
      if(fed) S.bkStart[n]=null;
      else { if(S.bkStart[n]==null){ S.bkStart[n]=S.t; log(`${N[n].site?N[n].site.name:N[n].hospital||N[n].name}: backup generator running (about ${fmtH(N[n].backup)}).`); } fed=S.t-S.bkStart[n]<N[n].backup; }
    }
    // a hired mobile generator carries the substation while it is cut off from the network
    const gen=genAt(n);
    if(gen&&gen.stage==='on'){ if(sol.island[n]!=null) genHome(gen,`Mains supply is back at ${N[n].name}, so generator ${gen.id} has been disconnected and is heading back to the depot.`); else fed=true; }
    const on=fed&&!S.lvOut[n];
    if(S.on[n]&&!on){ S.offSince[n]=S.t; S.counted[n]=false; S.affected+=N[n].cust; if(S.everOff&&S.everOff[n]==null) S.everOff[n]=S.t; }
    if(!S.on[n]&&on&&S.backAt) S.backAt[n]=S.t;
    S.on[n]=on;
  });
}
// Time passes: CML accrues for everyone off; an interruption counts toward CI once it reaches 3 minutes.
function accrue(dt){
  if(dt<=0) return;
  S.cml+=offCount()*dt;
  // customers ring in fast when they first lose supply, then again if it drags on
  RMUS.forEach(n=>{
    if(S.on[n]) return;
    // most people are asleep between 23:00 and 06:00; the morning brings a burst of calls from those who wake up without power
    const h=hourOf(S.t);
    const off=S.t-S.offSince[n], rate=(off<30?0.006:off<180?0.0012:0.002)*(h>=23||h<6?0.35:h>=6&&h<8.5&&off>60?1.8:1), c=N[n].cust*rate*dt, m=Math.floor(S.t);
    S.calls[m]=(S.calls[m]||0)+c; S.callsTotal+=c; S.callArea[areaOf(n)]=(S.callArea[areaOf(n)]||0)+c;
  });
  S.t+=dt;
  RMUS.forEach(n=>{
    if(!S.on[n]&&!S.counted[n]&&S.t-S.offSince[n]>=3-1e-9){ S.counted[n]=true; S.ci+=N[n].cust; }
    if(!S.on[n]&&S.maxOff) S.maxOff[n]=Math.max(S.maxOff[n]||0,S.t-S.offSince[n]);
  });
  // a sample every five minutes for the debrief timeline, and a frame for the replay
  if(S.hist&&(!S.hist.length||S.t-S.hist[S.hist.length-1][0]>=5)){ S.hist.push([S.t,offCount()]); recordFrame(); }
  // money and tiredness: crews cost more outside 07:00–17:00, and get tired the longer they work
  if(S.cost&&S.crews){
    const h=hourOf(S.t), ot=h<7||h>=17;
    S.crews.forEach(cr=>{
      if(cr.restUntil&&S.t<cr.restUntil) return;
      if(cr.job||cr.queue.length){ cr.worked=(cr.worked||0)+dt; if(ot) S.cost.overtime+=dt; else S.cost.crew+=dt; }
    });
    (S.gens||[]).forEach(g=>{ if(g.stage==='on') S.cost.generators=(S.cost.generators||0)+GEN.hourly*dt/60; });
  }
}
function callsRecent(){
  let s=0; for(const k in S.calls){ if(+k>S.t-15) s+=S.calls[k]; else if(+k<S.t-60) delete S.calls[k]; }
  return s;
}
function isNormal(){ return Object.keys(S.sw).every(k=>S.sw[k]===!NOPS.has(k)); }
// newsroom and public-report events never hold up the end of an incident
const INCIDENT_KINDS=new Set(['fault','digin','theft','floodhit','floodclear','vehicle','poledl','lv']);
const incidentPending = ()=>S.pending.some(e=>INCIDENT_KINDS.has(e.kind))||!!(S.pole&&!S.pole.done);
function allClear(){
  return !incidentPending()&&S.faults.every(f=>!f.active)&&!RMUS.some(n=>S.theft[n]||(S.flooded&&S.flooded[n])||(S.lvFault&&S.lvFault[n]))
    &&(!S.planned||S.planned.state==='done')&&offCount()===0&&isNormal()&&!(S.gens||[]).some(g=>g.stage==='on'||g.stage==='setup');
}
// switchgear nobody may touch: after a theft, or while a substation is under flood water
const locked = n=>!!((S.theft&&S.theft[n])||(S.flooded&&S.flooded[n]));
function snapshotStats(){ return {t:S.t,ci:S.ci,cml:S.cml,affected:S.affected,ops:S.ops,faultTrips:S.faultTrips,overloads:S.overloads,safety:S.safety,rep:Math.round(S.rep),calls:Math.round(S.callsTotal),hints:S.hintsL3||0,undos:S.undos||0}; }
function checkPhase(){
  if(S.phase==='closed') return;
  // planned work has no emergency stage: it closes once the job is done and the network is back to normal
  if(S.phase==='planned'){
    if(S.planned&&S.planned.state==='done'&&allClear()){ S.restored=snapshotStats(); recordStars(); S.phase='closed'; S.paused=true; S.modal='closed'; S.closedAt=S.t; log('Planned work complete and the network is back in normal running.','good'); sfx('chime'); onShiftEnd(); }
    return;
  }
  if(S.phase==='restore'&&!incidentPending()&&offCount()===0){
    S.phase='repair'; S.restored=snapshotStats(); recordStars();
    log('All customers back on supply.','good'); sfx('chime');
    if(!allClear()){ S.paused=true; S.modal='restored'; }
  }
  if(S.phase==='repair'&&allClear()){
    S.phase='closed'; S.paused=true; S.modal='closed'; S.closedAt=S.t;
    log('Network back in normal running. Incident closed.','good');
    onShiftEnd();
  }
}

// ---------- Weather ----------
// Storm gusts follow a bell curve around the peak; outside storms the wind stays light.
function windAt(t){
  const w=S.weather; if(!w) return 0;
  if(!w.storm) return w.calm;
  const g=w.base+(w.peak-w.base)*Math.exp(-Math.pow((t-w.tp)/w.width,2));

function windOK(t){ for(let k=0;k<900;k++) if(windAt(t+k)<WIND_LIMIT) return t+k; return t+900; }
const warnLevel = g=>g>=75?'Red':g>=55?'Amber':g>=40?'Yellow':null;

// ---------- Newsroom ----------
function rep(d){ S.rep=Math.max(0,Math.min(100,S.rep+d)); }
function news(outlet,text,d=0){
  S.news.unshift({t:S.t,outlet:outlet||OUTLETS[Math.floor(Math.random()*OUTLETS.length)],text});
  if(S.news.length>40) S.news.pop();
  if(d) rep(d);
}
function offByArea(){ const o={}; RMUS.forEach(n=>{ if(!S.on[n]) o[areaOf(n)]=(o[areaOf(n)]||0)+N[n].cust; }); return o; }
function schedule(ev){ const i=S.pending.findIndex(e=>e.t>ev.t); if(i<0) S.pending.push(ev); else S.pending.splice(i,0,ev); }
function newsCheck(){
  if(!S||!S.newsFlags) return;
  const F=S.newsFlags, off=offCount();
  if(off>=2000&&!F.thousands){ F.thousands=1; news(null,`Thousands without power across ${NET.name}`,-2); }
  RMUS.filter(n=>N[n].hospital).forEach(n=>{
    const h=N[n].hospital, dn=S.on[n]?0:S.t-S.offSince[n];
    if(dn>=30&&!F['g1'+n]){ F['g1'+n]=1; F['gok'+n]=0; news(null,`${h} switches to backup generators`,-4); }
    if(dn>=240&&!F['g2'+n]){ F['g2'+n]=1; news(null,`Fears for patients as ${h} generators run low`,-10); }
    if(S.on[n]&&F['g1'+n]&&!F['gok'+n]){ F['gok'+n]=1; news(null,`Mains power back at ${h}`,2); }
  });
  // vulnerable customers off for over an hour without a welfare visit
  RMUS.forEach(n=>{ if(!S.on[n]&&S.t-S.offSince[n]>=60&&!(S.welfare&&S.welfare[n])&&!F['psr'+n]){ F['psr'+n]=1; S.psrMissed=(S.psrMissed||0)+1; news(null,`Elderly and vulnerable residents in ${N[n].name} without power for over an hour`,-3); } });

  if(S.festival&&S.t>=S.festival.from&&S.t<S.festival.to&&!S.on[S.festival.node]&&!F.fest){ F.fest=1; S.festFail=true; news(null,'Festival stage plunged into darkness',-6); }
  // major sites such as the airport and the docks make the news if they are left without power
  RMUS.filter(n=>N[n].site).forEach(n=>{
    const s=N[n].site, dn=S.on[n]?0:S.t-S.offSince[n];
    if(dn>=20&&!F['s1'+n]){ F['s1'+n]=1; F['sok'+n]=0; news(null,s.off,-3); }
    if(S.on[n]&&F['s1'+n]&&!F['sok'+n]){ F['sok'+n]=1; F['s1'+n]=0; news(null,s.back,1); }
  });
  const oa=offByArea();
  Object.keys(S.areaHit).forEach(a=>{ if(S.areaHit[a]&&!oa[a]){ S.areaHit[a]=false; news(null,`Lights back on in ${a}`,1); } });
  Object.keys(oa).forEach(a=>{ if(oa[a]>=200) S.areaHit[a]=true; });
  if(S.safety>(F.safety||0)){ F.safety=S.safety; news(null,'Investigation launched after electricity crew safety incident',-10); }
  if(S.overloads>(F.overloads||0)){ F.overloads=S.overloads; news(null,'Second power cut as overloaded line trips',-3); }
  if(S.weather.storm&&windAt(S.t)>=75&&!F.red){ F.red=1; news('Met Office',`Red warning: gusts of ${windAt(S.t)} mph recorded at Faraday Head`); }
}
function makeMediaRequest(){

  const oa=offByArea(), areas=Object.keys(oa).sort((a,b)=>oa[b]-oa[a]);
  if(areas.length){
    const area=areas[0], id=++S.mediaSeq, outlet=OUTLETS[Math.floor(Math.random()*OUTLETS.length)];
    const due=S.diff==='trainee'?40:S.diff==='control'?15:20;
    S.media.unshift({id,outlet,area,cust:oa[area],t:S.t,deadline:S.t+due,answered:null});
    schedule({kind:'mediaDeadline',t:S.t+due,id});

    // the phone rings in the control room: stop the clock and put the request on screen
    S.pressPopup=id; S.paused=true; sfx('phone'); dirty=true;

}
function answerMedia(id,hours){
  const m=S.media.find(x=>x.id===id); if(!m||m.answered) return;
  if(S.pressPopup===id){ S.pressPopup=null; if(UI.overlay==='press') UI.overlay=null; }
  if(hours){
    m.answered='etr'; m.etr=S.t+hours*60;

// ---------- Events ----------
function crewPos(cr){

    const k=Math.max(0,Math.min(1,(S.t-j.t1)/(j.tArrive-j.t1)));
    if(j.path&&j.path.length>1) return pointAlong(j.path,k);

function nextEvent(){

}
function advance(dt){
  const target=S.t+dt;
  for(let g=0;g<200;g++){
    const ev=nextEvent();
    if(!ev||ev.t>target){ accrue(target-S.t); break; }
    accrue(ev.t-S.t); ev.fn(); afterChange();
    if(S.paused) break;
  }
  const before=S.news.length; newsCheck(); if(S.news.length!==before) dirty=true;

  const sol=solve();
  if(CBIDS.some(id=>S.sw[id]&&cbLoad(sol,id)>rat(id)+0.01)){
    const r=protect(true); afterChange();
    if(r.tripped.length){ S.paused=true; toast(`Demand is rising: ${r.tripped.map(cb=>'CB '+CB[cb].name).join(' and ')} tripped on overload. Clock paused.`);
      setWhy('More people switched things on as the day went on (the evening peak is around 18:30), so a circuit that coped earlier became overloaded and its breaker tripped. Leave headroom when you feed customers from a neighbouring circuit.'); }
  }
  // backup generators run out of fuel
  if(S.bkStart&&RMUS.some(n=>S.bkStart[n]!=null&&S.on[n]&&S.t-S.bkStart[n]>=N[n].backup)){ afterChange(); log('A backup generator has run out of fuel.','warn'); }

  if(S.pole&&!S.pole.done&&(S.t>=S.pole.deadline||!solve().cab[S.pole.cable])){ poleDeadline(); dirty=true; }
  // tired crews stand down for a rest once their current work is finished
  S.crews.forEach(cr=>{ if((cr.worked||0)>=720&&!cr.job&&!cr.restUntil){ cr.restUntil=S.t+180; cr.worked=0; log(`${cr.id} has worked 12 hours and must rest until ${fmtT(cr.restUntil)}.`,'warn'); dirty=true; } if(cr.restUntil&&S.t>=cr.restUntil&&!cr.queue.length){ cr.restUntil=null; dirty=true; } });

  const ph=dayPhase(S.t);
  if(S.phaseOfDay&&ph!==S.phaseOfDay){
    if(ph==='Dusk') log('Darkness is falling. Line patrols and repairs will be slower until dawn.');
    if(ph==='Dawn') log('First light. Crews can work at normal speed again soon.');
    if(ph==='Day') log('Full daylight.');
    if(ph==='Night') log('Night. Demand is low; patrols and repairs take longer.');

  }

    setWhy('A damaged pole is still carrying live wires. Switch the line off (open the switches at both ends) before the deadline, feeding the customers beyond it from a neighbour if you can.');
    news(null,'Road closed after car hits electricity pole'); sfx('alarm');

    news(null,`Police appeal after copper thieves strike ${N[p.node].name} substation`);

  if(close){ const why=parallelBlock(sid); if(why){ log('Refused: '+why,'warn'); toast('Refused: '+why); setWhy(PARALLEL_WHY); return; } }

      setWhy('You switched on a cable while a crew was working on it. In real life that could kill someone. Always check that nobody is working on a section before closing onto it.');
      sfx('alarm');
    }
  }

      log(`${cr.id} at ${N[j.node].name}. FPI ${S.fpi[j.node].trip?'TRIPPED':'not tripped'}.`,S.fpi[j.node].trip?'warn':'');
    }
    if((j.type==='test'||j.type==='repair'||j.type==='maint')&&solve().cab[j.cable]){
      log(`${cr.id} cannot ${j.type} ${cableName(CBL[j.cable])}: the cable is live.`,'warn');

    }
    let start=S.t;

    if(j.type==='patrol') log(`${cr.id} patrolling ${cableName(CBL[j.cable])} (about ${mins} min).`);
    if(j.type==='repair'&&j.held) log(`${cr.id} on site, but gusts are ${windAt(S.t)} mph: no climbing. Repairs to ${what} start when the wind drops below ${WIND_LIMIT} mph (forecast about ${fmtT(start)}), then take about ${fmtH(mins)}.`,'warn');
    else if(j.type==='repair') log(`${cr.id} repairing ${what} on ${cableName(CBL[j.cable])} (about ${fmtH(mins)}).`);
    if(j.type==='makesafe') log(`${cr.id} making ${N[j.node].name} safe: new earth bonds and LV joints (about 1½ hours).`);
    if(j.type==='maint') log(`${cr.id} has the permit and is starting maintenance on ${cableName(CBL[j.cable])} (about 3 hours). Keep it switched off.`);
    if(j.type==='lvfix') log(`${cr.id} fixing the low-voltage fault at ${N[j.node].name} (about 1 hour).`);
    if(j.type==='rebuild') log(`${cr.id} rebuilding the flooded switchgear at ${N[j.node].name} (about 4 hours).`);
    return;

  if(j.type==='op') applyOp(j.sw,j.close,cr.id);

    const f=faultOn(j.cable);
    if(S.dev&&!S.dev.fixed&&S.dev.cable===j.cable&&!f){ S.tested[j.cable]='fault'; log(`Test on ${cableName(CBL[j.cable])}: the insulation is breaking down. This is the cable behind the flickering lights. Repair it before it fails.`,'warn'); }
    else if(f&&!f.transient){ S.tested[j.cable]='fault'; f.found=true; log(`Fault confirmed on ${cableName(CBL[j.cable])}. Keep it isolated until it is repaired.`,'warn'); }
    else { if(f) f.active=false; S.tested[j.cable]='healthy'; log(`${cableName(CBL[j.cable])} tested healthy.`,'good'); }
  } else if(j.type==='patrol'){
    const f=faultOn(j.cable);
    if(f&&!f.transient){
      S.tested[j.cable]='fault'; f.found=true;
      log(`${cr.id} patrolled ${cableName(CBL[j.cable])}: found ${DAMAGE[f.damage].label}. Repair about ${fmtH(DAMAGE[f.damage].mins)}${CBL[j.cable].oh?' and needs climbing':''}.`,'warn');
    } else { if(f) f.active=false; S.tested[j.cable]='healthy'; log(`${cr.id} patrolled ${cableName(CBL[j.cable])}: no damage found.`,'good'); }
  } else if(j.type==='repair'){

    log(`${cr.id} repaired ${cableName(CBL[j.cable])}. Cable tested and ready to return to service.`,'good');
    if(S.dev&&!S.dev.fixed&&S.dev.cable===j.cable){ S.dev.fixed=true; S.pending=S.pending.filter(e=>!(e.dev&&e.cable===j.cable)); log('The failing cable was replaced before it broke down. No power cut!','good'); news(null,'Engineers stop a power cut before it happens',4); }
  } else if(j.type==='maint'){
    if(S.planned&&S.planned.cable===j.cable){ S.planned.state='done'; S.planned.doneAt=S.t; }
    log(`${cr.id} has finished the maintenance on ${cableName(CBL[j.cable])} and handed the cable back. Now put the network back to normal.`,'good');
  } else if(j.type==='lvfix'){
    S.lvFault[j.node]=false; S.lvOut[j.node]=false; if(S.cost) S.cost.materials+=400;
    log(`${cr.id} fixed the low-voltage fault at ${N[j.node].name}.`,'good');
  } else if(j.type==='rebuild'){
    S.flooded[j.node]=null; S.lvOut[j.node]=false; if(S.flood) S.flood.state='clear'; if(S.cost) S.cost.materials+=5000;
    log(`${cr.id} rebuilt the switchgear at ${N[j.node].name}. It can be switched back on.`,'good');
  } else if(j.type==='makesafe'){
    S.theft[j.node]=false; S.lvOut[j.node]=false;
    log(`${cr.id} made ${N[j.node].name} safe. Earth bonds replaced, LV cables jointed and the switchgear released.`,'good');
  }
  startNext(i);
}

// ---------- Orders from the player ----------
function crewPlan(cr){
  let t=S.t, pos=crewPos(cr);
  const j=cr.job;
  if(cr.restUntil&&cr.restUntil>t) t=cr.restUntil;
  if(j){ t=j.stage==='travel'?j.tArrive+jobMins(j,cr):j.tDone; pos=j.to; }
  cr.queue.forEach(q=>{ t+=ttc(cr,pos,N[q.node].m)+jobMins(q,cr); pos=N[q.node].m; });
  return {t,pos};
}
function crewEta(i,node,type,cable){
  const cr=S.crews[i], p=crewPlan(cr), d=cr.at===node&&!cr.job&&!cr.queue.length?0:ttc(cr,p.pos,N[node].m);
  return p.t+d+jobMins({type,cable},cr)-S.t;
}
function chooseCrew(node,type,cable){
  if(S.dispatch!=='auto'&&S.crews[S.dispatch]&&canDo(S.crews[S.dispatch],type)) return S.dispatch;
  let best=-1, bt=Infinity;
  S.crews.forEach((cr,i)=>{ if(!canDo(cr,type)) return; const e=crewEta(i,node,type,cable); if(e<bt){bt=e;best=i;} });
  return best<0?0:best;
}
function pendingFor(sid){
  if(S.control.some(o=>o.sw===sid)) return 'control';
  for(const cr of S.crews){ if((cr.job&&cr.job.sw===sid)||cr.queue.some(j=>j.sw===sid)) return cr.id; }
  return null;
}
const cableBusy = cid=>S.crews.some(cr=>(cr.job&&cr.job.cable===cid)||cr.queue.some(j=>j.cable===cid));
const canOrder = ()=>S&&S.phase!=='closed'&&!UI.replay;
function dispatch(job){
  const i=chooseCrew(job.node,job.type,job.cable), cr=S.crews[i];
  cr.queue.push(job);
  log(`${cr.id} given job: ${jobText(job)} at ${N[job.node].name}.`);
  if(!cr.job) startNext(i);
}
function orderOp(sid,close){
  if(!canOrder()) return;
  if(pendingFor(sid)){ toast('That switch already has an operation queued.'); return; }
  if(locked(nodeOfSw(sid))){ toast(`Locked out: ${N[nodeOfSw(sid)].name} is unsafe after the theft. Send a crew to make it safe first.`); return; }
  // with nothing else queued we can refuse straight away; otherwise queued orders may change
  // the picture first, so the check happens when the switch is actually operated
  const idle=!S.control.length&&S.crews.every(cr=>!cr.job&&!cr.queue.length);
  if(close&&idle){ const why=parallelBlock(sid); if(why){ toast('Blocked: '+why); setWhy(PARALLEL_WHY); render(); return; } }
  pushUndo(`${close?'close':'open'} ${switchLabel(sid)}`);
  if(remoteFor(sid)){
    const last=S.control.length?S.control[S.control.length-1].tDone:S.t;
    S.control.push({sw:sid,close,tDone:Math.max(last,S.t)+2});
  } else dispatch({type:'op',node:nodeOfSw(sid),sw:sid,close});
  afterChange(); render();
}
function orderVisit(n){ if(!canOrder()) return; pushUndo('send a crew to '+N[n].name); dispatch({type:'visit',node:n}); afterChange(); render(); }
const safeBusy = n=>S.crews.some(cr=>(cr.job&&cr.job.type==='makesafe'&&cr.job.node===n)||cr.queue.some(j=>j.type==='makesafe'&&j.node===n));
const nodeJobBusy = (n,type)=>S.crews.some(cr=>(cr.job&&cr.job.type===type&&cr.job.node===n)||cr.queue.some(j=>j.type===type&&j.node===n));
function orderNodeJob(n,type){ if(!canOrder()||nodeJobBusy(n,type)) return; pushUndo(`${type==='lvfix'?'fix the street fault at':'rebuild'} ${N[n].name}`); dispatch({type,node:n}); afterChange(); render(); }
// ---------- Mobile generators ----------
// A small fleet kept at the generator depot. One can carry a substation's customers while it is cut off from the network.
const GEN={fleet:2,cap:500,hire:2000,hourly:250,setup:20};
const genDepot = ()=>(NET.decor&&NET.decor.genDepot)||NET.depot;
const genAt = n=>(S.gens||[]).find(g=>g.node===n&&g.stage!=='return');
const gensFree = ()=>GEN.fleet-(S.gens||[]).filter(g=>g.stage!=='home').length;
// why a generator can't help here, or null if it can
function genBlock(n){
  if(S.on[n]) return 'customers here are on supply';
  if(genAt(n)) return 'a generator is already assigned';
  if(S.theft[n]) return 'the low-voltage cables have been stolen';
  if(S.flooded[n]) return 'the substation is flooded';
  if(S.lvFault[n]) return 'the fault is in the street cables, past where a generator connects';
  if(N[n].cust>GEN.cap) return `too many customers (${fmtN(N[n].cust)}; a mobile generator can carry about ${GEN.cap})`;
  if(gensFree()<=0) return 'both generators are already out';
  return null;
}
const genEta = n=>Math.round(tt(genDepot(),N[n].m)*(nightWork(S.t)?1.15:1));
function hireGenerator(n){
  if(!canOrder()||genBlock(n)) return;
  pushUndo(`hire a generator for ${N[n].name}`);
  S.gens=S.gens||[];
  const home=S.gens.find(g=>g.stage==='home'), id=home?home.id:'G'+(S.gens.length+1), from=genDepot().slice(), d=genEta(n);
  const g=home||{id}; S.gens=S.gens.filter(x=>x!==home).concat(g);
  Object.assign(g,{node:n,stage:'travel',from,to:N[n].m.slice(),t1:S.t,tArrive:S.t+d,path:routePath(from,N[n].m).map(p=>[+p[0].toFixed(1),+p[1].toFixed(1)])});
  S.cost.generators=(S.cost.generators||0)+GEN.hire;
  log(`Mobile generator ${g.id} hired for ${N[n].name} (£${fmtN(GEN.hire)} plus £${GEN.hourly} an hour). It arrives about ${fmtT(g.tArrive)} and takes ${GEN.setup} minutes to connect.`);
  afterChange(); render();
}
// send a generator back to the depot
function genHome(g,msg){
  const from=genPos(g).slice(), to=genDepot().slice(), d=Math.round(tt(from,to));
  if(msg) log(msg,g.stage==='on'?'good':'');
  Object.assign(g,{stage:'return',from,to,t1:S.t,tArrive:S.t+d,path:d>0?routePath(from,to).map(p=>[+p[0].toFixed(1),+p[1].toFixed(1)]):null});
  dirty=true;
}
function genEvent(g){
  if(g.stage==='travel'){
    if(S.on[g.node]){ genHome(g,`Generator ${g.id} reached ${N[g.node].name}, but the customers are already back on. Sending it home.`); return; }
    g.stage='setup'; g.tOn=S.t+GEN.setup; log(`Generator ${g.id} on site at ${N[g.node].name}. Connecting (about ${GEN.setup} minutes).`);
  } else if(g.stage==='setup'){
    const why=genBlock(g.node);
    if(why&&!/already assigned|both generators/.test(why)){ genHome(g,`Generator ${g.id} can't connect at ${N[g.node].name}: ${why}. Sending it home.`); return; }
    g.stage='on'; g.since=S.t; afterChange();
    log(`Generator ${g.id} running at ${N[g.node].name}. ${fmtN(N[g.node].cust)} customers back on.`,'good'); sfx('chime');
  } else if(g.stage==='return'){
    g.stage='home'; g.node=null; g.path=null; log(`Generator ${g.id} is back at the depot.`);
  }
  dirty=true;
}
function genPos(g){
  if((g.stage==='travel'||g.stage==='return')&&g.tArrive>g.t1){
    const k=Math.max(0,Math.min(1,(S.t-g.t1)/(g.tArrive-g.t1)));
    return g.path&&g.path.length>1?pointAlong(g.path,k):[g.from[0]+(g.to[0]-g.from[0])*k,g.from[1]+(g.to[1]-g.from[1])*k];
  }
  if(g.stage==='return') return g.to;
  if(g.stage==='home') return genDepot();
  return N[g.node].m;
}
function genStatus(g){
  if(g.stage==='home') return 'At the generator depot';
  if(g.stage==='travel') return `Driving to ${N[g.node].name} · arrives ${fmtT(g.tArrive)}`;
  if(g.stage==='setup') return `Connecting at ${N[g.node].name} · on at ${fmtT(g.tOn)}`;
  if(g.stage==='on') return `Running at ${N[g.node].name} since ${fmtT(g.since)}`;
  return `Returning to the depot · back ${fmtT(g.tArrive)}`;
}
function orderMakeSafe(n){ if(!canOrder()||safeBusy(n)) return; pushUndo('make '+N[n].name+' safe'); dispatch({type:'makesafe',node:n}); afterChange(); render(); }
function nearEnd(cid,i){
  const c=CBL[cid], ends=[c.a,c.b].filter(x=>N[x].kind!=='primary');
  if(ends.length===1) return ends[0];
  const p=crewPlan(S.crews[i]).pos;
  return dist(N[ends[0]].m,p)<=dist(N[ends[1]].m,p)?ends[0]:ends[1];
}
function orderCable(cid,type){
  if(!canOrder()) return;
  // a line patrol is a visual check, so it can go ahead with the line live
  if(type!=='patrol'&&solve().cab[cid]){ toast('That cable is live. Open the switches at both ends, or make sure both ends are dead, first.'); return; }
  const c=CBL[cid], ends=[c.a,c.b].filter(x=>N[x].kind!=='primary');
  pushUndo(`${type} ${cableName(c)}`);
  const i=chooseCrew(ends[0],type,cid);

function cancelJob(i,q){

// ---------- New incident ----------
// Work out what will happen during the shift. The first event always takes customers off.
function planEvents(scen,t,shift){
  const R=rand, rint=(a,b)=>a+Math.floor(R()*(b-a));
  const pool=FAULTABLE.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  // the first cable event must hit a live cable (and the shift's area, if it has one) so a breaker trips
  const live=solve().cab;
  const inArea=cid=>!shift||!shift.area||[CBL[cid].a,CBL[cid].b].every(n=>shift.area.some(p=>n===p||n.startsWith(p)));
  let fi=pool.findIndex(c=>live[c]&&inArea(c)); if(fi<0) fi=pool.findIndex(c=>live[c]);
  if(fi>0) [pool[0],pool[fi]]=[pool[fi],pool[0]];
  const take=()=>pool.shift(), pickNode=()=>RMUS[Math.floor(R()*RMUS.length)];
  const theftNode=()=>shift&&shift.theftNode&&N[shift.theftNode]?shift.theftNode:(N.V2&&R()<0.5?'V2':pickNode());
  const ev=[];
  // the training shift is scripted: one known fault, no press, nothing else
  if(shift&&shift.fixed) return [{kind:'fault',t,cable:shift.fixed,transient:false}];
  const liveUG=()=>{ const k=pool.findIndex(c=>live[c]&&!CBL[c].oh&&!CB[c+':a']&&!CB[c+':b']); return k>=0?pool.splice(k,1)[0]:take(); };
  const liveOH=()=>{ const k=pool.findIndex(c=>live[c]&&CBL[c].oh); return k>=0?pool.splice(k,1)[0]:take(); };
  if(scen==='planned'){ /* nothing breaks: the job is the planned work itself */ }
  else if(scen==='flood'){
    const cands=(NET.decor&&NET.decor.floodNodes||[]).filter(n=>N[n]), node=cands.length?cands[Math.floor(R()*cands.length)]:pickNode();
    const at=t+rint(45,75), until=at+rint(150,210);
    ev.push({kind:'floodwarn',t,node,at,until},{kind:'floodhit',t:at,node},{kind:'floodclear',t:until,node});
    if(R()<0.6) ev.push({kind:'fault',t:t+rint(30,140),cable:take(),transient:R()<0.4});
  }
  else if(scen==='heatwave'){ ev.push({kind:'fault',t,cable:liveUG(),transient:false}); ev.push({kind:'fault',t:t+rint(60,170),cable:liveUG(),transient:R()<0.2}); }
  else if(scen==='vehicle'){ ev.push({kind:'vehicle',t,cable:liveOH()}); if(R()<0.5) ev.push({kind:'fault',t:t+rint(60,150),cable:take(),transient:true}); }
  else if(scen==='flicker'){
    const cid=liveUG(), c=CBL[cid], node=N[c.a].kind==='primary'?c.b:c.a, failAt=t+rint(80,150);
    ev.push({kind:'flicker',t,cable:cid,node,failAt},{kind:'fault',t:failAt,cable:cid,transient:false,dev:true});
  }
  else if(scen==='festival'){ ev.push({kind:'fault',t:t+rint(40,140),cable:take(),transient:R()<0.25}); if(R()<0.5) ev.push({kind:'fault',t:t+rint(160,280),cable:take(),transient:R()<0.3}); }
  else if(scen==='single') ev.push({kind:'fault',t,cable:take(),transient:R()<0.2});
  else if(scen==='digin'){ ev.push({kind:'digin',t,cable:take()}); ev.push({kind:'fault',t:t+rint(40,120),cable:take(),transient:true}); }
  else if(scen==='theft'){ ev.push({kind:'theft',t,node:theftNode()}); ev.push({kind:'fault',t:t+rint(50,130),cable:take(),transient:R()<0.2}); }
  else if(scen==='mixed'){ ev.push({kind:'fault',t,cable:take(),transient:R()<0.2}); ev.push({kind:'theft',t:t+rint(30,90),node:theftNode()}); ev.push({kind:'digin',t:t+rint(90,180),cable:take()}); }
  else { // storm and bigstorm: wind mostly brings down overhead lines
    const takeStorm=()=>{ const k=pool.findIndex(c=>CBL[c].oh); return k>=0&&R()<0.75?pool.splice(k,1)[0]:take(); };
    const k0=pool.findIndex(c=>live[c]&&CBL[c].oh);
    ev.push({kind:'fault',t,cable:k0>=0?pool.splice(k0,1)[0]:take(),transient:R()<0.3});
    const n=scen==='bigstorm'?rint(3,6):rint(2,5);
    for(let i=0;i<n&&pool.length;i++) ev.push({kind:'fault',t:t+rint(20,190),cable:takeStorm(),transient:R()<0.35});
    if(scen==='bigstorm') ev.push({kind:'theft',t:t+rint(60,150),node:theftNode()});
    // members of the public sometimes ring in to report wires down
    ev.filter(e=>e.kind==='fault'&&!e.transient&&e.cable&&CBL[e.cable].oh&&R()<0.5).forEach(e=>ev.push({kind:'report',t:e.t+rint(10,40),cable:e.cable}));
  }
  ev.push({kind:'media',t:t+rint(15,30)});
  // the control engineer level always has one more thing go wrong
  if(S.diff==='control'&&pool.length&&scen!=='planned') ev.push({kind:'fault',t:t+rint(60,160),cable:take(),transient:R()<0.25});
  // the odd low-voltage street fault turns up on top of everything else
  if(scen!=='planned'&&R()<0.35) ev.push({kind:'lv',t:t+rint(20,200),node:pickNode()});
  return ev.filter(e=>!['fault','digin','report','vehicle','flicker'].includes(e.kind)||e.cable).sort((a,b)=>a.t-b.t);
}
const SCEN_OBJ={
  planned:['plannedZero','plannedOnTime','noSafety'], flood:['floodSafe','allBack240','psr','press'], heatwave:['noOverload','allBack120','psr','press'],
  vehicle:['poleSafe','noSafety','allBack240'], flicker:['devCaught','allBack120','press'], festival:['festival','allBack120','press'],

// ctx: {type:'career'|'daily', ...} when the shift belongs to the career or the daily challenge
function newIncident(def,scen,crews,shift=null,assessors=0,ctx=null){

  const career=ctx&&ctx.type==='career'&&scen!=='planned';

  const storm=scen==='storm'||scen==='bigstorm';

  S={def,scen,t,t0:t,paused:true,speed:1,sw:normalSw(),faults:[],pending:[],fpi:{},on:{},offSince:{},counted:{},theft:{},lvOut:{},
     ci:0,cml:0,affected:0,ops:0,faultTrips:0,overloads:0,safety:0,shift:shift?shift.id:null,brief:shift?shift.brief:(ctx&&ctx.brief||''),
     crews:[...Array.from({length:crews},(_,i)=>unit('crew',i)),...Array.from({length:assessors},(_,i)=>unit('assessor',i))],

    const ends=new Map([[Q.ka,dist(Q.P,G.nodes.get(Q.ka).p)],[Q.kb,dist(Q.P,G.nodes.get(Q.kb).p)]]);
    let bestEnd=null, bestD=Infinity;
    while(heap.length){
      const [dk,k]=pop(); if(done.has(k)) continue; done.add(k);
      if(ends.has(k)&&dk+ends.get(k)<bestD){ bestD=dk+ends.get(k); bestEnd=k; }

  path=path.filter((pt,i)=>i===0||dist(pt,path[i-1])>0.3);

}

    if(parks.some(p=>hx>p[0]-6&&hx<p[0]+p[2]+6&&hy>p[1]-6&&hy<p[1]+p[3]+6)) return;

  // switches
  CABLES.forEach(c=>['a','b'].forEach(e=>{
    const sid=c.id+':'+e, prim=N[c[e]].kind==='primary';
    const d=isS?(prim?30:40):(prim?24:21), sz=isS?13:10;
    const [x,y,horiz]=along(pts(c),e,d), closed=sw[sid];
    const isSel=!edit&&sel&&sel.sw===sid;

  // hint and training rings round the substations to look at
  const ringAt=(id,cls)=>{ const p=isS?N[id].s:N[id].m, r=isS?(N[id].kind==='primary'?40:34):20; return `<circle class="${cls}" cx="${p[0]}" cy="${p[1]}" r="${r}" pointer-events="none"/>`; };
  if(!edit&&UI.hint&&UI.hint.level>=2) (UI.hint.plan.focus.nodes||[]).forEach(id=>{ if(N[id]) h+=ringAt(id,'hintring'); });
  const ts=!edit&&tutStep(); if(ts&&ts.node&&N[ts.node]) h+=ringAt(ts.node,'coachring');
  // crews on the map, with the route ahead and arrival time for anyone driving
  if(!edit&&!isS){
    const offs=crewOffsets();
    S.crews.forEach(cr=>{ const j=cr.job; if(j&&j.stage==='travel'&&j.path&&j.path.length>1) h+=`<polyline class="route${cr.role==='assessor'?' as':''}" points="${j.path.map(p=>p.join(',')).join(' ')}"/>`; });
    S.crews.forEach((cr,i)=>{ const j=cr.job, eta=j&&j.stage==='travel'?`<text class="eta" y="-12">${fmtT(j.tArrive)}</text>`:'';
      h+=`<g id="crew-${i}" class="van${cr.role==='assessor'?' as':''}" transform="translate(${offs[i][0]},${offs[i][1]})" pointer-events="none"><path class="body" d="M-17,-8 h21 v14 h-21z M5,-4 h6 l5,5 v5 h-11z"/><circle class="wheel" cx="-10" cy="7" r="3"/><circle class="wheel" cx="9" cy="7" r="3"/><text x="-6.5" y="2">${cr.tag}</text>${eta}${workIcon(cr)}</g>`; });
    // mobile generators: the unit parked by its substation, and the lorry on the road
    (S.gens||[]).forEach((g,i)=>{
      if(g.stage==='home') return;
      if(g.stage==='travel'&&g.path&&g.path.length>1) h+=`<polyline class="route gen" points="${g.path.map(p=>p.join(',')).join(' ')}"/>`;
      if(g.stage==='on'||g.stage==='setup'){ const [x,y]=N[g.node].m; h+=`<g class="genunit" transform="translate(${x-34},${y-14})" pointer-events="none"><path d="M13,2 Q24,8 31,13" fill="none" stroke="#2a2a2a" stroke-width="1.4" stroke-dasharray="${g.stage==='on'?'':'2 2'}"/><rect x="-13" y="-8" width="26" height="15" rx="2" fill="#f2c230" stroke="#6a5208" stroke-width="1"/><rect x="-10" y="-5" width="7" height="9" fill="#6a5208" opacity=".35"/><path d="M4,-5 L1,0 L4,0 L1,5" fill="none" stroke="#2a2205" stroke-width="1.4"/>${g.stage==='on'?'<circle class="fan" cx="9" cy="-11" r="2.5" fill="#cfcfcf" opacity=".8"/>':''}</g>`; }
      else { const p=genPos(g); h+=`<g id="gen-${i}" class="genlorry" transform="translate(${p[0].toFixed(1)},${p[1].toFixed(1)})" pointer-events="none"><path d="M-19,-7 h23 v13 h-23z M4,-4 h6 l5,5 v5 h-11z" fill="#f2c230" stroke="#6a5208" stroke-width="1"/><circle cx="-11" cy="7" r="3" fill="#2a2a2a"/><circle cx="9" cy="7" r="3" fill="#2a2a2a"/><text x="-7.5" y="2" text-anchor="middle" style="font:700 8px var(--mono);fill:#2a2205">${g.id}</text>${g.stage==='travel'?`<text class="eta" y="-12">${fmtT(g.tArrive)}</text>`:''}</g>`; }
    });
    RMUS.forEach(n=>{ if(S.flooded[n]&&!(S.flooded[n]==='damaged'&&S.flood&&S.flood.state==='receded')) { const [x,y]=N[n].m; h+=`<g class="flooded-water" pointer-events="none"><ellipse cx="${x}" cy="${y+4}" rx="52" ry="26"/><path d="M${x-34} ${y+8}q6-5 12 0t12 0t12 0M${x-8} ${y+20}q6-5 12 0t12 0t12 0M${x-30} ${y-8}q6-5 12 0t12 0" fill="none" stroke="#dff1ff" stroke-width="2" stroke-linecap="round"/></g>`; } });
    h+=moverLayer('air')+weatherFx();
  }
  svg.innerHTML=h;
  if(!isS) try{ moveMovers(); }catch(e){}
  decorateSvg();
}

// ---------- Play side panel ----------
function costText(sid){
  if(remoteFor(sid)){ const last=S.control.length?S.control[S.control.length-1].tDone:S.t; return `remote · ${Math.round(Math.max(0,last-S.t)+2)} min`; }
  const n=nodeOfSw(sid), i=chooseCrew(n,'op');
  return `${S.crews[i].id} · ~${Math.round(crewEta(i,n,'op'))} min`;
}
function swRow(sid,ctxNode){
  const [cid,e]=sid.split(':'), c=CBL[cid], node=c[e], far=c[other(e)], closed=S.sw[sid];
  const lock=!canOrder(), pend=pendingFor(sid), abn=closed!==!NOPS.has(sid);
  const name=CB[sid]?`CB ${CB[sid].name} to ${N[far].name}`:ctxNode?`To ${N[far].name}`:`At ${N[node].name}`;
  const tag=NOPS.has(sid)?'<span class="tag">NOP</span>':'';
  const btn=locked(node)?`<button class="btn alt" disabled>Locked<small>${S.flooded&&S.flooded[node]?'flooded':'site unsafe'}</small></button>`
    :pend?`<button class="btn alt" disabled>Queued<small>${pend==='control'?'control room':pend}</small></button>`
    :`<button class="btn${closed?' alt':''}" data-act="op" data-sw="${sid}" data-close="${closed?0:1}" ${lock?'disabled':''}>${closed?'Open':'Close'}<small>${costText(sid)}</small></button>`;
  return `<div class="swrow${S.sel&&S.sel.sw===sid?' hl':''}"><div><div class="swname">${name}${tag}</div>
    <div class="swstate ${closed?'c':'o'}">${closed?'Closed':'Open'} · ${remoteFor(sid)?'remote':'manual'}${abn?' · <span class="abn">abnormal</span>':''}</div></div>${btn}</div>`;
}
function phaseBar(){
  if(S.scen==='planned'){
    const p=S.planned, cur=S.phase==='closed'?3:!p||p.state==='prep'?(maintWorking()?1:0):2;
    return `<ol class="phases">${['Prepare','Crew working','Normal running'].map((l,i)=>`<li class="${i<cur?'done':i===cur?'now':''}">${l}</li>`).join('')}</ol>`;
  }
  const order=['restore','repair','closed'], cur=order.indexOf(S.phase);
  return `<ol class="phases">${['Restore supply','Repair','Normal running'].map((l,i)=>`<li class="${i<cur||S.phase==='closed'?'done':i===cur?'now':''}">${l}</li>`).join('')}</ol>`;
}
const maintWorking = ()=>S.planned&&S.crews.some(cr=>cr.job&&cr.job.type==='maint'&&cr.job.cable===S.planned.cable&&cr.job.stage==='work');
// status boxes for the special jobs of a shift: planned work, floods, poles, flickers, festivals and street faults
function taskBoxes(){
  let h='';
  const p=S.planned;
  if(p&&S.phase!=='closed'){
    const c=CBL[p.cable], dead=!solve().cab[p.cable], busy=cableBusy(p.cable);
    const st=p.state==='done'?'Maintenance finished. Put the network back to normal.':maintWorking()?'Crew working. Keep the cable switched off.':busy?'Crew on the way.':
      dead?'Cable switched out. Hand it over to a crew.':S.t<p.from?`Prepare: feed the customers beyond it from a neighbour, then open both ends. Work can start from ${fmtT(p.from)}.`:'Switch the cable out without anyone losing power.';
    h+=`<div class="taskbox"><b>Planned work</b><button class="linkbtn" data-act="selc" data-c="${p.cable}">${cableName(c)}</button> · window ${fmtT(p.from)}–${fmtT(p.to)}<p>${st}</p>
      ${p.state==='prep'&&dead&&!busy?`<button class="btn wide" data-act="maint" data-c="${p.cable}" ${canOrder()?'':'disabled'}>Hand over to a crew for maintenance<small>about 3 hours</small></button>`:''}</div>`;
  }
  const f=S.flood;
  if(f&&S.phase!=='closed'){
    const n=f.node, mins=Math.round(f.at-S.t);
    const st=f.state==='warned'?(solve().island[n]!=null?`<span class="trip">Still live.</span> Water expected in ${mins>0?mins+' min':'moments'} (${fmtT(f.at)}). Switch it off and feed the substations beyond it from elsewhere.`:`Switched off safely. Water expected at ${fmtT(f.at)}.`)
      :f.state==='flooded'?`Under water but safe. Expected to recede around ${fmtT(f.until)}.`:f.state==='damaged'?`Wrecked by flood water. Wait for it to recede (around ${fmtT(f.until)}), then rebuild.`
      :f.state==='receded'?'The water has gone. Send a crew to rebuild the switchgear.':'Clear. It can be switched back on.';
    h+=`<div class="taskbox ${f.state==='warned'?'urgent':''}"><b>Flood warning</b><button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button><p>${st}</p></div>`;
  }
  const pl=S.pole;
  if(pl&&!pl.done&&S.phase!=='closed'){
    const mins=Math.max(0,Math.ceil(pl.deadline-S.t));
    h+=`<div class="taskbox urgent"><b>Police deadline: ${mins} min</b>Car versus pole on <button class="linkbtn" data-act="selc" data-c="${pl.cable}">${cableName(CBL[pl.cable])}</button>.<p>Open the switches at both ends before ${fmtT(pl.deadline)}.</p></div>`;
  }
  const d=S.dev;
  if(d&&!d.fixed&&!d.failed&&S.phase!=='closed')
    h+=`<div class="taskbox"><b>Flickering lights</b>Reports from around <button class="linkbtn" data-act="seln" data-n="${d.node}">${N[d.node].name}</button>.<p>One of its cables is failing. Switch suspects out one at a time and test them${S.tested[d.cable]==='fault'?'. <b style="display:inline;color:inherit;font:inherit;text-transform:none;letter-spacing:0">Found it:</b> repair it before it fails.':'.'}</p></div>`;
  const fe=S.festival;
  if(fe&&S.phase!=='closed'){
    const live=S.t>=fe.from&&S.t<fe.to;
    h+=`<div class="taskbox${S.festFail?' urgent':''}"><b>Port Ampere Festival</b><button class="linkbtn" data-act="seln" data-n="${fe.node}">${N[fe.node].name}</button> · ${fmtT(fe.from)}–${fmtT(fe.to)}<p>${S.festFail?'The stage lost power. The mayor is not happy.':live?`On stage now, adding ${fe.amps} A to the circuit.`:S.t<fe.from?`Starts at ${fmtT(fe.from)}, adding ${fe.amps} A.`:'Finished.'}</p></div>`;
  }
  const lv=RMUS.filter(n=>S.lvFault[n]);
  if(lv.length) h+=`<div class="taskbox"><b>Street faults</b>${lv.map(n=>`<button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button>`).join(', ')}<p>The 11 kV network is fine. Send a crew to fix the low-voltage fault.</p></div>`;
  const fl=RMUS.filter(n=>S.flooded[n]==='damaged'&&(!S.flood||S.flood.state==='receded'));
  if(fl.length&&!f) h+=`<div class="taskbox"><b>Rebuild</b>${fl.map(n=>N[n].name).join(', ')}</div>`;
  if(S.ctx&&S.ctx.type==='career'&&S.cost){ const m=shiftMoney(); h+=`<p class="note budget">Shift budget: <b>${money(m.spent)}</b> of ${money(m.budget)} spent so far${m.spent>m.budget?' <span class="trip">over budget</span>':''}.</p>`; }
  return h;
}
function incidentPanel(){
  const sh=SHIFTS.find(x=>x.id===S.shift);
  let h=`${S.ctx?`<p class="ctxlabel">${S.ctx.label}</p>`:''}<h2>${sh?sh.title.replace(/^Shift \d+ · /,''):S.ctx?SCEN_LABEL[S.scen]||'Incident':'Incident'}</h2><p class="lead">${S.headline}</p>${phaseBar()}`;
  if(S.brief&&S.phase!=='closed') h+=`<div class="brief"><b>Note from Mags</b>${S.brief}</div>`;
  h+=taskBoxes();
  const thefts=RMUS.filter(n=>S.theft[n]);
  if(thefts.length) h+=`<div class="alertbox"><b>Unsafe after copper theft:</b> ${thefts.map(n=>`<button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button>`).join(', ')}. Send a crew to make ${thefts.length===1?'it':'them'} safe.</div>`;
  if(S.stormUntil&&S.pending.length) h+=`<p class="note"><b>Storm in progress.</b> More faults are likely until about ${fmtT(S.stormUntil)}.</p>`;
  if(S.phase==='restore'){
    h+=`<details class="howto" ${S.shift==='s1'?'open':''}><summary>How to restore supply</summary><ol class="steps"><li><b>Locate.</b> Fault passage indicators (flags) trip between the breaker and the fault. Remote sites report straight away. Manual sites need a crew to read them.</li>
      <li><b>Isolate.</b> Open the switches at <i>both</i> ends of the faulty cable.</li>
      <li><b>Restore.</b> Close the breaker, and close normally open points (NOPs) to back-feed from another feeder. Watch the feeder loading.</li></ol>
      <p class="note">Interruptions of 3 minutes or more count towards CI. Pause the clock with the space bar to plan, then queue orders and let it run.</p></details>`;
  }
  if(S.callsTotal>=1){

function crewStatus(cr){
