  if(j&&j.stage==='work'&&j.held&&S.t<j.held) return `At ${N[j.node].name}, waiting for the wind to drop · starts about ${fmtT(j.held)}`;

  if(cr.restUntil&&S.t<cr.restUntil) return `Resting after a long shift · back at ${fmtT(cr.restUntil)}`;

  return 'Waiting on the road';
}

function renderWeather(){
  const el=$('#wxSec'), w=S.weather;
  if(!w||!w.storm){ el.hidden=true; return; }
  const g=windAt(S.t), trend=windAt(S.t+15)-g, lvl=warnLevel(g)||'';
  // gust forecast over the storm, with the climbing limit and the current time
  const T0=S.t0, T1=S.t0+420, W=300, H=70, x=t=>((t-T0)/(T1-T0))*W, y=v=>H-6-(v/100)*(H-12);
  let d='', a=`M0,${H} `;
  for(let t=T0;t<=T1;t+=6){ const p=`${x(t).toFixed(1)},${y(windAt(t)).toFixed(1)}`; d+=(d?' L':'M')+p; a+='L'+p+' '; }
  a+=`L${W},${H} Z`;
  const nx=Math.max(0,Math.min(W,x(S.t)));
  el.hidden=false;
  el.innerHTML=`<h3>Weather</h3><div class="wx-head"><span class="wx-name">Storm ${w.name}</span>${lvl?`<span class="wlevel ${lvl}">${lvl} warning</span>`:''}</div>
    <div class="gust">${g} mph<small>gusts, ${trend>1?'rising':trend<-1?'easing':'steady'} · peak about ${w.peak} mph at ${fmtT(w.tp)}</small></div>
    <svg class="wxspark" viewBox="0 0 ${W} ${H}" aria-label="Gust forecast"><path class="ar" d="${a}"/><path class="ln" d="${d}"/>
      <line class="lim" x1="0" x2="${W}" y1="${y(WIND_LIMIT)}" y2="${y(WIND_LIMIT)}"/><text x="${W-2}" y="${y(WIND_LIMIT)-3}" text-anchor="end">${WIND_LIMIT} mph climbing limit</text>
      <line class="now" x1="${nx}" x2="${nx}" y1="0" y2="${H}"/></svg>
    ${g>=WIND_LIMIT?`<p class="restrict"><b>No climbing.</b> Gusts above ${WIND_LIMIT} mph. Overhead line repairs wait until about ${fmtT(windOK(S.t))}. Switching and patrols carry on.</p>`
      :`<p class="restrict ok">Wind below ${WIND_LIMIT} mph. Crews can climb.</p>`}`;
}

function stars(st){
  const lim=['storm','bigstorm','mixed'].includes(S.scen)?[40,90]:S.scen==='theft'||S.scen==='digin'?[30,60]:[20,45], avg=st.cml/Math.max(1,st.affected);
  let s=avg<=lim[0]?3:avg<=lim[1]?2:1; if(st.safety) s--; if(st.overloads) s--; if(st.rep!=null&&st.rep<50) s--;
  if((st.hints||st.undos)&&S.diff!=='trainee') s--;   // the exact-move hint and undo each cost a star (free for trainees)
  return {s:Math.max(0,s),avg,lim};
}

function validate(){
  const err=[], warn=[], ids=Object.keys(N);
  if(!PRIMS.length) err.push('Add at least one primary substation.');
  if(!RMUS.length) err.push('Add at least one substation with customers.');
  CABLES.forEach(c=>{ if(N[c.a].kind==='primary'&&N[c.b].kind==='primary') err.push(`${cableName(c)} joins two primaries. Delete it.`); });
  const adj={}; ids.forEach(k=>adj[k]=[]); CABLES.forEach(c=>{adj[c.a].push(c.b);adj[c.b].push(c.a);});
  const seen=new Set(PRIMS), q=[...PRIMS];
  while(q.length){ const n=q.shift(); adj[n].forEach(m=>{ if(!seen.has(m)){seen.add(m);q.push(m);} }); }
  RMUS.forEach(n=>{ if(!seen.has(n)) err.push(`${N[n].name} has no cable route to a primary.`); });
  if(!FAULTABLE.length&&RMUS.length) err.push('Add some cables that can develop faults.');
  const sw=normalSw(), sol=solve(sw);
  sol.islands.forEach(isl=>{ const ps=[...new Set(isl.cbs.map(cb=>CB[cb].prim))]; if(ps.length>1) err.push(`In normal running ${ps.map(p=>N[p].name).join(' and ')} are connected. Add a normally open point between them.`); });
  RMUS.forEach(n=>{ if(seen.has(n)&&sol.island[n]==null) warn.push(`${N[n].name} is off supply in normal running. Check the normally open points.`); });
  CBIDS.forEach(id=>{ const a=cbLoad(sol,id,1); if(a>CB[id].rating) warn.push(`${CB[id].name} ${CB[id].feeder} carries ${Math.round(a)} A against a ${CB[id].rating} A rating at the evening peak.`); });

  return {err,warn};

function normalizeDef(d){
  if(!d||typeof d!=='object'||!d.nodes||typeof d.nodes!=='object'||!Array.isArray(d.cables)) throw new Error('That isn\'t an Open Point network. It needs "nodes" and "cables".');
  const num=v=>typeof v==='number'&&isFinite(v);
  const pt=p=>Array.isArray(p)&&p.length===2&&num(p[0])&&num(p[1])?[p[0],p[1]]:null;
  const line=l=>Array.isArray(l)&&l.length>=2&&l.every(pt)?l.map(pt):null;
  const SIZES={1000:560,1500:800,1600:900}, w=SIZES[d.w]?d.w:1000;
  const out={name:clean(d.name||'Imported network',40)||'Imported network',w,h:SIZES[w],nodes:{},cables:[]};
  if(d.dwg) out.dwg=clean(d.dwg,24);
  out.depot=pt(d.depot)||[60,out.h-50];
  if(Array.isArray(d.mlDefault)&&num(d.mlDefault[0])&&num(d.mlDefault[1])&&['start','middle','end'].includes(d.mlDefault[2])) out.mlDefault=d.mlDefault.slice(0,3);
  Object.keys(d.nodes).forEach(k=>{
    const n=d.nodes[k], id=clean(k,12).replace(/[^A-Za-z0-9_-]/g,'');
    if(!id||!n||!pt(n.s)||!pt(n.m)) return;
    const o={name:clean(n.name||id,32)||id,s:pt(n.s),m:pt(n.m)};
    if(n.kind==='primary') o.kind='primary';
    else{
      o.code=clean(n.code||'',4); o.cust=Math.max(0,Math.min(5000,Math.round(+n.cust||0)));
      if(n.remote) o.remote=true;
      if(n.area) o.area=clean(n.area,24);
      if(n.hospital) o.hospital=clean(n.hospital,40);
      if(n.site&&n.site.name) o.site={name:clean(n.site.name,40),off:clean(n.site.off||n.site.name+' loses power',80),back:clean(n.site.back||n.site.name+' back on',80)};
      if(['b','bl','br','r','l'].includes(n.sl)) o.sl=n.sl;
      if(n.note) o.note=clean(n.note,120);
    }
    if(Array.isArray(n.ml)&&num(n.ml[0])&&num(n.ml[1])&&['start','middle','end'].includes(n.ml[2])) o.ml=n.ml.slice(0,3);
    out.nodes[id]=o;
  });
  const taken={};
  d.cables.forEach(c=>{
    if(!c||!out.nodes[c.a]||!out.nodes[c.b]||c.a===c.b) return;
    let id=clean(c.id||'',12).replace(/[^A-Za-z0-9_-]/g,''); if(!id||taken[id]) id=uid('K',taken); taken[id]=1;
    const o={id,a:c.a,b:c.b};
    if(c.nop==='a'||c.nop==='b') o.nop=c.nop;
    if(c.oh) o.oh=true;
    if(num(c.rating)) o.rating=Math.max(50,Math.min(1000,Math.round(c.rating)));
    if(c.feeder) o.feeder=clean(c.feeder,20);
    if(line(c.sp)) o.sp=line(c.sp);
    if(line(c.mp)) o.mp=line(c.mp);
    out.cables.push(o);
  });
  if(d.decor&&typeof d.decor==='object'){
    const dc={};
    if(typeof d.decor.river==='string'&&/^[0-9MCSLQZmcslqz ,.\-]+$/.test(d.decor.river)) dc.river=d.decor.river.slice(0,400);
    if(typeof d.decor.coast==='string'&&/^[0-9MCSLQZmcslqz ,.\-]+$/.test(d.decor.coast)) dc.coast=d.decor.coast.slice(0,2000);
    if(Array.isArray(d.decor.hills)) dc.hills=d.decor.hills.filter(k=>Array.isArray(k)&&k.slice(0,4).every(num)).map(k=>k.slice(0,4));
    if(Array.isArray(d.decor.parks)) dc.parks=d.decor.parks.filter(p=>Array.isArray(p)&&p.slice(0,4).every(num)).map(p=>[p[0],p[1],p[2],p[3],clean(p[4]||'',30)]);
    if(Array.isArray(d.decor.labels)) dc.labels=d.decor.labels.filter(l=>Array.isArray(l)&&num(l[0])&&num(l[1])).map(l=>l[3]==='town'||l[3]==='sea'?[l[0],l[1],clean(l[2]||'',30),l[3]]:[l[0],l[1],clean(l[2]||'',30)]);
    if(Array.isArray(d.decor.roads)) dc.roads=d.decor.roads.map(line).filter(Boolean);
    if(Array.isArray(d.decor.landmarks)) dc.landmarks=d.decor.landmarks.filter(l=>Array.isArray(l)&&num(l[0])&&num(l[1])&&LANDMARK[l[2]]).map(l=>[l[0],l[1],l[2]]);
    if(d.decor.cableRoads===false) dc.cableRoads=false;
    const idOk=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,12}$/.test(v);
    if(d.decor.airport&&pt(d.decor.airport.c)) dc.airport={c:pt(d.decor.airport.c),a:num(d.decor.airport.a)?d.decor.airport.a:0,node:idOk(d.decor.airport.node)?d.decor.airport.node:''};
    if(d.decor.harbour&&num(d.decor.harbour.x0)&&num(d.decor.harbour.x1)&&Array.isArray(d.decor.harbour.piers))
      dc.harbour={x0:d.decor.harbour.x0,x1:d.decor.harbour.x1,piers:d.decor.harbour.piers.filter(num).slice(0,6),node:idOk(d.decor.harbour.node)?d.decor.harbour.node:''};
    if(Array.isArray(d.decor.lakes)) dc.lakes=d.decor.lakes.filter(k=>Array.isArray(k)&&k.slice(0,4).every(num)).map(k=>[k[0],k[1],k[2],k[3],clean(k[4]||'',30)]);
    if(d.decor.rail&&line(d.decor.rail.pts)) dc.rail={pts:line(d.decor.rail.pts),stations:(Array.isArray(d.decor.rail.stations)?d.decor.rail.stations:[]).filter(s=>Array.isArray(s)&&num(s[0])&&num(s[1])).map(s=>[s[0],s[1],clean(s[2]||'',30)])};
    if(Array.isArray(d.decor.towns)) dc.towns=d.decor.towns.filter(t=>t&&pt(t.c)&&Array.isArray(t.r)&&num(t.r[0])&&num(t.r[1])).slice(0,40)
      .map(t=>{ const o={c:pt(t.c),r:[Math.min(400,Math.max(10,t.r[0])),Math.min(300,Math.max(8,t.r[1]))],a:num(t.a)?t.a:0}; if(num(t.grid)&&t.grid>=30) o.grid=t.grid; if(t.name) o.name=clean(t.name,30); return o; });
    out.decor=dc;
  }
  return out;
}

// ---------- Sound (made on the fly, so nothing to download) ----------
let AC=null, windGain=null;
function audio(){
  if(!UI.settings.sound||!UI.sfxReady) return null;
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; }
}
function tone(ac,f,t0,dur,type,vol){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+dur+.05); }
function noise(ac,t0,dur,vol,freq){
  const b=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); s.buffer=b; f.type='lowpass'; f.frequency.value=freq; g.gain.value=vol;
  s.connect(f).connect(g).connect(ac.destination); s.start(t0);
}
function sfx(kind){
  const ac=audio(); if(!ac) return; const t=ac.currentTime;
  try{
    if(kind==='trip'){ noise(ac,t,.3,.6,700); tone(ac,62,t,.4,'sine',.4); }
    else if(kind==='click'){ noise(ac,t,.06,.3,2600); }
    else if(kind==='alarm'){ [0,.34,.68].forEach(d=>{ tone(ac,880,t+d,.15,'square',.05); tone(ac,660,t+d+.17,.15,'square',.05); }); }
    else if(kind==='phone'){ [0,.55].forEach(d=>{ tone(ac,440,t+d,.4,'sine',.06); tone(ac,480,t+d,.4,'sine',.06); }); }
    else if(kind==='chime'){ [523,659,784,1047].forEach((f,i)=>tone(ac,f,t+i*.11,.6,'sine',.08)); }
  }catch(e){}
}
// a soft rushing wind during storms, louder as the gusts build
function updateWind(){
  const on=S&&S.weather&&S.weather.storm&&!S.paused&&UI.mode==='play'&&!UI.overlay;
  if(!on){ if(windGain) windGain.gain.value=0; return; }
  const ac=audio(); if(!ac){ if(windGain) windGain.gain.value=0; return; }
  if(!windGain){
    const len=ac.sampleRate*2, b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; }
    const s=ac.createBufferSource(), f=ac.createBiquadFilter(); s.buffer=b; s.loop=true; f.type='bandpass'; f.frequency.value=420;
    windGain=ac.createGain(); windGain.gain.value=0; s.connect(f).connect(windGain).connect(ac.destination); s.start();
  }
  windGain.gain.value=Math.max(0,(windAt(S.t)-25)/70)*0.3;
}

// ---------- Plain English and the glossary ----------
const GLOSS=[
  ['normally open point','spare link','A switch kept open on purpose where two circuits meet. Close it to let one circuit feed the other\'s customers.'],
  ['NOP','spare link','Normally open point: a switch kept open on purpose where two circuits meet. Close it to let one circuit feed the other\'s customers.'],
  ['fault passage indicator','fault flag','A flag at a substation that trips when fault current passes through it. The fault is beyond the last red flag.'],
  ['FPI','fault flag','Fault passage indicator: a flag that trips when fault current passes through it. The fault is beyond the last red flag.'],
  ['back-feed','feed from next door','Supplying customers from a neighbouring circuit through a spare link, after the faulty part has been cut off.'],
  ['ring main unit','street substation','The set of switches at a local substation. Each switch connects it to the cable going one way or the other.'],
  ['primary substation','main substation','Where the network steps down to 11,000 volts and each circuit starts with its own breaker.'],
  ['primary','main substation','Where the network steps down to 11,000 volts and each circuit starts with its own breaker.'],
  ['Feeder loading','Circuit loading','How much current each circuit is carrying compared with what its breaker allows.'],

const GLOSS_RE=new RegExp('\\b('+GLOSS.map(g=>g[0].replace(/[.*+?^${}()|[\]\\-]/g,'\\$&')).join('|')+')\\b','gi');
const glossOf=m=>GLOSS.find(g=>g[0].toLowerCase()===m.toLowerCase());
// walk the text of a panel: swap jargon for plain words if asked, and underline each term with an explanation on hover
function decorate(root){
  if(!root) return;
  const plain=UI.settings.plain, nodes=[], w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){ const n=w.currentNode, p=n.parentElement; if(!p||p.closest('.term,script,style,textarea,input,select,option,svg')) continue; if(GLOSS_RE.test(n.nodeValue)) nodes.push(n); GLOSS_RE.lastIndex=0; }
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment(), s=n.nodeValue; let last=0, m;
    GLOSS_RE.lastIndex=0;
    while((m=GLOSS_RE.exec(s))){
      const g=glossOf(m[0]); if(!g) continue;
      if(g[0]===g[0].toUpperCase()&&m[0]!==g[0]) continue;   // acronyms must match their case
      frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const sp=document.createElement('span'); sp.className='term'; sp.dataset.tip=g[2];
      let txt=plain?g[1]:m[0]; if(plain&&m[0][0]===m[0][0].toUpperCase()&&m[0]!==m[0].toUpperCase()) txt=txt[0].toUpperCase()+txt.slice(1);
      sp.textContent=txt; frag.appendChild(sp); last=m.index+m[0].length;
    }
    frag.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(frag,n);
  });
}
function decorateAll(){ ['#panel','#objSec','#loadsH','#crewSec','#log','#newsSec','#wxSec','#legend','.bar .stats','#overlay','#coach'].forEach(s=>document.querySelectorAll(s).forEach(decorate)); }

// ---------- Switch previews ----------
function previewOp(sid,close){
  const res={sid,close,gain:[],lose:[],loads:[],risk:[],trip:false,block:null};
  if(locked(nodeOfSw(sid))){ res.block='this site is unsafe after the theft'; return res; }
  if(close){ const b=parallelBlock(sid); if(b){ res.block=b; return res; } }
  const sw2=Object.assign({},S.sw); sw2[sid]=close;
  const s0=solve(), s1=solve(sw2);
  RMUS.forEach(n=>{ if(S.lvOut[n]) return; const a=s0.island[n]!=null, b=s1.island[n]!=null; if(!a&&b) res.gain.push(n); if(a&&!b) res.lose.push(n); });
  CBIDS.forEach(id=>{ if(!sw2[id]) return; const a0=S.sw[id]?cbLoad(s0,id):0, a1=cbLoad(s1,id); if(Math.abs(a1-a0)>0.5||a1>rat(id)) res.loads.push({id,a:a1,r:rat(id)}); });
  const anyFault=S.faults.some(f=>f.active);
  CABLES.forEach(c=>{
    if(s0.cab[c.id]||!s1.cab[c.id]) return;
    const t=S.tested[c.id];
    if(t==='fault'&&faultOn(c.id)) res.trip=true;
    else if(anyFault&&t!=='healthy'&&t!=='repaired') res.risk.push(c.id);
  });
  // trainees get the true answer
  if(S.diff==='trainee'){ res.trip=res.trip||S.faults.some(f=>f.active&&!(f.transient&&f.trips>0)&&!s0.cab[f.cable]&&s1.cab[f.cable]); res.risk=[]; }
  return res;
}
const custSum = ns=>ns.reduce((a,n)=>a+N[n].cust,0);
function showPreview(sid,close){
  if(!S||UI.mode!=='play') return;
  const r=previewOp(sid,close), el=$('#prev');
  let h=`<b>${close?'Close':'Open'} ${switchLabel(sid)}</b>`;
  if(r.block) h+=`<div class="pv-bad">Not allowed: ${r.block}</div>`;
  else {
    if(r.gain.length) h+=`<div class="pv-good">+${fmtN(custSum(r.gain))} customers back on (${r.gain.slice(0,3).map(n=>N[n].name).join(', ')}${r.gain.length>3?'…':''})</div>`;
    if(r.lose.length) h+=`<div class="pv-bad">−${fmtN(custSum(r.lose))} customers lose power (${r.lose.slice(0,3).map(n=>N[n].name).join(', ')}${r.lose.length>3?'…':''})</div>`;
    if(!r.gain.length&&!r.lose.length) h+=`<div>Nobody gains or loses power.</div>`;
    r.loads.forEach(l=>{ const over=l.a>l.r; h+=`<div class="${over?'pv-bad':''}">${CB[l.id].name} ${CB[l.id].feeder}: ${Math.round(l.a)} / ${l.r} A ${over?(S.diff==='trainee'?'· overloaded':'· will trip on overload'):'· OK'}</div>`; });
    if(r.trip) h+=`<div class="pv-bad">This switches the faulty cable back on: the breaker will trip.</div>`;
    else if(r.risk.length) h+=`<div class="pv-warn">Switches on ${plural(r.risk.length,'section')} not yet proven healthy. If the fault is there, the breaker trips.</div>`;
  }
  el.innerHTML=h; el.hidden=false; decorate(el);
  // rings on the diagram: green for customers coming back, red for those going off
  const svg=$('#svg'), old=svg.querySelector('#pvg'); if(old) old.remove();
  const P=n=>UI.view==='s'?N[n].s:N[n].m, R=UI.view==='s'?30:17;
  let g=`<g id="pvg" pointer-events="none">`;
  r.gain.forEach(n=>{ const p=P(n); g+=`<circle class="pv-ring good" cx="${p[0]}" cy="${p[1]}" r="${R}"/>`; });
  r.lose.forEach(n=>{ const p=P(n); g+=`<circle class="pv-ring bad" cx="${p[0]}" cy="${p[1]}" r="${R}"/>`; });
  r.risk.forEach(cid=>{ g+=`<polyline class="pv-risk" points="${pts(CBL[cid]).map(p=>p.join(',')).join(' ')}"/>`; });
  svg.insertAdjacentHTML('beforeend',g+'</g>');
}
function hidePreview(){ const el=$('#prev'); if(el) el.hidden=true; const g=$('#svg').querySelector('#pvg'); if(g) g.remove(); }

// ---------- Hints ----------
// Everything here uses the true state of the network, so hints are always right.
function simSw(sw2){
  const s0=solve(), s1=solve(sw2);
  const trip=S.faults.some(f=>f.active&&!(f.transient&&f.trips>0)&&s1.cab[f.cable]&&!s0.cab[f.cable]);
  const over=CBIDS.some(id=>sw2[id]&&cbLoad(s1,id)>rat(id)+0.01);
  // two primaries tied together, either inside one island or across a closed cable between two islands
  const primOf=k=>CB[s1.islands[k].cbs[0]].prim;
  const par=s1.islands.some(isl=>new Set(isl.cbs.map(cb=>CB[cb].prim)).size>1)
    ||CABLES.some(c=>{ if(!sw2[c.id+':a']||!sw2[c.id+':b']) return false; const ia=s1.island[c.a], ib=s1.island[c.b]; return ia!=null&&ib!=null&&ia!==ib&&primOf(ia)!==primOf(ib); });
  let gain=0, lose=0; RMUS.forEach(n=>{ if(S.lvOut[n]) return; const a=s0.island[n]!=null, b=s1.island[n]!=null; if(!a&&b) gain+=N[n].cust; if(a&&!b) lose+=N[n].cust; });
  return {ok:!trip&&!over&&!par,gain,lose};
}
const usable = sid=>!pendingFor(sid)&&!locked(nodeOfSw(sid));
function hintPlan(){

  const ends=c=>[c.a,c.b].filter(n=>N[n].kind!=='primary');

  const deadCable=cid=>!solve().cab[cid];
  // make a cable dead without cutting anyone off: back-feed first if needed, then open its ends
  const isolateMove=cid=>{
    const c=CBL[cid], closed=['a','b'].map(e=>cid+':'+e).filter(s=>sw[s]&&usable(s));
    for(const s of closed){ const s2=Object.assign({},sw); s2[s]=false; const r=simSw(s2); if(r.lose===0) return {text:`Open the ${switchLabel(s)}.`,sw:s,close:false}; }
    const opens=Object.keys(sw).filter(s=>!sw[s]&&usable(s));
    for(const x of opens){ const s1=Object.assign({},sw); s1[x]=true; const r1=simSw(s1); if(!r1.ok) continue;
      for(const s of closed){ const s2=Object.assign({},s1); s2[s]=false; if(simSw(s2).lose===0) return {text:`First close the ${switchLabel(x)} so the far side has another supply, then open the ${switchLabel(s)}.`,sw:x,close:true}; } }
    return closed.length?{text:`Open the ${switchLabel(closed[0])}. Some customers will lose power, but it has to be done.`,sw:closed[0],close:false}:null;
  };
  if(S.pole&&!S.pole.done&&!deadCable(S.pole.cable)){
    let m=isolateMove(S.pole.cable);

      if(S.t+eta>S.pole.deadline-3){
        const fast=Object.keys(sw).filter(s=>sw[s]&&usable(s)&&remoteFor(s)).map(s=>{ const s2=Object.assign({},sw); s2[s]=false; return {s,dead:!solve(s2).cab[cid],lose:simSw(s2).lose}; }).filter(x=>x.dead).sort((a,b)=>a.lose-b.lose)[0];
        if(fast) m={text:`Open the ${switchLabel(fast.s)} from the control room. A crew can't reach the line before the deadline, and this makes it dead at once.`,sw:fast.s,close:false};
      }
    }
    if(m) return {nudge:`The police deadline is ${fmtT(S.pole.deadline)}. Switch the damaged line off before then, feeding the far end from a neighbour if you can.`,focus:{nodes:[CBL[S.pole.cable].a,CBL[S.pole.cable].b],cables:[S.pole.cable]},move:m}; }

      const opens=Object.keys(sw).filter(s=>!sw[s]&&usable(s));

      for(const x of opens){ const s1=Object.assign({},sw); s1[x]=true; const r1=simSw(s1); if(!r1.ok) continue; const s2=Object.assign({},s1); closed.forEach(s=>s2[s]=false); if(simSw(s2).lose<=N[n].cust&&simSw(Object.assign({},sw,Object.fromEntries(closed.map(s=>[s,false])))).lose>N[n].cust) return {nudge:`Water reaches ${N[n].name} at ${fmtT(S.flood.at)}. Feed what lies beyond it from a neighbour, then switch it off.`,focus:{nodes:[n],cables:[]},move:{text:`Close the ${switchLabel(x)} first.`,sw:x,close:true}}; }
      return {nudge:`Water reaches ${N[n].name} at ${fmtT(S.flood.at)}. Switch it off before then.`,focus:{nodes:[n],cables:[]},move:{text:`Open the ${switchLabel(closed[0])}.`,sw:closed[0],close:false}};
    }
  }
  const lvN=RMUS.find(n=>S.lvFault[n]&&!S.crews.some(cr=>(cr.job&&cr.job.type==='lvfix'&&cr.job.node===n)||cr.queue.some(j=>j.type==='lvfix'&&j.node===n)));
  if(lvN) return {nudge:'One substation\'s customers are off but the 11 kV network is fine there. That is a street (low-voltage) fault.',focus:{nodes:[lvN],cables:[]},move:{text:`Send a crew to fix the low-voltage fault at ${N[lvN].name}.`,kind:'lvfix',id:lvN}};
  const flN=RMUS.find(n=>S.flooded[n]==='damaged'&&S.flood&&S.flood.state==='receded'&&!S.crews.some(cr=>(cr.job&&cr.job.type==='rebuild')||cr.queue.some(j=>j.type==='rebuild')));
  if(flN) return {nudge:'The flood water has gone, but the switchgear was wrecked.',focus:{nodes:[flN],cables:[]},move:{text:`Send a crew to rebuild ${N[flN].name}.`,kind:'rebuild',id:flN}};

    else if(!cableBusy(cid)) return {nudge:'The cable is switched out. Hand it over to a crew.',focus:{nodes:[],cables:[cid]},move:{text:`Send a crew to do the maintenance on ${cableName(CBL[cid])}.`,kind:'maint',id:cid}};
  }

    const cid=S.dev.cable;
    if(S.tested[cid]==='fault'){ if(!cableBusy(cid)&&deadCable(cid)) return {nudge:'You have found the failing cable. Repair it before it breaks down.',focus:{nodes:[],cables:[cid]},move:{text:`Repair ${cableName(CBL[cid])}.`,kind:'repair',id:cid}}; }
    else if(!deadCable(cid)){ const m=isolateMove(cid); if(m) return {nudge:`One of the cables near ${N[S.dev.node].name} is failing. Switch it out safely so it can be tested.`,focus:{nodes:[S.dev.node],cables:[cid]},move:m}; }

    return {
      nudge:known?'You know where the damage is. Cut it off at both ends before switching anything back on.'
                 :'Follow the fault flags along the circuit that tripped. The fault is past the last red flag and before the first white one. Flags showing "?" need a crew to read them.',

    focus:{nodes:[nodeOfSw(best.sid)],cables:[best.sid.split(':')[0]]},
    move:{text:`Close the ${switchLabel(best.sid)} to bring back ${fmtN(best.gain)} customers.`,sw:best.sid,close:true}

    for(const a of ab) for(const b of ab){ if(a===b||sw[a]||!sw[b]) continue; const s1=Object.assign({},sw); s1[a]=true; if(!simSw(s1).ok) continue; const s2=Object.assign({},s1); s2[b]=false; const r=simSw(s2); if(r.ok&&r.lose===0) return {nudge:'Close a link first, then open the other point, so nobody goes off.',focus:{nodes:[nodeOfSw(a),nodeOfSw(b)],cables:[]},move:{text:`Close the ${switchLabel(a)} first, then open the ${switchLabel(b)}.`,sw:a,close:true}}; }

    const sid=ab.find(s=>sw[s])||ab[0]; if(sid) return {nudge:'Some switches are still out of their normal position. A short break may be unavoidable between different main substations.',focus:{nodes:[nodeOfSw(sid)],cables:[]},move:{text:`${sw[sid]?'Open':'Close'} the ${switchLabel(sid)}.`,sw:sid,close:!sw[sid]}};
  }

  if(gn) return {nudge:`${N[gn].name} has been off a while and nothing more can be switched. A mobile generator could get those customers back on until the repair is finished.`,focus:{nodes:[gn],cables:[]},move:{text:`Hire a mobile generator for ${N[gn].name} (£${fmtN(GEN.hire)} + £${GEN.hourly} an hour).`,kind:'gen',id:gn}};
  return {nudge:'Nothing to switch right now. Let the clock run while the crews work, or speed it up.',focus:{nodes:[],cables:[]},move:null};
}
function nextHint(){

  S.sel=null; dirty=true; render();
}
function doHintMove(){
  const m=UI.hint&&UI.hint.plan.move; if(!m) return;

// A rough "what an expert would have done": remote switching first, crews straight to the right place.
function expertCML(){
  const bad=new Set(S.faults.filter(f=>!f.transient).map(f=>f.cable)), onlyTransient=S.faults.length&&S.faults.every(f=>f.transient);
  const adj={}; Object.keys(N).forEach(k=>adj[k]=[]);
  CABLES.forEach(c=>{ if(bad.has(c.id)) return; adj[c.a].push(c.b); adj[c.b].push(c.a); });
  const reach=new Set(), q=[...PRIMS];
  while(q.length){ const n=q.shift(); adj[n].forEach(m=>{ if(!reach.has(m)&&N[m].kind!=='primary'){ reach.add(m); q.push(m); } }); }
  const nearRemote=n=>N[n].remote||INC[n].some(({c,end})=>N[c[other(end)]].remote);
  let cml=0;
  Object.keys(S.everOff||{}).forEach(n=>{
    let mins;
    if(onlyTransient) mins=3;
    else if(S.theft&&n in S.theft) mins=tt(NET.depot,N[n].m)+90;
    else if(!reach.has(n)){ const f=S.faults.find(f=>bad.has(f.cable)); mins=tt(NET.depot,N[n].m)+25+(f&&f.damage?DAMAGE[f.damage].mins:150); }
    else mins=nearRemote(n)?6:Math.min(50,tt(NET.depot,N[n].m)+10);
    cml+=N[n].cust*mins;
  });
  return Math.round(cml);
}
function pickTip(st,exp){
  if(st.safety) return 'A crew closed a switch onto a fault. Always prove a section is healthy (test or patrol it) before closing onto it by hand.';
  if(st.faultTrips) return 'Before switching a section back on, cut the fault off at both ends. Use the preview: hover a switch to see what it would do.';
  if(st.overloads) return 'Check the circuit loading before closing a spare link. If one neighbour can\'t take everyone, split the area between two.';
  if(S.media.some(m=>m.answered==='ignored')) return 'Answer the press when they call, even with a holding statement. Silence costs public confidence.';
  if(S.media.some(m=>m.result==='missed')) return 'Only promise restoration times you can keep. A missed promise does more harm than a cautious one.';
  if(exp&&st.cml>exp*1.8) return 'Get the healthy parts back first with remote switches (sites with a green dot only take 2 minutes), then send crews for the rest.';
  if(st.undos||st.hints) return 'Good work. Next time try it without hints or undo to earn every star.';
  return 'Nicely done. Try a harder difficulty or a storm shift next.';
}
function timelineSvg(){
  const hs=(S.hist||[]).concat([[S.t,offCount()]]); if(hs.length<2) return '';
  const W=420, H=110, t0=S.t0, t1=Math.max(S.t,t0+30), mx=Math.max(1,...hs.map(p=>p[1]));
  const L=46, x=t=>((t-t0)/(t1-t0))*(W-L-6)+L, y=v=>H-18-(v/mx)*(H-30);
  let d=`M${x(hs[0][0])},${y(0)} `+hs.map(p=>`L${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ')+` L${x(hs[hs.length-1][0])},${y(0)}Z`;
  const marks=S.log.filter(l=>l.kind==='bad'&&/tripped/.test(l.text)).map(l=>`<path class="tl-trip" d="M${x(l.t).toFixed(1)},${y(mx)-2} l-3.5,-6 h7z"/>`).join('');
  return `<svg class="tl" viewBox="0 0 ${W} ${H}" aria-label="Customers off over time"><path class="tl-a" d="${d}"/><line class="tl-ax" x1="${L}" x2="${W-4}" y1="${y(0)}" y2="${y(0)}"/>
    <text x="${L-5}" y="${y(mx)+4}" text-anchor="end">${fmtN(mx)}</text><text x="${L-5}" y="${y(0)}" text-anchor="end">0</text>
    <text x="${L}" y="${H-4}">${fmtT(t0)}</text><text x="${W-4}" y="${H-4}" text-anchor="end">${fmtT(t1)}</text>${marks}</svg>`;
}

function onShiftEnd(){

  const st=S.restored||snapshotStats(), sc=stars(st).s, rep={money:null,xp:0,promoted:false,ach:[],board:null};
  rep.ach=checkAchievements(st);

    const m=shiftMoney(), objDone=(S.objectives||[]).filter(k=>OBJ[k]&&OBJ[k].fn()==='done').length, bonus=sc*1500;

    CAREER.history.push({week:CAREER.week,day:CAREER.day,scen:S.scen,stars:sc,cml:Math.round(st.cml),result:m.result+bonus});
    if(m.result>0){ const a=unlock('budget'); if(a) rep.ach.push('budget'); }
    CAREER.day++; if(CAREER.day>=5){ CAREER.day=0; CAREER.week++; if(unlock('week')) rep.ach.push('week'); storyCheck('weekEnd'); }
    const nr=RANKS.reduce((r,x,i)=>CAREER.xp>=x.xp?i:r,0);
    if(nr>CAREER.rank){ CAREER.rank=nr; rep.promoted=RANKS[nr].name; if(unlock('promoted')) rep.ach.push('promoted'); storyCheck('promoted'); }
    if(CAREER.funds<0) storyCheck('broke');
    if(sc<=1) storyCheck('badShift'); else storyCheck('goodShift');
    if(CAREER.week>1&&CAREER.day===0&&(CAREER.week-1)%4===0) storyCheck('season');
    saveCareer();
  }

}

const SWKEYS = ()=>Object.keys(S.sw).sort();
function recordFrame(){
  if(!S||!S.frames) return;
  const sw=SWKEYS().map(k=>S.sw[k]?1:0).join(''), on=RMUS.map(n=>S.on[n]?1:0).join(''), last=S.frames[S.frames.length-1];
  if(last&&last.sw===sw&&last.on===on&&S.t-last.t<5) return;
  S.frames.push({t:S.t,sw,on,crews:S.crews.map(cr=>crewPos(cr).map(v=>Math.round(v))),off:offCount()});
  if(S.frames.length>800) S.frames.splice(1,1);
}
function startReplay(){
  if(!S||!S.frames||S.frames.length<2) return;
  UI.replay={i:0,playing:true,saved:JSON.stringify(Object.assign({},S,{def:null}))};
  UI.overlay=null; S.modal=null; S.sel=null; UI.hint=null; render(); showFrame(0);
}
function showFrame(i){
  const R=UI.replay; if(!R) return;

  keys.forEach((k,j)=>S.sw[k]=f.sw[j]==='1'); RMUS.forEach((n,j)=>S.on[n]=f.on[j]==='1');
  S.t=f.t; S.crews.forEach((cr,j)=>{ cr.job=null; cr.queue=[]; if(f.crews[j]) cr.pos=f.crews[j]; });

function upgradeChoices(u){
  if(u.pick==='node') return RMUS.filter(n=>!N[n].remote&&!(CAREER.upg.remote||[]).includes(n)).map(n=>[n,`${N[n].name} (${N[n].code})`]);
  if(u.pick==='ohline') return CABLES.filter(c=>c.oh&&!(CAREER.upg.underground||[]).includes(c.id)).map(c=>[c.id,cableName(c)]);
  if(u.pick==='feeder') return CBIDS.filter(id=>!(CAREER.upg.recloser||[]).includes(id)).map(id=>[id,`${CB[id].name} ${CB[id].feeder}`]);
  if(u.pick==='site') return RMUS.filter(n=>(N[n].hospital||N[n].site)&&!(CAREER.upg.backup||[]).includes(n)).map(n=>[n,N[n].hospital||N[n].site.name]);
  return null;
}
function upgradeOwned(u){
  const g=CAREER.upg;
  if(u.once) return !!g[u.id];
  if(u.max) return (g[u.id]||0)>=u.max;
  return false;
}
function buyUpgrade(id,choice){
  const u=UPGRADES.find(x=>x.id===id); if(!u||!CAREER) return;
  if(CAREER.funds<u.cost){ toast('Not enough funds for that yet.'); return; }
  const g=CAREER.upg;
  if(u.pick){ if(!choice) return; g[{node:'remote',ohline:'underground',feeder:'recloser',site:'backup'}[u.pick]].push(choice); }
  else if(u.once) g[u.id]=true; else g[u.id]=(g[u.id]||0)+1;
  CAREER.funds-=u.cost; saveCareer(); toast(`Bought: ${u.name}.`); sfx('chime'); renderOverlay();
}

  const tm=e.target.closest('.term'); if(tm){ showTip(tm); return; }
  const zb=e.target.closest('[data-zoom]'); if(zb){ const z=zb.dataset.zoom; if(z==='in') zoomAt(1/1.3); else if(z==='out') zoomAt(1.3); else setVB(fullVB()); return; }
  const sb=e.target.closest('[data-speed]'); if(sb){ setSpeed(+sb.dataset.speed); return; }
  const vb=e.target.closest('[data-view]'); if(vb){ UI.view=vb.dataset.view; render(); return; }
  const mb=e.target.closest('[data-mode]');
  if(mb){ UI.vb={}; hidePreview(); if(mb.dataset.mode==='edit'&&UI.mode!=='edit') startEditor(); else if(mb.dataset.mode==='play'&&UI.mode!=='play'){ UI.mode='play'; render(); } return; }
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act;
  switch(a){
    case 'op': orderOp(b.dataset.sw,b.dataset.close==='1'); break;
    case 'visit': orderVisit(b.dataset.n); break;
    case 'test': orderCable(b.dataset.c,'test'); break;
    case 'repair': orderCable(b.dataset.c,'repair'); break;
    case 'cancel': cancelJob(+b.dataset.crew,+b.dataset.q); break;
    case 'dispatch': S.dispatch=b.dataset.v==='auto'?'auto':+b.dataset.v; renderSide(); break;
    case 'desel': S.sel=null; render(); break;
    case 'selc': S.sel={k:'cable',id:b.dataset.c}; render(); break;
    case 'selsw': S.sel={k:'node',id:nodeOfSw(b.dataset.sw),sw:b.dataset.sw}; render(); break;
    case 'seln': S.sel={k:'node',id:b.dataset.n}; render(); break;
    case 'makesafe': orderMakeSafe(b.dataset.n); break;
    case 'patrol': orderCable(b.dataset.c,'patrol'); break;
    case 'media': answerMedia(+b.dataset.id,+b.dataset.h); break;
    case 'su-ass': UI.setup.assessors=+b.dataset.v; renderOverlay(); break;
    case 'home': UI.overlay='home'; UI.letter=false; if(S) S.paused=true; renderStats(); renderOverlay(); break;
    case 'letter': UI.letter=true; renderOverlay(); break;
    case 'letter-done': UI.letter=false; try{ localStorage.setItem('openpoint.letterRead','1'); }catch(err){} renderOverlay(); break;
    case 'shift': if(b.dataset.v==='s0') startTutorial(); else { UI.tut=null; startShift(b.dataset.v); } break;
    case 'hint': nextHint(); break;
    case 'hint-x': UI.hint=null; render(); break;
    case 'hint-do': doHintMove(); break;
    case 'undo': doUndo(); break;
    case 'why-x': UI.why=null; render(); break;
    case 'settings': UI.overlay='settings'; if(S) S.paused=true; renderOverlay(); renderStats(); break;
    case 'set': {
      const key=b.dataset.k, raw=b.dataset.v, v=raw==='true'?true:raw==='false'?false:raw;
      UI.settings[key]=v; saveSettings();
      if(key==='sound'&&!v&&windGain) windGain.gain.value=0;
      render(); break;
    }
    case 'tut-next': advanceTut(); break;
    case 'tut-skip': UI.tut=null; render(); break;
    case 'tut-start': UI.overlay=null; startTutorial(); break;
    case 'setup': UI.overlay='setup'; if(S) S.paused=true; renderOverlay(); break;
    case 'su-scen': UI.setup.scen=b.dataset.v; UI.setup.crews=b.dataset.v==='storm'?3:2; UI.setup.assessors=b.dataset.v==='storm'?2:0; renderOverlay(); break;
    case 'su-crews': UI.setup.crews=+b.dataset.v; renderOverlay(); break;
    case 'su-start': {
      UI.setup.net=$('#su-net').value;
      if(S) S.modal=null;
      newIncident(resolveNet(UI.setup.net),UI.setup.scen,UI.setup.crews,null,UI.setup.assessors||0);
      UI.overlay=null; UI.mode='play'; render(); break;
    }
    case 'ov-close': UI.overlay=null; UI.msg=''; render(); break;
    case 'm-continue': S.modal=null; UI.overlay=null; S.paused=false; render(); break;
    case 'm-view': S.modal=null; UI.overlay=null; render(); break;
    case 'tool': E.tool=b.dataset.v; E.pend=null; renderTools(); renderSvg(true); break;
    case 'e-delsel': if(E.sel){ if(E.sel.k==='node') delNode(E.sel.id); else delCable(E.sel.id); editChanged(true); } break;
    case 'e-straight': { const c=E.def.cables.find(x=>x.id===E.sel.id); if(c){ delete c[UI.view==='s'?'sp':'mp']; BLOCKS=null; editChanged(true); } break; }
    case 'e-save': {
      const all=savedList(); if(!E.key) E.key='n'+Date.now().toString(36);
      all[E.key]=E.def; toast(writeSaved(all)?'Saved in this browser.':'This browser blocked saving. Use Export to keep a copy.');
      renderEditSide(); break;
    }
    case 'e-del': {
      if(!E.confirmDel){ E.confirmDel=true; renderEditSide(); break; }
      const all=savedList(); delete all[E.key]; writeSaved(all); E.key=null; E.confirmDel=false; toast('Saved copy deleted. The network is still open in the editor.'); renderEditSide(); break;
    }
    case 'e-new': E.def={name:'My network',w:1000,h:560,depot:[60,510],nodes:{},cables:[]}; E.key=null; E.sel=null; E.pend=null; E.tool='prim'; editChanged(true); renderTools(); break;
    case 'e-export': UI.overlay='export'; renderOverlay(); break;
    case 'e-import': UI.overlay='import'; UI.msg=''; renderOverlay(); break;
    case 'ex-copy': {
      const ta=$('#ex-text');
      try{ navigator.clipboard.writeText(ta.value).then(()=>toast('Copied.'),()=>{ ta.focus(); ta.select(); }); }catch(err){ ta.focus(); ta.select(); }
      break;
    }
    case 'im-load': {
      try{ const d=normalizeDef(JSON.parse($('#im-text').value)); E.def=d; E.key=null; E.sel=null; UI.overlay=null; UI.msg=''; editChanged(true); renderOverlay(); toast(`Loaded ${d.name}.`); }
      catch(err){ UI.msg=err instanceof SyntaxError?'That text isn\'t valid JSON. Paste the whole export, including the first { and last }.':err.message; renderOverlay(); }
      break;
    }
    case 'gen': hireGenerator(b.dataset.n); break;
    case 'gen-home': { const g=(S.gens||[]).find(x=>x.id===b.dataset.id); if(g&&canOrder()){ pushUndo('send generator '+g.id+' home'); genHome(g,`Generator ${g.id} sent back to the depot.`); afterChange(); render(); } break; }
    case 'press-later': S.pressPopup=null; UI.overlay=null; render(); break;
    case 'maint': orderCable(b.dataset.c,'maint'); break;
    case 'lvfix': orderNodeJob(b.dataset.n,'lvfix'); break;
    case 'rebuild': orderNodeJob(b.dataset.n,'rebuild'); break;
    case 'welfare': arrangeWelfare(b.dataset.n); break;
    case 'contractor': hireContractor(); break;
    case 'finish-early': finishEarly(); break;
    case 'career-start': if(S) S.modal=null; UI.confirmReset=false; startCareerShift(); break;
    case 'daily': if(S) S.modal=null; startDaily(); break;
    case 'show-upg': UI.overlay='upgrades'; renderOverlay(); break;
    case 'show-ach': UI.overlay='ach'; renderOverlay(); break;
    case 'show-board': UI.overlay='board'; renderOverlay(); break;
    case 'show-save': UI.overlay='save'; UI.msg=''; UI.confirmReset=false; renderOverlay(); break;
    case 'buy': { const sel=$('#up-'+b.dataset.v); buyUpgrade(b.dataset.v,sel?sel.value:null); break; }
    case 'msg-ok': UI.msgs.shift(); if(!UI.msgs.length){ UI.overlay=UI.msgReturn||null; UI.msgReturn=null; } renderOverlay(); break;
    case 'sv-copy': case 'share-copy': {
      const ta=$(a==='sv-copy'?'#sv-text':'#share-text');
      try{ navigator.clipboard.writeText(ta.value).then(()=>toast('Copied.'),()=>{ ta.focus(); ta.select(); }); }catch(err){ ta.focus(); ta.select(); }
      break;
    }
    case 'sv-load': {
      try{ importSave($('#sv-in').value); UI.msg=''; UI.overlay='home'; toast('Save code loaded.'); renderOverlay(); }
      catch(err){ UI.msg=err.message&&/save code/.test(err.message)?err.message:'That code could not be read. Copy the whole code and try again.'; renderOverlay(); }
      break;
    }
    case 'career-reset':
      if(!UI.confirmReset){ UI.confirmReset=true; renderOverlay(); break; }
      CAREER=newCareer(); saveCareer(); UI.confirmReset=false; toast('New career started.'); UI.overlay='home'; renderOverlay(); break;
    case 'replay': startReplay(); break;
    case 'rp-play': if(UI.replay){ if(UI.replay.i>=S.frames.length-1) UI.replay.i=0; UI.replay.playing=!UI.replay.playing; renderReplayBar(); } break;
    case 'rp-exit': exitReplay(); break;
    case 'e-play': {
      const v=validate();
      if(v.err.length){ toast('Fix the problems listed under Checks first.'); break; }
      UI.setup.net='editor'; UI.overlay='setup'; renderOverlay(); break;
    }
  }
});
function editInput(e){
  if(UI.mode!=='edit') return;
  const t=e.target, d=E.def, sel=E.sel, n=sel&&sel.k==='node'?d.nodes[sel.id]:null, c=sel&&sel.k==='cable'?d.cables.find(x=>x.id===sel.id):null;
  switch(t.id){
    case 'e-name': d.name=clean(t.value,40)||'Untitled'; $('#netName').textContent=`Editing ${d.name}`; break;
    case 'e-size': { const S2={1000:560,1500:800,1600:900}; d.w=S2[+t.value]?+t.value:1000; d.h=S2[d.w]; break; }
    case 'e-open': if(e.type==='change') editLoad(t.value); return;
    case 'e-n-name': if(n) n.name=clean(t.value,32)||'Unnamed'; break;
    case 'e-n-code': if(n) n.code=clean(t.value,4).toUpperCase(); break;
    case 'e-n-cust': if(n) n.cust=Math.max(0,Math.min(5000,parseInt(t.value,10)||0)); break;
    case 'e-n-remote': if(n) n.remote=t.checked; break;
    case 'e-n-area': if(n){ const v=clean(t.value,24); if(v) n.area=v; else delete n.area; } break;
    case 'e-n-hosp': if(n){ const v=clean(t.value,40); if(v) n.hospital=v; else delete n.hospital; } break;
    case 'e-c-oh': if(c){ if(t.checked) c.oh=true; else delete c.oh; } break;
    case 'e-n-sl': if(n) n.sl=t.value; break;
    case 'e-c-nop': if(c){ if(t.value) c.nop=t.value; else delete c.nop; } break;
    case 'e-c-rating': if(c) c.rating=Math.max(50,Math.min(1000,parseInt(t.value,10)||400)); break;
    case 'e-c-feeder': if(c){ const v=clean(t.value,20); if(v) c.feeder=v; else delete c.feeder; } break;
    default: return;
  }
  editChanged(false);
}
$('#editSide').addEventListener('input',editInput);
$('#editSide').addEventListener('change',editInput);

// ======================= Main loop =======================
// A steady timer drives the clock. An error in one tick is reported but never stops the clock.
let lastTick=performance.now(), sideTimer=0, ticker=null;
function tick(){
  const now=performance.now(), dtReal=Math.min(0.25,(now-lastTick)/1000); lastTick=now;
  try{
    // the fault-current pulse fades after a few seconds, even with the clock paused
    if(UI.pulse&&now>UI.pulse.until){ UI.pulse=null; if(UI.mode==='play'&&S) renderSvg(false); }
    // if the browser isn't giving us animation frames, keep the boats and cars moving from here
    if(now-lastAnim>250) try{ moveMovers(); }catch(e){}
    updateWind();
    const R=UI.replay;
    if(R&&R.playing&&UI.mode==='play'){
      R.acc=(R.acc||0)+dtReal*6;
      if(R.acc>=1){ const n=Math.floor(R.acc); R.acc-=n; showFrame(R.i+n); if(R.i>=S.frames.length-1){ R.playing=false; renderReplayBar(); } }
    }
    if(UI.mode==='play'&&S&&!S.paused&&S.phase!=='closed'&&!UI.overlay){
      advance(dtReal*SPEEDS[S.speed]);
      sideTimer+=dtReal;
      if(dirty) render();
      else{
        lightUpdate();
        const ae=document.activeElement;
        if(sideTimer>2&&!(ae&&ae.closest&&ae.closest('.side'))){ sideTimer=0; renderSide(); }
      }
    }
  }catch(err){ console.error('Open Point tick failed',err); }
}

// ======================= Boot =======================
const SAVE_VERSION=9;
function start(data){
  // only resume a game saved by this version; older saves have a different shape
  if(data&&data.v===SAVE_VERSION&&data.S&&data.S.def){ S=data.S; Object.assign(UI,data.UI||{}); E=data.E||null; if(E) E.drag=null;
    // a resumed game keeps its network, but the island's scenery always comes from the latest version of the game
    if(S.def.name===MEGAWATT.name) S.def.decor=clone(MEGAWATT.decor);
    if(S.replay||UI.replay) UI.replay=null; }
  else {
    // first arrival: the first shift sits paused behind the control room screen
    const s1=SHIFTS.find(x=>x.id==='s1');
    newIncident(clone(MEGAWATT),s1.scen,s1.crews,s1);
    let read=false; try{ read=localStorage.getItem('openpoint.letterRead')==='1'; }catch(e){}
    UI.overlay='home'; UI.letter=!read;
  }
  if(UI.mode==='edit'&&!E) UI.mode='play';
  useNetwork(UI.mode==='edit'?E.def:S.def);
  render();
  lastTick=performance.now();
  if(!ticker){ ticker=setInterval(tick,50); requestAnimationFrame(animLoop); }
}
window.claude?.hot?.snapshot?.(()=>({v:SAVE_VERSION,S,UI,E}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
