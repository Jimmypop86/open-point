<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: control-room desk. Status strip on top, network board left, operator panel right; stacks on phones. */
:root{
  --bg:#e7ecea; --panel:#f8faf9; --ink:#14201d; --muted:#5a6a66; --rule:#cdd6d2; --grid:#e2e8e5;
  --accent:#0c6a62; --accent-ink:#ffffff;
  --f1:#cc650a; --f2:#1b62c2; --f3:#8236bf; --f4:#0f8a6e; --f5:#b8327a; --f6:#6b7d12; --f7:#0e8aa8; --f8:#8a5a2b; --f9:#b08900; --f10:#4b3fb0; --f11:#3a6e1f; --f12:#2a7f86; --f13:#a8432f;
  --dead:#98a7a3; --fault:#cc2424; --ok:#14804a; --warn:#b3741a;
  --ground:#e2e8df; --road:#fbfcfa; --road-edge:#c8d0c6; --water:#b3d0e2; --park:#cbe0c0; --block:#d0d7ce;
  --water-edge:#9cc0d6; --tree:#a7cb98; --block-shadow:#bcc5bb; --grid-major:#d2dbd7;
  --sea:#c9dde8; --coast:#9fbccb; --contour:#c3cfbf; --paper:#fbf7ec; --paper-ink:#2b2a26;
  /* illustrated map, daytime */
  --land:#d7e8b9; --sand:#efdca9; --shallow:#b4def0; --sea:#8cc7de; --wave:#eaf7fc;
  --field-a:#c8e09b; --field-b:#e6e4a4; --field-c:#b3d58d; --hedge:#93b96c;
  --hill1:#b1d48a; --hill2:#9ac677; --hill3:#84b764; --peak:#73a157; --peak-l:#a8cd86;
  --wood:#a6cf85; --tree:#5e9f4c; --tree-d:#447c39; --trunk:#8a6a44;
  --wall:#fbf4e4; --roof:#d9684c; --roof2:#a9584a; --window:#8fcbe6; --window-off:#5b6468; --hshadow:rgba(60,70,40,.2);
  --water:#7cc0dc; --water-edge:#5aa9c9; --river-h:#d8f0f8; --road:#fffaf0; --road-edge:#d1bd8c; --water-deep:#66b2d3;
  --desk:#15242a; --desk-ink:#e6efec; --desk-muted:#91a7a2; --desk-rule:#2c4046; --desk-alarm:#ff6a5c; --desk-ok:#4fd18b;
  --display:'Saira Condensed','Arial Narrow',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1416; --panel:#132024; --ink:#e2ebe8; --muted:#8ea19c; --rule:#243538; --grid:#182a2e;
  --accent:#3dbfb2; --accent-ink:#06211e;
  --f1:#f39a3e; --f2:#5aa2f5; --f3:#b884f2; --f4:#3fcf9f; --f5:#f06aae; --f6:#b5c73a; --f7:#4cc9e6; --f8:#c9935c; --f9:#e0b83a; --f10:#8f85f2; --f11:#6fc24a; --f12:#5fd0d6; --f13:#f08a72;
  --dead:#4b5d5a; --fault:#ff5a52; --ok:#43cf83; --warn:#e3a33f;
  --ground:#101b1d; --road:#22343a; --road-edge:#1a292d; --water:#123349; --park:#14291d; --block:#1a282b;
  --water-edge:#0c2536; --tree:#1d3d29; --block-shadow:#0b1416; --grid-major:#21373b;
  --sea:#08161f; --coast:#1c3a48; --contour:#21382b; --paper:#e9e3d2; --paper-ink:#24221d;
  /* illustrated map, night: windows glow where there is power */
  --land:#1c3324; --sand:#3a3928; --shallow:#11344a; --sea:#0a2131; --wave:#234f68;
  --field-a:#22402a; --field-b:#2e4a2c; --field-c:#1e3a27; --hedge:#2f5634;
  --hill1:#24442d; --hill2:#2b5135; --hill3:#335d3e; --peak:#3b6a45; --peak-l:#4b7c54;
  --wood:#203f29; --tree:#2e693b; --tree-d:#21512d; --trunk:#4a3a28;
  --wall:#3a3c36; --roof:#6d3a2d; --roof2:#55302a; --window:#ffd36b; --window-off:#161b1c; --hshadow:rgba(0,0,0,.35);
  --water:#15415a; --water-edge:#0f3347; --river-h:#2b6a88; --road:#4a4a3e; --road-edge:#2c2d26; --water-deep:#103750;
  --desk:#071012; --desk-ink:#e6efec; --desk-muted:#8197a0; --desk-rule:#22363b; --desk-alarm:#ff6a5c; --desk-ok:#4fd18b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1416; --panel:#132024; --ink:#e2ebe8; --muted:#8ea19c; --rule:#243538; --grid:#182a2e;
  --accent:#3dbfb2; --accent-ink:#06211e;
  --f1:#f39a3e; --f2:#5aa2f5; --f3:#b884f2; --f4:#3fcf9f; --f5:#f06aae; --f6:#b5c73a; --f7:#4cc9e6; --f8:#c9935c; --f9:#e0b83a; --f10:#8f85f2; --f11:#6fc24a; --f12:#5fd0d6; --f13:#f08a72;
  --dead:#4b5d5a; --fault:#ff5a52; --ok:#43cf83; --warn:#e3a33f;
  --ground:#101b1d; --road:#22343a; --road-edge:#1a292d; --water:#123349; --park:#14291d; --block:#1a282b;
  --water-edge:#0c2536; --tree:#1d3d29; --block-shadow:#0b1416; --grid-major:#21373b;
  --sea:#08161f; --coast:#1c3a48; --contour:#21382b; --paper:#e9e3d2; --paper-ink:#24221d;
  /* illustrated map, night: windows glow where there is power */
  --land:#1c3324; --sand:#3a3928; --shallow:#11344a; --sea:#0a2131; --wave:#234f68;
  --field-a:#22402a; --field-b:#2e4a2c; --field-c:#1e3a27; --hedge:#2f5634;
  --hill1:#24442d; --hill2:#2b5135; --hill3:#335d3e; --peak:#3b6a45; --peak-l:#4b7c54;
  --wood:#203f29; --tree:#2e693b; --tree-d:#21512d; --trunk:#4a3a28;
  --wall:#3a3c36; --roof:#6d3a2d; --roof2:#55302a; --window:#ffd36b; --window-off:#161b1c; --hshadow:rgba(0,0,0,.35);
  --water:#15415a; --water-edge:#0f3347; --river-h:#2b6a88; --road:#4a4a3e; --road-edge:#2c2d26; --water-deep:#103750;
  --desk:#071012; --desk-ink:#e6efec; --desk-muted:#8197a0; --desk-rule:#22363b; --desk-alarm:#ff6a5c; --desk-ok:#4fd18b;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
body.mode-edit .play-only,body.mode-play .edit-only{display:none!important}
.app{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* status strip */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;background:var(--desk);color:var(--desk-ink);border-radius:8px;padding:14px 18px;
  box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--accent) 55%,var(--desk))}
.bar .brand p,.bar .stat label{color:var(--desk-muted)}
.bar .stat b{text-shadow:0 0 12px color-mix(in srgb,currentColor 35%,transparent)}
.bar .stat.off b{color:var(--desk-alarm)}
.bar .stat.off.zero b{color:var(--desk-ok)}
.bar .seg{background:transparent;border-color:var(--desk-rule)}
.bar .seg button{color:var(--desk-muted)}
.bar .seg button[aria-pressed="true"]{background:var(--desk-ink);color:var(--desk)}
.bar .ghost{background:transparent;border-color:var(--desk-rule);color:var(--desk-ink)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font:700 30px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.brand p{margin:2px 0 0;font:12px var(--mono);color:var(--muted);letter-spacing:.04em}
.bar .brand p.byline{font:600 13px var(--body);letter-spacing:.02em;color:var(--desk-ink);opacity:.9;margin-top:3px}
.bar .brand .hdr-copy{font:400 11px var(--mono);color:var(--desk-muted);margin-left:10px;letter-spacing:.03em;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px}
.stat label{display:block;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat b{font:600 22px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.stat.off b{color:var(--fault)}
.stat.off.zero b{color:var(--ok)}
.dn{font:700 10px var(--mono);letter-spacing:.08em;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:4px;color:#1d1405}
.dn.Day{background:#f2d43d}
.dn.Dusk{background:#f29a5a}
.dn.Dawn{background:#f6b98a}
.dn.Night{background:#2c3f78;color:#dfe6ff}
#pz{font:700 10px var(--mono);letter-spacing:.08em;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;padding:2px;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.ghost{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.ghost:hover{border-color:var(--accent)}

/* main */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.board{min-width:0;display:flex;flex-direction:column;gap:8px}
.stage-shell{position:relative}
.stage-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
.stage{position:relative;min-width:720px}
#svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
#svg.is-edit{touch-action:none}
/* one finger (or the mouse) drags the map around; two fingers pinch to zoom */
#svg.is-map,#svg.is-schem{touch-action:none}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:min(560px,90%);background:var(--ink);color:var(--panel);
  padding:9px 14px;border-radius:6px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:2}
#toast[hidden]{display:none}
#pausedPill{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);font:700 12px var(--mono);letter-spacing:.06em;background:var(--warn);color:#1d1405;border:0;border-radius:4px;padding:5px 10px;cursor:pointer}
#pausedPill[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:14px;flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .tb{border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer}
.toolbar .tb[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.toolhint{flex-basis:100%;font-size:13px;color:var(--muted)}

/* overlay */
#overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow-y:auto;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#overlay[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px 24px;max-width:480px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.mbox h2{font:700 30px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;text-wrap:balance}
.stars{font-size:26px;letter-spacing:4px;color:var(--warn);margin:6px 0 10px}
.stars i{font-style:normal;color:var(--rule)}
.mgrid{display:grid;grid-template-columns:1fr auto;gap:5px 16px;margin:12px 0;font-size:14px}
.mgrid b{font:600 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.mbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
textarea{width:100%;min-height:220px;font:12px/1.4 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:8px;resize:vertical}

/* side panel */
.side{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);border-radius:6px;min-width:0}
.side section{padding:14px 16px;border-top:1px solid var(--rule)}
.side section:first-child{border-top:0}
/* the play panel: a row of tabs, and only the open tab's content scrolls */
#playSide{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:hidden}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--panel) 85%,var(--ink) 4%);border-radius:6px 6px 0 0;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;position:relative;appearance:none;border:0;background:none;color:var(--muted);font:600 12px var(--body);padding:11px 4px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;min-width:0;overflow:visible;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tabs .tb{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font:700 10px/16px var(--mono);color:#fff;background:var(--muted)}
.tabs .tb.hot{background:var(--fault)}
.tabs .tb.warn{background:var(--warn)}
.tabs .tb.dot{min-width:8px;width:8px;height:8px;padding:0;top:6px;right:6px}
.tabbody{overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1}
@media (max-width:980px){#playSide{position:static;max-height:none;overflow:visible}.tabbody{overflow:visible}.tabs{position:sticky;top:0;z-index:5}}
.side h2{font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.side h3,.h3{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.ph{display:flex;gap:10px;align-items:flex-start}
.ph .code{font:600 13px var(--mono);border:2px solid var(--ink);border-radius:4px;padding:2px 6px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;margin:10px 0 4px;
  background:color-mix(in srgb,var(--c) 15%,var(--panel));color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 50%,var(--panel))}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.trip{color:var(--fault);font-weight:700}
.note{margin:10px 0 0;font-size:13px;color:var(--muted)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.swrow:first-of-type{border-top:0}
.swrow.hl{background:color-mix(in srgb,var(--accent) 10%,transparent);margin:0 -8px;padding:8px;border-radius:4px}
.swname{font-size:14px;font-weight:700}
.swstate{font:12px var(--mono);color:var(--muted)}
.swstate.c::before{content:"■ "}
.swstate.o::before{content:"□ "}
.swstate .abn{color:var(--warn)}
.swstate .ert, .swstate.e{color:#b8860b}
.swstate.e::before{content:"⏚ "}
.ptwline{font-size:13px;margin:8px 0 6px;color:var(--muted)}
.ptwline b{color:var(--ink)}
.earthg path{fill:none;stroke:#e0a800;stroke-width:2;stroke-linecap:round}
.ptwtag rect{fill:#ffd23f;stroke:#6a5208;stroke-width:1}
.ptwtag text{font:700 8px var(--mono);fill:#2a2205;text-anchor:middle}
.ptwtag.cleared rect{fill:var(--panel);stroke-dasharray:3 2}
.tag{font:600 10px var(--mono);border:1px solid var(--muted);border-radius:3px;padding:0 4px;color:var(--muted);margin-left:4px;vertical-align:2px}
.btn{border:0;border-radius:5px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;text-align:right;line-height:1.2}
.btn small{display:block;font-weight:400;font-size:11px;opacity:.85;white-space:normal}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.danger{background:transparent;color:var(--fault);border:1.5px solid var(--fault)}
.btn.wide{width:100%;text-align:center;margin-top:12px;white-space:normal}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{text-align:center}
.steps{margin:10px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted);font-size:13px}
.lead{margin:8px 0 0}
.phases{list-style:none;display:flex;gap:4px;padding:0;margin:12px 0 4px;font-size:12px}
.phases li{flex:1;padding:6px 8px;border-radius:4px;background:var(--grid);color:var(--muted);font-weight:700;line-height:1.2}
.phases li.now{background:var(--ink);color:var(--panel)}
.phases li.done{background:color-mix(in srgb,var(--ok) 22%,var(--panel));color:var(--ink)}
.todo{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;font-size:14px}
.load{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.load:last-child{margin-bottom:0}
.lh{display:flex;align-items:baseline;gap:8px;font-size:14px}
.lh .sw{width:10px;height:10px;border-radius:2px;flex:none;align-self:center}
.lh .nm{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh .num{margin-left:auto;font:600 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.lh .num.bad{color:var(--fault)}
.barl{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.barl i{display:block;height:100%}
.crews{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.cr-h{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.badge{font:700 11px var(--mono);background:var(--warn);color:#1d1405;border-radius:3px;padding:2px 5px;flex:none;margin-top:1px}
.q{margin:4px 0 0 34px;padding:0;list-style:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.q li{display:flex;gap:4px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 4px;margin-left:auto}
.x:hover{color:var(--fault)}
.seg.small button{font-size:12px;padding:4px 9px}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto;font-size:13px}
#log li{display:grid;grid-template-columns:42px 1fr;gap:8px}
#log time{font:12px var(--mono);color:var(--muted);padding-top:1px}
#log li.bad span{color:var(--fault);font-weight:700}
#log li.good span{color:var(--ok);font-weight:700}
#log li.warn span{color:var(--warn);font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.fld>span{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.fld input,.fld select{font:14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks,.tips{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.checks .e{color:var(--fault)}
.checks .w{color:var(--warn)}
.checks .ok{color:var(--ok);font-weight:700}

/* svg */
svg text{font-family:var(--body)}
.cable{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.cable.dead{stroke-dasharray:7 6}
.is-map .cable{stroke-width:3.5}
.hit{fill:none;stroke:transparent;stroke-width:22;cursor:pointer;stroke-linecap:round}
.halo{fill:none;stroke:var(--accent);stroke-opacity:.3;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.swm{cursor:pointer}
.swm .hb{fill:transparent}
.swm .m{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.swm.closed .m{fill:var(--ink)}
.swm:hover .m,.swm.sel .m{stroke:var(--accent);stroke-width:3}
.swm.sel.closed .m{fill:var(--accent)}
.swm .ab{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:3 2}
.node .bus.down{fill:var(--fault)!important;opacity:.6}
.pmap.down{stroke:var(--fault)!important;stroke-width:3;stroke-dasharray:5 3}
.swm .stk{stroke:var(--fault);stroke-width:2.4;stroke-linecap:round;pointer-events:none}
.swm .pr{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:3 3}
.swl{font:600 10px var(--mono);fill:var(--muted)}
.node{cursor:pointer;outline:none}
.node .box{stroke-width:2.5}
.node:hover .box,.node:focus-visible .box{stroke:var(--accent)!important}
.selring{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.pendring{fill:none;stroke:var(--accent);stroke-width:3}
.code{font:600 12px var(--mono);text-anchor:middle;fill:var(--ink)}
.lbl{font-weight:700;font-size:13px;fill:var(--ink)}
.lbl2{font:11px var(--mono);fill:var(--muted)}
.is-map .lbl,.is-map .lbl2{paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
.fpi line{stroke:var(--ink);stroke-width:1.5}
.fpi.trip path{fill:var(--fault)}
.fpi.clear path{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.fpi.unk text{font:700 12px var(--mono);fill:var(--muted)}
.rdot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.bus{fill:var(--ink)}
.plbl{font:700 15px var(--display);letter-spacing:.05em;text-transform:uppercase;fill:var(--ink)}
.fmark circle{fill:var(--fault)}
.fmark path{fill:#fff}
.okmark circle{fill:var(--ok)}
.okmark path{fill:none;stroke:#fff;stroke-width:2}
.wrench circle{fill:var(--ok)}
.wrench text{font:700 9px var(--mono);fill:#fff;text-anchor:middle}
.crew rect{fill:var(--warn);stroke:var(--panel);stroke-width:2}
.crew.enroute rect{fill:var(--panel);stroke:var(--warn);stroke-dasharray:3 2}
.crew text{font:700 10px var(--mono);fill:#1d1405;text-anchor:middle}
.crew.enroute text{fill:var(--warn)}
.tblock rect{fill:var(--panel);stroke:var(--ink);stroke-width:1}
.tblock line{stroke:var(--ink);stroke-width:1}
.tblock text{font:10px var(--mono);fill:var(--ink)}
.tblock .tb{font:700 12px var(--display);letter-spacing:.06em}
.road-e{fill:none;stroke:var(--road-edge);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:var(--road);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.street-e{fill:none;stroke:var(--road-edge);stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
.street{fill:none;stroke:var(--road);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.river{fill:none;stroke:var(--water);stroke-width:16;stroke-linecap:round}
.park{fill:var(--park)}
.blk{fill:var(--block)}
.mapt{font-style:italic;font-size:13px;fill:var(--muted)}
.depot{fill:var(--muted)}
.pmap{fill:var(--ink)}
.pmap-t{font:700 7.5px var(--mono);fill:var(--panel);text-anchor:middle}
.ecable{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* living diagram: power flow, alarms, map detail */
.flow{fill:none;stroke:var(--panel);stroke-opacity:.9;stroke-width:1.6;stroke-dasharray:2 12;stroke-linecap:round;animation:flow 1.1s linear infinite;pointer-events:none}
.is-map .flow{stroke-width:1.3}
@keyframes flow{to{stroke-dashoffset:-14}}
.node .box{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.2))}
.alarm{fill:none;stroke:var(--fault);stroke-width:2;animation:alarm 1.6s ease-in-out infinite;pointer-events:none}
@keyframes alarm{0%,100%{opacity:.12}50%{opacity:.75}}
.lbl2.offc{fill:var(--fault);font-weight:600}
.swm.cbtrip .ab{stroke:var(--fault);stroke-dasharray:none;stroke-width:2.2;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.fmark .ring{fill:none;stroke:var(--fault);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(2.3);opacity:0}}
.van .body{fill:var(--warn)}
.van text{font:700 8px var(--mono);fill:#1d1405;text-anchor:middle}
.river-e{fill:none;stroke:var(--water-edge);stroke-width:21;stroke-linecap:round}
.tree{fill:var(--tree)}
.blk-s{fill:var(--block-shadow)}
.sea{fill:var(--sea)}
.coast{fill:var(--ground);stroke:var(--coast);stroke-width:4;stroke-linejoin:round}
.contour{fill:none;stroke:var(--contour);stroke-width:1.4}
.townt{font:700 26px var(--display);letter-spacing:.22em;fill:var(--ink);opacity:.55;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.seat{font:italic 600 18px 'Kalam',cursive;letter-spacing:.12em;fill:var(--wave);opacity:.95}
/* illustrated map */
.land{fill:var(--land)}
.sand{fill:var(--sand);stroke:var(--sand);stroke-width:18;stroke-linejoin:round}
.shallow{fill:none;stroke:var(--shallow);stroke-width:60;stroke-linejoin:round}
.wave{fill:none;stroke:var(--wave);stroke-width:1.6;stroke-linecap:round;opacity:.75}
.fa{fill:var(--field-a)} .fb{fill:var(--field-b)} .fc{fill:var(--field-c)}
.field{stroke:var(--hedge);stroke-width:2.2;stroke-linejoin:round}
.furrow{stroke:var(--hedge);stroke-width:1;opacity:.55}
.hill1{fill:var(--hill1)} .hill2{fill:var(--hill2)} .hill3{fill:var(--hill3)}
.peak{fill:var(--peak)} .peak-l{fill:var(--peak-l)}
.wood{fill:var(--wood)}
.tr-c{fill:var(--tree)} .tr-d{fill:var(--tree-d)} .tr-t{fill:var(--trunk)}
.river-b{fill:var(--water-edge)}
.river-w{fill:var(--water)}
.river-d{fill:var(--water-deep)}
.sandbar{fill:var(--sand)}
.shallow-fill{fill:var(--shallow)}
.reed{fill:none;stroke:var(--tree-d);stroke-width:1.1;stroke-linecap:round}
.hs{fill:var(--hshadow)} .wall{fill:var(--wall)} .roof{fill:var(--roof)} .roof2{fill:var(--roof2)}
.win{fill:var(--window)}
.hood.off .win{fill:var(--window-off)}
/* The map is an illustration with its own palette; the game clock, not the device theme, decides day or night.
   --night (0..1) and --dusk (0..1) are set on the svg from the time of day. */
#svg.is-map{
  --land:#d7e8b9; --sand:#efdca9; --shallow:#b4def0; --sea:#8cc7de; --wave:#eaf7fc;
  --field-a:#c8e09b; --field-b:#e6e4a4; --field-c:#b3d58d; --hedge:#93b96c;
  --hill1:#b1d48a; --hill2:#9ac677; --hill3:#84b764; --peak:#73a157; --peak-l:#a8cd86;
  --wood:#a6cf85; --tree:#5e9f4c; --tree-d:#447c39; --trunk:#8a6a44;
  --wall:#fbf4e4; --roof:#d9684c; --roof2:#a9584a; --window:#8fcbe6; --window-off:#5b6468; --hshadow:rgba(60,70,40,.2);
  --water:#7cc0dc; --water-edge:#5aa9c9; --river-h:#d8f0f8; --road:#fffaf0; --road-edge:#d1bd8c; --water-deep:#66b2d3;
  --ink:#14201d; --muted:#5a6a66; --panel:#f8faf9; --dead:#98a7a3; --fault:#cc2424; --warn:#b3741a; --ok:#14804a; --accent:#0c6a62; --accent-ink:#ffffff;
  --f1:#cc650a; --f2:#1b62c2; --f3:#8236bf; --f4:#0f8a6e; --f5:#b8327a; --f6:#6b7d12; --f7:#0e8aa8; --f8:#8a5a2b; --f9:#b08900; --f10:#4b3fb0; --f11:#3a6e1f; --f12:#2a7f86; --f13:#a8432f;
}
/* scenery: airport, docks, railway, farms */
.air-grass{fill:#c3dca0;stroke:#a9c886;stroke-width:1.2}
.runway{fill:#5b6064}
.rw-c{stroke:#fbfbf7;stroke-width:1.3;stroke-dasharray:8 6}
.rw-m{fill:#fbfbf7}
.rw-n{font:700 6px var(--mono);fill:#fbfbf7;text-anchor:middle}
.taxi{fill:#7a7f83}
.apron{fill:#9da2a6}
.term{fill:#eef2f3;stroke:#8b9296;stroke-width:.7}
.term-r{fill:#58707c}
.term-w{fill:#7fc4e2}
.tower{fill:#58707c}
.plane{fill:#fbfbf9;stroke:#4f5559;stroke-width:.6}
.rw-l{fill:#ffe9a3} .rw-g{fill:#5be38a} .lt-r{fill:#ff5a4a}
.quay{fill:#b9b5aa;stroke:#8f8a7e;stroke-width:1}
.breakwater{fill:none;stroke:#a7a296;stroke-width:7;stroke-linecap:round}
.bollard{fill:#4a4c4d}
.crane{fill:none;stroke:#e0782f;stroke-width:1.6;stroke-linecap:round}
.crane-c{fill:#e0782f}
.hull{fill:#a33a2c;stroke:#5d241c;stroke-width:.6}
.deck{fill:#d9d5cb}
.ctr{stroke:rgba(0,0,0,.25);stroke-width:.4}
.c1{fill:#d84d3c} .c2{fill:#2f78c4} .c3{fill:#e7b13a} .c4{fill:#3d9a6a}
.ware{fill:#c9c7c0;stroke:#8f8a7e;stroke-width:.7} .ware-r{fill:#8e9aa0}
.rail-b{fill:none;stroke:#3a3d3f;stroke-width:4;stroke-linejoin:round}
.rail-t{fill:none;stroke:#fbfbf7;stroke-width:2;stroke-dasharray:6 6;stroke-linejoin:round}
.station{fill:#f3efe4;stroke:#3a3d3f;stroke-width:.8} .station-r{fill:#b4513e}
.yard{fill:#e2d6b0;stroke:#c9b98a;stroke-width:.8}
.barn{fill:#b5443a} .barn-r{fill:#7e2f28}
.silo{fill:#c9cdd0;stroke:#8d9397;stroke-width:.7} .silo-t{fill:#a7adb1}
.sheep{fill:#fbfaf4;stroke:#9b9a90;stroke-width:.5} .sh-h{fill:#3b3b38}
.cow{fill:#fbfaf4;stroke:#55534e;stroke-width:.5} .cow-s{fill:#2f2e2b}
.bale{fill:#e4c766;stroke:#b99a3e;stroke-width:.7}
.rock{fill:#9aa1a3;stroke:#6f7679;stroke-width:.6}
.castle{fill:#b8b2a4;stroke:#7a7466;stroke-width:.8}
.nightshade{fill:#061328;opacity:calc(var(--night,0)*.62);pointer-events:none}
.duskglow{fill:#ff7a2e;opacity:calc(var(--dusk,0)*.17);pointer-events:none}
.litg{opacity:var(--night,0);pointer-events:none}
.art-n{opacity:var(--night,0)}
.art-dim{filter:brightness(calc(1 - var(--night,0)*.55))}
.lit{fill:#ffd36b}
.litglow{fill:#ffcf5a;opacity:.22}
.lm-w{fill:#fdfbf6} .lm-r{fill:#d8453a} .lm-d{fill:#38403f} .lm-y{fill:#ffd36b} .lm-g{fill:#2f7d5a}
.lm-beam{fill:#ffe9a3;opacity:calc(var(--night,0)*.3)}
.art-beam{opacity:calc(var(--night,0)*.75);pointer-events:none}
.lm-line{fill:none;stroke:#38403f;stroke-width:1.2}
.lm-wake{fill:none;stroke:var(--wave);stroke-width:1.4;stroke-linecap:round}
.rose{fill:var(--ink);opacity:.75}
.rose-l{fill:var(--land);stroke:var(--ink);stroke-width:1;opacity:.9}
.warnmark polygon{fill:var(--warn);stroke:var(--panel);stroke-width:1.5;stroke-linejoin:round}
.warnmark text{font:800 10px var(--mono);fill:#1d1405;text-anchor:middle}
.warnmark .ring{fill:none;stroke:var(--warn);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
/* control room home */
.mbox.wide{max-width:660px}
.fld .seg{flex-wrap:wrap}
.eyebrow{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 4px}
.letter{background:var(--paper);color:var(--paper-ink);font:17px/1.5 'Kalam',cursive;padding:18px 22px;border-radius:4px;margin:14px 0;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12);transform:rotate(-.4deg)}
.letter p{margin:0 0 10px}
.letter ul{margin:0 0 10px;padding-left:20px}
.letter li{margin-bottom:4px}
.letter .sig{font-weight:700;font-size:19px;margin:0}
.shifts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.shift{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:6px;padding:11px 14px;background:var(--bg);cursor:pointer;text-align:left;width:100%}
.shift:hover{border-color:var(--accent)}
.shift b{display:block;font-size:15px}
.shift span{font-size:13px;color:var(--muted)}
.shift .st{color:var(--warn);letter-spacing:2px;font-size:16px;white-space:nowrap}
.shift .st i{font-style:normal;color:var(--rule)}
.brief{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--rule));background:color-mix(in srgb,var(--warn) 9%,var(--panel));border-radius:6px;padding:10px 12px;margin:12px 0 0;font-size:14px}
.brief b{display:block;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--warn);margin-bottom:2px}
/* storms, assessors, newsroom */
.pole{fill:var(--ink);opacity:.55;pointer-events:none}
.crew.as rect{fill:var(--accent)}
.crew.as text{fill:var(--accent-ink)}
.van.as .body{fill:var(--accent)}
.van.as text{fill:var(--accent-ink)}
.badge.as{background:var(--accent);color:var(--accent-ink)}
/* tree teams green, planned teams blue, the welfare van purple */
.crew.vg rect,.van.vg .body,.badge.vg{fill:#3f8f3a;background:#3f8f3a}
.crew.pw rect,.van.pw .body,.badge.pw{fill:#2f6fb3;background:#2f6fb3}
.crew.wvb rect{fill:#8236bf} .crew.wvb.enroute rect{fill:var(--panel);stroke:#8236bf} .crew.wvb text{fill:#fff} .crew.wvb.enroute text{fill:#8236bf}
.crew.vg text,.crew.pw text,.van.vg text,.van.pw text{fill:#fff}
.badge.vg,.badge.pw,.badge.wv{color:#fff}
.badge.wv{background:#8236bf}
.route.vg{stroke:#3f8f3a} .route.pw{stroke:#2f6fb3} .route.wv{stroke:#8236bf}
.crew.enroute.vg rect,.crew.enroute.pw rect{fill:var(--panel)}
.crew.enroute.vg text{fill:#3f8f3a} .crew.enroute.pw text{fill:#2f6fb3}
.rolenote{margin:-4px 0 6px;font-size:12px}
.skills{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0 2px 34px}
.sk{font:600 10px var(--body);padding:1px 6px;border-radius:9px;border:1px solid var(--rule);color:var(--muted);background:var(--panel)}
/* team colours: SAPs and overhead teams get their own */
.crew.sp rect,.van.sp .body{fill:#2f5aa8} .crew.sp text,.van.sp text{fill:#fff} .badge.sp{background:#2f5aa8;color:#fff}
.crew.jt rect,.van.jt .body{fill:#7a3d8c} .crew.jt text,.van.jt text{fill:#fff} .badge.jt{background:#7a3d8c;color:#fff}
.crew.oh rect,.van.oh .body{fill:#8a5a1c} .crew.oh text,.van.oh text{fill:#fff} .badge.oh{background:#8a5a1c;color:#fff}
/* the six kinds of work, one colour each: HV in solid colours, LV in lighter ones */
.cat{display:inline-block;font:600 10.5px var(--body);letter-spacing:.02em;padding:1px 7px;border-radius:9px;border:1px solid var(--rule);background:var(--panel);color:var(--muted);vertical-align:1px;white-space:nowrap}
.cat-hvsw{background:#2f5aa8;border-color:#2f5aa8;color:#fff} .cat-lvsw{background:#dbe6f8;border-color:#9fb5de;color:#1f3d73}
.cat-hvjoint{background:#7a3d8c;border-color:#7a3d8c;color:#fff} .cat-lvjoint{background:#efe0f4;border-color:#c7a6d3;color:#55246a}
.cat-ohhv{background:#8a5a1c;border-color:#8a5a1c;color:#fff} .cat-ohlv{background:#f5e6d0;border-color:#d6b78a;color:#5e3b0b}
.cat-look{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .cat-veg{background:#e3f0dc;border-color:#9cc48a;color:#2c5a1c}
.catH{margin:12px 0 4px;font-size:12px;display:flex;align-items:center;gap:6px}
.sk-hvsw{border-color:#2f5aa8;color:#2f5aa8} .sk-lvsw{border-color:#9fb5de;color:#1f3d73} .sk-hvjoint{border-color:#7a3d8c;color:#7a3d8c}
.sk-lvjoint{border-color:#c7a6d3;color:#55246a} .sk-ohhv{border-color:#8a5a1c;color:#8a5a1c} .sk-ohlv{border-color:#d6b78a;color:#5e3b0b}
.sk-switch{border-color:color-mix(in srgb,var(--accent) 50%,var(--rule));color:var(--accent)}
.sk-line{border-color:color-mix(in srgb,#b3741a 50%,var(--rule));color:#b3741a}
.sk-joint{border-color:color-mix(in srgb,#2f6fb3 50%,var(--rule));color:#2f6fb3}
.sk-test{border-color:color-mix(in srgb,#8236bf 50%,var(--rule));color:#8236bf}
.btn.veg{background:#3f8f3a;border-color:#2f6f2b;color:#fff}
.btn.van{background:#8236bf;border-color:#64289a;color:#fff}
.vanbox{margin-top:10px;padding:10px 12px;border-radius:6px;border:1px solid color-mix(in srgb,#8236bf 40%,var(--rule));background:color-mix(in srgb,#8236bf 7%,var(--panel));font-size:13px}
.vanbox b{display:block;color:#8236bf;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
/* the substation picture in the side panel */
.subpic{margin:12px 0 4px;padding:8px 6px 2px;border:1px solid var(--rule);border-radius:6px;background:color-mix(in srgb,var(--panel) 92%,var(--ink) 3%)}
.subpic svg{display:block;width:100%;height:auto;overflow:visible}
.subpic .ln{stroke-width:3;stroke-linecap:round;fill:none}
.subpic .bus{stroke:none}
.subpic .tx{fill:none;stroke:var(--ink);stroke-width:2}
.subpic .fuse{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.subpic .lvb{fill:var(--muted)}
.subpic svg{overflow:hidden}
.subpic .fuse.blown{fill:var(--fault);stroke:var(--fault)} .subpic .fuse.out{fill:none;stroke-dasharray:2 2}
.subpic .lbox rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.3} .subpic .lbox.cl rect{fill:var(--accent);stroke:var(--accent)}
.subpic .nm{font:600 10px var(--body);fill:var(--ink);text-anchor:middle}
.subpic .sl,.subpic .sm{font:10px var(--mono);fill:var(--muted);text-anchor:middle}
.subpic .sm.hot,.subpic .warnt{fill:var(--fault);font-weight:700}
.subpic .sm.l{text-anchor:start}
.subpic .warnt{font:700 10px var(--body)}
.subpic .ssw .hit{fill:transparent}
.subpic .ssw .blade{stroke:var(--ink);stroke-width:2}
.subpic .ssw.c .blade{fill:var(--ink)}
.subpic .ssw.o .blade{fill:var(--panel)}
.subpic .ssw.act{cursor:pointer}
.subpic .ssw.act:hover .blade,.subpic .ssw.act:focus .blade{stroke:var(--accent);stroke-width:3}
.subpic .ssw.act:hover .hit{fill:color-mix(in srgb,var(--accent) 12%,transparent)}
.subpic .ssw .pend{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:3 3}
.subpic .ssw .nop{font:700 8px var(--mono);fill:var(--muted)}
.subpic .ssw .earth{fill:none;stroke:#e0a800;stroke-width:2;stroke-linecap:round}
.subpic .fpic line{stroke:var(--ink);stroke-width:1.5}
.subpic .fpic .trip{fill:var(--fault)} .subpic .fpic .clr{fill:var(--panel);stroke:var(--ink);stroke-width:1}
.subpic .fpic text{font:700 11px var(--mono);fill:var(--muted)}
.subpic .rtu path{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round}

/* weather on the map, and crews at work */
.rain{pointer-events:none;opacity:calc(var(--rain,0)*.55)}
.rain rect{animation:rainfall .5s linear infinite}
@keyframes rainfall{to{transform:translate(0,40px)}}
.cloud{fill:#1d2a33;animation:drift 60s linear infinite}
@keyframes drift{to{transform:translateX(var(--cw))}}
.sun{animation:sunspin 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunspin{to{rotate:360deg}}
.strike{animation:strike 2.4s ease-out forwards}
@keyframes strike{0%{opacity:1}8%{opacity:.2}14%{opacity:1}100%{opacity:0}}
.wxchip{position:absolute;right:12px;top:12px;z-index:2;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.wxchip[hidden]{display:none}
.wxbtn{display:block;font:600 15px/1.5 var(--mono);color:inherit;background:color-mix(in srgb,currentColor 8%,transparent);border:1px solid color-mix(in srgb,currentColor 30%,transparent);border-radius:999px;padding:1px 10px;margin-top:1px;cursor:pointer;white-space:nowrap}
.wxbtn:hover{background:color-mix(in srgb,currentColor 16%,transparent)} .wxbtn.warn{border-color:#e0a63a;color:#f3c463} .wxbtn.hot{border-color:#e2766b;color:#ff9a8f;background:rgba(226,118,107,.16)}
.wxpop{position:fixed;z-index:60;width:min(340px,calc(100vw - 16px));background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px}
.wxpop[hidden]{display:none} .wxpop h3{margin-top:0}
.wxc{font:600 13px var(--body);padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--rule);box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap}
.wxc.heat{background:#fff1d6;border-color:#f0b35a;color:#7a4a08}
.wxc.snow{background:#eef6ff;border-color:#9cc3e6;color:#1f4b73}
.wxc.wind,.wxc.storm{background:#eef3f6;border-color:#9fb3c0;color:#25404f}
.wxc.thunder{background:#ece9f6;border-color:#a99bd6;color:#3a2c6e}
.wxc.bad{background:#fde8e6;border-color:#e2766b;color:#8c1d14}
.offbolt{pointer-events:none;animation:boltflash 1.1s ease-in-out infinite}
.offbolt circle{fill:#2a2a2a;stroke:#ffd23f;stroke-width:1.2;opacity:.85}
.offbolt path{fill:#ffd23f;stroke:#c0392b;stroke-width:.6;stroke-linejoin:round}
@keyframes boltflash{0%,100%{opacity:1}50%{opacity:.15}}
.snowfall{pointer-events:none;opacity:.85}
.snowfall rect{animation:snowfall 7s linear infinite}
@keyframes snowfall{to{transform:translate(60px,60px)}}
.flash{pointer-events:none;fill:#fff;opacity:0;animation:lightning 9s linear infinite}
@keyframes lightning{0%,93%,100%{opacity:0}94%{opacity:.35}95%{opacity:.05}96%{opacity:.28}97%{opacity:0}}
#svg.stormy .tr-c,#svg.stormy .tr-d{animation:sway 1.3s ease-in-out infinite alternate}
#svg.stormy .tr-c{animation-delay:-.4s}
@keyframes sway{from{transform:translateX(-1.6px)}to{transform:translateX(1.6px)}}
.workicon{pointer-events:none}
.workicon .spark{animation:alarm .5s ease-in-out infinite}
.workicon .arm{animation:boom 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
@keyframes boom{from{transform:rotate(-8deg)}to{transform:rotate(6deg)}}
.flooded-water{fill:#4f8fc0;opacity:.55;pointer-events:none;animation:floodpulse 3s ease-in-out infinite}
@keyframes floodpulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body.calm *{transition:none!important;animation:none!important}

/* compact header while a shift is running: one slim row */
body.compact .bar{padding:7px 14px;gap:8px 18px}
body.compact .brand h1{font-size:20px}
body.compact .brand svg{width:24px;height:24px}
body.compact .brand p.byline{display:none}
body.compact .brand p{font-size:11px;margin:0}
body.compact .stat label{font-size:9px;letter-spacing:.07em}
body.compact .stat b{font-size:17px}
body.compact .stats{gap:4px 18px}
body.compact .seg button{padding:4px 9px;font-size:13px}
body.compact .ghost{padding:5px 10px;font-size:13px}
body.compact .app{gap:10px}

/* alarm list */
.alarmbar{position:relative;display:flex;align-items:center;gap:10px;background:var(--desk);color:var(--desk-ink);border-radius:6px;padding:6px 10px;font-size:13px;min-height:38px;
  border-left:5px solid var(--desk-muted)}
.alarmbar[hidden]{display:none}
/* the news ticker: headlines scroll from right to left; press requests wait on a button */
.newsbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:3px 6px 3px 3px;font-size:13px;min-height:30px;margin-top:6px;overflow:hidden}
.newsbar[hidden]{display:none}
.newsbar .nb-l{flex:none;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;background:var(--fault);color:#fff;border:0;border-radius:4px;padding:5px 9px;cursor:pointer}
.newsbar .nb-conf{flex:none;font:600 12px var(--mono);white-space:nowrap} .nb-conf.ok{color:var(--ok)} .nb-conf.warn{color:var(--warn)} .nb-conf.bad{color:var(--fault)}
.newsbar .nb-track{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.newsbar .nb-roll{display:inline-flex;white-space:nowrap;will-change:transform}
.newsbar .nb-track:hover .nb-roll{animation-play-state:paused}
.newsbar .nb-set{display:inline-flex;align-items:center}
.newsbar .nb-i{padding:0 4px} .newsbar .nb-i time{font:600 11.5px var(--mono);color:var(--muted)} .newsbar .nb-i b{font-weight:700}
.newsbar .nb-sep{color:var(--muted);padding:0 10px}
.newsbar .nb-press{flex:none;font:600 12px var(--body);background:var(--warn);color:#2a1a00;border:0;border-radius:999px;padding:4px 10px;cursor:pointer;animation:alblink 1.4s steps(2) infinite}
.newsbar .nb-press[hidden]{display:none}
@keyframes nbscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
body.calm .newsbar .nb-roll{animation:none!important} body.calm .newsbar .nb-press{animation:none}
.newspop{width:min(380px,calc(100vw - 16px));max-height:min(70vh,560px);overflow:auto}
.alarmbar.hot{border-left-color:var(--desk-alarm)}
.alarmbar.warn{border-left-color:var(--warn)}
.alarmbar .al-n{font:700 11px var(--mono);border-radius:3px;padding:2px 6px;background:var(--desk-rule);white-space:nowrap}
.alarmbar.hot .al-n{background:var(--desk-alarm);color:#fff;animation:alblink 1s steps(2) infinite}
@keyframes alblink{50%{opacity:.45}}
.alarmbar .al-last{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;background:none;border:0;color:inherit;text-align:left;padding:2px 0}
.alarmbar .al-last time{font-family:var(--mono);color:var(--desk-muted);margin-right:8px}
.alarmbar .al-b{border:1px solid var(--desk-rule);background:transparent;color:var(--desk-ink);border-radius:4px;padding:3px 9px;font:600 12px var(--body);cursor:pointer;white-space:nowrap}
.alarmbar .al-b:hover{border-color:var(--accent)}
.al-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.25);max-height:min(60vh,420px);overflow:auto;padding:4px 0;margin:0;list-style:none}
.al-list li{display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:start;padding:6px 12px;border-top:1px solid var(--rule)}
.al-list li:first-child{border-top:0}
.al-list li time{font:12px var(--mono);color:var(--muted);padding-top:2px}
.al-list li.bad{border-left:4px solid var(--fault)} .al-list li.warn{border-left:4px solid var(--warn)}
.al-list li.new span{font-weight:700}
.al-list li.new.bad span{animation:alblink 1.2s steps(2) 3}
.al-list .al-acts{display:flex;gap:4px}
.al-list .al-acts button{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:2px 7px;font:600 11px var(--body);cursor:pointer;color:var(--ink)}
.al-list .al-acts button:hover{border-color:var(--accent)}
.al-list .al-empty{display:block;color:var(--muted);padding:10px 12px}

/* what's-next timeline under the diagram */
.timeline{position:relative;height:46px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);overflow:hidden;font-size:11px}
.timeline .tl-now{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.timeline .tl-tick{position:absolute;top:0;bottom:0;border-left:1px dashed var(--rule)}
.timeline .tl-tick span{position:absolute;top:2px;left:3px;font:10px var(--mono);color:var(--muted);white-space:nowrap}
.timeline .tl-m{position:absolute;top:18px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--panel);cursor:pointer;padding:0;background:var(--muted);box-shadow:0 0 0 1px var(--rule)}
.timeline .tl-m.crew{background:var(--warn)} .timeline .tl-m.done{background:var(--ok)} .timeline .tl-m.ctl{background:var(--accent)}
.timeline .tl-m.gen{background:#f2c230} .timeline .tl-m.van{background:#8236bf} .timeline .tl-m.wx{background:#1b62c2} .timeline .tl-m.peak{background:#b8327a}
.timeline .tl-m.work{background:#2f6fb3}
.timeline .tl-m.dl{border-radius:2px;transform:rotate(45deg);background:var(--fault);width:13px;height:13px;margin-left:-6.5px}
.timeline .tl-m.dl.soon{animation:alblink 1s steps(2) infinite}
.timeline .tl-m:hover,.timeline .tl-m:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.timeline .tl-empty{position:absolute;left:12px;top:22px;color:var(--muted)}
.timeline .tl-ap{position:absolute;right:6px;top:3px;display:flex;align-items:center;gap:4px;font:600 10px var(--body);color:var(--muted);background:var(--panel);padding:0 4px;cursor:pointer}
.timeline .tl-ap input{margin:0}

/* right-click (or long-press) menu */
.ctxmenu{position:fixed;z-index:45;min-width:220px;max-width:300px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;box-shadow:0 16px 44px rgba(0,0,0,.28);padding:5px;display:flex;flex-direction:column}
.ctxmenu[hidden]{display:none}
.ctxmenu .cm-h{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 9px 4px}
.ctxmenu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:5px;padding:7px 9px;font:600 13px var(--body);cursor:pointer;color:var(--ink)}
.ctxmenu button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:color-mix(in srgb,var(--accent) 14%,var(--panel));outline:none}
.ctxmenu button:disabled{opacity:.45;cursor:not-allowed;background:none}
.ctxmenu hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
/* hovering a team or an incident lights up where it is */
.hl-ring{fill:none;stroke:var(--accent);stroke-width:4;opacity:.85;pointer-events:none}
.hl-line{fill:none;stroke:var(--accent);stroke-width:12;stroke-opacity:.35;stroke-linecap:round;pointer-events:none}

/* first-time tips */
.tipcard{position:absolute;left:12px;bottom:12px;width:min(330px,calc(100% - 70px));background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:6;font-size:14px;border-top:4px solid var(--accent)}
.tipcard[hidden]{display:none}
.tipcard b{display:block;font:700 15px var(--display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px}
.tipcard p{margin:0 0 8px}
.tipcard .btnrow{margin-top:6px}
.tipcard .linkbtn{color:var(--paper-ink);opacity:.75}

/* minimap when zoomed in */
.minimap{position:absolute;left:12px;bottom:12px;width:170px;height:auto;background:var(--panel);border:1px solid var(--rule);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:3;cursor:pointer}
.minimap[hidden]{display:none}
.minimap .mm-c{fill:none;stroke-width:5;stroke-linecap:round}
.minimap .mm-v{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-width:8}
.tipcard:not([hidden])~.minimap,.minimap.up{bottom:auto;top:56px}

/* legend show/hide */
.legtog{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:1px 8px;font:600 12px var(--body);color:var(--muted);cursor:pointer}
.legend.closed span:not(.legkeep){display:none}

/* a brief highlight when the panel changes */
/* (not called "flash": that class is the storm's lightning, which is see-through) */
.tabbody.glow{animation:panelflash .7s ease-out}
@keyframes panelflash{0%{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:inset 0 0 0 3px transparent}}

/* toasts sit low on the board, clear of the search box */
#toast{top:auto;bottom:52px}

/* title screen and pause menu */
.mbox.title{max-width:520px;text-align:center;padding:34px 30px 24px;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--accent) 16%,var(--panel)),var(--panel) 70%)}
.mbox.title .logo{width:84px;height:84px;margin:0 auto 10px;display:block}
.mbox.title h2{font-size:58px;letter-spacing:.06em;margin:0}
.mbox.title .tagline{margin:6px 0 22px;color:var(--muted)}
.menu-btns{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:0 auto}
.menu-btns .btn{text-align:center;padding:11px 14px;font-size:15px}
.mbox.pause{max-width:360px;text-align:center}
.mbox.pause h2{margin-bottom:14px}
.keyhint{font:11px var(--mono);color:var(--muted);margin-top:14px}

/* hover cards on the diagram */
.hovercard{position:fixed;z-index:42;pointer-events:none;max-width:260px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:7px;padding:8px 10px;box-shadow:0 10px 28px rgba(0,0,0,.22);font-size:12px;line-height:1.45;display:flex;flex-direction:column}
.hovercard[hidden]{display:none}
.hovercard b{font-size:13px;margin-bottom:2px}
.hovercard span{color:var(--muted)}
.hovercard .bad,.hovercard em.bad{color:var(--fault);font-style:normal;font-weight:700} .hovercard .good{color:var(--ok);font-weight:700}
/* switching schedules */
.planbox{border:2px solid var(--accent);border-radius:7px;padding:10px 12px;margin:0 0 12px;background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.planbox>b{display:block;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
.plansteps{margin:6px 0;padding-left:22px;font-size:13px}
.plansteps li{padding:4px 0;border-top:1px solid var(--rule)}
.plansteps li:first-child{border-top:0}
.plansteps li>span:first-child{display:inline-block;max-width:calc(100% - 56px)}
.plansteps li small{display:block;color:var(--muted);font-size:11px}
.plansteps li.bad{color:var(--fault)}
.plansteps .pa{float:right;display:flex;gap:3px}
.plansteps .pa button{border:1px solid var(--rule);background:var(--panel);border-radius:4px;width:24px;height:22px;cursor:pointer;color:var(--ink);font-size:11px;padding:0}
.pv-good{color:var(--ok);font-weight:700;font-size:13px}
.planno circle{fill:var(--accent)} .planno text{font:700 9px var(--mono);fill:var(--accent-ink);text-anchor:middle}
/* drag a team onto the diagram */
li[draggable="true"]{cursor:grab}
body.dragging #svg [data-k]{cursor:copy}
#svg .droptgt .box,#svg .droptgt .m,#svg polyline.droptgt{stroke:var(--accent)!important;stroke-width:4!important}
.crews .x.fol.on{color:var(--accent)}
/* log tools */
.logtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.logtools .seg button{padding:3px 8px;font-size:12px}
.logtools input{flex:1;min-width:120px;font:13px var(--body);padding:5px 8px;border:1px solid var(--rule);border-radius:5px;background:var(--panel);color:var(--ink)}
/* volume sliders */
.vols{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.vols label{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.vols input{width:100%;accent-color:var(--accent)}
.vols output{font:12px var(--mono);text-align:right}
/* confirm before costly switching */
.mbox.confirm{max-width:460px;border-top:5px solid var(--fault)}
.mbox.confirm h2{font-size:24px}
.cf-never{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:8px}
.menu-btns .btn small{font-size:11px}

/* phones: the panel becomes a bottom sheet you drag up and down */
.sheet-handle{display:none}
@media (max-width:760px){
  #playSide{position:fixed;left:0;right:0;bottom:0;top:auto;height:var(--sheet,46vh);max-height:none;z-index:15;border-radius:14px 14px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column;border-bottom:0}
  #playSide .tabbody{overflow-y:auto}
  #playSide .tabs{position:static}
  .sheet-handle{display:flex;justify-content:center;padding:8px 0 4px;cursor:grab;touch-action:none;flex:none}
  .sheet-handle span{width:44px;height:5px;border-radius:3px;background:var(--rule)}
  body.mode-play{padding-bottom:calc(var(--sheet,46vh) + 16px)}
  /* the compact header on a phone: clock, customers off and minutes lost, then one scrolling row of buttons */
  body.compact .bar{gap:6px 12px;padding:6px 10px}
  body.compact .brand{display:none}
  body.compact .stats{display:flex;flex-wrap:nowrap;gap:12px;width:100%}
  body.compact .stat:nth-child(3),body.compact .stat:nth-child(5){display:none}
  body.compact .stat b{font-size:15px}
  body.compact .controls{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}
  body.compact .controls::-webkit-scrollbar{display:none}
  body.compact .controls>*{flex:none}
  .alarmbar .al-b:not([data-act="al-toggle"]){display:none}
  .minimap{width:120px}
  .timeline{height:40px}
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="6" style="fill:var(--desk-ink)"/><path d="M6 22h7l9-9m0 9h6" style="stroke:var(--desk)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="13" cy="22" r="2.6" style="fill:var(--f1)"/></svg>
      <div><h1>Open Point</h1><p class="byline">An electricity fault management game by James Procter <span class="hdr-copy">© 2026 James Procter</span></p><p id="netName">11 kV fault restoration</p></div>
    </div>
    <div class="stats play-only">
      <div class="stat"><label>Clock</label><b id="clock">--:--</b><span id="dn" class="dn">DAY</span><span id="pz" hidden>PAUSED</span></div>
      <div class="stat off" id="offStat"><label>Customers off</label><b id="off">0</b></div>
      <div class="stat"><label>Interruptions (CI)</label><b id="ci">0</b></div>
      <div class="stat"><label>Minutes lost (CML)</label><b id="cml">0</b></div>
      <div class="stat"><label>Calls (15 min)</label><b id="calls">0</b></div>
      <div class="stat wxstat"><label>Weather</label><button id="wxBtn" class="wxbtn" data-act="wx-pop" aria-expanded="false" aria-controls="wxPop" title="Weather and forecast">–</button></div>
    </div>
    <div class="controls">
      <div class="seg play-only" role="group" aria-label="Clock speed" id="speedSeg">
        <button data-speed="0" title="Pause (space)">❚❚</button>
        <button data-speed="1" title="1 game minute per second">1×</button>
        <button data-speed="2" title="4 game minutes per second">4×</button>
        <button data-speed="3" title="15 game minutes per second">15×</button>
        <button data-act="skip" title="Skip to the next event (N)" aria-label="Skip to the next event">⏭</button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="vS" data-view="s" aria-pressed="true">Schematic</button>
        <button id="vM" data-view="m" aria-pressed="false">Map</button>
      </div>
      <div class="seg" role="group" aria-label="Mode">
        <button id="mP" data-mode="play" aria-pressed="true">Play</button>
        <button id="mE" data-mode="edit" aria-pressed="false">Editor</button>
      </div>
      <div class="seg play-only" role="group" aria-label="Help">
        <button id="hintBtn" data-act="hint" title="Hint (H)">Hint</button>
        <button id="undoBtn" data-act="undo" title="Undo last order (U)">Undo</button>
      </div>
      <button id="newBtn" class="ghost play-only" data-act="home">Control room</button>
      <button class="ghost" data-act="settings" title="Settings">Settings</button>
      <button class="ghost play-only" data-act="pause-menu" title="Menu (Esc)" aria-label="Menu">☰</button>
    </div>
  </header>
  <!-- the alarm list: newest alarm, how many are unacknowledged, and a drop-down of the rest -->
  <div id="alarmBar" class="alarmbar play-only" role="region" aria-label="Alarms" hidden></div>
  <div id="newsBar" class="newsbar play-only" role="region" aria-label="News" hidden></div>

  <main class="layout">
    <section class="board">
      <div class="toolbar edit-only" id="tools"></div>
      <div class="stage-shell">
        <div class="stage-wrap"><div class="stage" id="stage">
          <svg id="svg" viewBox="0 0 1000 560" role="img" aria-label="11 kV network"></svg>
        </div></div>

const LV_STREETS=['High Street','Church Road','Station Road','Mill Lane','Park Avenue','Victoria Road','Queen Street','North Road','School Lane','Orchard Way',

function buildLV(){
  LV={}; LVW={}; LVLINKS=[]; LVL={};
  RMUS.forEach(n=>{
    const c=N[n].cust; if(!c) return;
    let h=seedFrom('lv'+n); const R=()=>(h=(h*16807)%2147483647,(h-1)/2147483646);
    const k=c>=400?4:c>=180?3:2, w=Array.from({length:k},()=>0.6+R()), tot=w.reduce((a,b)=>a+b,0), names=new Set();
    let left=c;
    LV[n]={tx:Math.round(c*AMPS*1.35),links:[],ways:w.map((x,i)=>{
      const cu=i===k-1?left:Math.max(1,Math.round(c*x/tot)); left-=cu;
      let nm; do{ nm=LV_STREETS[Math.floor(R()*LV_STREETS.length)]; }while(names.has(nm)&&names.size<LV_STREETS.length); names.add(nm);
      const o={id:n+'/'+(i+1),node:n,i,cust:cu,name:'Way '+(i+1),street:nm}; LVW[o.id]=o; return o; })};
    // out in the country the low voltage runs on poles too: every way where the 11 kV is all overhead, the last one where some is
    const oh=INC[n].filter(x=>x.c.oh).length;
    if(oh) LV[n].ways.forEach((w,i)=>{ if(oh===INC[n].length||i===LV[n].ways.length-1) w.oh=true; });
  });
  // each substation's last streets reach towards its nearest neighbours
  const ns=Object.keys(LV), done=new Set();
  ns.forEach(a=>ns.filter(b=>b!==a).map(b=>[b,dist(N[a].m,N[b].m)]).filter(x=>x[1]<200).sort((x,y)=>x[1]-y[1]).slice(0,2).forEach(([b])=>{
    const key=[a,b].sort().join('|'); if(done.has(key)||LV[a].links.length>=Math.min(2,LV[a].ways.length)||LV[b].links.length>=Math.min(2,LV[b].ways.length)) return; done.add(key);
    const wa=LV[a].ways[LV[a].ways.length-1-LV[a].links.length], wb=LV[b].ways[LV[b].ways.length-1-LV[b].links.length];
    const l={id:'LB'+(LVLINKS.length+1),a:wa.id,b:wb.id};
    LVLINKS.push(l); LVL[l.id]=l; LV[a].links.push(l); LV[b].links.push(l);
  }));
}

// Flood-fill from each closed breaker through cables closed at both ends. Islands fed by
// several breakers (a loop on one primary) share their load equally.
function solve(sw=S.sw){
  const feed={}, cab={}, parent={}, island={}, islands=[];
  // a broken conductor carries no power past the break (but stays live up to it); a primary whose transformer is out feeds nothing
  const mine=S&&S.def===NET, OPEN=mine&&S.faults.some(f=>f.open&&f.active)?new Set(S.faults.filter(f=>f.open&&f.active).map(f=>f.cable)):null, DOWN=mine&&S.primDown||null;
  for(const id of CBIDS){
    if(!sw[id]) continue;
    if(DOWN&&DOWN[CB[id].prim]) continue;
    const c=CBL[id.split(':')[0]], fe=other(CB[id].end), start=c[fe];
    if(!cab[c.id]) cab[c.id]=id;
    if(OPEN&&OPEN.has(c.id)) continue;
    if(!sw[c.id+':'+fe]) continue;
    if(island[start]!=null){ islands[island[start]].cbs.push(id); continue; }
    const k=islands.length, isl={cbs:[id],nodes:[start]}; islands.push(isl);
    island[start]=k; feed[start]=id; parent[start]={from:null,cable:c.id};
    const q=[start];
    while(q.length){
      const n=q.shift();
      for(const {c:cc,end} of INC[n]){
        if(!sw[cc.id+':'+end]) continue;
        if(!cab[cc.id]) cab[cc.id]=id;
        if(OPEN&&OPEN.has(cc.id)) continue;
        const oe=other(end), on=cc[oe];
        if(N[on].kind==='primary'||!sw[cc.id+':'+oe]||island[on]!=null) continue;
        island[on]=k; feed[on]=id; parent[on]={from:n,cable:cc.id}; isl.nodes.push(on); q.push(on);
      }
    }
  }
  return {feed,cab,parent,island,islands};
}
const islandOfCB = (sol,id)=>{ for(let k=0;k<sol.islands.length;k++) if(sol.islands[k].cbs.includes(id)) return k; return null; };

function cbLoad(sol,id,f){

  const isl=sol.islands[k], mult=f!=null?f:(S?demand(S.t)*(S.heat?1.12:1)*(S.season==='Winter'?1.06:1)*(S.snow?1.08:1)*(S.growth||1):1);

  const ev=(f==null&&S&&S.festival&&S.t>=S.festival.from&&S.t<S.festival.to&&isl.nodes.includes(S.festival.node)?S.festival.amps:0)+(f==null?eventAmps(isl.nodes):0);

  const gen=f==null&&S?isl.nodes.reduce((a,n)=>a+(N[n].gen||0)*genFactor(n),0):0;
  // new connections such as car chargers add load of their own (xA, at peak)
  // (and streets of a neighbour it is backfeeding through a link box)
  return Math.max(0,isl.nodes.reduce((a,n)=>a+(N[n].cust+(f==null&&S&&S.lvFeed&&S.lvFeed[n]||0))*AMPS+(N[n].xA||0),0)*mult+ev-gen)/isl.cbs.length;
}

function windFactor(){ if(!S) return 0; const w=windAt(S.t); if(w<7||w>56) return 0; return w>=30?1:Math.pow((w-7)/23,1.5); }

function solarFactor(t){
  const h=hourOf(t); if(h<6||h>20) return 0;
  const sky=S&&S.weather&&S.weather.storm?0.3:S&&S.snow?0.35:S&&S.season==='Winter'?0.6:1;

// Protection: trip every breaker feeding an energised fault, then any breaker over its rating.
function protect(natural){
  const res={tripped:[],fault:false};
  for(let g=0;g<24;g++){
    const sol=solve(); let acted=false;
    for(const f of S.faults){
      // a broken conductor draws no fault current, so nothing trips
      if(!f.active||f.open) continue;
      const fe=feedersOf(sol,f.cable); if(!fe.length) continue;
      if(f.transient&&f.trips>0){
        f.active=false; acted=true;
        log(`No fault current on reclose. The fault on ${cableName(CBL[f.cable])} was transient and has cleared.`,'good');
        break;
      }
      const c=CBL[f.cable], path=new Set(), reset=new Set();
      fe.forEach(cb=>{ const k=islandOfCB(sol,cb); if(k!=null) sol.islands[k].nodes.forEach(n=>reset.add(n)); });
      ['a','b'].forEach(e=>{
        const n=c[e];
        // fault current flows out of the node feeding the cable, not the one downstream of it
        if(N[n].kind==='primary'||!S.sw[c.id+':'+e]||sol.island[n]==null||sol.parent[n].cable===c.id) return;
        let x=n; while(x){ path.add(x); x=sol.parent[x].from; }
      });
      // trainees see every flag; on the hardest level the odd indicator misreads, as real ones sometimes do
      reset.forEach(n=>{
        let trip=path.has(n); if(S.diff==='control'&&Math.random()<0.12) trip=!trip;
        S.fpi[n]={trip,known:S.diff==='trainee'||!!(S.upg&&S.upg.fpi)||!!N[n].remote||crewOnSite(n),t:S.t};
      });
      // the fault current's route, for the red pulse on the diagram: breaker cable, the path down, then the faulty cable
      const pc=new Set([f.cable]); fe.forEach(cb=>pc.add(cb.split(':')[0]));
      path.forEach(n=>{ if(sol.parent[n]&&sol.parent[n].cable) pc.add(sol.parent[n].cable); });
      UI.pulse={cables:[...pc],until:performance.now()+3800};
      fe.forEach(cb=>S.sw[cb]=false);
      f.trips++; res.tripped.push(...fe); res.fault=true; acted=true;
      if(!natural) S.faultTrips++;
      const names=fe.map(cb=>`CB ${CB[cb].name}`).join(' and ');
      log(natural?`${names} at ${N[CB[fe[0]].prim].name} tripped on earth fault protection.`:`${names} tripped. That operation energised a fault.`,'bad');
      setWhy(natural?`A fault on the network sent a surge of current through ${names}, so the breaker tripped to protect everything. All the customers it fed are off. The red pulse shows the path the fault current took.`
        :`That switching put power back onto the faulty cable, so ${names} tripped again. Cut the fault off from both sides before you switch anything back on.`);
      sfx('trip');
      break;
    }
    if(acted) continue;
    let tripped=false;
    for(const id of CBIDS){
      if(!S.sw[id]) continue;
      const a=cbLoad(sol,id);
      if(a>rat(id)+0.01){
        // trainees get a warning instead of a trip
        if(S.diff==='trainee'){ if(!S.ovWarned||S.ovWarned!==id){ S.ovWarned=id; setWhy(`${CB[id].name} ${CB[id].feeder} is overloaded (${Math.round(a)} A on a ${rat(id)} A breaker). On harder levels it would trip. Move some customers to another circuit.`); } continue; }
        S.sw[id]=false; S.overloads++; tripped=true; res.tripped.push(id);
        log(`CB ${CB[id].name} tripped on overcurrent: ${Math.round(a)} A against a ${rat(id)} A rating.`,'bad');
        setWhy(`${CB[id].name} ${CB[id].feeder} was asked to carry ${Math.round(a)} A, more than its ${rat(id)} A rating, so its breaker tripped. Split the load: feed some customers from one neighbour and the rest from another.`);
        sfx('trip');
        break;
      }
    }
    if(!tripped) break;
  }
  return res;
}
function updateOn(){
  const sol=solve(), board={};
  S.offN=S.offN||{}; S.ciN=S.ciN||{};
  RMUS.forEach(n=>{
    // stolen low-voltage cables keep a substation's customers off even when the 11 kV side is live
    let fed=sol.island[n]!=null;
    // fault passage indicators reset themselves when supply comes back to their substation
    const fp=S.fpi[n]; if(fed&&fp&&fp.trip&&fp.t!=null&&S.t>fp.t){ fp.trip=false; fp.reset=S.t; }
    // a backup generator carries its site for a while after the mains goes
    if(N[n].backup&&S.bkStart){
      if(fed) S.bkStart[n]=null;
      else { if(S.bkStart[n]==null){ S.bkStart[n]=S.t; log(`${N[n].site?N[n].site.name:N[n].hospital||N[n].name}: backup generator running (about ${fmtH(N[n].backup)}).`); } fed=S.t-S.bkStart[n]<N[n].backup; }
    }
    // hired mobile generators go home once mains supply is back
    if(sol.island[n]!=null) gensAt(n).forEach(g=>{ if(g.stage==='on') genHome(g,`Mains supply is back at ${N[n].name}, so generator ${g.id} has been disconnected and is heading back to the depot.`); });
    board[n]=fed&&!S.lvOut[n];
  });
  // then street by street: from the substation's own board, through a link box from a neighbour, or from a generator
  const off=lvSupply(sol,board);
  RMUS.forEach(n=>{
    // a site with no customers of its own (the solar farm) is simply on or off with its board
    if(!N[n].cust){ if(S.on[n]&&!board[n]) S.offSince[n]=S.t; S.on[n]=!!board[n]; S.offN[n]=0; return; }
    const k=off[n]||0, was=S.on[n]===false?(S.offN[n]||0):0;
    if(k>0&&was===0){ S.offSince[n]=S.t; S.counted[n]=false; S.ciN[n]=0; if(S.everOff&&S.everOff[n]==null) S.everOff[n]=S.t; }
    if(k>was) S.affected+=k-was;
    if(k===0&&was>0&&S.backAt) S.backAt[n]=S.t;
    S.offN[n]=k; S.on[n]=k===0;
  });
  // the welfare van packs up once its customers are back on
  (S.vans||[]).forEach(v=>{ if(v.stage==='on'&&S.on[v.node]) vanHome(v,`Power is back at ${N[v.node].name}. Welfare van ${v.id} is packing up and heading home.`); });
}
// Time passes: CML accrues for everyone off; an interruption counts toward CI once it reaches 3 minutes.
function accrue(dt){
  if(dt<=0) return;
  S.cml+=offCount()*dt;
  // customers ring in fast when they first lose supply, then again if it drags on
  RMUS.forEach(n=>{
    if(S.on[n]) return;
    // most people are asleep between 23:00 and 06:00; the morning brings a burst of calls from those who wake up without power
    const h=hourOf(S.t);
    const off=S.t-S.offSince[n], rate=(off<30?0.006:off<180?0.0012:0.002)*(h>=23||h<6?0.35:h>=6&&h<8.5&&off>60?1.8:1)*callDamp(n), c=offAt(n)*rate*dt, m=Math.floor(S.t);
    S.calls[m]=(S.calls[m]||0)+c; S.callsTotal+=c; S.callArea[areaOf(n)]=(S.callArea[areaOf(n)]||0)+c;
  });
  S.t+=dt;
  RMUS.forEach(n=>{
    // an interruption counts once it reaches 3 minutes; more streets going off later in the same outage add to it
    if(!S.on[n]&&S.t-S.offSince[n]>=3-1e-9){ const k=offAt(n), c=S.counted[n]?(S.ciN&&S.ciN[n]!=null?S.ciN[n]:N[n].cust):0; if(k>c){ S.ci+=k-c; if(S.ciN) S.ciN[n]=k; } S.counted[n]=true; }
    if(!S.on[n]&&S.maxOff) S.maxOff[n]=Math.max(S.maxOff[n]||0,S.t-S.offSince[n]);
  });
  // a sample every five minutes for the debrief timeline, and a frame for the replay
  if(S.hist&&(!S.hist.length||S.t-S.hist[S.hist.length-1][0]>=5)){ S.hist.push([S.t,offCount()]); recordFrame(); }
  // money and tiredness: crews cost more outside 07:00–17:00, and get tired the longer they work
  if(S.cost&&S.crews){
    const h=hourOf(S.t), ot=h<7||h>=17;
    S.crews.forEach(cr=>{
      if(cr.restUntil&&S.t<cr.restUntil) return;
      if(cr.job||cr.queue.length){ cr.worked=(cr.worked||0)+dt; if(ot) S.cost.overtime+=dt; else S.cost.crew+=dt; }
    });
    (S.gens||[]).forEach(g=>{ if(g.stage==='on') S.cost.generators=(S.cost.generators||0)+GEN.hourly*dt/60; });
    (S.vans||[]).forEach(v=>{ if(v.stage==='on') S.cost.van=(S.cost.van||0)+VAN.hourly*dt/60; });
  }
}
// customers who know when power is due back ring less; a welfare van on the street cuts calls further
function callDamp(n){
  if((S.vans||[]).some(v=>v.stage==='on'&&v.node===n)) return 0.3;
  const e=S.etr&&S.etr[areaOf(n)]; return e&&!e.missed?0.6:1;
}
function callsRecent(){
  let s=0; for(const k in S.calls){ if(+k>S.t-15) s+=S.calls[k]; else if(+k<S.t-60) delete S.calls[k]; }
  return s;
}
function isNormal(){ return Object.keys(S.sw).every(k=>S.sw[k]===!NOPS.has(k)); }
// newsroom and public-report events never hold up the end of an incident
const INCIDENT_KINDS=new Set(['fault','digin','theft','floodhit','floodclear','vehicle','poledl','lv','workreq','opencircuit','wiresdown','primaryloss','primaryback','lvblow','neutral']);
const primsDown = ()=>S.primDown?Object.keys(S.primDown).filter(p=>S.primDown[p]):[];
const incidentPending = ()=>S.pending.some(e=>INCIDENT_KINDS.has(e.kind))||!!(S.pole&&!S.pole.done)||(S.neutral||[]).some(z=>!z.done);
function allClear(){
  return !incidentPending()&&S.faults.every(f=>!f.active)&&!primsDown().length&&!RMUS.some(n=>S.theft[n]||(S.flooded&&S.flooded[n]))&&lvNormal()
    &&(!S.planned||S.planned.state==='done')&&offCount()===0&&isNormal()&&!(S.gens||[]).some(g=>g.stage==='on'||g.stage==='setup')&&!(S.works||[]).some(w=>w.state==='prep')
    &&!(docsOn()&&(Object.keys(S.earths).length||Object.keys(S.permits).length));
}
// switchgear nobody may touch: after a theft, or while a substation is under flood water
const locked = n=>!!((S.theft&&S.theft[n])||(S.flooded&&S.flooded[n]));
function snapshotStats(){ return {t:S.t,ci:S.ci,cml:S.cml,affected:S.affected,ops:S.ops,faultTrips:S.faultTrips,overloads:S.overloads,safety:S.safety,rep:Math.round(S.rep),calls:Math.round(S.callsTotal),hints:S.hintsL3||0,undos:S.undos||0}; }
function checkPhase(){
  if(S.phase==='closed') return;
  // planned work has no emergency stage: it closes once the job is done and the network is back to normal
  if(S.phase==='planned'){
    if(S.planned&&S.planned.state==='done'&&allClear()){ S.restored=snapshotStats(); recordStars(); S.phase='closed'; S.paused=true; S.modal='closed'; S.closedAt=S.t; log('Planned work complete and the network is back in normal running.','good'); sfx('chime'); onShiftEnd(); }
    return;
  }
  if(S.phase==='restore'&&!incidentPending()&&offCount()===0){
    // with safety documents the permit work still lies ahead, so the stars wait until the incident closes
    S.phase='repair'; S.restored=snapshotStats(); if(!docsOn()) recordStars();
    log('All customers back on supply.','good'); sfx('chime');
    if(!allClear()){ S.paused=true; S.modal='restored'; }
  }
  if(S.phase==='repair'&&allClear()){
    if(docsOn()) recordStars();
    S.phase='closed'; S.paused=true; S.modal='closed'; S.closedAt=S.t;
    log('Network back in normal running. Incident closed.','good');
    onShiftEnd();
  }
}
function afterChange(){ updateOn(); checkPhase(); newsCheck(); runSchedule(); dirty=true; }

// ---------- Weather ----------
// Storm gusts follow a bell curve around the peak; outside storms the wind stays light.
function windAt(t){
  const w=S.weather; if(!w) return 0;
  if(!w.storm) return w.calm;
  const g=w.base+(w.peak-w.base)*Math.exp(-Math.pow((t-w.tp)/w.width,2));
  return Math.max(5,Math.round(g+3*Math.sin(t/9)));
}
function windOK(t){ for(let k=0;k<900;k++) if(windAt(t+k)<WIND_LIMIT) return t+k; return t+900; }
const warnLevel = g=>g>=75?'Red':g>=55?'Amber':g>=40?'Yellow':null;

// ---------- Newsroom ----------
function rep(d){ S.rep=Math.max(0,Math.min(100,S.rep+d)); }
function news(outlet,text,d=0){
  S.news.unshift({t:S.t,outlet:outlet||OUTLETS[Math.floor(Math.random()*OUTLETS.length)],text});
  if(S.news.length>40) S.news.pop();
  if(d) rep(d);
}
// (substations without customers, like the solar farm, don't make an area "off")
function offByArea(){ const o={}; RMUS.forEach(n=>{ if(!S.on[n]&&N[n].cust) o[areaOf(n)]=(o[areaOf(n)]||0)+offAt(n); }); return o; }
function schedule(ev){ const i=S.pending.findIndex(e=>e.t>ev.t); if(i<0) S.pending.push(ev); else S.pending.splice(i,0,ev); }
function newsCheck(){
  if(!S||!S.newsFlags) return;
  const F=S.newsFlags, off=offCount();
  if(off>=2000&&!F.thousands){ F.thousands=1; news(null,`Thousands without power across ${NET.name}`,-2); }
  RMUS.filter(n=>N[n].hospital).forEach(n=>{
    const h=N[n].hospital, dn=S.on[n]?0:S.t-S.offSince[n];
    if(dn>=30&&!F['g1'+n]){ F['g1'+n]=1; F['gok'+n]=0; news(null,`${h} switches to backup generators`,-4); }
    if(dn>=240&&!F['g2'+n]){ F['g2'+n]=1; news(null,`Fears for patients as ${h} generators run low`,-10); }
    if(S.on[n]&&F['g1'+n]&&!F['gok'+n]){ F['gok'+n]=1; news(null,`Mains power back at ${h}`,2); }
  });
  // vulnerable customers off for over an hour without a welfare visit
  RMUS.forEach(n=>{ if(!S.on[n]&&N[n].cust&&S.t-S.offSince[n]>=60&&!(S.welfare&&S.welfare[n])&&!F['psr'+n]){ F['psr'+n]=1; S.psrMissed=(S.psrMissed||0)+1; news(null,`Elderly and vulnerable residents in ${N[n].name} without power for over an hour`,-3); } });
  // the festival going dark
  if(S.festival&&S.t>=S.festival.from&&S.t<S.festival.to&&!S.on[S.festival.node]&&!F.fest){ F.fest=1; S.festFail=true; news(null,'Festival stage plunged into darkness',-6); }
  // major sites such as the airport and the docks make the news if they are left without power
  RMUS.filter(n=>N[n].site).forEach(n=>{
    const s=N[n].site, dn=S.on[n]?0:S.t-S.offSince[n];
    if(dn>=20&&!F['s1'+n]){ F['s1'+n]=1; F['sok'+n]=0; news(null,s.off,-3); }
    if(S.on[n]&&F['s1'+n]&&!F['sok'+n]){ F['sok'+n]=1; F['s1'+n]=0; news(null,s.back,1); }
  });
  const oa=offByArea();
  Object.keys(S.areaHit).forEach(a=>{ if(S.areaHit[a]&&!oa[a]){ S.areaHit[a]=false; news(null,`Lights back on in ${a}`,1); } });
  Object.keys(oa).forEach(a=>{ if(oa[a]>=200) S.areaHit[a]=true; });
  if(S.safety>(F.safety||0)){ F.safety=S.safety; news(null,'Investigation launched after electricity crew safety incident',-10); }
  if(S.overloads>(F.overloads||0)){ F.overloads=S.overloads; news(null,'Second power cut as overloaded line trips',-3); }
  if(S.weather.storm&&windAt(S.t)>=75&&!F.red){ F.red=1; news('Met Office',`Red warning: gusts of ${windAt(S.t)} mph recorded at Faraday Head`); }
}
function makeMediaRequest(){
  // the newsdesks are quiet in the small hours; try again at breakfast time
  const h=hourOf(S.t);
  if(h>=23||h<6){ if(offCount()>0||incidentPending()) schedule({kind:'media',t:S.t+((6.5-h+24)%24)*60}); return; }
  const oa=offByArea(), areas=Object.keys(oa).sort((a,b)=>oa[b]-oa[a]);
  if(areas.length){
    const area=areas[0], id=++S.mediaSeq, outlet=OUTLETS[Math.floor(Math.random()*OUTLETS.length)];
    const due=S.diff==='trainee'?40:S.diff==='control'?15:20;
    S.media.unshift({id,outlet,area,cust:oa[area],t:S.t,deadline:S.t+due,answered:null});
    schedule({kind:'mediaDeadline',t:S.t+due,id});
    log(`${outlet} wants an update on ${area} (${fmtN(oa[area])} customers off). Answer in the Newsroom within ${due} minutes.`,'warn');
    // the phone rings in the control room: stop the clock and put the request on screen

function answerMedia(id,hours){
  const m=S.media.find(x=>x.id===id); if(!m||m.answered) return;
  if(S.pressPopup===id){ S.pressPopup=null; if(UI.overlay==='press') UI.overlay=null; }

// ---------- Estimated restoration times ----------
// One ETR per area, shared with customers and the press. Meeting it lifts public confidence; missing it costs.
function setEtr(area,t){
  if(!canOrder()||!S.etr) return;
  t=Math.ceil(t/15)*15; if(t<=S.t) t=Math.ceil((S.t+15)/15)*15;
  const old=S.etr[area];
  pushUndo(`set the restoration time for ${area}`);
  S.etr[area]={t,set:S.t,missed:false,updates:old?(old.updates||0)+1:0};
  log(old?`Restoration time for ${area} updated to ${fmtT(t)}${old.missed?' after the last one was missed':''}. Customers have been told.`
    :`Restoration time for ${area} set: power back by ${fmtT(t)}. Customers have been told by text and on the website.`);
  dirty=true; render();
}
// how long a fault will take to put right, from where the work has got to
function repairEst(f){
  const c=CBL[f.cable], dmg=f.damage?DAMAGE[f.damage].mins:WORK.repair;
  for(const cr of S.crews){
    const j=cr.job;
    if(j&&j.cable===f.cable&&j.type==='repair'){ if(j.stage==='work') return j.tDone; if(j.stage==='travel') return j.tArrive+jobMins(j,cr); return S.t+jobMins(j,cr)+30; }
  }
  const known=S.tested[f.cable]==='fault'||f.found;
  return S.t+(known?60:120)+(f.damage==='tree'&&!S.cleared[f.cable]?WORK.clear:0)+dmg+(docsOn()?30:0)+(c.oh&&windAt(S.t)>=WIND_LIMIT?Math.max(0,windOK(S.t)-S.t):0);
}
// a sensible restoration time for an area: switching if the network can reach it, otherwise the repair
function suggestEtr(area){
  const ns=RMUS.filter(n=>!S.on[n]&&areaOf(n)===area); if(!ns.length) return S.t+30;
  const bad=S.faults.filter(f=>f.active&&!f.transient), badSet=new Set(bad.map(f=>f.cable));
  const adj={}; Object.keys(N).forEach(k=>adj[k]=[]);
  CABLES.forEach(c=>{ if(badSet.has(c.id)) return; adj[c.a].push(c.b); adj[c.b].push(c.a); });
  const reach=new Set(), q=[...PRIMS];
  while(q.length){ const n=q.shift(); adj[n].forEach(m=>{ if(!reach.has(m)&&N[m].kind!=='primary'&&!locked(m)){ reach.add(m); q.push(m); } }); }
  let t=S.t+45;
  ns.forEach(n=>{
    if(S.theft[n]){ const j=S.crews.map(cr=>cr.job).find(j=>j&&j.type==='makesafe'&&j.node===n); t=Math.max(t,(j?(j.stage==='work'?j.tDone:j.tArrive+WORK.makesafe):S.t+40+WORK.makesafe)+15); return; }
    if(S.flooded[n]){ t=Math.max(t,(S.flood&&S.flood.until||S.t)+(S.flooded[n]==='damaged'?WORK.rebuild+60:30)); return; }
    if(lvBadAt(n).length&&solve().island[n]!=null){ t=Math.max(t,S.t+40+(lvBadAt(n).some(w=>wayFaulted(w.id)||(lvs(w.id)||{}).known)?WORK.lvfix:WORK.lvfuse)); return; }
    if(!reach.has(n)) bad.forEach(f=>{ t=Math.max(t,repairEst(f)+20); });
  });
  return Math.ceil(t/30)*30;
}
function checkEtrs(){
  if(!S.etr) return;
  const oa=offByArea();
  Object.keys(S.etr).forEach(a=>{
    const e=S.etr[a];
    if(!oa[a]){
      // a cautious ETR beaten by hours earns nothing extra
      if(!e.missed){ const early=e.t-S.t>180; if(!early) rep(2); log(`Power back in ${a} by ${fmtT(e.t)}, as promised.`,'good'); S.etrMet=(S.etrMet||0)+1; }
      delete S.etr[a]; dirty=true; return;
    }
    if(!e.missed&&S.t>e.t){
      e.missed=true; S.etrMissed=(S.etrMissed||0)+1;
      news(null,`${a} customers let down as promised restoration time passes`,-4);
      log(`Restoration time missed for ${a}: customers were told ${fmtT(e.t)}. Give them a new time in the Incidents tab.`,'bad');
      toast(`Restoration time missed for ${a}. Give customers a new time.`); dirty=true;
    }
  });
}

// ---------- Events ----------
function crewPos(cr){
  const j=cr.job;
  if(j&&j.stage==='travel'&&j.tArrive>j.t1){
    const k=Math.max(0,Math.min(1,(S.t-j.t1)/(j.tArrive-j.t1)));
    if(j.path&&j.path.length>1) return pointAlong(j.path,k);
    return [j.from[0]+(j.to[0]-j.from[0])*k, j.from[1]+(j.to[1]-j.from[1])*k];
  }
  return cr.pos;
}
function nextEvent(){

// why the van can't go here, or null if it can
function vanBlock(n){
