    setWhy(`Water and live electricity don't mix. If ${N[p.node].name} is still switched on when the flood arrives, the equipment is destroyed. Its own customers will lose power either way, but you can feed the substations beyond it from a neighbour.`);
    sfx('alarm'); if(!initial){ S.paused=true; toast(`Flood warning for ${N[p.node].name}. Clock paused.`); }
    news(null,`Flood warning issued for ${areaOf(p.node)}`);

    if(live){ S.cost.damage+=20000; news(null,`Flood water wrecks ${N[n].name} substation`,-8); log(`Flood water reached ${N[n].name} while it was live. The switchgear is wrecked and will need a crew to rebuild it once the water goes down.`,'bad'); sfx('trip'); }
    else log(`Flood water reached ${N[n].name}. It was switched off in time, so it will dry out safely.`,'good');
    return {tripped:[]};
  }

function parallelBlock(sid){

  if(pa&&pb&&pa!==pb) return `closing the ${switchLabel(sid)} would parallel ${N[pa].name} and ${N[pb].name}. Make one side dead first.`;
  return null;

  if(close){ const why=parallelBlock(sid); if(why){ log('Refused: '+why,'warn'); toast('Refused: '+why); setWhy(PARALLEL_WHY); return; } }

function jobText(j){

  if(j.type==='visit') return 'Read FPI';
  if(j.type==='clear') return `Clear trees from line to ${N[c.a===j.node?c.b:c.a].name}`;
  if(j.type==='earth'){ const [cid,e]=j.esw.split(':'); return `${j.on?'Apply':'Remove'} earth on cable to ${N[CBL[cid][other(e)]].name}`; }
  if(j.type==='makesafe') return 'Make safe after theft';
  if(j.type==='lvfix') return 'Fix low-voltage fault';

// assessors drive light vans and only look; crews do the switching and the repairs
function canDo(cr,type){

  if(cr.role==='planned') return ['maint','earth','op','test','repair'].includes(type);
  // reactive crews do maintenance only if no planned team is on shift, and clear trees (slowly) only if no tree team is
  if(type==='maint') return !S.crews.some(c=>c.role==='planned');
  if(type==='clear') return !S.crews.some(c=>c.role==='veg');

}
// colour class for a team's badge and van
const roleCls = cr=>({assessor:' as',veg:' vg',planned:' pw'})[cr.role]||'';
// the team you'd normally send for each job, so "Fastest" doesn't pull a planned team off its maintenance for a fault
const roleFits = (cr,type)=>cr.role==='planned'?type==='maint'||type==='earth':true;
// vans drive a little slower in the dark
const ttc = (cr,p,q)=>Math.round(tt(p,q)*(cr.role==='assessor'?0.75:1)*(nightWork(S.t)?1.15:1)*(S.snow?1.6:1));   // snow and ice slow everyone down
function lineLen(cid){ const p=CBL[cid].mp||[N[CBL[cid].a].m,N[CBL[cid].b].m]; let L=0; for(let i=0;i<p.length-1;i++) L+=dist(p[i],p[i+1]); return L; }

  const night=nightWork(S.t);
  if(j.type==='patrol') return Math.round((15+lineLen(j.cable)/18)*(cr&&cr.role==='assessor'?0.7:1)*(night?1.5:1)*(S.snow?1.3:1));
  if(j.type==='repair'){ const f=faultOn(j.cable), m=f&&f.damage==='tree'&&S.cleared&&S.cleared[j.cable]?TREE_REPAIR:f&&f.damage?DAMAGE[f.damage].mins:WORK.repair; return Math.round(m*(night?1.25:1)*(S.snow?1.2:1)); }

function startNext(i){

  const d=cr.at===j.node?0:ttc(cr,j.from,j.to);

function startWork(cr,j){

  if(j.type==='repair'&&j.held) log(`${cr.id} on site, but gusts are ${windAt(S.t)} mph: no climbing. Repairs to ${what} start when the wind drops below ${WIND_LIMIT} mph (forecast about ${fmtT(start)}), then take about ${fmtH(mins)}.`,'warn');

// ---------- Orders from the player ----------
function crewPlan(cr){
  let t=S.t, pos=crewPos(cr);
  const j=cr.job;
  if(cr.restUntil&&cr.restUntil>t) t=cr.restUntil;
  if(j){ t=j.stage==='travel'?j.tArrive+jobMins(j,cr):j.stage==='wait'?S.t+jobMins(j,cr):j.tDone; pos=j.to; }
  cr.queue.forEach(q=>{ t+=ttc(cr,pos,N[q.node].m)+jobMins(q,cr); pos=N[q.node].m; });
  return {t,pos};
}
function crewEta(i,node,type,cable){
  const cr=S.crews[i], p=crewPlan(cr), d=cr.at===node&&!cr.job&&!cr.queue.length?0:ttc(cr,p.pos,N[node].m);

function chooseCrew(node,type,cable){

function pendingFor(sid){

// ---------- Safety documents ----------

const docsOn = ()=>!!(S&&S.docs);

const needsPermit = type=>type==='repair'||type==='maint';

function permitBlock(cid){

  const bare=cableEnds(cid).find(s=>!earthed(s)); if(bare) return `there is no earth at ${N[nodeOfSw(bare)].name}`;

// a crew on site applies or removes an earth, proving the cable dead first

  }

// switching that makes an earthed cable live: a flashover. The breakers feeding it trip at once.
function checkEarths(){

  if(!hot.length) return;
  const fe=new Set(); hot.forEach(c=>feedersOf(sol,c.id).forEach(x=>fe.add(x)));
  fe.forEach(cb=>S.sw[cb]=false);
  S.safety++; S.safetyTip='You switched power onto a cable that still had its earths on. Cancel the permit and remove every earth before you switch a cable back on.';
  const names=[...fe].map(cb=>`CB ${CB[cb].name}`).join(' and ');
  log(`Flashover: ${cableName(hot[0])} was switched on with its earths still applied. ${names} tripped.`,'bad');
  news(null,'Explosion at substation as power switched onto earthed cable',-10);
  setWhy(`Earths connect a dead cable to the ground so it can't become live while people work on it. Switching power onto it drives a huge current straight into the earth, which is a flashover. ${names} tripped to clear it. Before you switch a cable back on, cancel its permit and remove all its earths.`);
  UI.pulse={cables:[...hot.map(c=>c.id),...[...fe].map(cb=>cb.split(':')[0])],until:performance.now()+3800};

// ---------- New incident ----------
// Work out what will happen during the shift. The first event always takes customers off.
function planEvents(scen,t,shift){
  const R=rand, rint=(a,b)=>a+Math.floor(R()*(b-a));
  const pool=FAULTABLE.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  // the first cable event must hit a live cable (and the shift's area, if it has one) so a breaker trips
  const live=solve().cab;
  const inArea=cid=>!shift||!shift.area||[CBL[cid].a,CBL[cid].b].every(n=>shift.area.some(p=>n===p||n.startsWith(p)));
  let fi=pool.findIndex(c=>live[c]&&inArea(c)); if(fi<0) fi=pool.findIndex(c=>live[c]);
  if(fi>0) [pool[0],pool[fi]]=[pool[fi],pool[0]];
  const take=()=>pool.shift(), pickNode=()=>RMUS[Math.floor(R()*RMUS.length)];
  const theftNode=()=>shift&&shift.theftNode&&N[shift.theftNode]?shift.theftNode:(N.V2&&R()<0.5?'V2':pickNode());
  const ev=[];
  // the training shift is scripted: one known fault, no press, nothing else
  if(shift&&shift.fixed) return [{kind:'fault',t,cable:shift.fixed,transient:false}];
  const liveUG=()=>{ const k=pool.findIndex(c=>live[c]&&!CBL[c].oh&&!CB[c+':a']&&!CB[c+':b']); return k>=0?pool.splice(k,1)[0]:take(); };
  const liveOH=()=>{ const k=pool.findIndex(c=>live[c]&&CBL[c].oh); return k>=0?pool.splice(k,1)[0]:take(); };
  if(scen==='planned'){ /* nothing breaks: the job is the planned work itself */ }
  else if(scen==='flood'){
    const cands=(NET.decor&&NET.decor.floodNodes||[]).filter(n=>N[n]), node=cands.length?cands[Math.floor(R()*cands.length)]:pickNode();
    const at=t+rint(45,75), until=at+rint(150,210);
    ev.push({kind:'floodwarn',t,node,at,until},{kind:'floodhit',t:at,node},{kind:'floodclear',t:until,node});
    if(R()<0.6) ev.push({kind:'fault',t:t+rint(30,140),cable:take(),transient:R()<0.4});
  }
  else if(scen==='heatwave'){ ev.push({kind:'fault',t,cable:liveUG(),transient:false}); ev.push({kind:'fault',t:t+rint(60,170),cable:liveUG(),transient:R()<0.2}); }
  else if(scen==='vehicle'){ ev.push({kind:'vehicle',t,cable:liveOH()}); if(R()<0.5) ev.push({kind:'fault',t:t+rint(60,150),cable:take(),transient:true}); }
  else if(scen==='flicker'){
    const cid=liveUG(), c=CBL[cid], node=N[c.a].kind==='primary'?c.b:c.a, failAt=t+rint(80,150);
    ev.push({kind:'flicker',t,cable:cid,node,failAt},{kind:'fault',t:failAt,cable:cid,transient:false,dev:true});
  }
  else if(scen==='festival'){ ev.push({kind:'fault',t:t+rint(40,140),cable:take(),transient:R()<0.25}); if(R()<0.5) ev.push({kind:'fault',t:t+rint(160,280),cable:take(),transient:R()<0.3}); }
  else if(scen==='single') ev.push({kind:'fault',t,cable:take(),transient:R()<0.2});
  else if(scen==='digin'){ ev.push({kind:'digin',t,cable:take()}); ev.push({kind:'fault',t:t+rint(40,120),cable:take(),transient:true}); }
  else if(scen==='theft'){ ev.push({kind:'theft',t,node:theftNode()}); ev.push({kind:'fault',t:t+rint(50,130),cable:take(),transient:R()<0.2}); }
  else if(scen==='mixed'){ ev.push({kind:'fault',t,cable:take(),transient:R()<0.2}); ev.push({kind:'theft',t:t+rint(30,90),node:theftNode()}); ev.push({kind:'digin',t:t+rint(90,180),cable:take()}); }
  else { // storm and bigstorm: wind mostly brings down overhead lines
    const takeStorm=()=>{ const k=pool.findIndex(c=>CBL[c].oh); return k>=0&&R()<0.75?pool.splice(k,1)[0]:take(); };
    const k0=pool.findIndex(c=>live[c]&&CBL[c].oh);
    ev.push({kind:'fault',t,cable:k0>=0?pool.splice(k0,1)[0]:take(),transient:R()<0.3});
    const n=scen==='bigstorm'?rint(3,6):rint(2,5);
    for(let i=0;i<n&&pool.length;i++) ev.push({kind:'fault',t:t+rint(20,190),cable:takeStorm(),transient:R()<0.35});

const artOn = ()=>!!ART&&!!NET&&!!NET.decor&&NET.decor.coast===MEGAWATT.decor.coast;

// a day picture with its night picture fading in over it as it gets dark
function artPair(a,box,off){

}
function landmarkSvg(k){
  const a=artOn()&&ART.landmarks&&ART.landmarks[k];
  if(!a) return LANDMARK[k];
  let h=artPair(a,a.box||ART_BOX[k]||[-16,-16,32,32]);
  // spinning parts (turbine blades) turn about their pivot
  if(a.spin){ const [px,py]=a.spin.pivot||[0,0]; h+=`<g>${artPair(a.spin,a.spin.box)}<animateTransform attributeName="transform" type="rotate" from="0 ${px} ${py}" to="360 ${px} ${py}" dur="${a.spin.dur||4}s" repeatCount="indefinite"/></g>`; }

  if(k==='lighthouse') h=(LANDMARK.lighthouse.match(/<path class="lm-beam"[\s\S]*?<\/path>/)||[''])[0]+h;
  return h;
}
// the picture for one house, if the art pack has one; flats are the bigger city blocks
function houseArt(b){
  let v=artOn()&&ART.houses&&ART.houses[b.flat?'flat':'house'];
  if(!v) return null;
  if(Array.isArray(v)) v=v[Math.abs(Math.round(b.x*7+b.y*13))%v.length];
  const bx=v.box||(b.flat?[-8,-6.5,18,15]:[-7.2,-8.5,14.4,15]), s=b.w/(b.flat?15.5:12);
  return {v,box:[b.x+bx[0]*s,b.y+bx[1]*s,bx[2]*s,bx[3]*s]};

    (d.parks||[]).map(p=>`<rect x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[3]}" rx="${Math.min(p[2],p[3])/2}" fill="#c4dfb0" stroke="#4f7d3a" stroke-dasharray="4 3"/>`).join(''));

    (hz?`<rect x="${f(hz[0])}" y="${f(hz[1])}" width="${f(hz[2])}" height="${f(hz[3]+60)}" fill="none" stroke="#7a4b8c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="${f(hz[0]+4)}" y="${f(hz[1]-4)}" font-size="10" fill="#7a4b8c">DOCKS</text>`:''));
  o+=L('houses-placed-by-game',blocks().map(b=>{ const bx=b.flat?[-8,-6.5,18,15]:[-7.2,-8.5,14.4,15], s=b.w/(b.flat?15.5:12);
    return `<rect x="${f(b.x+bx[0]*s)}" y="${f(b.y+bx[1]*s)}" width="${f(bx[2]*s)}" height="${f(bx[3]*s)}" fill="${b.flat?'#f3c1b8':'#fde2c8'}" stroke="#c0392b" stroke-width=".6"/>`; }).join(''));
  const box=(k,b,x,y)=>`<g transform="translate(${x},${y})"><rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" fill="#2f6fb3" fill-opacity=".12" stroke="#2f6fb3" stroke-width=".8" stroke-dasharray="3 2"/><circle r="1.5" fill="#2f6fb3"/><text y="${b[1]+b[3]+8}" font-size="7" text-anchor="middle" fill="#2f6fb3">${k}</text></g>`;
  o+=L('landmarks',(d.landmarks||[]).map(l=>box(l[2],ART_BOX[l[2]]||[-16,-16,32,32],l[0],l[1])).join('')+box('depot',[-11,-9,22,18],NET.depot[0],NET.depot[1]));

    Object.keys(N).map(k=>{ const m=N[k].m; return `<circle cx="${m[0]}" cy="${m[1]}" r="${N[k].kind==='primary'?14:9}" fill="#fff" stroke="#b8327a" stroke-width="2"/><text x="${m[0]}" y="${m[1]+3}" font-size="8" font-weight="bold" text-anchor="middle" fill="#b8327a">${N[k].code||k}</text>`; }).join(''));

    (d.lakes||[]).filter(k=>k[4]).map(k=>`<text x="${k[0]}" y="${k[1]+4}" font-size="11" text-anchor="middle">${k[4]}</text>`).join(''));

// draw an SVG onto a canvas of the given width and return it as a PNG
function svgToPng(svg,w,h){
  return new Promise((ok,fail)=>{
    const img=new Image(), u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    img.onload=()=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(u); c.toBlob(b=>b?ok(b):fail(new Error('PNG failed')),'image/png'); };
    img.onerror=()=>fail(new Error('SVG failed to load')); img.src=u;
  });
}
// a plain (uncompressed) zip of [name, Uint8Array] files, so the PNG layers download as one file
function makeZip(files){
  const crcT=Array.from({length:256},(_,n)=>{ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; return c>>>0; });
  const crc=d=>{ let c=0xFFFFFFFF; for(let i=0;i<d.length;i++) c=crcT[(c^d[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const enc=new TextEncoder(), parts=[], cent=[]; let off=0;
  files.forEach(([name,data])=>{
    const nm=enc.encode(name), c=crc(data), h=new DataView(new ArrayBuffer(30));
    [[0,0x04034b50,4],[4,20,2],[14,c,4],[18,data.length,4],[22,data.length,4],[26,nm.length,2]].forEach(([p,v,n])=>n===4?h.setUint32(p,v,true):h.setUint16(p,v,true));
    const e=new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[16,c,4],[20,data.length,4],[24,data.length,4],[28,nm.length,2],[42,off,4]].forEach(([p,v,n])=>n===4?e.setUint32(p,v,true):e.setUint16(p,v,true));
    parts.push(new Uint8Array(h.buffer),nm,data); cent.push(new Uint8Array(e.buffer),nm);
    off+=30+nm.length+data.length;
  });
  const size=cent.reduce((a,b)=>a+b.length,0), end=new DataView(new ArrayBuffer(22));
  [[0,0x06054b50,4],[8,files.length,2],[10,files.length,2],[12,size,4],[16,off,4]].forEach(([p,v,n])=>n===4?end.setUint32(p,v,true):end.setUint16(p,v,true));
  return new Blob([...parts,...cent,new Uint8Array(end.buffer)],{type:'application/zip'});
}
function showArtTemplates(){
  const t=artTemplates(), url=s=>URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  const el=document.createElement('div');
  el.setAttribute('style','position:fixed;inset:auto 16px 16px auto;z-index:99;background:#fff;color:#14201d;padding:14px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);font:14px system-ui;line-height:1.6;max-width:340px');
  el.innerHTML=`<b>Art templates</b><br><a href="${url(t.template)}" download="megawatt-template.svg">Download layout template (SVG)</a><br><a href="${url(t.reference)}" download="megawatt-reference.svg">Download current map (SVG reference)</a>
    <br><b style="display:block;margin-top:6px">For Procreate: PNG layers</b><button data-w="6400">6400 × 3600</button> <button data-w="4800">4800 × 2700</button><div class="st" style="font-size:12px;color:#5a6a66"></div><small>See art/ART-GUIDE.md</small>`;
  el.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
    const w=+b.dataset.w, h=w*9/16, st=el.querySelector('.st'), files=[];
    el.querySelectorAll('button').forEach(x=>x.disabled=true);
    try{
      for(let i=0;i<t.layers.length;i++){
        const [id,svg]=t.layers[i]; st.textContent=`Drawing ${id} (${i+1} of ${t.layers.length})…`;
        files.push([`${String(i).padStart(2,'0')}-${id}.png`,new Uint8Array(await (await svgToPng(svg,w,h)).arrayBuffer())]);
      }
      const a=document.createElement('a'); a.href=URL.createObjectURL(makeZip(files)); a.download=`megawatt-template-${w}x${h}.zip`; a.click();
      st.textContent='Done: unzip it, then add each PNG as a layer.';
    }catch(e){ st.textContent='Sorry, that failed: '+e.message; }
    el.querySelectorAll('button').forEach(x=>x.disabled=false);
  });

  for(let i=0;i<70;i++){
    const x=rnd()*W, y=rnd()*H;
    if(!onLand(x,y)||!onLand(x,y+8)||inAnyTown(x,y,1.2)||inPark(x,y)||inZone(zones,x,y,6)||!clear(x,y,10)) continue;
    base+=treeSvg(x,y,3.5+rnd()*2);
  }
  // farmsteads near the roads, out in the countryside
  const farms=[];
  for(let i=0;i<500&&farms.length<11;i++){
    const x=40+rnd()*(W-80), y=40+rnd()*(H-80);
    if(!onLand(x-20,y-14)||!onLand(x+20,y+14)||!onLand(x-20,y+14)||!onLand(x+20,y-14)) continue;
    if(inAnyTown(x,y,1.5)||inPark(x,y,20)||inHill(x,y)||inZone(zones,x,y,24)||!clear(x,y,20)) continue;
    if(Math.min(...segs.map(s=>distSeg([x,y],s[0],s[1])))>70||farms.some(p=>dist(p,[x,y])<130)) continue;
    farms.push([x,y]); base+=farmSvg(x,y,rnd);
  }
  if(d.river) base+=riverSvg(d.river,!!d.coast,onLand,rnd);
  // the island railway, with its stations
  if(d.rail){
    const rp=railPts(d).map(p=>p.join(',')).join(' ');
    base+=`<polyline class="rail-b" points="${rp}"/><polyline class="rail-t" points="${rp}"/>`;
    (d.rail.stations||[]).forEach(s=>{ base+=`<g transform="translate(${s[0]},${s[1]})"><rect class="station" x="-8" y="-5" width="16" height="9" rx="1.5"/><rect class="station-r" x="-8" y="-5" width="16" height="3"/></g>`; });
  }
  // the airport and the docks, whose lights come on at night if their substation has supply
  const siteLights={};
  if(d.airport){ const a=airportSvg(d.airport); base+=a.body; siteLights[d.airport.node]=(siteLights[d.airport.node]||'')+a.lights; }
  if(d.harbour){ const hb=harbourSvg(d.harbour,onLand); base+=hb.body; siteLights[d.harbour.node]=(siteLights[d.harbour.node]||'')+hb.lights; }
  // drawn after the houses: roads, names, landmarks and the map furniture
  // edges first, then fills, so junctions join up cleanly; town streets and lanes are narrower than main roads
  const pl=l=>l.pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '), wide=l=>l.kind==='main';
  let roads=RN.lines.map(l=>`<polyline points="${pl(l)}" class="${wide(l)?'road-e':'street-e'}"/>`).join('')+RN.lines.map(l=>`<polyline points="${pl(l)}" class="${wide(l)?'road':'street'}"/>`).join('');
  // a level crossing wherever a road meets the railway: rails across the road, barriers and warning signs either side
  if(d.rail){
    const rp=railPts(d), seen=[];
    RN.lines.forEach(l=>{ if(l.kind==='spur') return; for(let i=0;i<l.pts.length-1;i++) for(let k=0;k<rp.length-1;k++){
      const a=l.pts[i], b=l.pts[i+1], c=rp[k], e=rp[k+1], r=[b[0]-a[0],b[1]-a[1]], s=[e[0]-c[0],e[1]-c[1]], den=r[0]*s[1]-r[1]*s[0]; if(Math.abs(den)<1e-9) continue;
      const q=[c[0]-a[0],c[1]-a[1]], t=(q[0]*s[1]-q[1]*s[0])/den, u=(q[0]*r[1]-q[1]*r[0])/den; if(t<0||t>1||u<0||u>1) continue;
      const x=[a[0]+t*r[0],a[1]+t*r[1]]; if(seen.some(p=>dist(p,x)<16)) continue; seen.push(x);
      const ra=Math.atan2(s[1],s[0])*180/Math.PI, la=Math.atan2(r[1],r[0])*180/Math.PI, w=wide(l)?9:6;
      roads+=`<g transform="translate(${x[0].toFixed(1)},${x[1].toFixed(1)})" pointer-events="none">
        <g transform="rotate(${ra.toFixed(1)})"><rect x="-${w/2+5}" y="-4.5" width="${w+10}" height="9" fill="#e9e2d0" opacity=".9"/><line x1="-${w/2+6}" y1="-2.2" x2="${w/2+6}" y2="-2.2" stroke="#3a3a3a" stroke-width="1.3"/><line x1="-${w/2+6}" y1="2.2" x2="${w/2+6}" y2="2.2" stroke="#3a3a3a" stroke-width="1.3"/></g>
        <g transform="rotate(${la.toFixed(1)})">${[-1,1].map(sd=>`<g transform="translate(${sd*9},${sd*(w/2+4)})"><circle r="1.6" fill="#3a3a3a"/><line x1="0" y1="0" x2="${-sd*10}" y2="0" stroke="#fff" stroke-width="1.6"/><line x1="0" y1="0" x2="${-sd*10}" y2="0" stroke="#d8453a" stroke-width="1.6" stroke-dasharray="2.5 2.5"/></g>`).join('')}</g></g>`; } });
  }
  // a stone bridge wherever a road crosses the river
  if(d.river){
    const rv=samplePath(d.river,4), hit=(a,b,c,e)=>{ const r=[b[0]-a[0],b[1]-a[1]], s=[e[0]-c[0],e[1]-c[1]], den=r[0]*s[1]-r[1]*s[0]; if(Math.abs(den)<1e-9) return null;
      const q=[c[0]-a[0],c[1]-a[1]], t=(q[0]*s[1]-q[1]*s[0])/den, u=(q[0]*r[1]-q[1]*r[0])/den; return t>=0&&t<=1&&u>=0&&u<=1?[a[0]+t*r[0],a[1]+t*r[1]]:null; };
    const done=[];
    RN.lines.forEach(l=>{ if(l.kind==='spur') return; for(let i=0;i<l.pts.length-1;i++) for(let k=0;k<rv.length-1;k++){ const x=hit(l.pts[i],l.pts[i+1],rv[k],rv[k+1]); if(!x||done.some(p=>dist(p,x)<20)) continue; done.push(x);
      const ang=Math.atan2(l.pts[i+1][1]-l.pts[i][1],l.pts[i+1][0]-l.pts[i][0])*180/Math.PI, w=wide(l)?9:6;
      roads+=`<g transform="translate(${x[0].toFixed(1)},${x[1].toFixed(1)}) rotate(${ang.toFixed(1)})" pointer-events="none"><rect x="-15" y="${-w/2-2}" width="30" height="${w+4}" rx="2" fill="#cfc6b3" stroke="#8b8270" stroke-width=".8"/><rect x="-15" y="${-w/2}" width="30" height="${w}" fill="#f6efe0"/><line x1="-15" y1="${-w/2-1}" x2="15" y2="${-w/2-1}" stroke="#8b8270" stroke-width="1.2"/><line x1="-15" y1="${w/2+1}" x2="15" y2="${w/2+1}" stroke="#8b8270" stroke-width="1.2"/></g>`; } });
  }
  // the night shade and dusk glow sit over the land, houses and roads, but under the names and the network
  let shade=`<rect width="${W}" height="${H}" class="duskglow"/><rect width="${W}" height="${H}" class="nightshade"/>`;
  let top='';
  parks.forEach(p=>{ if(p[4]) top+=`<text x="${p[0]+p[2]/2}" y="${p[1]+p[3]/2+4}" class="mapt" text-anchor="middle">${p[4]}</text>`; });
  (d.landmarks||[]).forEach(l=>{ if(LANDMARK[l[2]]) top+=`<g transform="translate(${l[0]},${l[1]})" pointer-events="none">${landmarkSvg(l[2])}</g>`; });
  (d.labels||[]).forEach(l=>{ if(l[3]==='sea') return; top+=`<text x="${l[0]}" y="${l[1]}" class="${l[3]==='town'?'townt':l[3]==='sea'?'seat':'mapt'}" text-anchor="middle">${l[3]==='town'?String(l[2]).toUpperCase():l[2]}</text>`; });
  const [dx,dy]=NET.depot;
  const depotArt=artOn()&&ART.landmarks&&ART.landmarks.depot;
  top+=`<g transform="translate(${dx},${dy})">${depotArt?artPair(depotArt,depotArt.box||[-11,-9,22,18]):'<rect x="-11" y="-9" width="22" height="18" rx="2" class="depot"/>'}<text x="0" y="24" text-anchor="middle" class="lbl2">Depot</text></g>
  <g transform="translate(30,${H-20})"><line x1="0" y1="0" x2="62" y2="0" style="stroke:var(--ink)" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" style="stroke:var(--ink)" stroke-width="2"/><line x1="62" y1="-4" x2="62" y2="4" style="stroke:var(--ink)" stroke-width="2"/><text x="70" y="4" class="lbl2">500 m</text></g>`;
  (d.lakes||[]).forEach(k=>{ if(k[4]) top+=`<text x="${k[0]}" y="${k[1]+4}" class="mapt" text-anchor="middle">${k[4]}</text>`; });
  // a hand-painted island replaces the drawn landscape; its night picture does the darkening, so the night shade comes off
  // (the airport and dock lights stay, so they still go out when their substation loses supply)
  const map=artOn()&&ART.map; let dim=false;
  if(map&&map.day){
    base=artPair(map,[0,0,W,H]);
    if(ART.roads===false) roads='';
    if(map.night){ shade=`<rect width="${W}" height="${H}" class="duskglow"/>`; dim=true; }
    if(ART.labels===false) top=top.replace(/<text [^>]*class="(townt|mapt)"[^>]*>[^<]*<\/text>/g,'');
  }
  blocks(); MAPKEY=NET;
  return MAPSTATIC={base,roads,shade,top,siteLights,dim};
}

function updateWxChip(){
  const el=$('#wxChip'); if(!el) return;
  if(!S||UI.mode!=='play'){ el.hidden=true; return; }
  const w=S.weather, g=windAt(S.t), bits=[];
  if(w&&w.storm&&!w.minor) bits.push(['storm',`🌧 Storm ${w.name} · gusts ${g} mph`]);
  else if(w&&w.thunder){ if(S.t<w.tp+w.width) bits.push(['thunder',`⛈ Thunderstorms${Math.abs(S.t-w.tp)<w.width?' overhead':' later'}`]); }
  else if(w&&w.minor) bits.push(['wind',`💨 Windy · gusts ${g} mph`]);
  if(S.snow) bits.push(['snow','❄ Snow · icy roads']);
  if(S.heat) bits.push(['heat','☀ Heat · 31°C']);
  if(!bits.length){ el.hidden=true; return; }
  el.hidden=false;

function mapBg(edit){

    groups[n].forEach(b=>{ const k=Math.floor(b.x/70)+','+Math.floor(b.y/70); (cells[k]=cells[k]||[]).push(b); });
    Object.values(cells).forEach((bs,i)=>{ const x=bs.reduce((a,b)=>a+b.x,0)/bs.length, y=bs.reduce((a,b)=>a+b.y,0)/bs.length-10;

    if(m.mode==='ping'){ dir=f<0.5?1:-1; f=f<0.5?f*2:2-f*2; }

      g.firstChild.lastChild.setAttribute('transform',`rotate(${ang}) scale(${(1+alt*0.4).toFixed(2)})`);
      return;
    }

// ---------- Play side panel ----------
function costText(sid){
  if(remoteFor(sid)){ const last=S.control.length?S.control[S.control.length-1].tDone:S.t; return `remote · ${Math.round(Math.max(0,last-S.t)+2)} min`; }
  const n=nodeOfSw(sid), i=chooseCrew(n,'op');
  return `${S.crews[i].id} · ~${Math.round(crewEta(i,n,'op'))} min`;
}
function swRow(sid,ctxNode){
  const [cid,e]=sid.split(':'), c=CBL[cid], node=c[e], far=c[other(e)], closed=S.sw[sid];
  const lock=!canOrder(), pend=pendingFor(sid), abn=closed!==!NOPS.has(sid);
  const name=CB[sid]?`CB ${CB[sid].name} to ${N[far].name}`:ctxNode?`To ${N[far].name}`:`At ${N[node].name}`;
  const tag=NOPS.has(sid)?'<span class="tag">NOP</span>':'';
  const btn=locked(node)?`<button class="btn alt" disabled>Locked<small>${S.flooded&&S.flooded[node]?'flooded':'site unsafe'}</small></button>`
    :pend?`<button class="btn alt" disabled>Queued<small>${pend==='control'?'control room':pend}</small></button>`
    :docsOn()&&!closed&&earthed(sid)?`<button class="btn alt" disabled>Interlocked<small>earth applied</small></button>`
    :`<button class="btn${closed?' alt':''}" data-act="op" data-sw="${sid}" data-close="${closed?0:1}" ${lock?'disabled':''}>${closed?'Open':'Close'}<small>${costText(sid)}</small></button>`;
  return `<div class="swrow${S.sel&&S.sel.sw===sid?' hl':''}"><div><div class="swname">${name}${tag}</div>
    <div class="swstate ${closed?'c':'o'}">${closed?'Closed':'Open'} · ${remoteFor(sid)?'remote':'manual'}${abn?' · <span class="abn">abnormal</span>':''}${docsOn()&&earthed(sid)?' · <span class="ert">earthed</span>':''}</div></div>${btn}</div>`;
}
function phaseBar(){
  if(S.scen==='planned'){
    const p=S.planned, cur=S.phase==='closed'?3:!p||p.state==='prep'?(maintWorking()?1:0):2;
    return `<ol class="phases">${['Prepare','Crew working','Normal running'].map((l,i)=>`<li class="${i<cur?'done':i===cur?'now':''}">${l}</li>`).join('')}</ol>`;
  }
  const order=['restore','repair','closed'], cur=order.indexOf(S.phase);
  return `<ol class="phases">${['Restore supply','Repair','Normal running'].map((l,i)=>`<li class="${i<cur||S.phase==='closed'?'done':i===cur?'now':''}">${l}</li>`).join('')}</ol>`;
}
const maintWorking = ()=>S.planned&&S.crews.some(cr=>cr.job&&cr.job.type==='maint'&&cr.job.cable===S.planned.cable&&cr.job.stage==='work');
// status boxes for the special jobs of a shift: planned work, floods, poles, flickers, festivals and street faults
function taskBoxes(){
  let h='';
  const p=S.planned;
  if(p&&S.phase!=='closed'){
    const c=CBL[p.cable], dead=!solve().cab[p.cable], busy=cableBusy(p.cable);
    const st=p.state==='done'?'Maintenance finished. Put the network back to normal.':maintWorking()?'Crew working. Keep the cable switched off.':busy?'Crew on the way.':
      dead?(docsOn()&&!permitOn(p.cable)?'Cable switched out. Earth both ends and issue a permit (select the cable), then hand it over to a crew.':'Cable switched out. Hand it over to a crew.'):S.t<p.from?`Prepare: feed the customers beyond it from a neighbour, then open both ends. Work can start from ${fmtT(p.from)}.`:'Switch the cable out without anyone losing power.';
    h+=`<div class="taskbox"><b>Planned work</b><button class="linkbtn" data-act="selc" data-c="${p.cable}">${cableName(c)}</button> · window ${fmtT(p.from)}–${fmtT(p.to)}<p>${st}</p>
      ${p.state==='prep'&&dead&&!busy?`<button class="btn wide" data-act="maint" data-c="${p.cable}" ${canOrder()?'':'disabled'}>Hand over to a crew for maintenance<small>about 3 hours</small></button>`:''}</div>`;
  }
  const f=S.flood;
  if(f&&S.phase!=='closed'){
    const n=f.node, mins=Math.round(f.at-S.t);
    const st=f.state==='warned'?(solve().island[n]!=null?`<span class="trip">Still live.</span> Water expected in ${mins>0?mins+' min':'moments'} (${fmtT(f.at)}). Switch it off and feed the substations beyond it from elsewhere.`:`Switched off safely. Water expected at ${fmtT(f.at)}.`)
      :f.state==='flooded'?`Under water but safe. Expected to recede around ${fmtT(f.until)}.`:f.state==='damaged'?`Wrecked by flood water. Wait for it to recede (around ${fmtT(f.until)}), then rebuild.`
      :f.state==='receded'?'The water has gone. Send a crew to rebuild the switchgear.':'Clear. It can be switched back on.';
    h+=`<div class="taskbox ${f.state==='warned'?'urgent':''}"><b>Flood warning</b><button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button><p>${st}</p></div>`;
  }
  // work requests from other teams
  (S.works||[]).forEach(w=>{
    if(w.state!=='prep'&&!(w.state==='done'&&S.t-w.doneAt<60)) return;
    const c=CBL[w.cable], K=WORK_KINDS[w.kind], dead=!solve().cab[w.cable], busy=cableBusy(w.cable);
    const working=S.crews.some(cr=>cr.job&&cr.job.type==='maint'&&cr.job.cable===w.cable&&cr.job.stage==='work');
    const st=w.state==='done'?'Finished. Put the cable back into service.':working?'Team working. Keep it switched off.':busy?'Crew on the way.':dead?(docsOn()&&!permitOn(w.cable)?'Switched out. Earth both ends and issue a permit (select the cable), then hand it over to the team.':'Switched out. Hand it over to the team.'):`Feed the customers beyond it from a neighbour, then open both ends. Must start by ${fmtT(w.to)}.`;
    h+=`<div class="taskbox"><b>Work request · ${K.label}</b><button class="linkbtn" data-act="selc" data-c="${w.cable}">${cableName(c)}</button> · ${fmtT(w.from)}–${fmtT(w.to)} · about ${fmtH(w.mins)}<p>${st}</p>
      ${w.state==='prep'&&dead&&!busy?`<button class="btn wide" data-act="maint" data-c="${w.cable}" ${canOrder()?'':'disabled'}>Hand over for ${K.label.toLowerCase()}<small>about ${fmtH(w.mins)} · earns £${fmtN(WORK_CREDIT)}</small></button>`:''}</div>`;
  });
  const pl=S.pole;
  if(pl&&!pl.done&&S.phase!=='closed'){
    const mins=Math.max(0,Math.ceil(pl.deadline-S.t));
    h+=`<div class="taskbox urgent"><b>Police deadline: ${mins} min</b>Car versus pole on <button class="linkbtn" data-act="selc" data-c="${pl.cable}">${cableName(CBL[pl.cable])}</button>.<p>Open the switches at both ends before ${fmtT(pl.deadline)}.</p></div>`;
  }
  const d=S.dev;
  if(d&&!d.fixed&&!d.failed&&S.phase!=='closed')
    h+=`<div class="taskbox"><b>Flickering lights</b>Reports from around <button class="linkbtn" data-act="seln" data-n="${d.node}">${N[d.node].name}</button>.<p>One of its cables is failing. Switch suspects out one at a time and test them${S.tested[d.cable]==='fault'?'. <b style="display:inline;color:inherit;font:inherit;text-transform:none;letter-spacing:0">Found it:</b> repair it before it fails.':'.'}</p></div>`;
  const fe=S.festival;
  if(fe&&S.phase!=='closed'){
    const live=S.t>=fe.from&&S.t<fe.to;
    h+=`<div class="taskbox${S.festFail?' urgent':''}"><b>Port Ampere Festival</b><button class="linkbtn" data-act="seln" data-n="${fe.node}">${N[fe.node].name}</button> · ${fmtT(fe.from)}–${fmtT(fe.to)}<p>${S.festFail?'The stage lost power. The mayor is not happy.':live?`On stage now, adding ${fe.amps} A to the circuit.`:S.t<fe.from?`Starts at ${fmtT(fe.from)}, adding ${fe.amps} A.`:'Finished.'}</p></div>`;
  }
  const lv=RMUS.filter(n=>S.lvFault[n]);
  if(lv.length) h+=`<div class="taskbox"><b>Street faults</b>${lv.map(n=>`<button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button>`).join(', ')}<p>The 11 kV network is fine. Send a crew to fix the low-voltage fault.</p></div>`;
  const fl=RMUS.filter(n=>S.flooded[n]==='damaged'&&(!S.flood||S.flood.state==='receded'));
  if(fl.length&&!f) h+=`<div class="taskbox"><b>Rebuild</b>${fl.map(n=>N[n].name).join(', ')}</div>`;
  if(S.ctx&&S.ctx.type==='career'&&S.cost){ const m=shiftMoney(); h+=`<p class="note budget">Shift budget: <b>${money(m.spent)}</b> of ${money(m.budget)} spent so far${m.spent>m.budget?' <span class="trip">over budget</span>':''}.</p>`; }
  return h;
}
// crews standing by for a permit, and the paperwork still to finish before normal running
const waitingCrews = ()=>S.crews.filter(cr=>cr.job&&cr.job.stage==='wait'&&cr.job.waitFor!=='veg');

function incidentPanel(){
  const sh=SHIFTS.find(x=>x.id===S.shift);

  if(thefts.length) h+=`<div class="alertbox"><b>Unsafe after copper theft:</b> ${thefts.map(n=>`<button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button>`).join(', ')}. Send a crew to make ${thefts.length===1?'it':'them'} safe.</div>`;

  if(S.phase==='restore'){
    h+=`<details class="howto" ${S.shift==='s1'?'open':''}><summary>How to restore supply</summary><ol class="steps"><li><b>Locate.</b> Fault passage indicators (flags) trip between the breaker and the fault. Remote sites report straight away. Manual sites need a crew to read them.</li>
      <li><b>Isolate.</b> Open the switches at <i>both</i> ends of the faulty cable.</li>
      <li><b>Restore.</b> Close the breaker, and close normally open points (NOPs) to back-feed from another feeder. Watch the feeder loading.</li></ol>
      <p class="note">Interruptions of 3 minutes or more count towards CI. Pause the clock with the space bar to plan, then queue orders and let it run.</p></details>`;
  }

    h+=`<div class="calls"><b>Customer calls:</b> ${fmtN(callsRecent())} in the last 15 minutes, ${fmtN(S.callsTotal)} since ${fmtT(S.t0)}.
      <span class="muted">Busiest: ${top.map(a=>`${a} (${fmtN(S.callArea[a])})`).join(', ')}</span></div>`;
  }
  if(S.phase==='restore'){
  } else if(S.phase==='planned'){

    if(abn.length&&S.planned&&S.planned.state==='done') h+=`<h3 style="margin-top:14px">Switches out of normal position (${abn.length})</h3><ul class="todo">`+
      abn.map(sid=>`<li><button class="linkbtn" data-act="selsw" data-sw="${sid}">${switchLabel(sid)}</button> <span class="muted">should be ${NOPS.has(sid)?'open':'closed'}</span></li>`).join('')+'</ul>';
  } else if(S.phase==='repair'){
    const found=S.faults.filter(f=>f.active&&S.tested[f.cable]==='fault');
    const hidden=S.faults.filter(f=>f.active&&S.tested[f.cable]!=='fault').length;
    const abn=Object.keys(S.sw).filter(k=>S.sw[k]!==!NOPS.has(k));
    h+=`<p class="note">Everyone is back on. Now repair the damage and put the network back to its normal running arrangement.${docsOn()?' Before a crew can repair a cable, earth it at both ends and issue a permit to work. Afterwards, cancel the permit and remove the earths before switching it back on.':''}</p><ul class="todo">`;
    found.forEach(f=>{ h+=`<li>Repair: <button class="linkbtn" data-act="selc" data-c="${f.cable}">${cableName(CBL[f.cable])}</button></li>`; });
    if(hidden) h+=`<li>${plural(hidden,'faulty cable')} not yet located. Test the dead sections to find ${hidden===1?'it':'them'}.</li>`;
    if(!found.length&&!hidden) h+='<li>All faults repaired ✓</li>';

      h+=`<h3 style="margin-top:14px">Switches out of normal position (${abn.length})</h3><ul class="todo">`+

    h+=`<p class="note">Incident closed at ${fmtT(S.closedAt)}.</p><button class="btn wide" data-act="home">Back to the control room</button>`;

// the node panel's extra jobs: street faults, flood rebuilds and welfare visits
function nodeExtras(n){
  let h='';
  const est=type=>{ const i=chooseCrew(n,type); return `${S.crews[i].id} · ~${Math.round(crewEta(i,n,type))} min`; };
  if(S.lvFault[n]) h+=`<div class="alertbox"><b>Street fault.</b> The 11 kV network here is fine, but a low-voltage cable or fuse in the street has failed.</div>
    <button class="btn wide" data-act="lvfix" data-n="${n}" ${!canOrder()||nodeJobBusy(n,'lvfix')?'disabled':''}>Fix the street fault<small>${nodeJobBusy(n,'lvfix')?'crew already assigned':est('lvfix')}</small></button>`;
  if(S.flooded[n]){
    const ready=S.flooded[n]==='damaged'&&S.flood&&S.flood.state==='receded';
    h+=`<div class="alertbox"><b>${S.flooded[n]==='damaged'?'Flood damage.':'Under water.'}</b> ${S.flooded[n]==='damaged'?'The switchgear was live when the water came in and is wrecked.':'It was switched off in time and will dry out once the water goes down.'} It is locked out until then.</div>`;
    if(S.flooded[n]==='damaged') h+=`<button class="btn wide" data-act="rebuild" data-n="${n}" ${!canOrder()||!ready||nodeJobBusy(n,'rebuild')?'disabled':''}>Rebuild the switchgear<small>${!ready?'wait for the water to go down':nodeJobBusy(n,'rebuild')?'crew already assigned':est('rebuild')}</small></button>`;
  }
  // mobile generator: status if one is assigned, otherwise the hire button (or why it can't help)
  const g=genAt(n);
  if(g) h+=`<div class="genbox"><b>Generator ${g.id}</b>${genStatus(g)}${g.stage==='on'?`<br><span class="muted">Disconnects automatically when mains supply returns.</span>`:''}
    <button class="btn alt" data-act="gen-home" data-id="${g.id}" ${canOrder()?'':'disabled'}>Send it back to the depot</button></div>`;
  else if(!S.on[n]){
    const why=genBlock(n);
    if(!why) h+=`<button class="btn wide gen" data-act="gen" data-n="${n}" ${canOrder()?'':'disabled'}>Hire a mobile generator<small>£${fmtN(GEN.hire)} + £${GEN.hourly}/h · on supply about ${fmtT(S.t+genEta(n)+GEN.setup)}</small></button>`;
    else h+=`<p class="note">Mobile generator: not possible here, ${why}.</p>`;
  }

}

function stars(st){
  const lim=['storm','bigstorm','mixed'].includes(S.scen)?[40,90]:S.scen==='theft'||S.scen==='digin'?[30,60]:[20,45], avg=st.cml/Math.max(1,st.affected);
  // safety incidents count even if they happen after everyone is back on (most permit work does)
  let s=avg<=lim[0]?3:avg<=lim[1]?2:1; if(st.safety||S.safety) s--; if(st.overloads) s--; if(st.rep!=null&&st.rep<50) s--;
  if((st.hints||st.undos)&&S.diff!=='trainee') s--;   // the exact-move hint and undo each cost a star (free for trainees)
  return {s:Math.max(0,s),avg,lim};
}

function validate(){
  const err=[], warn=[], ids=Object.keys(N);
  if(!PRIMS.length) err.push('Add at least one primary substation.');
  if(!RMUS.length) err.push('Add at least one substation with customers.');
  CABLES.forEach(c=>{ if(N[c.a].kind==='primary'&&N[c.b].kind==='primary') err.push(`${cableName(c)} joins two primaries. Delete it.`); });
  const adj={}; ids.forEach(k=>adj[k]=[]); CABLES.forEach(c=>{adj[c.a].push(c.b);adj[c.b].push(c.a);});
  const seen=new Set(PRIMS), q=[...PRIMS];
  while(q.length){ const n=q.shift(); adj[n].forEach(m=>{ if(!seen.has(m)){seen.add(m);q.push(m);} }); }
  RMUS.forEach(n=>{ if(!seen.has(n)) err.push(`${N[n].name} has no cable route to a primary.`); });
  if(!FAULTABLE.length&&RMUS.length) err.push('Add some cables that can develop faults.');
  const sw=normalSw(), sol=solve(sw);
  sol.islands.forEach(isl=>{ const ps=[...new Set(isl.cbs.map(cb=>CB[cb].prim))]; if(ps.length>1) err.push(`In normal running ${ps.map(p=>N[p].name).join(' and ')} are connected. Add a normally open point between them.`); });
  RMUS.forEach(n=>{ if(seen.has(n)&&sol.island[n]==null) warn.push(`${N[n].name} is off supply in normal running. Check the normally open points.`); });
  CBIDS.forEach(id=>{ const a=cbLoad(sol,id,1); if(a>CB[id].rating) warn.push(`${CB[id].name} ${CB[id].feeder} carries ${Math.round(a)} A against a ${CB[id].rating} A rating at the evening peak.`); });
  const codes={}; RMUS.forEach(n=>{ const c=N[n].code; if(c){ if(codes[c]) warn.push(`Code ${c} is used twice.`); codes[c]=1; } });
  return {err,warn};
}

function svgPoint(evt){

  return [Math.max(20,Math.min(d.w-20,Math.round(r.x/g)*g)),Math.max(20,Math.min(d.h-20,Math.round(r.y/g)*g))];
}
function uid(prefix,taken){ let i=1; while(taken[prefix+i]) i++; return prefix+i; }
function addNode(kind,p){
  const d=E.def, id=uid(kind==='prim'?'P':'R',d.nodes);
  if(kind==='prim') d.nodes[id]={name:'New Primary',kind:'primary',s:p.slice(),m:p.slice()};
  else{
    const used=new Set(Object.values(d.nodes).map(n=>n.code)); let k=1; while(used.has('R'+k)) k++;
    d.nodes[id]={code:'R'+k,name:'Substation R'+k,cust:300,s:p.slice(),m:p.slice()};
  }
  E.sel={k:'node',id};
}
function addCable(a,b){
  const d=E.def;
  if(d.nodes[a].kind==='primary'&&d.nodes[b].kind==='primary'){ toast('Primaries connect to substations, not to each other.'); return; }
  if(d.cables.some(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a))){ toast('Those two are already connected.'); return; }
  if(d.nodes[b].kind==='primary') [a,b]=[b,a];
  const taken={}; d.cables.forEach(c=>taken[c.id]=1);
  const c={id:uid('K',taken),a,b};
  if(d.nodes[a].kind==='primary') c.rating=400;
  d.cables.push(c); E.sel={k:'cable',id:c.id};
}
function delNode(id){ const d=E.def; delete d.nodes[id]; d.cables=d.cables.filter(c=>c.a!==id&&c.b!==id); E.sel=null; }
function delCable(id){ const d=E.def; d.cables=d.cables.filter(c=>c.id!==id); E.sel=null; }
function moveNode(id,dx,dy){
  const d=E.def, n=d.nodes[id], vk=UI.view==='s'?'s':'m', pk=vk==='s'?'sp':'mp';
  n[vk]=[n[vk][0]+dx,n[vk][1]+dy];

    if(c.a===id) c[pk][0]=[c[pk][0][0]+dx,c[pk][0][1]+dy];
    if(c.b===id){ const L=c[pk].length-1; c[pk][L]=[c[pk][L][0]+dx,c[pk][L][1]+dy]; }
  });
  if(vk==='m') BLOCKS=null;
}
function editPointerDown(e){
  const el=e.target.closest('[data-k]'), k=el&&el.dataset.k, id=el&&el.dataset.id, p=svgPoint(e);
  let panel=true;
  switch(E.tool){
    case 'select':

      else if(k==='cable') E.sel={k:'cable',id};

      else E.sel=null;
      break;
    case 'sub': case 'prim':
      if(k==='node') E.sel={k:'node',id}; else if(!k) addNode(E.tool,p);
      break;
    case 'cable':
      if(k==='node'){ if(!E.pend) E.pend=id; else if(E.pend===id) E.pend=null; else { addCable(E.pend,id); E.pend=null; } }
      else E.pend=null;

let dragRaf=0;
function editDrag(e){

function normalizeDef(d){
  if(!d||typeof d!=='object'||!d.nodes||typeof d.nodes!=='object'||!Array.isArray(d.cables)) throw new Error('That isn\'t an Open Point network. It needs "nodes" and "cables".');
  const num=v=>typeof v==='number'&&isFinite(v);
  const pt=p=>Array.isArray(p)&&p.length===2&&num(p[0])&&num(p[1])?[p[0],p[1]]:null;
  const line=l=>Array.isArray(l)&&l.length>=2&&l.every(pt)?l.map(pt):null;
  const SIZES={1000:560,1500:800,1600:900}, w=SIZES[d.w]?d.w:1000;
  const out={name:clean(d.name||'Imported network',40)||'Imported network',w,h:SIZES[w],nodes:{},cables:[]};
  if(d.dwg) out.dwg=clean(d.dwg,24);
  out.depot=pt(d.depot)||[60,out.h-50];
  if(Array.isArray(d.mlDefault)&&num(d.mlDefault[0])&&num(d.mlDefault[1])&&['start','middle','end'].includes(d.mlDefault[2])) out.mlDefault=d.mlDefault.slice(0,3);
  Object.keys(d.nodes).forEach(k=>{
    const n=d.nodes[k], id=clean(k,12).replace(/[^A-Za-z0-9_-]/g,'');
    if(!id||!n||!pt(n.s)||!pt(n.m)) return;
    const o={name:clean(n.name||id,32)||id,s:pt(n.s),m:pt(n.m)};
    if(n.kind==='primary') o.kind='primary';
    else{
      o.code=clean(n.code||'',4); o.cust=Math.max(0,Math.min(5000,Math.round(+n.cust||0)));
      if(n.remote) o.remote=true;
      if(n.area) o.area=clean(n.area,24);
      if(n.hospital) o.hospital=clean(n.hospital,40);
      if(n.site&&n.site.name) o.site={name:clean(n.site.name,40),off:clean(n.site.off||n.site.name+' loses power',80),back:clean(n.site.back||n.site.name+' back on',80)};
      if(['b','bl','br','r','l'].includes(n.sl)) o.sl=n.sl;
      if(n.note) o.note=clean(n.note,120);
    }
    if(Array.isArray(n.ml)&&num(n.ml[0])&&num(n.ml[1])&&['start','middle','end'].includes(n.ml[2])) o.ml=n.ml.slice(0,3);
    out.nodes[id]=o;
  });
  const taken={};
  d.cables.forEach(c=>{
    if(!c||!out.nodes[c.a]||!out.nodes[c.b]||c.a===c.b) return;
    let id=clean(c.id||'',12).replace(/[^A-Za-z0-9_-]/g,''); if(!id||taken[id]) id=uid('K',taken); taken[id]=1;
    const o={id,a:c.a,b:c.b};
    if(c.nop==='a'||c.nop==='b') o.nop=c.nop;
    if(c.oh) o.oh=true;
    if(num(c.rating)) o.rating=Math.max(50,Math.min(1000,Math.round(c.rating)));
    if(c.feeder) o.feeder=clean(c.feeder,20);
    if(line(c.sp)) o.sp=line(c.sp);
    if(line(c.mp)) o.mp=line(c.mp);
    out.cables.push(o);
  });
  if(d.decor&&typeof d.decor==='object'){
    const dc={};
    if(typeof d.decor.river==='string'&&/^[0-9MCSLQZmcslqz ,.\-]+$/.test(d.decor.river)) dc.river=d.decor.river.slice(0,400);
    if(typeof d.decor.coast==='string'&&/^[0-9MCSLQZmcslqz ,.\-]+$/.test(d.decor.coast)) dc.coast=d.decor.coast.slice(0,2000);
    if(Array.isArray(d.decor.hills)) dc.hills=d.decor.hills.filter(k=>Array.isArray(k)&&k.slice(0,4).every(num)).map(k=>k.slice(0,4));
    if(Array.isArray(d.decor.parks)) dc.parks=d.decor.parks.filter(p=>Array.isArray(p)&&p.slice(0,4).every(num)).map(p=>[p[0],p[1],p[2],p[3],clean(p[4]||'',30)]);
    if(Array.isArray(d.decor.labels)) dc.labels=d.decor.labels.filter(l=>Array.isArray(l)&&num(l[0])&&num(l[1])).map(l=>l[3]==='town'||l[3]==='sea'?[l[0],l[1],clean(l[2]||'',30),l[3]]:[l[0],l[1],clean(l[2]||'',30)]);
    if(Array.isArray(d.decor.roads)) dc.roads=d.decor.roads.map(line).filter(Boolean);
    if(Array.isArray(d.decor.landmarks)) dc.landmarks=d.decor.landmarks.filter(l=>Array.isArray(l)&&num(l[0])&&num(l[1])&&LANDMARK[l[2]]).map(l=>[l[0],l[1],l[2]]);
    if(d.decor.cableRoads===false) dc.cableRoads=false;
    const idOk=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,12}$/.test(v);
    if(d.decor.airport&&pt(d.decor.airport.c)) dc.airport={c:pt(d.decor.airport.c),a:num(d.decor.airport.a)?d.decor.airport.a:0,node:idOk(d.decor.airport.node)?d.decor.airport.node:''};
    if(d.decor.harbour&&num(d.decor.harbour.x0)&&num(d.decor.harbour.x1)&&Array.isArray(d.decor.harbour.piers))
      dc.harbour={x0:d.decor.harbour.x0,x1:d.decor.harbour.x1,piers:d.decor.harbour.piers.filter(num).slice(0,6),node:idOk(d.decor.harbour.node)?d.decor.harbour.node:''};
    if(Array.isArray(d.decor.lakes)) dc.lakes=d.decor.lakes.filter(k=>Array.isArray(k)&&k.slice(0,4).every(num)).map(k=>[k[0],k[1],k[2],k[3],clean(k[4]||'',30)]);

let AC=null, windGain=null;
function audio(){

// every sound is scaled by its category's volume (set at the start of sfx)
let SFXK=1;
function tone(ac,f,t0,dur,type,vol){ vol=Math.max(0.0002,vol*SFXK); const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+dur+.05); }
function noise(ac,t0,dur,vol,freq){
  const b=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); s.buffer=b; f.type='lowpass'; f.frequency.value=freq; g.gain.value=vol*SFXK;

}
// an alarm makes its own sound only if the event that raised it hasn't just made one
function alarmSound(kind){ if(performance.now()-(UI.lastSfx||0)<600) return; sfx(kind==='bad'?'alarmHi':'alarmLo'); }
function sfx(kind){
  UI.lastSfx=performance.now();
  SFXK=['alarm','alarmHi','alarmLo','phone'].includes(kind)?vol('alarms'):vol('effects');
  if(SFXK<=0) return;
  const ac=audio(); if(!ac) return; const t=ac.currentTime;
  try{
    if(kind==='alarmHi'){ [0,.18].forEach(d=>tone(ac,988,t+d,.12,'triangle',.07)); return; }
    if(kind==='alarmLo'){ tone(ac,587,t,.22,'sine',.06); return; }
    if(kind==='trip'){ noise(ac,t,.3,.6,700); tone(ac,62,t,.4,'sine',.4); }
    else if(kind==='click'){ noise(ac,t,.06,.3,2600); }
    else if(kind==='alarm'){ [0,.34,.68].forEach(d=>{ tone(ac,880,t+d,.15,'square',.05); tone(ac,660,t+d+.17,.15,'square',.05); }); }
    else if(kind==='phone'){ [0,.55].forEach(d=>{ tone(ac,440,t+d,.4,'sine',.06); tone(ac,480,t+d,.4,'sine',.06); }); }
    else if(kind==='chime'){ [523,659,784,1047].forEach((f,i)=>tone(ac,f,t+i*.11,.6,'sine',.08)); }

}
// a soft rushing wind during storms, louder as the gusts build
function updateWind(){
  const on=S&&S.weather&&S.weather.storm&&!S.paused&&UI.mode==='play'&&!UI.overlay;
  if(!on){ if(windGain) windGain.gain.value=0; return; }
  const ac=audio(); if(!ac){ if(windGain) windGain.gain.value=0; return; }
  if(!windGain){
    const len=ac.sampleRate*2, b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; }
    const s=ac.createBufferSource(), f=ac.createBiquadFilter(); s.buffer=b; s.loop=true; f.type='bandpass'; f.frequency.value=420;

// ---------- Plain English and the glossary ----------
const GLOSS=[
  ['normally open point','spare link','A switch kept open on purpose where two circuits meet. Close it to let one circuit feed the other\'s customers.'],
  ['NOP','spare link','Normally open point: a switch kept open on purpose where two circuits meet. Close it to let one circuit feed the other\'s customers.'],
  ['fault passage indicator','fault flag','A flag at a substation that trips when fault current passes through it. The fault is beyond the last red flag.'],
  ['FPI','fault flag','Fault passage indicator: a flag that trips when fault current passes through it. The fault is beyond the last red flag.'],
  ['back-feed','feed from next door','Supplying customers from a neighbouring circuit through a spare link, after the faulty part has been cut off.'],
  ['ring main unit','street substation','The set of switches at a local substation. Each switch connects it to the cable going one way or the other.'],
  ['primary substation','main substation','Where the network steps down to 11,000 volts and each circuit starts with its own breaker.'],
  ['primary','main substation','Where the network steps down to 11,000 volts and each circuit starts with its own breaker.'],
  ['Feeder loading','Circuit loading','How much current each circuit is carrying compared with what its breaker allows.'],
  ['feeder','circuit','One 11,000 volt circuit leaving a main substation through a chain of street substations. Each has a breaker and a maximum load.'],
  ['CML','customer minutes lost','Customer minutes lost: customers off multiplied by minutes off. The main measure of disruption.'],
  ['CI','interruptions','Customer interruptions: customers who lost power for 3 minutes or more.'],
  ['overcurrent','overload','More current than a circuit is built to carry.'],
  ['transient','temporary','A fault that clears by itself, like a branch brushing a line. Switching back on works.'],
  ['earth fault protection','fault protection','Equipment that spots current leaking to the ground and trips the breaker in a fraction of a second.'],
  ['energised','switched on','Connected to a supply.'],
  ['interconnector','link cable','A cable joining two circuits, normally left open at one end.'],
  ['permit to work','work permit','A safety document the control engineer issues once a cable is switched off at both ends and earthed. Nobody may work on the cable without one, and it must be cancelled before the earths come off.'],
  ['earths','safety earths','Heavy connections from a switched-off cable to the ground, applied at each end. If the cable were switched on by mistake, the current would go to ground instead of through the people working on it.'],
  ['flashover','flashover','What happens when power is switched onto an earthed cable: a huge current straight to ground, a bang and a tripped breaker.'],
  ['abnormal','not in normal position','A switch left in a different position from usual, for example a spare link that has been closed.'],
];
const GLOSS_RE=new RegExp('\\b('+GLOSS.map(g=>g[0].replace(/[.*+?^${}()|[\]\\-]/g,'\\$&')).join('|')+')\\b','gi');
const glossOf=m=>GLOSS.find(g=>g[0].toLowerCase()===m.toLowerCase());
// walk the text of a panel: swap jargon for plain words if asked, and underline each term with an explanation on hover
function decorate(root){
  if(!root) return;
  const plain=UI.settings.plain, nodes=[], w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){ const n=w.currentNode, p=n.parentElement; if(!p||p.closest('.term,script,style,textarea,input,select,option,svg')) continue; if(GLOSS_RE.test(n.nodeValue)) nodes.push(n); GLOSS_RE.lastIndex=0; }
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment(), s=n.nodeValue; let last=0, m;
    GLOSS_RE.lastIndex=0;
    while((m=GLOSS_RE.exec(s))){
      const g=glossOf(m[0]); if(!g) continue;
      if(g[0]===g[0].toUpperCase()&&m[0]!==g[0]) continue;   // acronyms must match their case
      frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const sp=document.createElement('span'); sp.className='term'; sp.dataset.tip=g[2];
      let txt=plain?g[1]:m[0]; if(plain&&m[0][0]===m[0][0].toUpperCase()&&m[0]!==m[0].toUpperCase()) txt=txt[0].toUpperCase()+txt.slice(1);
      sp.textContent=txt; frag.appendChild(sp); last=m.index+m[0].length;
    }
    frag.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(frag,n);
  });
}
function decorateAll(){ ['#panel','#boardSec','#objSec','#loadsH','#crewSec','#log','#newsSec','#wxSec','#legend','.bar .stats','#overlay','#coach'].forEach(s=>document.querySelectorAll(s).forEach(decorate)); }

// ---------- Switch previews ----------
function previewOp(sid,close){
  const res={sid,close,gain:[],lose:[],loads:[],risk:[],trip:false,block:null};
  if(locked(nodeOfSw(sid))){ res.block='this site is unsafe after the theft'; return res; }
  if(close){ const b=parallelBlock(sid); if(b){ res.block=b; return res; } }
  if(close&&docsOn()&&earthed(sid)){ res.block='its earth is on, and the switch is interlocked with it'; return res; }
  const sw2=Object.assign({},S.sw); sw2[sid]=close;
  const s0=solve(), s1=solve(sw2);
  RMUS.forEach(n=>{ if(S.lvOut[n]) return; const a=s0.island[n]!=null, b=s1.island[n]!=null; if(!a&&b) res.gain.push(n); if(a&&!b) res.lose.push(n); });
  CBIDS.forEach(id=>{ if(!sw2[id]) return; const a0=S.sw[id]?cbLoad(s0,id):0, a1=cbLoad(s1,id); if(Math.abs(a1-a0)>0.5||a1>rat(id)) res.loads.push({id,a:a1,r:rat(id)}); });
  const anyFault=S.faults.some(f=>f.active);
  CABLES.forEach(c=>{
    if(s0.cab[c.id]||!s1.cab[c.id]) return;
    const t=S.tested[c.id];
    if(t==='fault'&&faultOn(c.id)) res.trip=true;
    else if(anyFault&&t!=='healthy'&&t!=='repaired') res.risk.push(c.id);
  });
  // earths are known to the control room, so this warning is always exact
  if(docsOn()) res.flash=CABLES.filter(c=>!s0.cab[c.id]&&s1.cab[c.id]&&cableEarthed(c.id)).map(c=>c.id);
  // trainees get the true answer
  if(S.diff==='trainee'){ res.trip=res.trip||S.faults.some(f=>f.active&&!(f.transient&&f.trips>0)&&!s0.cab[f.cable]&&s1.cab[f.cable]); res.risk=[]; }
  return res;
}
const custSum = ns=>ns.reduce((a,n)=>a+N[n].cust,0);
function showPreview(sid,close){

    if(r.lose.length) h+=`<div class="pv-bad">−${fmtN(custSum(r.lose))} customers lose power (${r.lose.slice(0,3).map(n=>N[n].name).join(', ')}${r.lose.length>3?'…':''})</div>`;

// ---------- Hints ----------
// Everything here uses the true state of the network, so hints are always right.
function simSw(sw2){
  const s0=solve(), s1=solve(sw2);
  const trip=S.faults.some(f=>f.active&&!(f.transient&&f.trips>0)&&s1.cab[f.cable]&&!s0.cab[f.cable]);
  const over=CBIDS.some(id=>sw2[id]&&cbLoad(s1,id)>rat(id)+0.01);
  // two primaries tied together, either inside one island or across a closed cable between two islands
  const primOf=k=>CB[s1.islands[k].cbs[0]].prim;
  const par=s1.islands.some(isl=>new Set(isl.cbs.map(cb=>CB[cb].prim)).size>1)
    ||CABLES.some(c=>{ if(!sw2[c.id+':a']||!sw2[c.id+':b']) return false; const ia=s1.island[c.a], ib=s1.island[c.b]; return ia!=null&&ib!=null&&ia!==ib&&primOf(ia)!==primOf(ib); });

  const flash=docsOn()&&CABLES.some(c=>s1.cab[c.id]&&cableEarthed(c.id));

const usable = sid=>!pendingFor(sid)&&!locked(nodeOfSw(sid))&&!(docsOn()&&earthed(sid));

    const c=CBL[cid], closed=['a','b'].map(e=>cid+':'+e).filter(s=>sw[s]&&usable(s));
    for(const s of closed){ const s2=Object.assign({},sw); s2[s]=false; const r=simSw(s2); if(r.lose===0) return {text:`Open the ${switchLabel(s)}.`,sw:s,close:false}; }
    const opens=Object.keys(sw).filter(s=>!sw[s]&&usable(s));
    for(const x of opens){ const s1=Object.assign({},sw); s1[x]=true; const r1=simSw(s1); if(!r1.ok) continue;
      for(const s of closed){ const s2=Object.assign({},s1); s2[s]=false; if(simSw(s2).lose===0) return {text:`First close the ${switchLabel(x)} so the far side has another supply, then open the ${switchLabel(s)}.`,sw:x,close:true}; } }

      const d=docsStep(cid); if(d&&d.wait) return docsWait(cid); if(d) return {nudge:`You have found the failing cable. ${docsNudge}`,focus:{nodes:[],cables:[cid]},move:d};
      return {nudge:'You have found the failing cable. Repair it before it breaks down.',focus:{nodes:[],cables:[cid]},move:{text:`Repair ${cableName(CBL[cid])}.`,kind:'repair',id:cid}}; } }
    else if(!deadCable(cid)){ const m=isolateMove(cid); if(m) return {nudge:`One of the cables near ${N[S.dev.node].name} is failing. Switch it out safely so it can be tested.`,focus:{nodes:[S.dev.node],cables:[cid]},move:m}; }
    else if(!cableBusy(cid)) return {nudge:'The suspect cable is switched out. Test it.',focus:{nodes:[],cables:[cid]},move:{text:`Test ${cableName(CBL[cid])}.`,kind:'test',id:cid}};
  }
  // 1. a known or unknown fault that is not yet cut off at both ends
  for(const f of active){
    const c=CBL[f.cable], closed=['a','b'].map(e=>c.id+':'+e).filter(sid=>sw[sid]&&usable(sid));
    if(!closed.length) continue;
    closed.sort((x,y)=>remoteFor(y)-remoteFor(x));
    const known=S.tested[f.cable]==='fault';
    return {
      nudge:known?'You know where the damage is. Cut it off at both ends before switching anything back on.'
                 :'Follow the fault flags along the circuit that tripped. The fault is past the last red flag and before the first white one. Flags showing "?" need a crew to read them.',
      focus:{nodes:ends(c),cables:[c.id]},
      move:{text:`Open the ${switchLabel(closed[0])}.`,sw:closed[0],close:false}
    };
  }
  // 2. a single switch that brings customers back safely
  const opens=Object.keys(sw).filter(sid=>!sw[sid]&&usable(sid));
  let best=null;
  // switches that go back to their normal position win ties, so restoring never undoes a return to normal
  opens.forEach(sid=>{ const s2=Object.assign({},sw); s2[sid]=true; const r=simSw(s2); if(r.ok&&r.gain>0&&r.lose===0){ const score=r.gain+(remoteFor(sid)?50:0)+(NOPS.has(sid)?0:1000); if(!best||score>best.score) best={sid,score,gain:r.gain}; } });
  if(best) return {
    nudge:'Some customers can be fed from a neighbouring circuit, or from their own breaker, now that the fault is cut off.',
    focus:{nodes:[nodeOfSw(best.sid)],cables:[best.sid.split(':')[0]]},
    move:{text:`Close the ${switchLabel(best.sid)} to bring back ${fmtN(best.gain)} customers.`,sw:best.sid,close:true}
  };
  // a healthy cable switched out at both ends: closing both ends brings customers back
  for(const c of CABLES){
    const ea=c.id+':a', eb=c.id+':b';
    if(sw[ea]||sw[eb]||!usable(ea)||!usable(eb)||NOPS.has(ea)||NOPS.has(eb)||active.some(f=>f.cable===c.id)) continue;
    const s2=Object.assign({},sw); s2[ea]=true; s2[eb]=true; const r=simSw(s2);
    if(r.ok&&r.gain>0&&r.lose===0){ const first=solve().island[c.a]!=null||N[c.a].kind==='primary'?ea:eb;
      return {nudge:'A healthy cable is switched out at both ends. Put it back into service to bring customers back.',focus:{nodes:[c.a,c.b].filter(n=>N[n].kind!=='primary'),cables:[c.id]},
        move:{text:`Close the ${switchLabel(first)}, then the ${switchLabel(first===ea?eb:ea)} (${fmtN(r.gain)} customers back).`,sw:first,close:true}}; }
  }
  // 3. a split: open one point, then close another, when one neighbour can't take everyone
  let pair=null;
  Object.keys(sw).filter(sid=>sw[sid]&&!CB[sid]&&usable(sid)).forEach(a=>{
    const s1=Object.assign({},sw); s1[a]=false;
    opens.forEach(b=>{ if(b===a) return; const s2=Object.assign({},s1); s2[b]=true; const r=simSw(s2); const net=r.gain-r.lose; if(r.ok&&net>0&&(!pair||net>pair.net)) pair={a,b,net}; });
  });
  if(pair) return {
    nudge:'No single switch helps any more. Try splitting a circuit so two neighbours share the load.',
    focus:{nodes:[nodeOfSw(pair.a),nodeOfSw(pair.b)],cables:[pair.a.split(':')[0],pair.b.split(':')[0]]},
    move:{text:`First open the ${switchLabel(pair.a)}, then close the ${switchLabel(pair.b)} (about ${fmtN(pair.net)} more customers back).`,sw:pair.a,close:false}
  };
  // keep customers informed: a restoration time for every area that's been off a while, and a fresh one when it's missed
  const oaH=offByArea(), etrA=Object.keys(oaH).sort((a,b)=>oaH[b]-oaH[a]).find(a=>{ const e=S.etr&&S.etr[a]; if(e) return e.missed; return RMUS.some(n=>!S.on[n]&&areaOf(n)===a&&S.t-S.offSince[n]>=15); });
  if(etrA) return {nudge:S.etr[etrA]?`The restoration time for ${etrA} has passed. Give customers a new one.`:`${fmtN(oaH[etrA])} customers in ${etrA} don't know when their power is coming back. Give them a restoration time: they ring less, and meeting it builds confidence.`,
    focus:{nodes:RMUS.filter(n=>!S.on[n]&&areaOf(n)===etrA),cables:[]},move:{text:`Set the restoration time for ${etrA} to ${fmtT(suggestEtr(etrA))}.`,kind:'etr',id:etrA}};
  // street faults and flood rebuilds come once the switching has got everyone it can back on
  const lvN=RMUS.find(n=>S.lvFault[n]&&!S.crews.some(cr=>(cr.job&&cr.job.type==='lvfix'&&cr.job.node===n)||cr.queue.some(j=>j.type==='lvfix'&&j.node===n)));
  if(lvN) return {nudge:'One substation\'s customers are off but the 11 kV network is fine there. That is a street (low-voltage) fault.',focus:{nodes:[lvN],cables:[]},move:{text:`Send a crew to fix the low-voltage fault at ${N[lvN].name}.`,kind:'lvfix',id:lvN}};
  const flN=RMUS.find(n=>S.flooded[n]==='damaged'&&S.flood&&S.flood.state==='receded'&&!S.crews.some(cr=>(cr.job&&cr.job.type==='rebuild')||cr.queue.some(j=>j.type==='rebuild')));
  if(flN) return {nudge:'The flood water has gone, but the switchgear was wrecked.',focus:{nodes:[flN],cables:[]},move:{text:`Send a crew to rebuild ${N[flN].name}.`,kind:'rebuild',id:flN}};
  // 4. stolen copper
  const th=RMUS.find(n=>S.theft[n]&&!safeBusy(n));
  if(th) return {nudge:'A substation hit by thieves needs a crew before its customers can come back.',focus:{nodes:[th],cables:[]},move:{text:`Send a crew to make ${N[th].name} safe.`,kind:'makesafe',id:th}};
  // 5. damage that is cut off and needs finding or fixing
  for(const f of active){
    if(cableBusy(f.cable)) continue;
    const c=CBL[f.cable], known=S.tested[f.cable]==='fault', live=solve().cab[f.cable];
    if(live) continue;
    if(!known) return {nudge:'The damaged section is cut off. Now find exactly where the fault is.',focus:{nodes:ends(c),cables:[c.id]},move:{text:`${c.oh?'Patrol':'Test'} the ${cableName(c)} ${c.oh?'line':'cable'}.`,kind:c.oh?'patrol':'test',id:c.id}};
    if(f.damage==='tree'&&!S.cleared[c.id]) return {nudge:'A tree is on the line. The tree team has to cut it back before a line crew can repair it.',focus:{nodes:ends(c),cables:[c.id]},move:{text:`Send the tree team to clear the ${cableName(c)} line.`,kind:'clear',id:c.id}};
    const d=docsStep(c.id);
    if(d&&d.wait) return docsWait(c.id);
    if(d) return {nudge:`The damage is found and cut off. ${docsNudge}`,focus:{nodes:ends(c),cables:[c.id]},move:d};
    return {nudge:'The damage is found and cut off. Get a crew to repair it.',focus:{nodes:ends(c),cables:[c.id]},move:{text:`Repair the ${cableName(c)} ${c.oh?'line':'cable'}.`,kind:'repair',id:c.id}};
  }
  // finished work: cancel the permit, then take the earths off, before anything is switched back on
  if(docsOn()){
    const done=Object.keys(S.permits).find(cid=>S.permits[cid].state==='cleared');
    if(done) return {nudge:'The crew has finished and cleared the permit. Cancel it so the earths can come off.',focus:{nodes:[],cables:[done]},move:{text:`Cancel ${S.permits[done].no} on ${cableName(CBL[done])}.`,kind:'permitx',id:done}};
    const stillNeeded=cid=>S.faults.some(f=>f.active&&f.cable===cid)||(S.planned&&S.planned.cable===cid&&S.planned.state==='prep')||(S.works||[]).some(w=>w.cable===cid&&w.state==='prep');
    const off=Object.keys(S.earths).find(s=>{ const cid=s.split(':')[0]; return !permitOn(cid)&&!earthPending(s)&&!stillNeeded(cid); });
    if(off) return {nudge:'The work is finished. Remove the earths before switching the cable back on, or it will flash over.',focus:{nodes:[nodeOfSw(off)],cables:[off.split(':')[0]]},move:{text:`Remove the earth at ${N[nodeOfSw(off)].name} on ${cableName(CBL[off.split(':')[0]])}.`,kind:'unearth',id:off}};
    const going=Object.keys(S.earths).find(s=>earthPending(s)&&!stillNeeded(s.split(':')[0]));
    if(going) return {nudge:'A crew is still taking an earth off. Wait until every earth is removed before switching the cable back on.',focus:{nodes:[nodeOfSw(going)],cables:[going.split(':')[0]]},move:null};
  }
  // 6. return to normal running without cutting anyone off
  if(offCount()===0&&!isNormal()){
    const ab=Object.keys(sw).filter(sid=>sw[sid]!==!NOPS.has(sid)&&usable(sid));
    for(const sid of ab){ const s2=Object.assign({},sw); s2[sid]=!sw[sid]; const r=simSw(s2); if(r.ok&&r.lose===0) return {nudge:'Everyone is on. Put each switch back to its normal position without cutting anyone off.',focus:{nodes:[nodeOfSw(sid)],cables:[sid.split(':')[0]]},move:{text:`${sw[sid]?'Open':'Close'} the ${switchLabel(sid)}.`,sw:sid,close:!sw[sid]}}; }
    for(const a of ab) for(const b of ab){ if(a===b||sw[a]||!sw[b]) continue; const s1=Object.assign({},sw); s1[a]=true; if(!simSw(s1).ok) continue; const s2=Object.assign({},s1); s2[b]=false; const r=simSw(s2); if(r.ok&&r.lose===0) return {nudge:'Close a link first, then open the other point, so nobody goes off.',focus:{nodes:[nodeOfSw(a),nodeOfSw(b)],cables:[]},move:{text:`Close the ${switchLabel(a)} first, then open the ${switchLabel(b)}.`,sw:a,close:true}}; }
    // between two different primaries a short break can't be avoided: open the temporary link first
    // closing must not put power onto earths or onto a crew
    const unsafe=s=>{ if(sw[s]) return false; const s2=Object.assign({},sw); s2[s]=true; const s1=solve(s2);
      return (docsOn()&&CABLES.some(c=>s1.cab[c.id]&&cableEarthed(c.id)))||S.crews.some(cr=>{ const j=cr.job; return j&&j.cable&&j.stage!=='travel'&&['maint','repair','test'].includes(j.type)&&s1.cab[j.cable]; }); };
    const sid=ab.find(s=>sw[s])||ab.find(s=>!unsafe(s)); if(sid) return {nudge:'Some switches are still out of their normal position. A short break may be unavoidable between different main substations.',focus:{nodes:[nodeOfSw(sid)],cables:[]},move:{text:`${sw[sid]?'Open':'Close'} the ${switchLabel(sid)}.`,sw:sid,close:!sw[sid]}};
  }
  // customers facing a long wait: the welfare van looks after the biggest group
  const vn=(S.vans||[]).some(v=>v.stage==='home')&&RMUS.filter(n=>!S.on[n]&&S.t-S.offSince[n]>=90&&!vanBlock(n)).sort((a,b)=>N[b].cust-N[a].cust)[0];
  if(vn) return {nudge:`${N[vn].name} has been off for ${fmtH(S.t-S.offSince[vn])}. The welfare van can look after those customers while they wait.`,focus:{nodes:[vn],cables:[]},move:{text:`Send the welfare van to ${N[vn].name}.`,kind:'van',id:vn}};
  // 7. customers who will be off for a long time: a mobile generator can carry them until the repair is done
  const gn=RMUS.filter(n=>!S.on[n]&&S.t-S.offSince[n]>=20&&!genBlock(n)).sort((a,b)=>N[b].cust-N[a].cust)[0];
  if(gn) return {nudge:`${N[gn].name} has been off a while and nothing more can be switched. A mobile generator could get those customers back on until the repair is finished.`,focus:{nodes:[gn],cables:[]},move:{text:`Hire a mobile generator for ${N[gn].name} (£${fmtN(GEN.hire)} + £${GEN.hourly} an hour).`,kind:'gen',id:gn}};
  return {nudge:'Nothing to switch right now. Let the clock run while the crews work, or speed it up.',focus:{nodes:[],cables:[]},move:null};
}
function nextHint(){
  if(!S||S.phase==='closed') return;
  if(!UI.hint) UI.hint={level:1,plan:hintPlan()};
  else if(UI.hint.level<3){ UI.hint.level++; if(UI.hint.level===3&&UI.hint.plan.move&&S.diff!=='trainee'&&!UI.hint.charged){ UI.hint.charged=true; S.hintsL3=(S.hintsL3||0)+1; } }
  S.sel=null; dirty=true; render();
}
function doHintMove(){
  const m=UI.hint&&UI.hint.plan.move; if(!m) return;
  UI.hint=null;
  if(m.sw) orderOp(m.sw,m.close);
  else if(m.kind==='makesafe') orderMakeSafe(m.id);
  else if(m.kind==='lvfix'||m.kind==='rebuild') orderNodeJob(m.id,m.kind);
  else if(m.kind==='gen') hireGenerator(m.id);
  else if(m.kind==='earth'||m.kind==='unearth') orderEarth(m.id,m.kind==='earth');
  else if(m.kind==='permit') issuePermit(m.id);
  else if(m.kind==='etr') setEtr(m.id,suggestEtr(m.id));
  else if(m.kind==='van') sendVan(m.id);
  else if(m.kind==='permitx') cancelPermit(m.id);
  else orderCable(m.id,m.kind);
}

const ended = ()=>S.phase==='repair'||S.phase==='closed';
function backWithin(m){ if(S.restored) return S.restored.t-S.t0<=m?'done':'failed'; return S.t-S.t0>m?'failed':'pending'; }
function maxOffOf(filter,lim){ const ns=RMUS.filter(filter); if(ns.some(n=>(S.maxOff[n]||0)>lim)) return 'failed'; return ended()?'done':'pending'; }
const OBJ={
  allBack120:{label:'Everyone back on within 2 hours',fn:()=>backWithin(120)},
  allBack240:{label:'Everyone back on within 4 hours',fn:()=>backWithin(240)},

  hosp60:{label:'The hospital off for less than an hour',fn:()=>maxOffOf(n=>N[n].hospital,60)},
  site30:{label:'Airport and docks back within 30 minutes',fn:()=>maxOffOf(n=>N[n].site,30)},
  press:{label:'Answer every press request',fn:()=>S.media.some(m=>m.answered==='ignored')?'failed':ended()?'done':'pending'},
  noSafety:{label:'No safety incidents',fn:()=>S.safety>0?'failed':ended()?'done':'pending'},
  psr:{label:'Look after vulnerable customers (welfare visits within an hour)',fn:()=>S.psrMissed?'failed':ended()?'done':'pending'},
  plannedZero:{label:'Nobody loses power during the planned work',fn:()=>S.affected>0?'failed':S.phase==='closed'?'done':'pending'},
  plannedOnTime:{label:'Maintenance finished inside its time window',fn:()=>{ const p=S.planned; if(!p) return 'pending'; if(p.doneAt!=null) return p.doneAt<=p.to?'done':'failed'; return S.t>p.to?'failed':'pending'; }},
  floodSafe:{label:'Flooding substation switched off before the water arrives',fn:()=>!S.flood?'pending':S.flood.state==='damaged'||S.flood.state==='receded'?'failed':S.flood.state==='warned'?'pending':'done'},
  poleSafe:{label:'Damaged pole switched off before the police deadline',fn:()=>S.poleSafe?'done':S.pole&&S.pole.done?'failed':'pending'},
  devCaught:{label:'Find and fix the failing cable before it breaks',fn:()=>S.dev&&S.dev.fixed?'done':S.dev&&S.dev.failed?'failed':'pending'},

};
function objectivesHtml(){
  const list=(S.objectives||[]).filter(k=>OBJ[k]);
  if(!list.length) return '';
  return `<h3>Objectives</h3><ul class="objs">${list.map(k=>{ const st=OBJ[k].fn(); return `<li class="${st}"><span class="ob-i" aria-hidden="true">${st==='done'?'✓':st==='failed'?'✗':'○'}</span>${OBJ[k].label}</li>`; }).join('')}</ul>`;
}

// ---------- Debrief ----------
// A rough "what an expert would have done": remote switching first, crews straight to the right place.
function expertCML(){
  const bad=new Set(S.faults.filter(f=>!f.transient).map(f=>f.cable)), onlyTransient=S.faults.length&&S.faults.every(f=>f.transient);
  const adj={}; Object.keys(N).forEach(k=>adj[k]=[]);
  CABLES.forEach(c=>{ if(bad.has(c.id)) return; adj[c.a].push(c.b); adj[c.b].push(c.a); });
  const reach=new Set(), q=[...PRIMS];
  while(q.length){ const n=q.shift(); adj[n].forEach(m=>{ if(!reach.has(m)&&N[m].kind!=='primary'){ reach.add(m); q.push(m); } }); }
  const nearRemote=n=>N[n].remote||INC[n].some(({c,end})=>N[c[other(end)]].remote);
  let cml=0;
  Object.keys(S.everOff||{}).forEach(n=>{
    let mins;
    if(onlyTransient) mins=3;
    else if(S.theft&&n in S.theft) mins=tt(NET.depot,N[n].m)+90;
    else if(!reach.has(n)){ const f=S.faults.find(f=>bad.has(f.cable)); mins=tt(NET.depot,N[n].m)+25+(f&&f.damage?DAMAGE[f.damage].mins:150); }
    else mins=nearRemote(n)?6:Math.min(50,tt(NET.depot,N[n].m)+10);
    cml+=N[n].cust*mins;
  });
  return Math.round(cml);
}
function pickTip(st,exp){
  if(st.safety||S.safety) return S.safetyTip||'A crew closed a switch onto a fault. Always prove a section is healthy (test or patrol it) before closing onto it by hand.';
  if(st.faultTrips) return 'Before switching a section back on, cut the fault off at both ends. Use the preview: hover a switch to see what it would do.';
  if(st.overloads) return 'Check the circuit loading before closing a spare link. If one neighbour can\'t take everyone, split the area between two.';
  if(S.media.some(m=>m.answered==='ignored')) return 'Answer the press when they call, even with a holding statement. Silence costs public confidence.';
  if(S.media.some(m=>m.result==='missed')) return 'Only promise restoration times you can keep. A missed promise does more harm than a cautious one.';
  if(exp&&st.cml>exp*1.8) return 'Get the healthy parts back first with remote switches (sites with a green dot only take 2 minutes), then send crews for the rest.';
  if(st.undos||st.hints) return 'Good work. Next time try it without hints or undo to earn every star.';
  return 'Nicely done. Try a harder difficulty or a storm shift next.';
}
function timelineSvg(){
  const hs=(S.hist||[]).concat([[S.t,offCount()]]); if(hs.length<2) return '';
  const W=420, H=110, t0=S.t0, t1=Math.max(S.t,t0+30), mx=Math.max(1,...hs.map(p=>p[1]));
  const L=46, x=t=>((t-t0)/(t1-t0))*(W-L-6)+L, y=v=>H-18-(v/mx)*(H-30);
  let d=`M${x(hs[0][0])},${y(0)} `+hs.map(p=>`L${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ')+` L${x(hs[hs.length-1][0])},${y(0)}Z`;
  const marks=S.log.filter(l=>l.kind==='bad'&&/tripped/.test(l.text)).map(l=>`<path class="tl-trip" d="M${x(l.t).toFixed(1)},${y(mx)-2} l-3.5,-6 h7z"/>`).join('');
  return `<svg class="tl" viewBox="0 0 ${W} ${H}" aria-label="Customers off over time"><path class="tl-a" d="${d}"/><line class="tl-ax" x1="${L}" x2="${W-4}" y1="${y(0)}" y2="${y(0)}"/>
    <text x="${L-5}" y="${y(mx)+4}" text-anchor="end">${fmtN(mx)}</text><text x="${L-5}" y="${y(0)}" text-anchor="end">0</text>
    <text x="${L}" y="${H-4}">${fmtT(t0)}</text><text x="${W-4}" y="${H-4}" text-anchor="end">${fmtT(t1)}</text>${marks}</svg>`;
}
function debriefHtml(st){
  const exp=expertCML();
  return `<h3 style="margin-top:12px">Customers off over time</h3>${timelineSvg()}
    <p class="muted" style="margin:4px 0 0">Red markers show breaker trips.</p>
    ${exp?`<p style="font-size:14px;margin:10px 0 0"><b>Expert comparison:</b> a seasoned engineer would have lost about ${fmtN(exp)} customer-minutes. You lost ${fmtN(st.cml)}.</p>`:''}
    <div class="brief" style="margin-top:10px"><b>Mags's tip</b>${pickTip(st,exp)}</div>
    ${(S.objectives||[]).length?`<div style="margin-top:10px">${objectivesHtml()}</div>`:''}`;
}

function setVB(vb){

function onShiftEnd(){
  if(!S||S.ended) return; S.ended=true;
  const st=S.restored||snapshotStats(), sc=stars(st).s, rep={money:null,xp:0,promoted:false,ach:[],board:null};
  rep.ach=checkAchievements(st);
  rep.board=recordBoard(st,sc);
  if(S.ctx&&S.ctx.type==='career'&&CAREER){
    const m=shiftMoney(), objDone=(S.objectives||[]).filter(k=>OBJ[k]&&OBJ[k].fn()==='done').length, bonus=sc*1500;
    rep.money=m; rep.bonus=bonus; rep.xp=sc*100+objDone*40;
    CAREER.funds+=m.result+bonus; CAREER.xp+=rep.xp;
    CAREER.history.push({week:CAREER.week,day:CAREER.day,scen:S.scen,stars:sc,cml:Math.round(st.cml),result:m.result+bonus});
    if(m.result>0){ const a=unlock('budget'); if(a) rep.ach.push('budget'); }
    CAREER.day++; if(CAREER.day>=5){ CAREER.day=0; CAREER.week++; if(unlock('week')) rep.ach.push('week'); storyCheck('weekEnd'); }
    const nr=RANKS.reduce((r,x,i)=>CAREER.xp>=x.xp?i:r,0);
    if(nr>CAREER.rank){ CAREER.rank=nr; rep.promoted=RANKS[nr].name; if(unlock('promoted')) rep.ach.push('promoted'); storyCheck('promoted'); }
    if(CAREER.funds<0) storyCheck('broke');
    if(sc<=1) storyCheck('badShift'); else storyCheck('goodShift');
    if(CAREER.week>1&&CAREER.day===0&&(CAREER.week-1)%4===0) storyCheck('season');
    saveCareer();
  }
  S.endReport=rep;
}

}
function startReplay(){

function upgradeChoices(u){

function upgradeOwned(u){

function buyUpgrade(id,choice){

document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea')) return;
  const k=e.key, typing=e.ctrlKey||e.metaKey||e.altKey;
  if(k==='Escape'){
    const cm=$('#ctxMenu');
    if(cm&&!cm.hidden) hideCtx();
    else if(UI.alarmOpen){ UI.alarmOpen=false; renderAlarms(); }
    else if(UI.overlay==='pause') resumeFromPause();
    else if(UI.overlay==='title') {}
    else if(UI.overlay&&UI.overlay!=='home'&&UI.overlay!=='milestone'){ UI.overlay=null; render(); }
    else if(UI.hint){ UI.hint=null; render(); }
    else if(UI.mode==='play'&&S&&S.sel){ S.sel=null; render(); }
    // nothing left to close: Esc brings up the pause menu
    else if(!UI.overlay&&UI.mode==='play'&&S) openPause();
    hidePreview(); return;
  }
  if((k==='f'||k==='F')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ toggleFullscreen(); return; }
  if(UI.overlay) return;
  // Shift + 1–7 jumps to a side panel tab
  if(e.shiftKey&&/^Digit[1-7]$/.test(e.code)&&UI.mode==='play'){ const t=TABS[+e.code.slice(5)-1]; if(t){ e.preventDefault(); showTab(t[0]); } return; }
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'&&UI.mode==='play'){ e.preventDefault(); doUndo(); return; }
  if(typing) return;
  // the diagram from the keyboard: Enter selects what has focus, [ and ] step through a substation's switches, O and C open and close
  const fk=e.target.closest&&e.target.closest('#svg [data-k]');
  if(fk&&(k==='Enter'||k===' ')&&UI.mode==='play'){ e.preventDefault(); pick(fk); return; }
  if(UI.mode==='play'&&S&&S.sel&&S.sel.k==='node'&&(k==='['||k===']')){ const sws=INC[S.sel.id].map(({c,end})=>c.id+':'+end); const i=sws.indexOf(S.sel.sw); S.sel={k:'node',id:S.sel.id,sw:sws[(i+(k===']'?1:-1)+sws.length)%sws.length]}; render(); return; }
  if(UI.mode==='play'&&S&&(k==='o'||k==='O'||k==='c'||k==='C')){ const sid=S.sel&&S.sel.sw||(fk&&fk.dataset.k==='sw'?fk.dataset.id:null); if(sid){ orderOp(sid,k.toLowerCase()==='c'); } else toast('Select a switch first: click one, or select a substation and press [ or ].'); return; }
  if((k==='n'||k==='N')&&UI.mode==='play'){ skipAhead(); return; }
  if(k===' '&&UI.mode==='play'&&!e.target.closest('button,[data-k]')){ e.preventDefault(); setSpeed(0); return; }
  if(UI.mode==='play'&&['1','2','3'].includes(k)){ setSpeed(+k); return; }
  if(k==='s'||k==='S'){ UI.view='s'; render(); return; }
  if(k==='m'||k==='M'){ UI.view='m'; render(); return; }
  if((k==='h'||k==='H')&&UI.mode==='play'){ nextHint(); return; }
  if((k==='u'||k==='U')&&UI.mode==='play'){ doUndo(); return; }
  if(k==='+'||k==='='){ zoomAt(1/1.25); return; }
  if(k==='-'||k==='_'){ zoomAt(1.25); return; }
  if(k==='0'){ setVB(fullVB()); return; }
  if(k==='/'){ e.preventDefault(); $('#find').focus(); return; }
});

  e.preventDefault(); e.stopPropagation();
  const i=TABS.findIndex(t=>t[0]===UI.tab), n=TABS.length;
  const j=e.key==='Home'?0:e.key==='End'?n-1:(i+(e.key==='ArrowRight'?1:-1)+n)%n;
  showTab(TABS[j][0]); $('#tab-'+TABS[j][0]).focus();
});
