<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Open Point</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: control-room desk. Status strip on top, network board left, operator panel right; stacks on phones. */
:root{
  --bg:#e7ecea; --panel:#f8faf9; --ink:#14201d; --muted:#5a6a66; --rule:#cdd6d2; --grid:#e2e8e5;
  --accent:#0c6a62; --accent-ink:#ffffff;
  --f1:#cc650a; --f2:#1b62c2; --f3:#8236bf; --f4:#0f8a6e; --f5:#b8327a; --f6:#6b7d12; --f7:#0e8aa8; --f8:#8a5a2b;
  --dead:#98a7a3; --fault:#cc2424; --ok:#14804a; --warn:#b3741a;
  --ground:#e2e8df; --road:#fbfcfa; --road-edge:#c8d0c6; --water:#b3d0e2; --park:#cbe0c0; --block:#d0d7ce;
  --water-edge:#9cc0d6; --tree:#a7cb98; --block-shadow:#bcc5bb; --grid-major:#d2dbd7;
  --sea:#c9dde8; --coast:#9fbccb; --contour:#c3cfbf; --paper:#fbf7ec; --paper-ink:#2b2a26;
  --desk:#15242a; --desk-ink:#e6efec; --desk-muted:#91a7a2; --desk-rule:#2c4046; --desk-alarm:#ff6a5c; --desk-ok:#4fd18b;
  --display:'Saira Condensed','Arial Narrow',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1416; --panel:#132024; --ink:#e2ebe8; --muted:#8ea19c; --rule:#243538; --grid:#182a2e;
  --accent:#3dbfb2; --accent-ink:#06211e;
  --f1:#f39a3e; --f2:#5aa2f5; --f3:#b884f2; --f4:#3fcf9f; --f5:#f06aae; --f6:#b5c73a; --f7:#4cc9e6; --f8:#c9935c;
  --dead:#4b5d5a; --fault:#ff5a52; --ok:#43cf83; --warn:#e3a33f;
  --ground:#101b1d; --road:#22343a; --road-edge:#1a292d; --water:#123349; --park:#14291d; --block:#1a282b;
  --water-edge:#0c2536; --tree:#1d3d29; --block-shadow:#0b1416; --grid-major:#21373b;
  --sea:#08161f; --coast:#1c3a48; --contour:#21382b; --paper:#e9e3d2; --paper-ink:#24221d;
  --desk:#071012; --desk-ink:#e6efec; --desk-muted:#8197a0; --desk-rule:#22363b; --desk-alarm:#ff6a5c; --desk-ok:#4fd18b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1416; --panel:#132024; --ink:#e2ebe8; --muted:#8ea19c; --rule:#243538; --grid:#182a2e;
  --accent:#3dbfb2; --accent-ink:#06211e;
  --f1:#f39a3e; --f2:#5aa2f5; --f3:#b884f2; --f4:#3fcf9f; --f5:#f06aae; --f6:#b5c73a; --f7:#4cc9e6; --f8:#c9935c;
  --dead:#4b5d5a; --fault:#ff5a52; --ok:#43cf83; --warn:#e3a33f;
  --ground:#101b1d; --road:#22343a; --road-edge:#1a292d; --water:#123349; --park:#14291d; --block:#1a282b;
  --water-edge:#0c2536; --tree:#1d3d29; --block-shadow:#0b1416; --grid-major:#21373b;
  --sea:#08161f; --coast:#1c3a48; --contour:#21382b; --paper:#e9e3d2; --paper-ink:#24221d;
  --desk:#071012; --desk-ink:#e6efec; --desk-muted:#8197a0; --desk-rule:#22363b; --desk-alarm:#ff6a5c; --desk-ok:#4fd18b;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
body.mode-edit .play-only,body.mode-play .edit-only{display:none!important}
.app{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* status strip */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;background:var(--desk);color:var(--desk-ink);border-radius:8px;padding:14px 18px;
  box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--accent) 55%,var(--desk))}
.bar .brand p,.bar .stat label{color:var(--desk-muted)}
.bar .stat b{text-shadow:0 0 12px color-mix(in srgb,currentColor 35%,transparent)}
.bar .stat.off b{color:var(--desk-alarm)}
.bar .stat.off.zero b{color:var(--desk-ok)}
.bar .seg{background:transparent;border-color:var(--desk-rule)}
.bar .seg button{color:var(--desk-muted)}
.bar .seg button[aria-pressed="true"]{background:var(--desk-ink);color:var(--desk)}
.bar .ghost{background:transparent;border-color:var(--desk-rule);color:var(--desk-ink)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font:700 30px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.brand p{margin:2px 0 0;font:12px var(--mono);color:var(--muted);letter-spacing:.04em}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px}
.stat label{display:block;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat b{font:600 22px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.stat.off b{color:var(--fault)}
.stat.off.zero b{color:var(--ok)}
#pz{font:700 10px var(--mono);letter-spacing:.08em;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;padding:2px;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.ghost{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.ghost:hover{border-color:var(--accent)}

/* main */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.board{min-width:0;display:flex;flex-direction:column;gap:8px}
.stage-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
.stage{position:relative;min-width:720px}
#svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
#svg.is-edit{touch-action:none}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:min(560px,90%);background:var(--ink);color:var(--panel);
  padding:9px 14px;border-radius:6px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:2}
#toast[hidden]{display:none}
#pausedPill{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);font:700 12px var(--mono);letter-spacing:.06em;background:var(--warn);color:#1d1405;border:0;border-radius:4px;padding:5px 10px;cursor:pointer}
#pausedPill[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:14px;flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .tb{border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer}
.toolbar .tb[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.toolhint{flex-basis:100%;font-size:13px;color:var(--muted)}

/* overlay */
#overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow-y:auto;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#overlay[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px 24px;max-width:480px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.mbox h2{font:700 30px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;text-wrap:balance}
.stars{font-size:26px;letter-spacing:4px;color:var(--warn);margin:6px 0 10px}
.stars i{font-style:normal;color:var(--rule)}
.mgrid{display:grid;grid-template-columns:1fr auto;gap:5px 16px;margin:12px 0;font-size:14px}
.mgrid b{font:600 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.mbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
textarea{width:100%;min-height:220px;font:12px/1.4 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:8px;resize:vertical}

/* side panel */
.side{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);border-radius:6px;min-width:0}
.side section{padding:14px 16px;border-top:1px solid var(--rule)}
.side section:first-child{border-top:0}
.side h2{font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.side h3,.h3{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.ph{display:flex;gap:10px;align-items:flex-start}
.ph .code{font:600 13px var(--mono);border:2px solid var(--ink);border-radius:4px;padding:2px 6px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;margin:10px 0 4px;
  background:color-mix(in srgb,var(--c) 15%,var(--panel));color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 50%,var(--panel))}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.trip{color:var(--fault);font-weight:700}
.note{margin:10px 0 0;font-size:13px;color:var(--muted)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.swrow:first-of-type{border-top:0}
.swrow.hl{background:color-mix(in srgb,var(--accent) 10%,transparent);margin:0 -8px;padding:8px;border-radius:4px}
.swname{font-size:14px;font-weight:700}
.swstate{font:12px var(--mono);color:var(--muted)}
.swstate.c::before{content:"■ "}
.swstate.o::before{content:"□ "}
.swstate .abn{color:var(--warn)}
.tag{font:600 10px var(--mono);border:1px solid var(--muted);border-radius:3px;padding:0 4px;color:var(--muted);margin-left:4px;vertical-align:2px}
.btn{border:0;border-radius:5px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;text-align:right;line-height:1.2}
.btn small{display:block;font-weight:400;font-size:11px;opacity:.85}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.danger{background:transparent;color:var(--fault);border:1.5px solid var(--fault)}
.btn.wide{width:100%;text-align:center;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{text-align:center}
.steps{margin:10px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted);font-size:13px}
.lead{margin:8px 0 0}
.phases{list-style:none;display:flex;gap:4px;padding:0;margin:12px 0 4px;font-size:12px}
.phases li{flex:1;padding:6px 8px;border-radius:4px;background:var(--grid);color:var(--muted);font-weight:700;line-height:1.2}
.phases li.now{background:var(--ink);color:var(--panel)}
.phases li.done{background:color-mix(in srgb,var(--ok) 22%,var(--panel));color:var(--ink)}
.todo{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;font-size:14px}
.load{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.load:last-child{margin-bottom:0}
.lh{display:flex;align-items:baseline;gap:8px;font-size:14px}
.lh .sw{width:10px;height:10px;border-radius:2px;flex:none;align-self:center}
.lh .nm{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh .num{margin-left:auto;font:600 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.lh .num.bad{color:var(--fault)}
.barl{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.barl i{display:block;height:100%}
.crews{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.cr-h{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.badge{font:700 11px var(--mono);background:var(--warn);color:#1d1405;border-radius:3px;padding:2px 5px;flex:none;margin-top:1px}
.q{margin:4px 0 0 34px;padding:0;list-style:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.q li{display:flex;gap:4px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 4px;margin-left:auto}
.x:hover{color:var(--fault)}
.seg.small button{font-size:12px;padding:4px 9px}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto;font-size:13px}
#log li{display:grid;grid-template-columns:42px 1fr;gap:8px}
#log time{font:12px var(--mono);color:var(--muted);padding-top:1px}
#log li.bad span{color:var(--fault);font-weight:700}
#log li.good span{color:var(--ok);font-weight:700}
#log li.warn span{color:var(--warn);font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.fld>span{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.fld input,.fld select{font:14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks,.tips{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.checks .e{color:var(--fault)}
.checks .w{color:var(--warn)}
.checks .ok{color:var(--ok);font-weight:700}

/* svg */
svg text{font-family:var(--body)}
.cable{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.cable.dead{stroke-dasharray:7 6}
.is-map .cable{stroke-width:3.5}
.hit{fill:none;stroke:transparent;stroke-width:22;cursor:pointer;stroke-linecap:round}
.halo{fill:none;stroke:var(--accent);stroke-opacity:.3;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.swm{cursor:pointer}
.swm .hb{fill:transparent}
.swm .m{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.swm.closed .m{fill:var(--ink)}
.swm:hover .m,.swm.sel .m{stroke:var(--accent);stroke-width:3}
.swm.sel.closed .m{fill:var(--accent)}
.swm .ab{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:3 2}
.swm .pr{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:3 3}
.swl{font:600 10px var(--mono);fill:var(--muted)}
.node{cursor:pointer;outline:none}
.node .box{stroke-width:2.5}
.node:hover .box,.node:focus-visible .box{stroke:var(--accent)!important}
.selring{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.pendring{fill:none;stroke:var(--accent);stroke-width:3}
.code{font:600 12px var(--mono);text-anchor:middle;fill:var(--ink)}
.lbl{font-weight:700;font-size:13px;fill:var(--ink)}
.lbl2{font:11px var(--mono);fill:var(--muted)}
.is-map .lbl,.is-map .lbl2{paint-order:stroke;stroke:var(--ground);stroke-width:4px;stroke-linejoin:round}
.fpi line{stroke:var(--ink);stroke-width:1.5}
.fpi.trip path{fill:var(--fault)}
.fpi.clear path{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.fpi.unk text{font:700 12px var(--mono);fill:var(--muted)}
.rdot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.bus{fill:var(--ink)}
.plbl{font:700 15px var(--display);letter-spacing:.05em;text-transform:uppercase;fill:var(--ink)}
.fmark circle{fill:var(--fault)}
.fmark path{fill:#fff}
.okmark circle{fill:var(--ok)}
.okmark path{fill:none;stroke:#fff;stroke-width:2}
.wrench circle{fill:var(--ok)}
.wrench text{font:700 9px var(--mono);fill:#fff;text-anchor:middle}
.crew rect{fill:var(--warn);stroke:var(--panel);stroke-width:2}
.crew.enroute rect{fill:var(--panel);stroke:var(--warn);stroke-dasharray:3 2}
.crew text{font:700 10px var(--mono);fill:#1d1405;text-anchor:middle}
.crew.enroute text{fill:var(--warn)}
.tblock rect{fill:var(--panel);stroke:var(--ink);stroke-width:1}
.tblock line{stroke:var(--ink);stroke-width:1}
.tblock text{font:10px var(--mono);fill:var(--ink)}
.tblock .tb{font:700 12px var(--display);letter-spacing:.06em}
.road-e{fill:none;stroke:var(--road-edge);stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:var(--road);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.river{fill:none;stroke:var(--water);stroke-width:20;stroke-linecap:round}
.park{fill:var(--park)}
.blk{fill:var(--block)}
.mapt{font-style:italic;font-size:13px;fill:var(--muted)}
.depot{fill:var(--muted)}
.pmap{fill:var(--ink)}
.pmap-t{font:700 7.5px var(--mono);fill:var(--panel);text-anchor:middle}
.ecable{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* living diagram: power flow, alarms, map detail */
.flow{fill:none;stroke:var(--panel);stroke-opacity:.9;stroke-width:1.6;stroke-dasharray:2 12;stroke-linecap:round;animation:flow 1.1s linear infinite;pointer-events:none}
.is-map .flow{stroke-width:1.3}
@keyframes flow{to{stroke-dashoffset:-14}}
.node .box{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.2))}
.alarm{fill:none;stroke:var(--fault);stroke-width:2;animation:alarm 1.6s ease-in-out infinite;pointer-events:none}
@keyframes alarm{0%,100%{opacity:.12}50%{opacity:.75}}
.lbl2.offc{fill:var(--fault);font-weight:600}
.swm.cbtrip .ab{stroke:var(--fault);stroke-dasharray:none;stroke-width:2.2;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.fmark .ring{fill:none;stroke:var(--fault);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(2.3);opacity:0}}
.van .body{fill:var(--warn);stroke:var(--panel);stroke-width:1.5;stroke-linejoin:round}
.van .wheel{fill:var(--ink);stroke:var(--panel);stroke-width:1}
.van text{font:700 8px var(--mono);fill:#1d1405;text-anchor:middle}
.river-e{fill:none;stroke:var(--water-edge);stroke-width:27;stroke-linecap:round}
.tree{fill:var(--tree)}
.blk-s{fill:var(--block-shadow)}
.sea{fill:var(--sea)}
.coast{fill:var(--ground);stroke:var(--coast);stroke-width:4;stroke-linejoin:round}
.contour{fill:none;stroke:var(--contour);stroke-width:1.4}
.townt{font:700 24px var(--display);letter-spacing:.2em;fill:var(--muted);opacity:.6}
.seat{font-style:italic;font-size:17px;letter-spacing:.18em;fill:var(--coast)}
.warnmark polygon{fill:var(--warn);stroke:var(--panel);stroke-width:1.5;stroke-linejoin:round}
.warnmark text{font:800 10px var(--mono);fill:#1d1405;text-anchor:middle}
.warnmark .ring{fill:none;stroke:var(--warn);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
/* control room home */
.mbox.wide{max-width:660px}
.fld .seg{flex-wrap:wrap}
.eyebrow{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 4px}
.letter{background:var(--paper);color:var(--paper-ink);font:17px/1.5 'Kalam',cursive;padding:18px 22px;border-radius:4px;margin:14px 0;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12);transform:rotate(-.4deg)}
.letter p{margin:0 0 10px}
.letter ul{margin:0 0 10px;padding-left:20px}
.letter li{margin-bottom:4px}
.letter .sig{font-weight:700;font-size:19px;margin:0}
.shifts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.shift{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:6px;padding:11px 14px;background:var(--bg);cursor:pointer;text-align:left;width:100%}
.shift:hover{border-color:var(--accent)}
.shift b{display:block;font-size:15px}
.shift span{font-size:13px;color:var(--muted)}
.shift .st{color:var(--warn);letter-spacing:2px;font-size:16px;white-space:nowrap}
.shift .st i{font-style:normal;color:var(--rule)}
.brief{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--rule));background:color-mix(in srgb,var(--warn) 9%,var(--panel));border-radius:6px;padding:10px 12px;margin:12px 0 0;font-size:14px}
.brief b{display:block;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--warn);margin-bottom:2px}
.alertbox{border:1px solid color-mix(in srgb,var(--fault) 45%,var(--rule));background:color-mix(in srgb,var(--fault) 8%,var(--panel));border-radius:6px;padding:10px 12px;margin:12px 0 0;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

   brief:'Copper Lane has been hit again. Nobody touches that switchgear until a crew has made it safe. Keep an eye on the rest of the island while they work.'},
  {id:'s3',title:'Shift 3 · Roadworks',desc:'Island Civils are digging up the city centre.',scen:'digin',crews:2,area:['PA','U','C','D'],
   brief:'Island Civils have been digging in town all week. When they hit a cable you know exactly where the damage is, but a digger strike takes about four hours to repair.'},
  {id:'s4',title:'Shift 4 · Atlantic storm',desc:'Gales across the whole island. Several faults, and the thieves are out.',scen:'bigstorm',crews:3,
   brief:'This is the big one. Faults will pop up all over the island while the storm passes, and thieves will use the dark. Look after the hospital and the biggest towns first.'},
];

// ======================= Constants & helpers =======================
const AMPS = 0.1;                 // amps per customer at 11 kV (about 2 kW each)
const WORK = {op:5, visit:2, test:30, repair:150, makesafe:90};
const SPEEDS = [0,1,4,15];        // game minutes per real second
const STORE = 'openpoint.networks.v1';
const $ = s=>document.querySelector(s);
const other = e=>e==='a'?'b':'a';
const fmtT = m=>{m=((Math.floor(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const fmtN = n=>Math.round(n).toLocaleString('en-GB');
const dist = (p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
const tt = (p,q)=>dist(p,q)<1?0:Math.round(3+dist(p,q)/28);   // drive time in minutes
const clean = (s,max)=>String(s==null?'':s).replace(/[<>&"'`]/g,'').slice(0,max);
const clone = o=>JSON.parse(JSON.stringify(o));
const plural = (n,w)=>`${n} ${w}${n===1?'':'s'}`;

// ======================= Active network =======================
let NET, N, CABLES, CBL, INC, RMUS, PRIMS, CB, CBIDS, NOPS, FAULTABLE, BLOCKS;
function useNetwork(def){
  NET=def; N=def.nodes; CABLES=def.cables; CBL={}; INC={}; BLOCKS=null;
  CABLES.forEach(c=>CBL[c.id]=c);
  Object.keys(N).forEach(k=>INC[k]=[]);
  CABLES.forEach(c=>{ if(INC[c.a]&&INC[c.b]){ INC[c.a].push({c,end:'a'}); INC[c.b].push({c,end:'b'}); } });
  RMUS=Object.keys(N).filter(k=>N[k].kind!=='primary');
  PRIMS=Object.keys(N).filter(k=>N[k].kind==='primary');
  CB={}; CBIDS=[]; let k=0;
  CABLES.forEach(c=>['a','b'].forEach(e=>{
    const p=N[c[e]], o=N[c[other(e)]];
    if(p&&o&&p.kind==='primary'&&o.kind!=='primary'){
      k++; const id=c.id+':'+e;
      CB[id]={name:'F'+k,feeder:c.feeder||o.name,prim:c[e],rating:c.rating||400,color:'--f'+(((k-1)%8)+1),end:e};
      CBIDS.push(id);
    }
  }));
  NOPS=new Set(CABLES.filter(c=>c.nop).map(c=>c.id+':'+c.nop));
  FAULTABLE=CABLES.filter(c=>!c.nop&&!(N[c.a].kind==='primary'&&N[c.b].kind==='primary')).map(c=>c.id);
}
function normalSw(){ const sw={}; CABLES.forEach(c=>{sw[c.id+':a']=true;sw[c.id+':b']=true;}); NOPS.forEach(k=>sw[k]=false); return sw; }
const cableName = c=>`${N[c.a].name} – ${N[c.b].name}`;
const nodeOfSw = sid=>{const [cid,e]=sid.split(':'); return CBL[cid][e];};
function switchLabel(sid){
  if(CB[sid]) return `CB ${CB[sid].name}`;
  const [cid,e]=sid.split(':'), c=CBL[cid];
  return `${N[c[e]].name} switch towards ${N[c[other(e)]].name}`;
}
const remoteFor = sid=>!!CB[sid]||!!N[nodeOfSw(sid)].remote;

// ======================= Simulation =======================
let S=null, E=null, dirty=false;
const UI={view:'s',mode:'play',overlay:null,setup:{net:'b:megawatt',scen:'single',crews:2},msg:'',letter:false};

// Flood-fill from each closed breaker through cables closed at both ends. Islands fed by
// several breakers (a loop on one primary) share their load equally.
function solve(sw=S.sw){
  const feed={}, cab={}, parent={}, island={}, islands=[];
  for(const id of CBIDS){
    if(!sw[id]) continue;
    const c=CBL[id.split(':')[0]], fe=other(CB[id].end), start=c[fe];
    if(!cab[c.id]) cab[c.id]=id;
    if(!sw[c.id+':'+fe]) continue;
    if(island[start]!=null){ islands[island[start]].cbs.push(id); continue; }
    const k=islands.length, isl={cbs:[id],nodes:[start]}; islands.push(isl);
    island[start]=k; feed[start]=id; parent[start]={from:null,cable:c.id};
    const q=[start];
    while(q.length){
      const n=q.shift();
      for(const {c:cc,end} of INC[n]){
        if(!sw[cc.id+':'+end]) continue;
        if(!cab[cc.id]) cab[cc.id]=id;
        const oe=other(end), on=cc[oe];
        if(N[on].kind==='primary'||!sw[cc.id+':'+oe]||island[on]!=null) continue;
        island[on]=k; feed[on]=id; parent[on]={from:n,cable:cc.id}; isl.nodes.push(on); q.push(on);
      }
    }
  }
  return {feed,cab,parent,island,islands};
}
const islandOfCB = (sol,id)=>{ for(let k=0;k<sol.islands.length;k++) if(sol.islands[k].cbs.includes(id)) return k; return null; };
function cbLoad(sol,id){
  const k=islandOfCB(sol,id); if(k==null) return 0;
  const isl=sol.islands[k];
  return isl.nodes.reduce((a,n)=>a+N[n].cust,0)*AMPS/isl.cbs.length;
}
function sidePrim(sol,n){ if(N[n].kind==='primary') return n; const k=sol.island[n]; return k==null?null:CB[sol.islands[k].cbs[0]].prim; }
function feedersOf(sol,cid){
  const c=CBL[cid], out=new Set();
  ['a','b'].forEach(e=>{
    const sid=cid+':'+e; if(!S.sw[sid]) return;
    if(CB[sid]){ out.add(sid); return; }
    const k=sol.island[c[e]]; if(k!=null) sol.islands[k].cbs.forEach(x=>out.add(x));
  });
  return [...out];
}
const offCount = ()=>RMUS.reduce((s,n)=>s+(S.on[n]?0:N[n].cust),0);
const crewOnSite = n=>S.crews.some(cr=>cr.at===n);
const faultOn = cid=>S.faults.find(f=>f.cable===cid&&f.active);
function log(text,kind=''){ S.log.unshift({t:S.t,text,kind}); if(S.log.length>120) S.log.pop(); }

// Protection: trip every breaker feeding an energised fault, then any breaker over its rating.
function protect(natural){
  const res={tripped:[],fault:false};
  for(let g=0;g<24;g++){
    const sol=solve(); let acted=false;
    for(const f of S.faults){
      if(!f.active) continue;
      const fe=feedersOf(sol,f.cable); if(!fe.length) continue;
      if(f.transient&&f.trips>0){
        f.active=false; acted=true;
        log(`No fault current on reclose. The fault on ${cableName(CBL[f.cable])} was transient and has cleared.`,'good');
        break;
      }
      const c=CBL[f.cable], path=new Set(), reset=new Set();
      fe.forEach(cb=>{ const k=islandOfCB(sol,cb); if(k!=null) sol.islands[k].nodes.forEach(n=>reset.add(n)); });
      ['a','b'].forEach(e=>{
        const n=c[e];
        // fault current flows out of the node feeding the cable, not the one downstream of it
        if(N[n].kind==='primary'||!S.sw[c.id+':'+e]||sol.island[n]==null||sol.parent[n].cable===c.id) return;
        let x=n; while(x){ path.add(x); x=sol.parent[x].from; }
      });
      reset.forEach(n=>{ S.fpi[n]={trip:path.has(n),known:!!N[n].remote||crewOnSite(n),t:S.t}; });
      fe.forEach(cb=>S.sw[cb]=false);
      f.trips++; res.tripped.push(...fe); res.fault=true; acted=true;
      if(!natural) S.faultTrips++;
      const names=fe.map(cb=>`CB ${CB[cb].name}`).join(' and ');
      log(natural?`${names} at ${N[CB[fe[0]].prim].name} tripped on earth fault protection.`:`${names} tripped. That operation energised a fault.`,'bad');
      break;
    }
    if(acted) continue;
    let tripped=false;
    for(const id of CBIDS){
      if(!S.sw[id]) continue;
      const a=cbLoad(sol,id);
      if(a>CB[id].rating+0.01){
        S.sw[id]=false; S.overloads++; tripped=true; res.tripped.push(id);
        log(`CB ${CB[id].name} tripped on overcurrent: ${Math.round(a)} A against a ${CB[id].rating} A rating.`,'bad');
        break;
      }
    }
    if(!tripped) break;
  }
  return res;
}
function updateOn(){
  const sol=solve();
  RMUS.forEach(n=>{
    // stolen low-voltage cables keep a substation's customers off even when the 11 kV side is live
    const on=sol.island[n]!=null&&!S.lvOut[n];
    if(S.on[n]&&!on){ S.offSince[n]=S.t; S.counted[n]=false; S.affected+=N[n].cust; }
    S.on[n]=on;
  });
}
// Time passes: CML accrues for everyone off; an interruption counts toward CI once it reaches 3 minutes.
function accrue(dt){
  if(dt<=0) return;
  S.cml+=offCount()*dt; S.t+=dt;
  RMUS.forEach(n=>{ if(!S.on[n]&&!S.counted[n]&&S.t-S.offSince[n]>=3-1e-9){ S.counted[n]=true; S.ci+=N[n].cust; } });
}
function isNormal(){ return Object.keys(S.sw).every(k=>S.sw[k]===!NOPS.has(k)); }
function allClear(){ return !S.pending.length&&S.faults.every(f=>!f.active)&&!RMUS.some(n=>S.theft[n])&&offCount()===0&&isNormal(); }
const locked = n=>!!(S.theft&&S.theft[n]);
function snapshotStats(){ return {t:S.t,ci:S.ci,cml:S.cml,affected:S.affected,ops:S.ops,faultTrips:S.faultTrips,overloads:S.overloads,safety:S.safety}; }
function checkPhase(){
  if(S.phase==='closed') return;
  if(S.phase==='restore'&&!S.pending.length&&offCount()===0){
    S.phase='repair'; S.restored=snapshotStats(); recordStars();
    log('All customers back on supply.','good');
    if(!allClear()){ S.paused=true; S.modal='restored'; }
  }
  if(S.phase==='repair'&&allClear()){
    S.phase='closed'; S.paused=true; S.modal='closed'; S.closedAt=S.t;
    log('Network back in normal running. Incident closed.','good');
  }
}
function afterChange(){ updateOn(); checkPhase(); dirty=true; }

// ---------- Events ----------
function crewPos(cr){
  const j=cr.job;
  if(j&&j.stage==='travel'&&j.tArrive>j.t1){
    const k=Math.max(0,Math.min(1,(S.t-j.t1)/(j.tArrive-j.t1)));
    return [j.from[0]+(j.to[0]-j.from[0])*k, j.from[1]+(j.to[1]-j.from[1])*k];
  }
  return cr.pos;
}
function nextEvent(){
  let best=null;
  const consider=(t,fn)=>{ if(!best||t<best.t) best={t,fn}; };
  if(S.control.length) consider(S.control[0].tDone,doControl);
  S.crews.forEach((cr,i)=>{ const j=cr.job; if(j) consider(j.stage==='travel'?j.tArrive:j.tDone,()=>crewEvent(i)); });
  if(S.pending.length) consider(S.pending[0].t,()=>handleEvent(false));
  return best;
}
function advance(dt){
  const target=S.t+dt;
  for(let g=0;g<200;g++){
    const ev=nextEvent();
    if(!ev||ev.t>target){ accrue(target-S.t); break; }
    accrue(ev.t-S.t); ev.fn(); afterChange();
    if(S.paused) break;
  }
}
function handleEvent(initial){
  const p=S.pending.shift();
  if(p.kind==='theft'){
    S.theft[p.node]=true; S.lvOut[p.node]=true;
    log(`Intruder alarm at ${N[p.node].name} substation. Police report the door forced and copper earth bonds and low-voltage cables stolen. The site is unsafe and its switchgear is locked out.`,'bad');
    if(!initial){ S.paused=true; toast(`Intruder alarm at ${N[p.node].name}. Clock paused.`); }
    return {tripped:[]};
  }
  const c=CBL[p.cable], f={cable:p.cable,active:true,transient:!!p.transient,trips:0,t:S.t};
  if(p.kind==='digin'){
    f.digin=true; f.found=true; f.transient=false; S.tested[p.cable]='fault';
    log(`Call from Island Civils: a mini-digger has hit the 11 kV cable between ${N[c.a].name} and ${N[c.b].name}. Their crew are clear and unhurt.`,'bad');
  }
  S.faults.push(f);
  const r=protect(true);
  if(!initial&&(r.tripped.length||f.digin)){
    S.paused=true;
    const what=f.digin?'Digger strike reported':`${r.tripped.map(cb=>'CB '+CB[cb].name).join(' and ')} tripped`;
    toast(`${S.scen==='storm'||S.scen==='bigstorm'?'Storm: ':''}${what}. Clock paused.`);
  }
  return r;
}
function parallelBlock(sid){
  const [cid,e]=sid.split(':'), c=CBL[cid], oe=other(e);
  if(!S.sw[cid+':'+oe]) return null;
  const sol=solve(), pa=sidePrim(sol,c[e]), pb=sidePrim(sol,c[oe]);
  if(pa&&pb&&pa!==pb) return `closing the ${switchLabel(sid)} would parallel ${N[pa].name} and ${N[pb].name}. Make one side dead first.`;
  return null;
}
function applyOp(sid,close,who){
  if(S.sw[sid]===close){ log(`${switchLabel(sid)} is already ${close?'closed':'open'}.`); return; }
  if(locked(nodeOfSw(sid))){ log(`Refused: ${N[nodeOfSw(sid)].name} is unsafe after the theft. It must be made safe before anything there is operated.`,'warn'); return; }
  if(close){ const why=parallelBlock(sid); if(why){ log('Refused: '+why,'warn'); toast('Refused: '+why); return; } }
  S.sw[sid]=close; S.ops++;
  log(`${close?'Closed':'Opened'} ${switchLabel(sid)} (${who}).`);
  const r=protect(false);
  if(who!=='remote'&&close&&r.fault){
    S.safety++;
    log(`${who} closed a switch onto a fault. In real life that is a serious safety incident: prove a section healthy before closing onto it by hand.`,'bad');
  }
}
function doControl(){ const op=S.control.shift(); applyOp(op.sw,op.close,'remote'); }
function jobText(j){
  const c=j.cable?CBL[j.cable]:null;
  if(j.type==='op'){ const [cid,e]=j.sw.split(':'); return `${j.close?'Close':'Open'} switch to ${N[CBL[cid][other(e)]].name}`; }
  if(j.type==='visit') return 'Read FPI';
  if(j.type==='makesafe') return 'Make safe after theft';
  if(j.type==='test') return `Test cable to ${N[c.a===j.node?c.b:c.a].name}`;
  return `Repair cable to ${N[c.a===j.node?c.b:c.a].name}`;
}
function startNext(i){
  const cr=S.crews[i];
  if(cr.job||!cr.queue.length) return;
  const j=cr.queue.shift();
  j.from=crewPos(cr).slice(); j.to=N[j.node].m.slice(); j.t1=S.t;
  const d=cr.at===j.node?0:tt(j.from,j.to);
  j.tArrive=S.t+d; j.stage='travel';
  if(d>0) cr.at=null;
  cr.job=j;
}
function crewEvent(i){
  const cr=S.crews[i], j=cr.job;
  if(j.stage==='travel'){
    const was=cr.at; cr.pos=j.to.slice(); cr.at=j.node;
    if(was!==j.node){
      S.fpi[j.node].known=true;
      log(`${cr.id} at ${N[j.node].name}. FPI ${S.fpi[j.node].trip?'TRIPPED':'not tripped'}.`,S.fpi[j.node].trip?'warn':'');
    }
    if((j.type==='test'||j.type==='repair')&&solve().cab[j.cable]){
      log(`${cr.id} cannot ${j.type} ${cableName(CBL[j.cable])}: the cable is live.`,'warn');
      cr.job=null; startNext(i); return;
    }
    const dig=j.type==='repair'&&faultOn(j.cable)&&faultOn(j.cable).digin;
    j.stage='work'; j.tDone=S.t+(dig?240:WORK[j.type]);
    if(j.type==='test') log(`${cr.id} testing ${cableName(CBL[j.cable])} (30 min).`);
    if(j.type==='repair') log(dig?`${cr.id} repairing the digger damage on ${cableName(CBL[j.cable])} (about 4 hours).`:`${cr.id} excavating and jointing ${cableName(CBL[j.cable])} (about 2½ hours).`);
    if(j.type==='makesafe') log(`${cr.id} making ${N[j.node].name} safe: new earth bonds and LV joints (about 1½ hours).`);
    return;
  }
  cr.job=null;
  if(j.type==='op') applyOp(j.sw,j.close,cr.id);
  else if(j.type==='test'){
    const f=faultOn(j.cable);
    if(f&&!f.transient){ S.tested[j.cable]='fault'; f.found=true; log(`Fault confirmed on ${cableName(CBL[j.cable])}. Keep it isolated until it is repaired.`,'warn'); }
    else { if(f) f.active=false; S.tested[j.cable]='healthy'; log(`${cableName(CBL[j.cable])} tested healthy.`,'good'); }
  } else if(j.type==='repair'){
    const f=faultOn(j.cable);
    if(f){ f.active=false; f.repaired=true; }
    S.tested[j.cable]='repaired';
    log(`${cr.id} repaired ${cableName(CBL[j.cable])}. Cable tested and ready to return to service.`,'good');
  } else if(j.type==='makesafe'){
    S.theft[j.node]=false; S.lvOut[j.node]=false;
    log(`${cr.id} made ${N[j.node].name} safe. Earth bonds replaced, LV cables jointed and the switchgear released.`,'good');
  }
  startNext(i);
}

// ---------- Orders from the player ----------
function crewPlan(cr){
  let t=S.t, pos=crewPos(cr);
  const j=cr.job;
  if(j){ t=j.stage==='travel'?j.tArrive+WORK[j.type]:j.tDone; pos=j.to; }
  cr.queue.forEach(q=>{ t+=tt(pos,N[q.node].m)+WORK[q.type]; pos=N[q.node].m; });
  return {t,pos};
}
function crewEta(i,node,type){ const cr=S.crews[i], p=crewPlan(cr); const d=cr.at===node&&!cr.job&&!cr.queue.length?0:tt(p.pos,N[node].m); return p.t+d+WORK[type]-S.t; }
function chooseCrew(node,type){
  if(S.dispatch!=='auto'&&S.crews[S.dispatch]) return S.dispatch;
  let best=0, bt=Infinity;
  S.crews.forEach((_,i)=>{ const e=crewEta(i,node,type); if(e<bt){bt=e;best=i;} });
  return best;
}
function pendingFor(sid){
  if(S.control.some(o=>o.sw===sid)) return 'control';
  for(const cr of S.crews){ if((cr.job&&cr.job.sw===sid)||cr.queue.some(j=>j.sw===sid)) return cr.id; }
  return null;
}
const cableBusy = cid=>S.crews.some(cr=>(cr.job&&cr.job.cable===cid)||cr.queue.some(j=>j.cable===cid));
const canOrder = ()=>S&&S.phase!=='closed';
function dispatch(job){
  const i=chooseCrew(job.node,job.type), cr=S.crews[i];
  cr.queue.push(job);
  log(`${cr.id} given job: ${jobText(job)} at ${N[job.node].name}.`);
  if(!cr.job) startNext(i);
}
function orderOp(sid,close){
  if(!canOrder()) return;
  if(pendingFor(sid)){ toast('That switch already has an operation queued.'); return; }
  if(locked(nodeOfSw(sid))){ toast(`Locked out: ${N[nodeOfSw(sid)].name} is unsafe after the theft. Send a crew to make it safe first.`); return; }
  // with nothing else queued we can refuse straight away; otherwise queued orders may change
  // the picture first, so the check happens when the switch is actually operated
  const idle=!S.control.length&&S.crews.every(cr=>!cr.job&&!cr.queue.length);
  if(close&&idle){ const why=parallelBlock(sid); if(why){ toast('Blocked: '+why); return; } }
  if(remoteFor(sid)){
    const last=S.control.length?S.control[S.control.length-1].tDone:S.t;
    S.control.push({sw:sid,close,tDone:Math.max(last,S.t)+2});
  } else dispatch({type:'op',node:nodeOfSw(sid),sw:sid,close});
  afterChange(); render();
}
function orderVisit(n){ if(!canOrder()) return; dispatch({type:'visit',node:n}); afterChange(); render(); }
const safeBusy = n=>S.crews.some(cr=>(cr.job&&cr.job.type==='makesafe'&&cr.job.node===n)||cr.queue.some(j=>j.type==='makesafe'&&j.node===n));
function orderMakeSafe(n){ if(!canOrder()||safeBusy(n)) return; dispatch({type:'makesafe',node:n}); afterChange(); render(); }
function nearEnd(cid,i){
  const c=CBL[cid], ends=[c.a,c.b].filter(x=>N[x].kind!=='primary');
  if(ends.length===1) return ends[0];
  const p=crewPlan(S.crews[i]).pos;
  return dist(N[ends[0]].m,p)<=dist(N[ends[1]].m,p)?ends[0]:ends[1];
}
function orderCable(cid,type){
  if(!canOrder()) return;
  if(solve().cab[cid]){ toast('That cable is live. Open the switches at both ends, or make sure both ends are dead, first.'); return; }
  const c=CBL[cid], ends=[c.a,c.b].filter(x=>N[x].kind!=='primary');
  const i=chooseCrew(ends[0],type);
  const job={type,node:nearEnd(cid,i),cable:cid}, cr=S.crews[i];
  cr.queue.push(job);
  log(`${cr.id} given job: ${jobText(job)}.`);
  if(!cr.job) startNext(i);
  afterChange(); render();
}
function cancelJob(i,q){
  const cr=S.crews[i];
  if(q>=0){ const j=cr.queue.splice(q,1)[0]; if(j) log(`${cr.id}: cancelled ${jobText(j)}.`); }
  else if(cr.job){
    const j=cr.job;
    if(j.stage==='travel'){ cr.pos=crewPos(cr).slice(); cr.at=null; }
    cr.job=null; log(`${cr.id}: stopped ${jobText(j)}.`);
    startNext(i);
  }
  dirty=true; render();
}

// ---------- New incident ----------
// Work out what will happen during the shift. The first event always takes customers off.
function planEvents(scen,t,shift){
  const R=Math.random, rint=(a,b)=>a+Math.floor(R()*(b-a));
  const pool=FAULTABLE.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  // the first cable event must hit a live cable (and the shift's area, if it has one) so a breaker trips
  const live=solve().cab;

  else if(scen==='mixed'){ ev.push({kind:'fault',t,cable:take(),transient:R()<0.2}); ev.push({kind:'theft',t:t+rint(30,90),node:theftNode()}); ev.push({kind:'digin',t:t+rint(90,180),cable:take()}); }

function newIncident(def,scen,crews,shift=null){

     ci:0,cml:0,affected:0,ops:0,faultTrips:0,overloads:0,safety:0,shift:shift?shift.id:null,brief:shift?shift.brief:'',
     crews:Array.from({length:crews},(_,i)=>({id:'Crew '+(i+1),tag:'CR'+(i+1),pos:NET.depot.slice(),at:'depot',job:null,queue:[]})),
     control:[],log:[],tested:{},sel:null,phase:'restore',modal:null,dispatch:'auto',headline:'',stormUntil:null,restored:null,closedAt:null};

  else if(first.kind==='digin') S.headline=`At ${fmtT(t)} a digger struck the ${cableName(CBL[first.cable])} cable${cb?` and breaker ${CB[cb].name} (${CB[cb].feeder}) tripped`:''}. ${off} customers are off supply.`;
  else S.headline=cb?`At ${fmtT(t)} breaker ${CB[cb].name} (${CB[cb].feeder}) at ${N[CB[cb].prim].name} tripped. ${off} customers are off supply.`
                     :`At ${fmtT(t)} a cable failed on a section that is not in use.`;

  const offNames=RMUS.filter(n=>!S.on[n]).map(n=>N[n].name);
  log(`${off} customers off. Calls coming in from ${offNames.slice(0,3).join(', ')}${offNames.length>3?' and more':''}.`);
  log(`${plural(crews,'crew')} at the depot, ready to go. The clock is paused until you start it.`);

}

function busOf(id){
  const n=N[id]; let y1=n.s[1], y2=n.s[1];
  INC[id].forEach(({c,end})=>{ const o=N[c[other(end)]]; y1=Math.min(y1,o.s[1]); y2=Math.max(y2,o.s[1]); });
  return [n.s[0],y1-20,y2+20];
}
function attach(c,e){
  const n=N[c[e]]; if(n.kind!=='primary') return n.s;
  const [x,y1,y2]=busOf(c[e]), oy=N[c[other(e)]].s[1];
  return [x,Math.max(y1,Math.min(y2,oy))];
}
function pts(c){ return UI.view==='s'?(c.sp||[attach(c,'a'),attach(c,'b')]):(c.mp||[N[c.a].m,N[c.b].m]); }
function along(p,e,d){
  const q=e==='a'?p:p.slice().reverse();
  const [x0,y0]=q[0],[x1,y1]=q[1], L=Math.hypot(x1-x0,y1-y0)||1, k=Math.min(d,L*0.42)/L;
  return [x0+(x1-x0)*k,y0+(y1-y0)*k,Math.abs(x1-x0)>=Math.abs(y1-y0)];
}
function midOf(p){
  const seg=[]; let L=0;
  for(let i=0;i<p.length-1;i++){ const l=dist(p[i],p[i+1]); seg.push(l); L+=l; }
  let d=L/2;
  for(let i=0;i<seg.length;i++){ if(d<=seg[i]){ const k=d/(seg[i]||1); return [p[i][0]+(p[i+1][0]-p[i][0])*k,p[i][1]+(p[i+1][1]-p[i][1])*k]; } d-=seg[i]; }
  return p[p.length-1];
}
function distSeg(p,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
  let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);
}
function roadLines(){ return [...CABLES.map(c=>c.mp||[N[c.a].m,N[c.b].m]),...((NET.decor&&NET.decor.roads)||[])]; }
function blocks(){
  if(BLOCKS) return BLOCKS;
  let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const segs=[]; roadLines().forEach(r=>{ for(let i=0;i<r.length-1;i++) segs.push([r[i],r[i+1]]); });
  const parks=(NET.decor&&NET.decor.parks)||[], out=[];
  // keep buildings on dry land when the network has a coastline
  let onLand=()=>true;
  try{ if(NET.decor&&NET.decor.coast){ const p=new Path2D(NET.decor.coast), cx=document.createElement('canvas').getContext('2d'); onLand=(x,y)=>cx.isPointInPath(p,x,y); } }catch(e){}
  RMUS.forEach(n=>{
    const [cx,cy]=N[n].m, count=Math.round(6+(N[n].cust||0)/35);
    for(let i=0;i<count;i++){
      const ang=rnd()*Math.PI*2, r=24+rnd()*54, x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r, w=8+rnd()*12, h=7+rnd()*9;
      if(segs.some(s=>distSeg([x,y],s[0],s[1])<15)) continue;
      if(parks.some(p=>x>p[0]-8&&x<p[0]+p[2]+8&&y>p[1]-8&&y<p[1]+p[3]+8)) continue;
      if(!onLand(x-w/2,y-h/2)||!onLand(x+w/2,y+h/2)) continue;
      out.push([x-w/2,y-h/2,w,h]);
    }

  return BLOCKS=out;
}

function costText(sid){

function swRow(sid,ctxNode){

  const lock=!canOrder(), pend=pendingFor(sid), abn=closed!==!NOPS.has(sid);
  const name=CB[sid]?`CB ${CB[sid].name} to ${N[far].name}`:ctxNode?`To ${N[far].name}`:`At ${N[node].name}`;
  const tag=NOPS.has(sid)?'<span class="tag">NOP</span>':'';
  const btn=locked(node)?`<button class="btn alt" disabled>Locked<small>site unsafe</small></button>`
    :pend?`<button class="btn alt" disabled>Queued<small>${pend==='control'?'control room':pend}</small></button>`
    :`<button class="btn${closed?' alt':''}" data-act="op" data-sw="${sid}" data-close="${closed?0:1}" ${lock?'disabled':''}>${closed?'Open':'Close'}<small>${costText(sid)}</small></button>`;
  return `<div class="swrow${S.sel&&S.sel.sw===sid?' hl':''}"><div><div class="swname">${name}${tag}</div>
    <div class="swstate ${closed?'c':'o'}">${closed?'Closed':'Open'} · ${remoteFor(sid)?'remote':'manual'}${abn?' · <span class="abn">abnormal</span>':''}</div></div>${btn}</div>`;
}
function phaseBar(){
  const order=['restore','repair','closed'], cur=order.indexOf(S.phase);
  return `<ol class="phases">${['Restore supply','Repair','Normal running'].map((l,i)=>`<li class="${i<cur||S.phase==='closed'?'done':i===cur?'now':''}">${l}</li>`).join('')}</ol>`;
}
function incidentPanel(){
  const sh=SHIFTS.find(x=>x.id===S.shift);
  let h=`<h2>${sh?sh.title.replace(/^Shift \d+ · /,''):'Incident'}</h2><p class="lead">${S.headline}</p>${phaseBar()}`;
  if(S.brief&&S.phase!=='closed') h+=`<div class="brief"><b>Note from Mags</b>${S.brief}</div>`;
  const thefts=RMUS.filter(n=>S.theft[n]);
  if(thefts.length) h+=`<div class="alertbox"><b>Unsafe after copper theft:</b> ${thefts.map(n=>`<button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button>`).join(', ')}. Send a crew to make ${thefts.length===1?'it':'them'} safe.</div>`;
  if(S.stormUntil&&S.pending.length) h+=`<p class="note"><b>Storm in progress.</b> More faults are likely until about ${fmtT(S.stormUntil)}.</p>`;
  if(S.phase==='restore'){
    h+=`<ol class="steps"><li><b>Locate.</b> Fault passage indicators (flags) trip between the breaker and the fault. Remote sites report straight away. Manual sites need a crew to read them.</li>
      <li><b>Isolate.</b> Open the switches at <i>both</i> ends of the faulty cable.</li>
      <li><b>Restore.</b> Close the breaker, and close normally open points (NOPs) to back-feed from another feeder. Watch the feeder loading.</li></ol>
      <p class="note">Interruptions of 3 minutes or more count towards CI. Pause the clock with the space bar to plan, then queue orders and let it run.</p>`;
  } else if(S.phase==='repair'){
    const found=S.faults.filter(f=>f.active&&S.tested[f.cable]==='fault');
    const hidden=S.faults.filter(f=>f.active&&S.tested[f.cable]!=='fault').length;
    const abn=Object.keys(S.sw).filter(k=>S.sw[k]!==!NOPS.has(k));
    h+=`<p class="note">Everyone is back on. Now repair the damage and put the network back to its normal running arrangement.</p><ul class="todo">`;
    found.forEach(f=>{ h+=`<li>Repair: <button class="linkbtn" data-act="selc" data-c="${f.cable}">${cableName(CBL[f.cable])}</button></li>`; });
    if(hidden) h+=`<li>${plural(hidden,'faulty cable')} not yet located. Test the dead sections to find ${hidden===1?'it':'them'}.</li>`;
    if(!found.length&&!hidden) h+='<li>All faults repaired ✓</li>';
    h+='</ul>';
    if(abn.length){
      h+=`<h3 style="margin-top:14px">Switches out of normal position (${abn.length})</h3><ul class="todo">`+
        abn.map(sid=>`<li><button class="linkbtn" data-act="selsw" data-sw="${sid}">${switchLabel(sid)}</button> <span class="muted">should be ${NOPS.has(sid)?'open':'closed'}</span></li>`).join('')+'</ul>';
    } else h+='<p class="note">All switches are in their normal positions.</p>';

  }
  return h;
}

function validate(){
  const err=[], warn=[], ids=Object.keys(N);
  if(!PRIMS.length) err.push('Add at least one primary substation.');
  if(!RMUS.length) err.push('Add at least one substation with customers.');
  CABLES.forEach(c=>{ if(N[c.a].kind==='primary'&&N[c.b].kind==='primary') err.push(`${cableName(c)} joins two primaries. Delete it.`); });
  const adj={}; ids.forEach(k=>adj[k]=[]); CABLES.forEach(c=>{adj[c.a].push(c.b);adj[c.b].push(c.a);});
  const seen=new Set(PRIMS), q=[...PRIMS];
  while(q.length){ const n=q.shift(); adj[n].forEach(m=>{ if(!seen.has(m)){seen.add(m);q.push(m);} }); }
  RMUS.forEach(n=>{ if(!seen.has(n)) err.push(`${N[n].name} has no cable route to a primary.`); });
  if(!FAULTABLE.length&&RMUS.length) err.push('Add some cables that can develop faults.');
  const sw=normalSw(), sol=solve(sw);
  sol.islands.forEach(isl=>{ const ps=[...new Set(isl.cbs.map(cb=>CB[cb].prim))]; if(ps.length>1) err.push(`In normal running ${ps.map(p=>N[p].name).join(' and ')} are connected. Add a normally open point between them.`); });
  RMUS.forEach(n=>{ if(seen.has(n)&&sol.island[n]==null) warn.push(`${N[n].name} is off supply in normal running. Check the normally open points.`); });
  CBIDS.forEach(id=>{ const a=cbLoad(sol,id); if(a>CB[id].rating) warn.push(`${CB[id].name} ${CB[id].feeder} carries ${Math.round(a)} A against a ${CB[id].rating} A rating in normal running.`); });
  const codes={}; RMUS.forEach(n=>{ const c=N[n].code; if(c){ if(codes[c]) warn.push(`Code ${c} is used twice.`); codes[c]=1; } });
  return {err,warn};
}

function svgPoint(evt){
  const svg=$('#svg'), p=svg.createSVGPoint(); p.x=evt.clientX; p.y=evt.clientY;
  const r=p.matrixTransform(svg.getScreenCTM().inverse());
  const g=UI.view==='s'?10:5, d=E.def;
  return [Math.max(20,Math.min(d.w-20,Math.round(r.x/g)*g)),Math.max(20,Math.min(d.h-20,Math.round(r.y/g)*g))];
}
function uid(prefix,taken){ let i=1; while(taken[prefix+i]) i++; return prefix+i; }
function addNode(kind,p){
  const d=E.def, id=uid(kind==='prim'?'P':'R',d.nodes);
  if(kind==='prim') d.nodes[id]={name:'New Primary',kind:'primary',s:p.slice(),m:p.slice()};
  else{
    const used=new Set(Object.values(d.nodes).map(n=>n.code)); let k=1; while(used.has('R'+k)) k++;
    d.nodes[id]={code:'R'+k,name:'Substation R'+k,cust:300,s:p.slice(),m:p.slice()};
  }
  E.sel={k:'node',id};
}
function addCable(a,b){
  const d=E.def;
  if(d.nodes[a].kind==='primary'&&d.nodes[b].kind==='primary'){ toast('Primaries connect to substations, not to each other.'); return; }
  if(d.cables.some(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a))){ toast('Those two are already connected.'); return; }
  if(d.nodes[b].kind==='primary') [a,b]=[b,a];
  const taken={}; d.cables.forEach(c=>taken[c.id]=1);
  const c={id:uid('K',taken),a,b};
  if(d.nodes[a].kind==='primary') c.rating=400;
  d.cables.push(c); E.sel={k:'cable',id:c.id};
}
function delNode(id){ const d=E.def; delete d.nodes[id]; d.cables=d.cables.filter(c=>c.a!==id&&c.b!==id); E.sel=null; }
function delCable(id){ const d=E.def; d.cables=d.cables.filter(c=>c.id!==id); E.sel=null; }
function moveNode(id,dx,dy){
  const d=E.def, n=d.nodes[id], vk=UI.view==='s'?'s':'m', pk=vk==='s'?'sp':'mp';
  n[vk]=[n[vk][0]+dx,n[vk][1]+dy];
  d.cables.forEach(c=>{
    if(!c[pk]) return;
    if(c.a===id) c[pk][0]=[c[pk][0][0]+dx,c[pk][0][1]+dy];
    if(c.b===id){ const L=c[pk].length-1; c[pk][L]=[c[pk][L][0]+dx,c[pk][L][1]+dy]; }
  });
  if(vk==='m') BLOCKS=null;
}
function editPointerDown(e){
  const el=e.target.closest('[data-k]'), k=el&&el.dataset.k, id=el&&el.dataset.id, p=svgPoint(e);
  let panel=true;
  switch(E.tool){
    case 'select':
      if(k==='node'){ E.sel={k:'node',id}; const n=E.def.nodes[id]; E.drag={id,last:p,moved:false}; e.preventDefault(); }
      else if(k==='cable') E.sel={k:'cable',id};
      else if(k==='sw') E.sel={k:'cable',id:id.split(':')[0]};
      else E.sel=null;
      break;
    case 'sub': case 'prim':
      if(k==='node') E.sel={k:'node',id}; else if(!k) addNode(E.tool,p);
      break;
    case 'cable':
      if(k==='node'){ if(!E.pend) E.pend=id; else if(E.pend===id) E.pend=null; else { addCable(E.pend,id); E.pend=null; } }
      else E.pend=null;
      break;
    case 'depot':
      if(UI.view!=='m'){ toast('Switch to the map view to place the depot.'); return; }
      E.def.depot=p; panel=false;
      break;
    case 'del':
      if(k==='node') delNode(id); else if(k==='cable') delCable(id); else if(k==='sw') delCable(id.split(':')[0]);
      break;
  }
  editChanged(panel);
}
let dragRaf=0;
function editDrag(e){
  const p=svgPoint(e), dx=p[0]-E.drag.last[0], dy=p[1]-E.drag.last[1];
  if(!dx&&!dy) return;
  moveNode(E.drag.id,dx,dy); E.drag.last=p; E.drag.moved=true;
  if(!dragRaf) dragRaf=requestAnimationFrame(()=>{ dragRaf=0; useNetwork(E.def); renderSvg(true); });
}
function normalizeDef(d){
  if(!d||typeof d!=='object'||!d.nodes||typeof d.nodes!=='object'||!Array.isArray(d.cables)) throw new Error('That isn\'t an Open Point network. It needs "nodes" and "cables".');
  const num=v=>typeof v==='number'&&isFinite(v);
  const pt=p=>Array.isArray(p)&&p.length===2&&num(p[0])&&num(p[1])?[p[0],p[1]]:null;
  const line=l=>Array.isArray(l)&&l.length>=2&&l.every(pt)?l.map(pt):null;
  const SIZES={1000:560,1500:800,1600:900}, w=SIZES[d.w]?d.w:1000;
  const out={name:clean(d.name||'Imported network',40)||'Imported network',w,h:SIZES[w],nodes:{},cables:[]};
  if(d.dwg) out.dwg=clean(d.dwg,24);
  out.depot=pt(d.depot)||[60,out.h-50];
  if(Array.isArray(d.mlDefault)&&num(d.mlDefault[0])&&num(d.mlDefault[1])&&['start','middle','end'].includes(d.mlDefault[2])) out.mlDefault=d.mlDefault.slice(0,3);
  Object.keys(d.nodes).forEach(k=>{
    const n=d.nodes[k], id=clean(k,12).replace(/[^A-Za-z0-9_-]/g,'');
    if(!id||!n||!pt(n.s)||!pt(n.m)) return;
    const o={name:clean(n.name||id,32)||id,s:pt(n.s),m:pt(n.m)};
    if(n.kind==='primary') o.kind='primary';
    else{
      o.code=clean(n.code||'',4); o.cust=Math.max(0,Math.min(5000,Math.round(+n.cust||0)));
      if(n.remote) o.remote=true;
      if(['b','bl','br','r','l'].includes(n.sl)) o.sl=n.sl;
      if(n.note) o.note=clean(n.note,120);
    }
    if(Array.isArray(n.ml)&&num(n.ml[0])&&num(n.ml[1])&&['start','middle','end'].includes(n.ml[2])) o.ml=n.ml.slice(0,3);
    out.nodes[id]=o;
  });
  const taken={};
  d.cables.forEach(c=>{
    if(!c||!out.nodes[c.a]||!out.nodes[c.b]||c.a===c.b) return;
    let id=clean(c.id||'',12).replace(/[^A-Za-z0-9_-]/g,''); if(!id||taken[id]) id=uid('K',taken); taken[id]=1;
    const o={id,a:c.a,b:c.b};
    if(c.nop==='a'||c.nop==='b') o.nop=c.nop;
    if(num(c.rating)) o.rating=Math.max(50,Math.min(1000,Math.round(c.rating)));
    if(c.feeder) o.feeder=clean(c.feeder,20);
    if(line(c.sp)) o.sp=line(c.sp);
    if(line(c.mp)) o.mp=line(c.mp);
    out.cables.push(o);
  });
  if(d.decor&&typeof d.decor==='object'){
    const dc={};
    if(typeof d.decor.river==='string'&&/^[0-9MCSLQZmcslqz ,.\-]+$/.test(d.decor.river)) dc.river=d.decor.river.slice(0,400);
    if(typeof d.decor.coast==='string'&&/^[0-9MCSLQZmcslqz ,.\-]+$/.test(d.decor.coast)) dc.coast=d.decor.coast.slice(0,2000);
    if(Array.isArray(d.decor.hills)) dc.hills=d.decor.hills.filter(k=>Array.isArray(k)&&k.slice(0,4).every(num)).map(k=>k.slice(0,4));
    if(Array.isArray(d.decor.parks)) dc.parks=d.decor.parks.filter(p=>Array.isArray(p)&&p.slice(0,4).every(num)).map(p=>[p[0],p[1],p[2],p[3],clean(p[4]||'',30)]);
    if(Array.isArray(d.decor.labels)) dc.labels=d.decor.labels.filter(l=>Array.isArray(l)&&num(l[0])&&num(l[1])).map(l=>l[3]==='town'||l[3]==='sea'?[l[0],l[1],clean(l[2]||'',30),l[3]]:[l[0],l[1],clean(l[2]||'',30)]);
    if(Array.isArray(d.decor.roads)) dc.roads=d.decor.roads.map(line).filter(Boolean);
    out.decor=dc;
  }
  return out;
}

    case 'op': orderOp(b.dataset.sw,b.dataset.close==='1'); break;
    case 'visit': orderVisit(b.dataset.n); break;
    case 'test': orderCable(b.dataset.c,'test'); break;
    case 'repair': orderCable(b.dataset.c,'repair'); break;
    case 'cancel': cancelJob(+b.dataset.crew,+b.dataset.q); break;
    case 'dispatch': S.dispatch=b.dataset.v==='auto'?'auto':+b.dataset.v; renderSide(); break;
    case 'desel': S.sel=null; render(); break;
    case 'selc': S.sel={k:'cable',id:b.dataset.c}; render(); break;
    case 'selsw': S.sel={k:'node',id:nodeOfSw(b.dataset.sw),sw:b.dataset.sw}; render(); break;
    case 'seln': S.sel={k:'node',id:b.dataset.n}; render(); break;
    case 'makesafe': orderMakeSafe(b.dataset.n); break;
    case 'home': UI.overlay='home'; UI.letter=false; if(S) S.paused=true; renderStats(); renderOverlay(); break;
    case 'letter': UI.letter=true; renderOverlay(); break;
    case 'letter-done': UI.letter=false; try{ localStorage.setItem('openpoint.letterRead','1'); }catch(err){} renderOverlay(); break;
    case 'shift': startShift(b.dataset.v); break;
    case 'setup': UI.overlay='setup'; if(S) S.paused=true; renderOverlay(); break;
    case 'su-scen': UI.setup.scen=b.dataset.v; UI.setup.crews=b.dataset.v==='storm'?3:2; renderOverlay(); break;
    case 'su-crews': UI.setup.crews=+b.dataset.v; renderOverlay(); break;
    case 'su-start': {
      UI.setup.net=$('#su-net').value;
      if(S) S.modal=null;
      newIncident(resolveNet(UI.setup.net),UI.setup.scen,UI.setup.crews);
      UI.overlay=null; UI.mode='play'; render(); break;
    }
    case 'ov-close': UI.overlay=null; UI.msg=''; render(); break;
    case 'm-continue': S.modal=null; UI.overlay=null; S.paused=false; render(); break;
    case 'm-view': S.modal=null; UI.overlay=null; render(); break;
    case 'tool': E.tool=b.dataset.v; E.pend=null; renderTools(); renderSvg(true); break;
    case 'e-delsel': if(E.sel){ if(E.sel.k==='node') delNode(E.sel.id); else delCable(E.sel.id); editChanged(true); } break;
    case 'e-straight': { const c=E.def.cables.find(x=>x.id===E.sel.id); if(c){ delete c[UI.view==='s'?'sp':'mp']; BLOCKS=null; editChanged(true); } break; }
    case 'e-save': {
      const all=savedList(); if(!E.key) E.key='n'+Date.now().toString(36);
      all[E.key]=E.def; toast(writeSaved(all)?'Saved in this browser.':'This browser blocked saving. Use Export to keep a copy.');
      renderEditSide(); break;
    }
    case 'e-del': {
      if(!E.confirmDel){ E.confirmDel=true; renderEditSide(); break; }
      const all=savedList(); delete all[E.key]; writeSaved(all); E.key=null; E.confirmDel=false; toast('Saved copy deleted. The network is still open in the editor.'); renderEditSide(); break;
    }
    case 'e-new': E.def={name:'My network',w:1000,h:560,depot:[60,510],nodes:{},cables:[]}; E.key=null; E.sel=null; E.pend=null; E.tool='prim'; editChanged(true); renderTools(); break;
    case 'e-export': UI.overlay='export'; renderOverlay(); break;
    case 'e-import': UI.overlay='import'; UI.msg=''; renderOverlay(); break;
    case 'ex-copy': {
      const ta=$('#ex-text');
      try{ navigator.clipboard.writeText(ta.value).then(()=>toast('Copied.'),()=>{ ta.focus(); ta.select(); }); }catch(err){ ta.focus(); ta.select(); }
      break;
    }
    case 'im-load': {
      try{ const d=normalizeDef(JSON.parse($('#im-text').value)); E.def=d; E.key=null; E.sel=null; UI.overlay=null; UI.msg=''; editChanged(true); renderOverlay(); toast(`Loaded ${d.name}.`); }
      catch(err){ UI.msg=err instanceof SyntaxError?'That text isn\'t valid JSON. Paste the whole export, including the first { and last }.':err.message; renderOverlay(); }
      break;
    }
    case 'e-play': {
      const v=validate();
      if(v.err.length){ toast('Fix the problems listed under Checks first.'); break; }
      UI.setup.net='editor'; UI.overlay='setup'; renderOverlay(); break;
    }
  }
});
function editInput(e){
  if(UI.mode!=='edit') return;
  const t=e.target, d=E.def, sel=E.sel, n=sel&&sel.k==='node'?d.nodes[sel.id]:null, c=sel&&sel.k==='cable'?d.cables.find(x=>x.id===sel.id):null;
  switch(t.id){
    case 'e-name': d.name=clean(t.value,40)||'Untitled'; $('#netName').textContent=`Editing ${d.name}`; break;
    case 'e-size': { const S2={1000:560,1500:800,1600:900}; d.w=S2[+t.value]?+t.value:1000; d.h=S2[d.w]; break; }
    case 'e-open': if(e.type==='change') editLoad(t.value); return;
    case 'e-n-name': if(n) n.name=clean(t.value,32)||'Unnamed'; break;
    case 'e-n-code': if(n) n.code=clean(t.value,4).toUpperCase(); break;
    case 'e-n-cust': if(n) n.cust=Math.max(0,Math.min(5000,parseInt(t.value,10)||0)); break;
    case 'e-n-remote': if(n) n.remote=t.checked; break;
    case 'e-n-sl': if(n) n.sl=t.value; break;
    case 'e-c-nop': if(c){ if(t.value) c.nop=t.value; else delete c.nop; } break;
    case 'e-c-rating': if(c) c.rating=Math.max(50,Math.min(1000,parseInt(t.value,10)||400)); break;
    case 'e-c-feeder': if(c){ const v=clean(t.value,20); if(v) c.feeder=v; else delete c.feeder; } break;
    default: return;
  }
  editChanged(false);
}
$('#editSide').addEventListener('input',editInput);
$('#editSide').addEventListener('change',editInput);

// ======================= Main loop =======================
// A steady timer drives the clock. An error in one tick is reported but never stops the clock.
let lastTick=performance.now(), sideTimer=0, ticker=null;
function tick(){
  const now=performance.now(), dtReal=Math.min(0.25,(now-lastTick)/1000); lastTick=now;
  try{
    if(UI.mode==='play'&&S&&!S.paused&&S.phase!=='closed'&&!UI.overlay){
      advance(dtReal*SPEEDS[S.speed]);
      sideTimer+=dtReal;
      if(dirty) render();
      else{
        lightUpdate();
        const ae=document.activeElement;
        if(sideTimer>2&&!(ae&&ae.closest&&ae.closest('.side'))){ sideTimer=0; renderSide(); }
      }
    }
  }catch(err){ console.error('Open Point tick failed',err); }
}

// ======================= Boot =======================
const SAVE_VERSION=4;
function start(data){
  // only resume a game saved by this version; older saves have a different shape
  if(data&&data.v===SAVE_VERSION&&data.S&&data.S.def){ S=data.S; Object.assign(UI,data.UI||{}); E=data.E||null; if(E) E.drag=null; }
  else {
    // first arrival: the first shift sits paused behind the control room screen
    newIncident(clone(MEGAWATT),SHIFTS[0].scen,SHIFTS[0].crews,SHIFTS[0]);
    let read=false; try{ read=localStorage.getItem('openpoint.letterRead')==='1'; }catch(e){}
    UI.overlay='home'; UI.letter=!read;
  }
  if(UI.mode==='edit'&&!E) UI.mode='play';
  useNetwork(UI.mode==='edit'?E.def:S.def);
  render();
  lastTick=performance.now();
  if(!ticker) ticker=setInterval(tick,50);
}
window.claude?.hot?.snapshot?.(()=>({v:SAVE_VERSION,S,UI,E}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
