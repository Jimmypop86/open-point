function editInput(e){
  if(UI.mode!=='edit') return;
  const t=e.target, d=E.def, sel=E.sel, n=sel&&sel.k==='node'?d.nodes[sel.id]:null, c=sel&&sel.k==='cable'?d.cables.find(x=>x.id===sel.id):null;
  switch(t.id){
    case 'e-name': d.name=clean(t.value,40)||'Untitled'; $('#netName').textContent=`Editing ${d.name}`; break;
    case 'e-size': { const S2={1000:560,1500:800,1600:900}; d.w=S2[+t.value]?+t.value:1000; d.h=S2[d.w]; break; }
    case 'e-open': if(e.type==='change') editLoad(t.value); return;
    case 'e-n-name': if(n) n.name=clean(t.value,32)||'Unnamed'; break;
    case 'e-n-code': if(n) n.code=clean(t.value,4).toUpperCase(); break;
    case 'e-n-cust': if(n) n.cust=Math.max(0,Math.min(5000,parseInt(t.value,10)||0)); break;
    case 'e-n-remote': if(n) n.remote=t.checked; break;
    case 'e-n-area': if(n){ const v=clean(t.value,24); if(v) n.area=v; else delete n.area; } break;
    case 'e-n-hosp': if(n){ const v=clean(t.value,40); if(v) n.hospital=v; else delete n.hospital; } break;
    case 'e-c-oh': if(c){ if(t.checked) c.oh=true; else delete c.oh; } break;
    case 'e-n-sl': if(n) n.sl=t.value; break;
    case 'e-c-nop': if(c){ if(t.value) c.nop=t.value; else delete c.nop; } break;
    case 'e-c-rating': if(c) c.rating=Math.max(50,Math.min(1000,parseInt(t.value,10)||400)); break;
    case 'e-c-feeder': if(c){ const v=clean(t.value,20); if(v) c.feeder=v; else delete c.feeder; } break;
    default: return;
  }
  editChanged(false);
}

// ======================= Main loop =======================
// A steady timer drives the clock. An error in one tick is reported but never stops the clock.
let lastTick=performance.now(), sideTimer=0, ticker=null;
function tick(){
  const now=performance.now(), dtReal=Math.min(0.25,(now-lastTick)/1000); lastTick=now;
  try{
    // the fault-current pulse fades after a few seconds, even with the clock paused
    if(UI.pulse&&now>UI.pulse.until){ UI.pulse=null; if(UI.mode==='play'&&S) renderSvg(false); }
    // if the browser isn't giving us animation frames, keep the boats and cars moving from here
    if(now-lastAnim>250) try{ moveMovers(); }catch(e){}
    updateWind();
    const R=UI.replay;
    if(R&&R.playing&&UI.mode==='play'){
      R.acc=(R.acc||0)+dtReal*6;
      if(R.acc>=1){ const n=Math.floor(R.acc); R.acc-=n; showFrame(R.i+n); if(R.i>=S.frames.length-1){ R.playing=false; renderReplayBar(); } }
    }
    if(UI.mode==='play'&&S&&!S.paused&&S.phase!=='closed'&&!UI.overlay){
      advance(dtReal*SPEEDS[S.speed]);
      checkAutoPause();
      sideTimer+=dtReal;
      if(dirty) render();
      else{
        lightUpdate();
        const ae=document.activeElement;
        if(sideTimer>2&&!(ae&&ae.closest&&ae.closest('.side'))){ sideTimer=0; renderSide(); }
      }
      if(UI.follow!=null) followStep();
    }
    if(UI.mode==='play') autoSave();
  }catch(err){ console.error('Open Point tick failed',err); }
}

// ---------- Alarm list ----------
// Every warning and bad event in the log becomes an alarm to acknowledge, linked to the switch, cable or substation it's about.
function alarmRef(text){
  for(const c of CABLES) if(text.includes(cableName(c))) return {k:'cable',id:c.id};
  const m=text.match(/\bCB ([A-Z]\d+)/); if(m){ const cb=CBIDS.find(id=>CB[id].name===m[1]); if(cb) return {k:'node',id:CB[cb].prim,sw:cb}; }
  const ns=Object.keys(N).sort((a,b)=>N[b].name.length-N[a].name.length);
  for(const n of ns) if(text.includes(N[n].name)) return {k:'node',id:n};
  return null;
}
function raiseAlarm(text,kind){
  if(!S) return;
  S.alarms=S.alarms||[]; S.alarmSeq=(S.alarmSeq||0)+1;
  S.alarms.unshift({id:S.alarmSeq,t:S.t,text,kind,ref:alarmRef(text),ack:false});
  if(S.alarms.length>80) S.alarms.pop();
  alarmSound(kind); dirty=true;
}
const unacked = ()=>(S&&S.alarms||[]).filter(a=>!a.ack);
function ackAlarm(id){ (S.alarms||[]).forEach(a=>{ if(id==null||a.id===id) a.ack=true; }); renderAlarms(); }
function goAlarm(id){
  const a=(S.alarms||[]).find(x=>x.id===id); if(!a) return;
  a.ack=true; UI.alarmOpen=false;
  if(a.ref){ S.sel=a.ref.k==='cable'?{k:'cable',id:a.ref.id}:{k:'node',id:a.ref.id,sw:a.ref.sw}; focusNode(a.ref.k==='cable'?CBL[a.ref.id].a:a.ref.id); }
  render();
}
function renderAlarms(){
  const el=$('#alarmBar'); if(!el) return;
  if(UI.mode!=='play'||!S){ el.hidden=true; return; }
  const all=S.alarms||[], un=all.filter(a=>!a.ack), last=un[0]||all[0];
  el.hidden=false;
  el.className='alarmbar play-only'+(un.some(a=>a.kind==='bad')?' hot':un.length?' warn':'');
  el.innerHTML=`<span class="al-n" title="Unacknowledged alarms">${un.length?`${un.length} new`:'No new alarms'}</span>
    ${last?`<button class="al-last" data-act="al-go" data-id="${last.id}" title="Show where this is"><time>${fmtT(last.t)}</time>${last.text}</button>`:'<span class="al-last" style="color:var(--desk-muted)">Alarms appear here as they happen.</span>'}
    ${un.length?`<button class="al-b" data-act="al-ackall">Acknowledge all</button>`:''}
    <button class="al-b" data-act="al-toggle" aria-expanded="${!!UI.alarmOpen}">${UI.alarmOpen?'Close ▴':`All (${all.length}) ▾`}</button>
    ${UI.alarmOpen?`<ul class="al-list">${all.length?all.slice(0,40).map(a=>`<li class="${a.kind}${a.ack?'':' new'}"><time>${fmtT(a.t)}</time><span>${a.text}</span>
      <span class="al-acts">${a.ref?`<button data-act="al-go" data-id="${a.id}">Show</button>`:''}${a.ack?'':`<button data-act="al-ack" data-id="${a.id}">Ack</button>`}</span></li>`).join(''):'<li><span class="al-empty">No alarms yet this shift.</span></li>'}</ul>`:''}`;
}
// ---------- What's coming up ----------
const TL_SPAN=240;   // game minutes shown ahead
function upcoming(){
  const out=[], add=(t,k,label,ref,dl)=>{ if(t!=null&&t>S.t-0.5&&t<=S.t+TL_SPAN) out.push({t,k,label,ref,dl:!!dl,key:k+':'+label}); };
  S.crews.forEach(cr=>{ const j=cr.job; if(!j) { if(cr.restUntil&&cr.queue.length) add(cr.restUntil,'crew',`${cr.id} back from rest`,null); return; }
    if(j.stage==='travel') add(j.tArrive,'crew',`${cr.id} arrives at ${N[j.node].name}`,{k:'node',id:j.node});
    else if(j.stage==='work') add(j.tDone,'done',`${cr.id}: ${jobText(j).toLowerCase()} done`,j.cable?{k:'cable',id:j.cable}:{k:'node',id:j.node}); });
  S.control.forEach(o=>add(o.tDone,'ctl',`Remote: ${o.close?'close':'open'} ${switchLabel(o.sw)}`,{k:'node',id:nodeOfSw(o.sw),sw:o.sw}));
  (S.gens||[]).forEach(g=>{ if(g.stage==='travel') add(g.tArrive,'gen',`Generator ${g.id} reaches ${N[g.node].name}`,{k:'node',id:g.node}); if(g.stage==='setup') add(g.tOn,'gen',`Generator ${g.id} on at ${N[g.node].name}`,{k:'node',id:g.node}); });
  (S.vans||[]).forEach(v=>{ if(v.stage==='travel') add(v.tArrive,'van',`Welfare van reaches ${N[v.node].name}`,{k:'node',id:v.node}); });
  Object.keys(S.etr||{}).forEach(a=>{ const e=S.etr[a]; if(!e.missed){ const n=RMUS.find(x=>!S.on[x]&&areaOf(x)===a); add(e.t,'etr',`Restoration time for ${a}`,n?{k:'node',id:n}:null,true); } });
  S.media.forEach(m=>{ if(!m.answered) add(m.deadline,'press',`Reply to ${m.outlet}`,null,true); });
  if(S.pole&&!S.pole.done) add(S.pole.deadline,'pole','Police deadline: switch off the pole',{k:'cable',id:S.pole.cable},true);
  if(S.flood&&S.flood.state==='warned') add(S.flood.at,'flood',`Flood water reaches ${N[S.flood.node].name}`,{k:'node',id:S.flood.node},true);

  return `<div class="planbox"><b>Switching schedule</b><p class="muted" style="margin:0 0 6px">Click switches (on the diagram or below) to add steps.</p>
    ${steps.length?`<ol class="plansteps">${steps.map((st,i)=>`<li class="${chk.first&&chk.first.i===i?'bad':''}"><span>${st.close?'Close':'Open'} ${switchLabel(st.sw)}<small>${remoteFor(st.sw)?'remote':'crew'}</small></span>
      <span class="pa">${i?`<button data-act="plan-up" data-i="${i}" aria-label="Move up">▲</button>`:''}<button data-act="plan-x" data-i="${i}" aria-label="Remove">✕</button></span></li>`).join('')}</ol>`:'<p class="note">No steps yet.</p>'}
    ${steps.length?`<p class="${chk.first?'pv-bad':'pv-good'}" style="margin:6px 0">${chk.first?`Step ${chk.first.i+1} won't work: ${chk.first.why}.`:`Together: +${fmtN(chk.gain)} back on${chk.lose?`, −${fmtN(chk.lose)} off`:''}.`}</p>`:''}
    <div class="btnrow"><button class="btn" data-act="plan-send" ${!steps.length||!canOrder()?'disabled':''}>Send ${plural(steps.length,'step')}</button><button class="btn alt" data-act="plan-cancel">Cancel</button></div></div>`;
}
function sendPlan(){
  const steps=(UI.plan||[]).map(st=>({sw:st.sw,close:st.close,issued:false}));
  if(!steps.length) return;
  pushUndo(`send a switching schedule of ${plural(steps.length,'step')}`);
  S.schedule=steps; UI.plan=[]; UI.planning=false;
  log(`Switching schedule sent: ${plural(steps.length,'step')}.`);
  runSchedule(); afterChange(); render();
}
// issue the next step once the one before has been carried out
let schedBusy=false;
function runSchedule(){
  if(schedBusy||!S||!S.schedule||!S.schedule.length) return;
  schedBusy=true;
  try{
    const q=S.schedule, cur=q[0];
    if(cur.issued){
      if(pendingFor(cur.sw)) return;
      if(S.sw[cur.sw]!==cur.close){ log(`Switching schedule stopped: the ${switchLabel(cur.sw)} did not ${cur.close?'close':'open'}.`,'warn'); S.schedule=null; return; }
      q.shift();
      if(!q.length){ log('Switching schedule complete.','good'); S.schedule=null; return; }
    }
    const nx=q[0]; nx.issued=true; UI.confirmOk=true;
    orderOp(nx.sw,nx.close,true);
    UI.confirmOk=false;
    if(!pendingFor(nx.sw)&&S.sw[nx.sw]!==nx.close){ log(`Switching schedule stopped at the ${switchLabel(nx.sw)}.`,'warn'); S.schedule=null; }
  } finally { schedBusy=false; }
}
// ---------- Drag a crew onto the diagram ----------
function crewDrop(i,el){
  const cr=S.crews[i]; if(!cr||!canOrder()) return;
  const k=el.dataset.k, id=el.dataset.id, prev=S.dispatch;
  S.dispatch=i;
  try{
    if(k==='sw'){ if(!canDo(cr,'op')) return toast(`${cr.id} can't operate switches.`); orderOp(id,!S.sw[id]); }
    else if(k==='node'){
      if(N[id].kind==='primary') return toast('Drop a crew on a street substation, a switch or a cable.');
      if(S.theft[id]&&canDo(cr,'makesafe')) orderMakeSafe(id);
      else if(S.lvFault[id]&&canDo(cr,'lvfix')) orderNodeJob(id,'lvfix');
      else if(S.flooded[id]==='damaged'&&S.flood&&S.flood.state==='receded'&&canDo(cr,'rebuild')) orderNodeJob(id,'rebuild');
      else if(canDo(cr,'visit')) orderVisit(id);
      else toast(`${cr.id} has nothing to do there.`);
    } else if(k==='cable'){
      const c=CBL[id], t=S.tested[id], f=faultOn(id);
      const type=t==='fault'&&f&&f.damage==='tree'&&!S.cleared[id]&&canDo(cr,'clear')?'clear':t==='fault'?'repair':c.oh?'patrol':'test';
      if(!canDo(cr,type)) return toast(`${cr.id} can't ${type==='clear'?'clear trees':type} there.`);
      orderCable(id,type);
    }
  } finally { S.dispatch=prev; }
}
function moveJobUp(i,q){ const cr=S.crews[i]; if(!cr||q<1||q>=cr.queue.length) return; [cr.queue[q-1],cr.queue[q]]=[cr.queue[q],cr.queue[q-1]]; log(`${cr.id}: job order changed.`); dirty=true; render(); }
// ---------- Follow a crew ----------
function followStep(){
  if(UI.follow==null||!S) return;
  const cr=S.crews[UI.follow]; if(!cr){ UI.follow=null; return; }
  if(UI.view==='m'){ const p=crewOffsets()[UI.follow], vb=UI.vb.m||[0,0,NET.w/3,NET.h/3]; setVB([p[0]-vb[2]/2,p[1]-vb[3]/2,vb[2],vb[3]]); }
  if(!cr.job||cr.job.stage!=='travel'){ toast(`${cr.id} ${cr.job?`is at ${N[cr.job.node].name}`:'has stopped'}.`); UI.follow=null; renderSide(); }
}
function startFollow(i){
  const cr=S.crews[i]; if(!cr) return;
  if(!cr.job||cr.job.stage!=='travel'){ toast(`${cr.id} isn't driving anywhere right now.`); return; }
  UI.follow=i; UI.view='m'; UI.vb.m=null; const p=crewOffsets()[i]; render(); setVB([p[0]-NET.w/6,p[1]-NET.h/6,NET.w/3,NET.h/3]);
  toast(`Following ${cr.id}. Drag the map to stop.`);
}
// ---------- Log filter and search ----------
const LOG_FILTERS=[['all','All'],['alarm','Alarms'],['crew','Teams'],['sw','Switching']];
function logMatch(l){
  const f=UI.logF||'all', q=(UI.logQ||'').trim().toLowerCase();
  if(q&&!l.text.toLowerCase().includes(q)) return false;
  if(f==='alarm') return l.kind==='bad'||l.kind==='warn';
  if(f==='crew') return /\b(Crew|Assessor|Tree team|Planned team|Contractor|Welfare van|Generator)\b/.test(l.text);
  if(f==='sw') return /\b(Opened|Closed|tripped|switch|Switching|earth|permit|Permit)\b/i.test(l.text);
  return true;
}
function renderLog(){
  const list=$('#log'); if(!list||!S) return;
  const rows=S.log.filter(logMatch);
  list.innerHTML=rows.map(l=>`<li class="${l.kind}"><time>${fmtT(l.t)}</time><span>${l.text}</span></li>`).join('')||'<li><span class="muted">Nothing matches.</span></li>';
  const seg=$('#logSeg'); if(seg) seg.innerHTML=LOG_FILTERS.map(([v,l])=>`<button data-act="log-f" data-v="${v}" aria-pressed="${(UI.logF||'all')===v}">${l}</button>`).join('');
}
// ---------- Volumes ----------
const vol = cat=>{ const v=UI.settings['vol_'+cat]; return v==null?1:v/100; };
// ---------- Shift summary to share ----------
function shiftSummary(){
  const st=S.restored||snapshotStats(), fin=snapshotStats(), sc=stars(st).s, sh=SHIFTS.find(x=>x.id===S.shift);
  const name=S.ctx&&S.ctx.label||(sh?sh.title:SCEN_LABEL[S.scen]||'Incident');
  const back=S.restored?fmtH(S.restored.t-(S.firstAt||S.t0)):'not yet';
  return {name,sc,text:`Open Point · ${name}\n${'★'.repeat(sc)}${'☆'.repeat(3-sc)} · ${fmtN(Math.round(fin.cml))} customer minutes lost · ${fmtN(fin.ci)} interrupted · everyone back in ${back} · ${fin.safety} safety incident${fin.safety===1?'':'s'}`,st:fin,back};
}
function saveSummaryImage(){
  const s=shiftSummary(), W=900, H=470, tl=timelineSvg().replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
  const css=getComputedStyle(document.body), c=v=>css.getPropertyValue(v).trim()||'#000';
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="${c('--desk')}"/><rect x="0" y="${H-8}" width="${W}" height="8" fill="${c('--accent')}"/>
    <text x="40" y="64" font-family="Arial Narrow,Arial,sans-serif" font-weight="700" font-size="44" fill="${c('--desk-ink')}">OPEN POINT</text>
    <text x="40" y="100" font-family="Arial,sans-serif" font-size="22" fill="${c('--desk-muted')}">${esc(s.name)}</text>
    <text x="${W-40}" y="72" text-anchor="end" font-family="Arial,sans-serif" font-size="46" fill="#f2c230">${'★'.repeat(s.sc)}<tspan fill="${c('--desk-rule')}">${'★'.repeat(3-s.sc)}</tspan></text>
    ${[['Minutes lost (CML)',fmtN(Math.round(s.st.cml))],['Interrupted (CI)',fmtN(s.st.ci)],['Everyone back in',s.back],['Safety incidents',s.st.safety]].map(([l,v],i)=>`<g transform="translate(${40+i*210},150)"><text font-family="Arial,sans-serif" font-size="14" fill="${c('--desk-muted')}">${esc(l.toUpperCase())}</text><text y="40" font-family="Consolas,monospace" font-size="32" font-weight="700" fill="${c('--desk-ink')}">${esc(v)}</text></g>`).join('')}
    <g class="tlg" transform="translate(40,232) scale(1.7)"><rect width="420" height="110" rx="4" fill="${c('--panel')}"/>${tl}</g>
    <text x="40" y="${H-22}" font-family="Arial,sans-serif" font-size="13" fill="${c('--desk-muted')}">An electricity fault management game by James Procter</text></svg>`;
  // the timeline's own styles live in the page's stylesheet, so carry them over
  const style=`<style>.tl-a{fill:${c('--fault')};opacity:.35}.tl-ax{stroke:${c('--muted')}}.tl-trip{fill:${c('--fault')}}.tlg text{font-family:Consolas,monospace;font-size:9px;fill:${c('--muted')}}</style>`;
  svgToPng(svg.replace('<rect width=',style+'<rect width='),W,H).then(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`open-point-${(S.shift||S.scen)}.png`; a.click(); toast('Summary image saved.'); }).catch(()=>toast('Sorry, the image could not be made.'));
}

// ======================= Boot =======================
const SAVE_VERSION=10;
function start(data){
  // only resume a game saved by this version; older saves have a different shape
  if(data&&data.v===SAVE_VERSION&&data.S&&data.S.def){ S=data.S; Object.assign(UI,data.UI||{}); E=data.E||null; if(E) E.drag=null;
    // a resumed game keeps its network, but the island's scenery always comes from the latest version of the game
    if(S.def.name===MEGAWATT.name) S.def.decor=clone(MEGAWATT.decor);
    if(S.replay||UI.replay) UI.replay=null; }
  else {
    // first arrival: the first shift sits paused behind the control room screen
    const s1=SHIFTS.find(x=>x.id==='s1');
    newIncident(clone(MEGAWATT),s1.scen,s1.crews,s1);
    // the title screen comes first; Play leads to Mags's letter or the control room
    UI.overlay='title';
  }
  // a shift left mid-way (the page was closed or reloaded) is picked up where it was
  if(!(data&&data.v===SAVE_VERSION&&data.S)){
    const sv=loadAutoSave();
    if(sv){ S=sv.S; if(S.def.name===MEGAWATT.name) S.def.decor=clone(MEGAWATT.decor); S.paused=true; UI.view=sv.ui&&sv.ui.view||'s'; UI.tab=sv.ui&&sv.ui.tab||'incident'; UI.tut=sv.ui&&sv.ui.tut||null; UI.mode='play'; UI.overlay='title'; }
  }
  if(UI.mode==='edit'&&!E) UI.mode='play';
  useNetwork(UI.mode==='edit'?E.def:S.def);
  render();
  lastTick=performance.now();
  if(!ticker){ ticker=setInterval(tick,50); requestAnimationFrame(animLoop); }
}
window.claude?.hot?.snapshot?.(()=>({v:SAVE_VERSION,S,UI,E}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
if(location.hash==='#art-template') showArtTemplates();
</script>
