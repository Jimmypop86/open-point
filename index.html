  if(vanAt(n)) return 'the van is already there or on its way';
  const e=S.etr&&S.etr[areaOf(n)], long=S.t-S.offSince[n]>=VAN.minOff||(e&&e.t-S.t>=180);
  if(!long) return `it is for long power cuts (off for ${VAN.minOff} minutes, or a restoration time 3 hours or more away)`;
  if(!vanFree()) return 'the welfare van is already out';

function permitBlock(cid){

  const bare=cableEnds(cid).find(s=>!earthed(s)); if(bare) return `there is no earth at ${N[nodeOfSw(bare)].name}`;
  return null;
}
function issuePermit(cid){

function orderEarth(sid,on){

  const cid=sid.split(':')[0];
  if(on&&S.sw[sid]&&pendingFor(sid)==null){ toast('Open that switch before earthing it.'); return; }
  if(!on&&permitOn(cid)){ toast(`Cancel ${permitOn(cid).no} before removing the earths.`); return; }
  pushUndo(`${on?'earth':'remove the earth at'} ${switchLabel(sid)}`);

// a crew on site applies or removes an earth, proving the cable dead first
function applyEarth(cr,sid,on){
  const cid=sid.split(':')[0], where=`${N[nodeOfSw(sid)].name} on ${cableName(CBL[cid])}`;
  if(!on){
    if(permitOn(cid)){ log(`${cr.id} did not remove the earth at ${where}: ${permitOn(cid).no} is still in force.`,'warn'); return; }
    delete S.earths[sid]; log(`${cr.id} removed the earth at ${where}.`); return;
  }
  if(S.sw[sid]){ log(`${cr.id} could not earth at ${where}: the switch is closed.`,'warn'); return; }
  if(solve().cab[cid]){ log(`${cr.id} tested before earthing and found ${cableName(CBL[cid])} live. Earth not applied. Make it dead first.`,'warn'); return; }
  S.earths[sid]=true; log(`${cr.id} proved ${cableName(CBL[cid])} dead and applied an earth at ${N[nodeOfSw(sid)].name}.`,'good');

// switching that makes an earthed cable live: a flashover. The breakers feeding it trip at once.
function checkEarths(){
  if(!docsOn()) return;
  const sol=solve(), hot=CABLES.filter(c=>sol.cab[c.id]&&cableEarthed(c.id));
  if(!hot.length) return;
  const fe=new Set(); hot.forEach(c=>feedersOf(sol,c.id).forEach(x=>fe.add(x)));
  fe.forEach(cb=>S.sw[cb]=false);
  S.safety++; S.safetyTip='You switched power onto a cable that still had its earths on. Cancel the permit and remove every earth before you switch a cable back on.';
  const names=[...fe].map(cb=>`CB ${CB[cb].name}`).join(' and ');
  log(`Flashover: ${cableName(hot[0])} was switched on with its earths still applied. ${names} tripped.`,'bad');
  news(null,'Explosion at substation as power switched onto earthed cable',-10);
  setWhy(`Earths connect a dead cable to the ground so it can't become live while people work on it. Switching power onto it drives a huge current straight into the earth, which is a flashover. ${names} tripped to clear it. Before you switch a cable back on, cancel its permit and remove all its earths.`);
  UI.pulse={cables:[...hot.map(c=>c.id),...[...fe].map(cb=>cb.split(':')[0])],until:performance.now()+3800};
  sfx('alarm');
}

// ---------- New incident ----------
// Work out what will happen during the shift. The first event always takes customers off.
function planEvents(scen,t,shift){
  const R=rand, rint=(a,b)=>a+Math.floor(R()*(b-a));
  const pool=FAULTABLE.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  // in a career, cables in poor condition fail more often: a weighted shuffle, worn cables first
  if(S&&S.cond){ const key={}; pool.forEach(c=>key[c]=Math.pow(R(),1/faultWeight(c))); pool.sort((a,b)=>key[b]-key[a]); }
  // the first cable event must hit a live cable (and the shift's area, if it has one) so a breaker trips
  const live=solve().cab;

  let fi=pool.findIndex(c=>live[c]&&inArea(c)); if(fi<0) fi=pool.findIndex(c=>live[c]);
  if(fi>0) [pool[0],pool[fi]]=[pool[fi],pool[0]];

  const theftNode=()=>shift&&shift.theftNode&&N[shift.theftNode]?shift.theftNode:(N.V2&&R()<0.5?'V2':pickNode());
  const ev=[];
  // the training shift is scripted: one known fault, no press, nothing else
  if(shift&&shift.fixed) return [{kind:'fault',t,cable:shift.fixed,transient:false}];
  const liveUG=()=>{ const k=pool.findIndex(c=>live[c]&&!CBL[c].oh&&!CB[c+':a']&&!CB[c+':b']); return k>=0?pool.splice(k,1)[0]:take(); };
  const liveOH=()=>{ const k=pool.findIndex(c=>live[c]&&CBL[c].oh); return k>=0?pool.splice(k,1)[0]:take(); };
  if(scen==='planned'){ /* nothing breaks: the job is the planned work itself */ }
  else if(scen==='lvday'){
    // a day of low-voltage trouble, with an 11 kV fault in the middle of it to give the link boxes something to do
    ev.push({kind:'lv',t,node:pickNode(),fault:null},{kind:'lv',t:t+rint(20,60),node:pickNode(),fault:'recur'},{kind:'neutral',t:t+rint(60,140),node:pickNode()});
    ev.push({kind:'fault',t:t+rint(30,90),cable:take(),transient:false});
    if(R()<0.6) ev.push({kind:'lv',t:t+rint(120,240),node:pickNode(),fault:'cable'});
  }
  else if(scen==='intermittent'){ ev.push({kind:'fault',t,cable:liveUG(),transient:true,intermit:true}); if(R()<0.4) ev.push({kind:'fault',t:t+rint(90,200),cable:take(),transient:R()<0.4}); }
  else if(scen==='brokenwire'){
    const k=pool.findIndex(c=>live[c]&&CBL[c].oh&&!CBL[c].nop&&!CB[c+':a']&&!CB[c+':b']), cid=k>=0?pool.splice(k,1)[0]:liveOH();

    if(R()<0.5) ev.push({kind:'fault',t:t+rint(60,160),cable:take(),transient:true});
  }
  else if(scen==='primary'){
    const pr=primLossPick(R);
    if(pr){ ev.push({kind:'primaryloss',t,prim:pr,back:t+rint(200,320)}); if(R()<0.4) ev.push({kind:'fault',t:t+rint(60,180),cable:take(),transient:R()<0.5}); }
    else ev.push({kind:'fault',t,cable:take(),transient:false});
  }
  else if(scen==='flood'){
    const cands=(NET.decor&&NET.decor.floodNodes||[]).filter(n=>N[n]), node=cands.length?cands[Math.floor(R()*cands.length)]:pickNode();
    const at=t+rint(45,75), until=at+rint(150,210);
    ev.push({kind:'floodwarn',t,node,at,until},{kind:'floodhit',t:at,node},{kind:'floodclear',t:until,node});
    if(R()<0.6) ev.push({kind:'fault',t:t+rint(30,140),cable:take(),transient:R()<0.4});
  }
  else if(scen==='heatwave'){ ev.push({kind:'fault',t,cable:liveUG(),transient:false}); ev.push({kind:'fault',t:t+rint(60,170),cable:liveUG(),transient:R()<0.2}); }
  else if(scen==='vehicle'){ ev.push({kind:'vehicle',t,cable:liveOH()}); if(R()<0.5) ev.push({kind:'fault',t:t+rint(60,150),cable:take(),transient:true}); }

    ev.push({kind:'flicker',t,cable:cid,node,failAt},{kind:'fault',t:failAt,cable:cid,transient:false,dev:true});
  }

  else if(scen==='single') ev.push({kind:'fault',t,cable:take(),transient:R()<0.2});

  else if(scen==='theft'){ ev.push({kind:'theft',t,node:theftNode()}); ev.push({kind:'fault',t:t+rint(50,130),cable:take(),transient:R()<0.2}); }
  else if(scen==='mixed'){ ev.push({kind:'fault',t,cable:take(),transient:R()<0.2}); ev.push({kind:'theft',t:t+rint(30,90),node:theftNode()}); ev.push({kind:'digin',t:t+rint(90,180),cable:take()}); }
  else { // storm and bigstorm: wind mostly brings down overhead lines
    const takeStorm=()=>{ const k=pool.findIndex(c=>CBL[c].oh); return k>=0&&R()<0.75?pool.splice(k,1)[0]:take(); };

// a primary that can lose its transformer: a smaller one, so its neighbours have a chance of carrying it

      else { const p=genSpread(i); h+=`<g id="gen-${i}" class="genlorry" transform="translate(${p[0].toFixed(1)},${p[1].toFixed(1)})" pointer-events="none">${vanShape({fill:'#e2b84a',stripe:.35})}<text x="-6" y="1.2" text-anchor="middle" style="font:700 8px var(--mono);fill:#2a2205">${g.id}</text>${g.stage==='travel'?`<text class="eta" y="-12">${fmtT(g.tArrive)}</text>`:''}</g>`; }
    });

    const vanG=(id,stage)=>`<g${id?` id="${id}"`:''} class="wvan" pointer-events="none">${stage==='on'?`<path d="M-17,-7 h-12 l-4,6 h16z" fill="#efe2f5" stroke="${INK}" stroke-width=".8" stroke-linejoin="round"/><path d="M-31,-1 v7 M-19,-1 v8" stroke="${INK}" stroke-width=".8"/>`:''}${vanShape({fill:'#8a55b0',beacon:false})}<path d="M-9,-4 h4 v-2 h2 v2 h4 v2 h-4 v2 h-2 v-2 h-4z" fill="#fff" stroke="${INK}" stroke-width=".4"/></g>`;
    (S.vans||[]).forEach((v,i)=>{
      if(v.stage==='home') return;
      if(v.stage==='travel'&&v.path&&v.path.length>1) h+=`<polyline class="route wv" points="${v.path.map(p=>p.join(',')).join(' ')}"/>`;
      const p=vanPos(v), off=v.stage==='on'?[30,16]:[0,0];

    });
    RMUS.forEach(n=>{ if(S.flooded[n]&&!(S.flooded[n]==='damaged'&&S.flood&&S.flood.state==='receded')) { const [x,y]=N[n].m; h+=`<g class="flooded-water" pointer-events="none"><ellipse cx="${x}" cy="${y+4}" rx="52" ry="26"/><path d="M${x-34} ${y+8}q6-5 12 0t12 0t12 0M${x-8} ${y+20}q6-5 12 0t12 0t12 0M${x-30} ${y-8}q6-5 12 0t12 0" fill="none" stroke="#dff1ff" stroke-width="2" stroke-linecap="round"/></g>`; } });
    h+=moverLayer('air')+weatherFx();
  }
  svg.innerHTML=h;
  if(!edit&&UI.hlNow) showHl(UI.hlNow);
  if(!isS) try{ moveMovers(); }catch(e){}

}

// ---------- Play side panel ----------
function costText(sid){
  if(remoteFor(sid)){ const last=S.control.length?S.control[S.control.length-1].tDone:S.t; return `remote · ${Math.round(Math.max(0,last-S.t)+2)} min`; }
  return crewEst(nodeOfSw(sid),'op');
}
function swRow(sid,ctxNode){
  const [cid,e]=sid.split(':'), c=CBL[cid], node=c[e], far=c[other(e)], closed=S.sw[sid];
  const lock=!canOrder(), pend=pendingFor(sid), abn=closed!==!NOPS.has(sid);
  const name=CB[sid]?`CB ${CB[sid].name} to ${N[far].name}`:ctxNode?`To ${N[far].name}`:`At ${N[node].name}`;
  const tag=NOPS.has(sid)?'<span class="tag">NOP</span>':'';
  const btn=locked(node)?`<button class="btn alt" disabled>Locked<small>${S.flooded&&S.flooded[node]?'flooded':'site unsafe'}</small></button>`
    :pend?`<button class="btn alt" disabled>Queued<small>${pend==='control'?'control room':pend}</small></button>`
    :docsOn()&&!closed&&earthed(sid)?`<button class="btn alt" disabled>Interlocked<small>earth applied</small></button>`
    :S.stuck&&S.stuck[sid]?`<button class="btn" data-act="free" data-sw="${sid}" ${lock?'disabled':''}>Free switch<small>${crewEst(node,'free')}</small></button>`
    :!closed&&primDead(sid)?`<button class="btn alt" disabled>No supply<small>transformer out</small></button>`
    :`<button class="btn${closed?' alt':''}" data-act="op" data-sw="${sid}" data-close="${closed?0:1}" ${lock?'disabled':''}>${closed?'Open':'Close'}<small>${costText(sid)}</small></button>`;
  return `<div class="swrow${S.sel&&S.sel.sw===sid?' hl':''}"><div><div class="swname">${name}${tag}</div>
    <div class="swstate ${closed?'c':'o'}">${closed?'Closed':'Open'} · ${remoteFor(sid)?'remote':'manual'}${abn?' · <span class="abn">abnormal</span>':''}${docsOn()&&earthed(sid)?' · <span class="ert">earthed</span>':''}${S.stuck&&S.stuck[sid]?' · <span class="abn">seized</span>':''}</div></div>${btn}</div>`;
}
function phaseBar(){
  if(S.scen==='planned'){
    const p=S.planned, cur=S.phase==='closed'?3:!p||p.state==='prep'?(maintWorking()?1:0):2;
    return `<ol class="phases">${['Prepare','Crew working','Normal running'].map((l,i)=>`<li class="${i<cur?'done':i===cur?'now':''}">${l}</li>`).join('')}</ol>`;
  }
  const order=['restore','repair','closed'], cur=order.indexOf(S.phase);
  return `<ol class="phases">${['Restore supply','Repair','Normal running'].map((l,i)=>`<li class="${i<cur||S.phase==='closed'?'done':i===cur?'now':''}">${l}</li>`).join('')}</ol>`;
}
const maintWorking = ()=>S.planned&&S.crews.some(cr=>cr.job&&cr.job.type==='maint'&&cr.job.cable===S.planned.cable&&cr.job.stage==='work');
// status boxes for the special jobs of a shift: planned work, floods, poles, flickers, festivals and street faults
function taskBoxes(){
  let h='';
  const p=S.planned;
  if(p&&S.phase!=='closed'){
    const c=CBL[p.cable], dead=!solve().cab[p.cable], busy=cableBusy(p.cable);
    const st=p.state==='done'?'Maintenance finished. Put the network back to normal.':maintWorking()?'Crew working. Keep the cable switched off.':busy?'Crew on the way.':
      dead?(docsOn()&&!permitOn(p.cable)?'Cable switched out. Earth both ends and issue a permit (select the cable), then hand it over to a crew.':'Cable switched out. Hand it over to a crew.'):S.t<p.from?`Prepare: feed the customers beyond it from a neighbour, then open both ends. Work can start from ${fmtT(p.from)}.`:'Switch the cable out without anyone losing power.';
    h+=`<div class="taskbox"><b>Planned work</b><button class="linkbtn" data-act="selc" data-c="${p.cable}">${cableName(c)}</button> · window ${fmtT(p.from)}–${fmtT(p.to)}<p>${st}</p>
      ${p.state==='prep'&&dead&&!busy?`<button class="btn wide" data-act="maint" data-c="${p.cable}" ${canOrder()?'':'disabled'}>Hand over to a crew for maintenance<small>about 3 hours</small></button>`:''}</div>`;
  }
  const f=S.flood;
  if(f&&S.phase!=='closed'){
    const n=f.node, mins=Math.round(f.at-S.t);
    const st=f.state==='warned'?(solve().island[n]!=null?`<span class="trip">Still live.</span> Water expected in ${mins>0?mins+' min':'moments'} (${fmtT(f.at)}). Switch it off and feed the substations beyond it from elsewhere.`:`Switched off safely. Water expected at ${fmtT(f.at)}.`)
      :f.state==='flooded'?`Under water but safe. Expected to recede around ${fmtT(f.until)}.`:f.state==='damaged'?`Wrecked by flood water. Wait for it to recede (around ${fmtT(f.until)}), then rebuild.`
      :f.state==='receded'?'The water has gone. Send a crew to rebuild the switchgear.':'Clear. It can be switched back on.';
    h+=`<div class="taskbox ${f.state==='warned'?'urgent':''}"><b>Flood warning</b><button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button><p>${st}</p></div>`;
  }
  // work requests from other teams
  (S.works||[]).forEach(w=>{
    if(w.state!=='prep'&&!(w.state==='done'&&S.t-w.doneAt<60)) return;
    const c=CBL[w.cable], K=WORK_KINDS[w.kind], dead=!solve().cab[w.cable], busy=cableBusy(w.cable);
    const working=S.crews.some(cr=>cr.job&&cr.job.type==='maint'&&cr.job.cable===w.cable&&cr.job.stage==='work');
    const st=w.state==='done'?'Finished. Put the cable back into service.':working?'Team working. Keep it switched off.':busy?'Crew on the way.':dead?(docsOn()&&!permitOn(w.cable)?'Switched out. Earth both ends and issue a permit (select the cable), then hand it over to the team.':'Switched out. Hand it over to the team.'):`Feed the customers beyond it from a neighbour, then open both ends. Must start by ${fmtT(w.to)}.`;
    h+=`<div class="taskbox"><b>Work request · ${K.label}</b><button class="linkbtn" data-act="selc" data-c="${w.cable}">${cableName(c)}</button> · ${fmtT(w.from)}–${fmtT(w.to)} · about ${fmtH(w.mins)}<p>${st}</p>
      ${w.state==='prep'&&dead&&!busy?`<button class="btn wide" data-act="maint" data-c="${w.cable}" ${canOrder()?'':'disabled'}>Hand over for ${K.label.toLowerCase()}<small>about ${fmtH(w.mins)} · earns £${fmtN(WORK_CREDIT)}</small></button>`:''}</div>`;
  });
  const pl=S.pole;
  if(pl&&!pl.done&&S.phase!=='closed'){
    const mins=Math.max(0,Math.ceil(pl.deadline-S.t));
    h+=`<div class="taskbox urgent"><b>Police deadline: ${mins} min</b>${pl.wires?'Broken wire reported on':'Car versus pole on'} <button class="linkbtn" data-act="selc" data-c="${pl.cable}">${cableName(CBL[pl.cable])}</button>.<p>Open the switches at both ends before ${fmtT(pl.deadline)}.</p></div>`;
  }
  const d=S.dev;
  if(d&&!d.fixed&&!d.failed&&S.phase!=='closed')
    h+=`<div class="taskbox"><b>Flickering lights</b>Reports from around <button class="linkbtn" data-act="seln" data-n="${d.node}">${N[d.node].name}</button>.<p>One of its cables is failing. Switch suspects out one at a time and test them${S.tested[d.cable]==='fault'?'. <b style="display:inline;color:inherit;font:inherit;text-transform:none;letter-spacing:0">Found it:</b> repair it before it fails.':'.'}</p></div>`;
  const fe=S.festival;
  if(fe&&S.phase!=='closed'){
    const live=S.t>=fe.from&&S.t<fe.to;
    h+=`<div class="taskbox${S.festFail?' urgent':''}"><b>Port Ampere Festival</b><button class="linkbtn" data-act="seln" data-n="${fe.node}">${N[fe.node].name}</button> · ${fmtT(fe.from)}–${fmtT(fe.to)}<p>${S.festFail?'The stage lost power. The mayor is not happy.':live?`On stage now, adding ${fe.amps} A to the circuit.`:S.t<fe.from?`Starts at ${fmtT(fe.from)}, adding ${fe.amps} A.`:'Finished.'}</p></div>`;
  }
  if(S.phase!=='closed') (S.events||[]).forEach(e=>{
    if(S.t>=e.to&&!e.failed) return;
    const K=EVENT_KINDS[e.kind], live=S.t>=e.from&&S.t<e.to, cov=e.kind==='medical'&&!evOn(e)?medCover(e)-(S.t-S.offSince[e.node]):null;
    h+=`<div class="taskbox${e.failed||(cov!=null&&cov<=45)?' urgent':''}"><b>${K.label}</b><button class="linkbtn" data-act="seln" data-n="${e.node}">${N[e.node].name}</button>${K.at?` · ${fmtT(e.from)}–${fmtT(e.to)}`:''}
      <p>${e.failed?K.failText:cov!=null?`Off supply: about ${fmtH(Math.max(0,cov))} of backup oxygen left.`:live?K.now(e):`Starts at ${fmtT(e.from)}. ${K.desc(e)}.`}</p></div>`;
  });
  (S.neutral||[]).filter(z=>!z.done).forEach(z=>{ const w=LVW[z.way], mins=Math.max(0,Math.ceil(z.deadline-S.t));
    h+=`<div class="taskbox urgent"><b>Broken neutral: ${mins} min</b><button class="linkbtn" data-act="seln" data-n="${w.node}">${wayRef(w)}</button><p>Customers are getting shocks. Take the way's fuse out to make it safe, then repair the neutral.</p></div>`; });
  const lv=RMUS.filter(n=>lvBadAt(n).some(w=>(lvs(w.id)||{}).fault!=='neutral'));
  if(lv.length) h+=`<div class="taskbox"><b>Street faults</b>${lv.map(n=>`<button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button>`).join(', ')}<p>Low-voltage fuses or cables. Open the substation to see which streets.</p></div>`;
  const bf=LVLINKS.filter(l=>S.lnk&&S.lnk[l.id]);
  if(bf.length) h+=`<div class="taskbox"><b>Link boxes closed (${bf.length})</b>${bf.map(l=>`<button class="linkbtn" data-act="seln" data-n="${LVW[l.a].node}">${N[LVW[l.a].node].name} – ${N[LVW[l.b].node].name}</button>`).join(', ')}<p>Open them again before each substation's own supply comes back.</p></div>`;
  const fl=RMUS.filter(n=>S.flooded[n]==='damaged'&&(!S.flood||S.flood.state==='receded'));
  if(fl.length&&!f) h+=`<div class="taskbox"><b>Rebuild</b>${fl.map(n=>N[n].name).join(', ')}</div>`;
  if(S.ctx&&S.ctx.type==='career'&&S.cost){ const m=shiftMoney(); h+=`<p class="note budget">Shift budget: <b>${money(m.spent)}</b> of ${money(m.budget)} spent so far${m.spent>m.budget?' <span class="trip">over budget</span>':''}.</p>`; }
  return h;
}
// crews standing by for a permit, and the paperwork still to finish before normal running
const waitingCrews = ()=>S.crews.filter(cr=>cr.job&&cr.job.stage==='wait'&&cr.job.waitFor!=='veg');
function docsTodo(){
  if(!docsOn()) return '';
  const cl=cid=>`<button class="linkbtn" data-act="selc" data-c="${cid}">${cableName(CBL[cid])}</button>`;
  let h='';
  Object.keys(S.permits).forEach(cid=>{ const p=S.permits[cid]; if(p.state==='cleared') h+=`<li>Cancel ${p.no}: ${cl(cid)}</li>`; });
  const left=new Set(Object.keys(S.earths).map(s=>s.split(':')[0]).filter(cid=>!permitOn(cid)));
  left.forEach(cid=>{ h+=`<li>Remove the earths: ${cl(cid)}</li>`; });
  return h;
}
function incidentPanel(){
  const sh=SHIFTS.find(x=>x.id===S.shift);
  let h=`${S.ctx?`<p class="ctxlabel">${S.ctx.label}</p>`:''}<h2>${sh?sh.title.replace(/^Shift \d+ · /,''):S.ctx?SCEN_LABEL[S.scen]||'Incident':'Incident'}</h2><p class="lead">${S.headline}</p>${phaseBar()}`;
  if(S.brief&&S.phase!=='closed') h+=`<div class="brief"><b>Note from Mags</b>${S.brief}</div>`;
  h+=taskBoxes();
  const thefts=RMUS.filter(n=>S.theft[n]);
  waitingCrews().forEach(cr=>{ const cid=cr.job.cable; h+=`<div class="alertbox"><b>${cr.id} is waiting for a permit</b> to work on <button class="linkbtn" data-act="selc" data-c="${cid}">${cableName(CBL[cid])}</button>. ${permitBlock(cid)?`It can't be issued yet: ${permitBlock(cid)}.`:'It is isolated and earthed, so you can issue it now.'}</div>`; });
  if(thefts.length) h+=`<div class="alertbox"><b>Unsafe after copper theft:</b> ${thefts.map(n=>`<button class="linkbtn" data-act="seln" data-n="${n}">${N[n].name}</button>`).join(', ')}. Send a crew to make ${thefts.length===1?'it':'them'} safe.</div>`;
  if(S.stormUntil&&S.pending.length) h+=`<p class="note"><b>Storm in progress.</b> More faults are likely until about ${fmtT(S.stormUntil)}.</p>`;
  if(S.phase==='restore'){
    h+=`<details class="howto" ${S.shift==='s1'?'open':''}><summary>How to restore supply</summary><ol class="steps"><li><b>Locate.</b> Fault passage indicators (flags) trip between the breaker and the fault. Remote sites report straight away. Manual sites need a crew to read them.</li>
      <li><b>Isolate.</b> Open the switches at <i>both</i> ends of the faulty cable.</li>
      <li><b>Restore.</b> Close the breaker, and close normally open points (NOPs) to back-feed from another feeder. Watch the feeder loading.</li></ol>
      <p class="note">Interruptions of 3 minutes or more count towards CI. Pause the clock with the space bar to plan, then queue orders and let it run.</p></details>`;
  }
  if(S.callsTotal>=1){
    const top=Object.keys(S.callArea).sort((a,b)=>S.callArea[b]-S.callArea[a]).slice(0,3);
    h+=`<div class="calls"><b>Customer calls:</b> ${fmtN(callsRecent())} in the last 15 minutes, ${fmtN(S.callsTotal)} since ${fmtT(S.t0)}.
      <span class="muted">Busiest: ${top.map(a=>`${a} (${fmtN(S.callArea[a])})`).join(', ')}</span></div>`;
  }
  if(S.phase==='restore'){
  } else if(S.phase==='planned'){
    const abn=Object.keys(S.sw).filter(k=>S.sw[k]!==!NOPS.has(k)), todo=docsTodo();
    if(todo) h+=`<h3 style="margin-top:14px">Safety documents</h3><ul class="todo">${todo}</ul>`;
    if(abn.length&&S.planned&&S.planned.state==='done') h+=`<h3 style="margin-top:14px">Switches out of normal position (${abn.length})</h3><ul class="todo">`+
      abn.map(sid=>`<li><button class="linkbtn" data-act="selsw" data-sw="${sid}">${switchLabel(sid)}</button> <span class="muted">should be ${NOPS.has(sid)?'open':'closed'}</span></li>`).join('')+'</ul>';
  } else if(S.phase==='repair'){
    const found=S.faults.filter(f=>f.active&&S.tested[f.cable]==='fault');
    const hidden=S.faults.filter(f=>f.active&&S.tested[f.cable]!=='fault').length;
    const abn=Object.keys(S.sw).filter(k=>S.sw[k]!==!NOPS.has(k));
    h+=`<p class="note">Everyone is back on. Now repair the damage and put the network back to its normal running arrangement.${docsOn()?' Before a crew can repair a cable, earth it at both ends and issue a permit to work. Afterwards, cancel the permit and remove the earths before switching it back on.':''}</p><ul class="todo">`;
    found.forEach(f=>{ h+=`<li>Repair: <button class="linkbtn" data-act="selc" data-c="${f.cable}">${cableName(CBL[f.cable])}</button></li>`; });
    if(hidden) h+=`<li>${plural(hidden,'faulty cable')} not yet located. Test the dead sections to find ${hidden===1?'it':'them'}.</li>`;
    if(!found.length&&!hidden) h+='<li>All faults repaired ✓</li>';
    h+=docsTodo()+'</ul>';
    if(abn.length){
      h+=`<h3 style="margin-top:14px">Switches out of normal position (${abn.length})</h3><ul class="todo">`+
        abn.map(sid=>`<li><button class="linkbtn" data-act="selsw" data-sw="${sid}">${switchLabel(sid)}</button> <span class="muted">should be ${NOPS.has(sid)?'open':'closed'}</span></li>`).join('')+'</ul>';
    } else h+='<p class="note">All switches are in their normal positions.</p>';
    if(S.ctx&&S.ctx.type==='career') h+=`<button class="btn wide alt" data-act="finish-early" style="margin-top:12px">Hand the rest over to the next shift<small>each unfinished job costs £3,000</small></button>`;
  } else {
    h+=`<p class="note">Incident closed at ${fmtT(S.closedAt)}.</p><button class="btn wide" data-act="home">Back to the control room</button>`;
  }

function teamOnText(match){

// what has put an area's customers off, and who is on it
function offCauses(ns){
  // the normal feed of each substation, as if every primary were in service
  const saved=S.primDown; S.primDown={}; let solN; try{ solN=solve(normalSw()); } finally { S.primDown=saved; }
  const sol=solve(), out=new Map(), add=(k,v)=>{ if(!out.has(k)) out.set(k,v); };
  ns.forEach(n=>{
    if(S.theft[n]) return add('th'+n,{cat:'hvjoint',what:`Copper theft at ${N[n].name}`,...teamOnText(j=>j.type==='makesafe'&&j.node===n)});
    if(S.flooded[n]) return add('fl'+n,{cat:'hvjoint',what:`${N[n].name} ${S.flooded[n]==='damaged'?'wrecked by':'under'} flood water`,...(S.flooded[n]==='damaged'?teamOnText(j=>j.type==='rebuild'&&j.node===n):{t:`Water due to go down about ${fmtT(S.flood&&S.flood.until||S.t)}`})});
    if(sol.island[n]!=null){
      // the 11 kV is on: something on the low-voltage side
      lvBadAt(n).filter(w=>!wayOn(w.id)).forEach(w=>{ const s=lvs(w.id), nx=lvNextJob(w);
        add('lv'+w.id,{cat:nx?jobCat(nx,w.id):'lvsw',what:`${s.fault==='neutral'?'Broken neutral':s.known&&s.fault?'LV cable fault':'Blown LV fuse'} on ${wayRef(w)}`,...teamOnText(j=>j.way===w.id)}); });
      return;
    }
    // the 11 kV is off: the transformer, a fault on the circuit that normally feeds it, or a breaker still to close
    const cb=solN.feed[n], pr=cb&&CB[cb].prim;
    if(!cb) return add('nf'+n,{cat:'hvsw',what:`${N[n].name} has no 11 kV supply`,t:'Restore it by switching'});
    if(pr&&S.primDown&&S.primDown[pr]) return add('pr'+pr,{cat:'hvsw',what:`${N[pr].name} transformer out of service`,t:`Back in service about ${fmtT(S.primBack[pr])}`});
    const fs=S.faults.filter(f=>f.active&&!(f.transient&&f.trips>0)&&solN.cab[f.cable]===cb);
    fs.forEach(f=>{ const known=S.tested[f.cable]==='fault'||f.found, live=!!sol.cab[f.cable];
      const what=known?`${f.damage?DMG_TITLE[f.damage]:'Fault'} on ${cableName(CBL[f.cable])}`:`${f.open?'Broken conductor':'Fault'} somewhere on the ${CB[cb].name} ${CB[cb].feeder} circuit, not yet found`;
      const cat=live?'hvsw':!known?(CBL[f.cable].oh?'look':'hvjoint'):f.damage==='tree'&&!S.cleared[f.cable]?'veg':jobCat('repair',f.cable);
      add('f'+f.cable,{cat,what,...teamOnText(j=>j.cable===f.cable)}); });
    if(!fs.length&&cb) add('cb'+cb,{cat:'hvsw',what:`${CB[cb].name} ${CB[cb].feeder} circuit not yet switched back on`,t:pendingFor(cb)?'Switching under way':'Restore it by switching'});
  });
  return [...out.values()];
}

// average minutes off per customer for three stars and for two, by kind of shift (tuned from play-testing:
// a careful, quick player should usually get three, a slower one two)
const STAR_LIM={single:[20,45],digin:[20,45],theft:[45,90],storm:[30,65],bigstorm:[30,65],mixed:[45,90],flood:[45,95],heatwave:[25,50],vehicle:[30,60],
  flicker:[30,70],festival:[25,50],intermittent:[15,35],brokenwire:[45,75],primary:[15,35],lvday:[40,80],planned:[20,45]};
function stars(st){
  const lim=STAR_LIM[S.scen]||[20,45], avg=st.cml/Math.max(1,st.affected);
  // safety incidents count even if they happen after everyone is back on (most permit work does)
  let s=avg<=lim[0]?3:avg<=lim[1]?2:1; if(st.safety||S.safety) s--; if(st.overloads) s--; if(st.rep!=null&&st.rep<50) s--;
  if((st.hints||st.undos)&&S.diff!=='trainee') s--;   // the exact-move hint and undo each cost a star (free for trainees)
  return {s:Math.max(0,s),avg,lim};
}

function netOptions(selected,withEditor){
  const saved=savedList();
  let o=`<option value="b:megawatt">Megawatt Island · 28 substations</option>`;
  Object.keys(saved).forEach(k=>{ o+=`<option value="s:${k}">${clean(saved[k].name,40)} · saved</option>`; });

function validate(){
  const err=[], warn=[], ids=Object.keys(N);
  if(!PRIMS.length) err.push('Add at least one primary substation.');
  if(!RMUS.length) err.push('Add at least one substation with customers.');
  CABLES.forEach(c=>{ if(N[c.a].kind==='primary'&&N[c.b].kind==='primary') err.push(`${cableName(c)} joins two primaries. Delete it.`); });
  const adj={}; ids.forEach(k=>adj[k]=[]); CABLES.forEach(c=>{adj[c.a].push(c.b);adj[c.b].push(c.a);});
  const seen=new Set(PRIMS), q=[...PRIMS];
  while(q.length){ const n=q.shift(); adj[n].forEach(m=>{ if(!seen.has(m)){seen.add(m);q.push(m);} }); }
  RMUS.forEach(n=>{ if(!seen.has(n)) err.push(`${N[n].name} has no cable route to a primary.`); });
  if(!FAULTABLE.length&&RMUS.length) err.push('Add some cables that can develop faults.');
  const sw=normalSw(), sol=solve(sw);
  sol.islands.forEach(isl=>{ const ps=[...new Set(isl.cbs.map(cb=>CB[cb].prim))]; if(ps.length>1) err.push(`In normal running ${ps.map(p=>N[p].name).join(' and ')} are connected. Add a normally open point between them.`); });
  RMUS.forEach(n=>{ if(seen.has(n)&&sol.island[n]==null) warn.push(`${N[n].name} is off supply in normal running. Check the normally open points.`); });
  CBIDS.forEach(id=>{ const a=cbLoad(sol,id,1); if(a>CB[id].rating) warn.push(`${CB[id].name} ${CB[id].feeder} carries ${Math.round(a)} A against a ${CB[id].rating} A rating at the evening peak.`); });
  const codes={}; RMUS.forEach(n=>{ const c=N[n].code; if(c){ if(codes[c]) warn.push(`Code ${c} is used twice.`); codes[c]=1; } });
  return {err,warn};
}

function svgPoint(evt){
  const svg=$('#svg'), p=svg.createSVGPoint(); p.x=evt.clientX; p.y=evt.clientY;

  return [Math.max(20,Math.min(d.w-20,Math.round(r.x/g)*g)),Math.max(20,Math.min(d.h-20,Math.round(r.y/g)*g))];
}
function uid(prefix,taken){ let i=1; while(taken[prefix+i]) i++; return prefix+i; }
function addNode(kind,p){
  const d=E.def, id=uid(kind==='prim'?'P':'R',d.nodes);
  if(kind==='prim') d.nodes[id]={name:'New Primary',kind:'primary',s:p.slice(),m:p.slice()};
  else{
    const used=new Set(Object.values(d.nodes).map(n=>n.code)); let k=1; while(used.has('R'+k)) k++;
    d.nodes[id]={code:'R'+k,name:'Substation R'+k,cust:300,s:p.slice(),m:p.slice()};
  }

}
function addCable(a,b){
  const d=E.def;
  if(d.nodes[a].kind==='primary'&&d.nodes[b].kind==='primary'){ toast('Primaries connect to substations, not to each other.'); return; }
  if(d.cables.some(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a))){ toast('Those two are already connected.'); return; }
  if(d.nodes[b].kind==='primary') [a,b]=[b,a];
  const taken={}; d.cables.forEach(c=>taken[c.id]=1);
  const c={id:uid('K',taken),a,b};
  if(d.nodes[a].kind==='primary') c.rating=400;
  d.cables.push(c); E.sel={k:'cable',id:c.id};
}
function delNode(id){ const d=E.def; delete d.nodes[id]; d.cables=d.cables.filter(c=>c.a!==id&&c.b!==id); E.sel=null; }
function delCable(id){ const d=E.def; d.cables=d.cables.filter(c=>c.id!==id); E.sel=null; }
function moveNode(id,dx,dy){
  const d=E.def, n=d.nodes[id], vk=UI.view==='s'?'s':'m', pk=vk==='s'?'sp':'mp';
  n[vk]=[n[vk][0]+dx,n[vk][1]+dy];
  d.cables.forEach(c=>{
    if(!c[pk]) return;
    if(c.a===id) c[pk][0]=[c[pk][0][0]+dx,c[pk][0][1]+dy];
    if(c.b===id){ const L=c[pk].length-1; c[pk][L]=[c[pk][L][0]+dx,c[pk][L][1]+dy]; }
  });
  if(vk==='m') BLOCKS=null;
}
function editPointerDown(e){
  const el=e.target.closest('[data-k]'), k=el&&el.dataset.k, id=el&&el.dataset.id, p=svgPoint(e);
  let panel=true;
  switch(E.tool){
    case 'select':
      if(k==='node'){ E.sel={k:'node',id}; const n=E.def.nodes[id]; E.drag={id,last:p,moved:false}; e.preventDefault(); }
      else if(k==='cable') E.sel={k:'cable',id};
      else if(k==='sw') E.sel={k:'cable',id:id.split(':')[0]};
      else E.sel=null;
      break;
    case 'sub': case 'prim':
      if(k==='node') E.sel={k:'node',id}; else if(!k) addNode(E.tool,p);
      break;
    case 'cable':
      if(k==='node'){ if(!E.pend) E.pend=id; else if(E.pend===id) E.pend=null; else { addCable(E.pend,id); E.pend=null; } }
      else E.pend=null;

    case 'depot':
      if(UI.view!=='m'){ toast('Switch to the map view to place the depot.'); return; }
      E.def.depot=p; panel=false;

let dragRaf=0;
function editDrag(e){

function normalizeDef(d){
  if(!d||typeof d!=='object'||!d.nodes||typeof d.nodes!=='object'||!Array.isArray(d.cables)) throw new Error('That isn\'t an Open Point network. It needs "nodes" and "cables".');
  const num=v=>typeof v==='number'&&isFinite(v);
  const pt=p=>Array.isArray(p)&&p.length===2&&num(p[0])&&num(p[1])?[p[0],p[1]]:null;
  const line=l=>Array.isArray(l)&&l.length>=2&&l.every(pt)?l.map(pt):null;
  const SIZES={1000:560,1500:800,1600:900}, w=SIZES[d.w]?d.w:1000;
  const out={name:clean(d.name||'Imported network',40)||'Imported network',w,h:SIZES[w],nodes:{},cables:[]};
  if(d.dwg) out.dwg=clean(d.dwg,24);
  out.depot=pt(d.depot)||[60,out.h-50];
  if(Array.isArray(d.mlDefault)&&num(d.mlDefault[0])&&num(d.mlDefault[1])&&['start','middle','end'].includes(d.mlDefault[2])) out.mlDefault=d.mlDefault.slice(0,3);
  Object.keys(d.nodes).forEach(k=>{
    const n=d.nodes[k], id=clean(k,12).replace(/[^A-Za-z0-9_-]/g,'');
    if(!id||!n||!pt(n.s)||!pt(n.m)) return;
    const o={name:clean(n.name||id,32)||id,s:pt(n.s),m:pt(n.m)};
    if(n.kind==='primary') o.kind='primary';
    else{
      o.code=clean(n.code||'',4); o.cust=Math.max(0,Math.min(5000,Math.round(+n.cust||0)));
      if(n.remote) o.remote=true;
      if(n.area) o.area=clean(n.area,24);
      if(n.hospital) o.hospital=clean(n.hospital,40);
      if(n.site&&n.site.name) o.site={name:clean(n.site.name,40),off:clean(n.site.off||n.site.name+' loses power',80),back:clean(n.site.back||n.site.name+' back on',80)};
      if(['b','bl','br','r','l'].includes(n.sl)) o.sl=n.sl;
      if(n.note) o.note=clean(n.note,120);
    }
    if(Array.isArray(n.ml)&&num(n.ml[0])&&num(n.ml[1])&&['start','middle','end'].includes(n.ml[2])) o.ml=n.ml.slice(0,3);
    out.nodes[id]=o;
  });
  const taken={};
  d.cables.forEach(c=>{
    if(!c||!out.nodes[c.a]||!out.nodes[c.b]||c.a===c.b) return;
    let id=clean(c.id||'',12).replace(/[^A-Za-z0-9_-]/g,''); if(!id||taken[id]) id=uid('K',taken); taken[id]=1;
    const o={id,a:c.a,b:c.b};
    if(c.nop==='a'||c.nop==='b') o.nop=c.nop;
    if(c.oh) o.oh=true;
    if(num(c.rating)) o.rating=Math.max(50,Math.min(1000,Math.round(c.rating)));
    if(c.feeder) o.feeder=clean(c.feeder,20);
    if(line(c.sp)) o.sp=line(c.sp);
    if(line(c.mp)) o.mp=line(c.mp);
    out.cables.push(o);
  });
  if(d.decor&&typeof d.decor==='object'){
    const dc={};
    if(typeof d.decor.river==='string'&&/^[0-9MCSLQZmcslqz ,.\-]+$/.test(d.decor.river)) dc.river=d.decor.river.slice(0,400);
    if(typeof d.decor.coast==='string'&&/^[0-9MCSLQZmcslqz ,.\-]+$/.test(d.decor.coast)) dc.coast=d.decor.coast.slice(0,2000);
    if(Array.isArray(d.decor.hills)) dc.hills=d.decor.hills.filter(k=>Array.isArray(k)&&k.slice(0,4).every(num)).map(k=>k.slice(0,4));
    if(Array.isArray(d.decor.parks)) dc.parks=d.decor.parks.filter(p=>Array.isArray(p)&&p.slice(0,4).every(num)).map(p=>[p[0],p[1],p[2],p[3],clean(p[4]||'',30)]);
    if(Array.isArray(d.decor.labels)) dc.labels=d.decor.labels.filter(l=>Array.isArray(l)&&num(l[0])&&num(l[1])).map(l=>l[3]==='town'||l[3]==='sea'?[l[0],l[1],clean(l[2]||'',30),l[3]]:[l[0],l[1],clean(l[2]||'',30)]);
    if(Array.isArray(d.decor.roads)) dc.roads=d.decor.roads.map(line).filter(Boolean);
    if(Array.isArray(d.decor.landmarks)) dc.landmarks=d.decor.landmarks.filter(l=>Array.isArray(l)&&num(l[0])&&num(l[1])&&LANDMARK[l[2]]).map(l=>[l[0],l[1],l[2]]);
    if(d.decor.cableRoads===false) dc.cableRoads=false;
    const idOk=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,12}$/.test(v);
    if(d.decor.airport&&pt(d.decor.airport.c)) dc.airport={c:pt(d.decor.airport.c),a:num(d.decor.airport.a)?d.decor.airport.a:0,node:idOk(d.decor.airport.node)?d.decor.airport.node:''};
    if(d.decor.harbour&&num(d.decor.harbour.x0)&&num(d.decor.harbour.x1)&&Array.isArray(d.decor.harbour.piers))
      dc.harbour={x0:d.decor.harbour.x0,x1:d.decor.harbour.x1,piers:d.decor.harbour.piers.filter(num).slice(0,6),node:idOk(d.decor.harbour.node)?d.decor.harbour.node:''};
    if(Array.isArray(d.decor.lakes)) dc.lakes=d.decor.lakes.filter(k=>Array.isArray(k)&&k.slice(0,4).every(num)).map(k=>[k[0],k[1],k[2],k[3],clean(k[4]||'',30)]);

// every sound is scaled by its category's volume (set at the start of sfx)
let SFXK=1;
function tone(ac,f,t0,dur,type,vol){ vol=Math.max(0.0002,vol*SFXK); const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+dur+.05); }

// an alarm makes its own sound only if the event that raised it hasn't just made one
function alarmSound(kind){ if(performance.now()-(UI.lastSfx||0)<600) return; sfx(kind==='bad'?'alarmHi':'alarmLo'); }
function sfx(kind){
  if(UI.silent) return;
  UI.lastSfx=performance.now();
  SFXK=['alarm','alarmHi','alarmLo','phone'].includes(kind)?vol('alarms'):vol('effects');
  if(SFXK<=0) return;
  const ac=audio(); if(!ac) return; const t=ac.currentTime;
  try{
    if(kind==='alarmHi'){ [0,.18].forEach(d=>tone(ac,988,t+d,.12,'triangle',.07)); return; }
    if(kind==='alarmLo'){ tone(ac,587,t,.22,'sine',.06); return; }
    if(kind==='trip'){ noise(ac,t,.3,.6,700); tone(ac,62,t,.4,'sine',.4); }
    else if(kind==='click'){ noise(ac,t,.06,.3,2600); }
    else if(kind==='alarm'){ [0,.34,.68].forEach(d=>{ tone(ac,880,t+d,.15,'square',.05); tone(ac,660,t+d+.17,.15,'square',.05); }); }
    else if(kind==='phone'){ [0,.55].forEach(d=>{ tone(ac,440,t+d,.4,'sine',.06); tone(ac,480,t+d,.4,'sine',.06); }); }

}
// a soft rushing wind during storms, louder as the gusts build
function updateWind(){
  const on=S&&S.weather&&S.weather.storm&&!S.paused&&UI.mode==='play'&&!UI.overlay;
  if(!on){ if(windGain) windGain.gain.value=0; return; }
  const ac=audio(); if(!ac){ if(windGain) windGain.gain.value=0; return; }
  if(!windGain){
    const len=ac.sampleRate*2, b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; }
    const s=ac.createBufferSource(), f=ac.createBiquadFilter(); s.buffer=b; s.loop=true; f.type='bandpass'; f.frequency.value=420;
    windGain=ac.createGain(); windGain.gain.value=0; s.connect(f).connect(windGain).connect(ac.destination); s.start();

// ---------- Plain English and the glossary ----------
const GLOSS=[
  ['normally open point','spare link','A switch kept open on purpose where two circuits meet. Close it to let one circuit feed the other\'s customers.'],
  ['NOP','spare link','Normally open point: a switch kept open on purpose where two circuits meet. Close it to let one circuit feed the other\'s customers.'],
  ['fault passage indicator','fault flag','A flag at a substation that trips when fault current passes through it. The fault is beyond the last red flag.'],
  ['FPI','fault flag','Fault passage indicator: a flag that trips when fault current passes through it. The fault is beyond the last red flag.'],
  ['back-feed','feed from next door','Supplying customers from a neighbouring circuit through a spare link, after the faulty part has been cut off.'],
  ['ring main unit','street substation','The set of switches at a local substation. Each switch connects it to the cable going one way or the other.'],
  ['primary substation','main substation','Where the network steps down to 11,000 volts and each circuit starts with its own breaker.'],
  ['primary','main substation','Where the network steps down to 11,000 volts and each circuit starts with its own breaker.'],
  ['Feeder loading','Circuit loading','How much current each circuit is carrying compared with what its breaker allows.'],
  ['feeder','circuit','One 11,000 volt circuit leaving a main substation through a chain of street substations. Each has a breaker and a maximum load.'],
  ['CML','customer minutes lost','Customer minutes lost: customers off multiplied by minutes off. The main measure of disruption.'],
  ['CI','interruptions','Customer interruptions: customers who lost power for 3 minutes or more.'],
  ['overcurrent','overload','More current than a circuit is built to carry.'],
  ['transient','temporary','A fault that clears by itself, like a branch brushing a line. Switching back on works.'],
  ['earth fault protection','fault protection','Equipment that spots current leaking to the ground and trips the breaker in a fraction of a second.'],
  ['energised','switched on','Connected to a supply.'],
  ['interconnector','link cable','A cable joining two circuits, normally left open at one end.'],
  ['permit to work','work permit','A safety document the control engineer issues once a cable is switched off at both ends and earthed. Nobody may work on the cable without one, and it must be cancelled before the earths come off.'],
  ['earths','safety earths','Heavy connections from a switched-off cable to the ground, applied at each end. If the cable were switched on by mistake, the current would go to ground instead of through the people working on it.'],
  ['flashover','flashover','What happens when power is switched onto an earthed cable: a huge current straight to ground, a bang and a tripped breaker.'],
  ['abnormal','not in normal position','A switch left in a different position from usual, for example a spare link that has been closed.'],
];
const GLOSS_RE=new RegExp('\\b('+GLOSS.map(g=>g[0].replace(/[.*+?^${}()|[\]\\-]/g,'\\$&')).join('|')+')\\b','gi');
const glossOf=m=>GLOSS.find(g=>g[0].toLowerCase()===m.toLowerCase());
// walk the text of a panel: swap jargon for plain words if asked, and underline each term with an explanation on hover
function decorate(root){
  if(!root) return;
  const plain=UI.settings.plain, nodes=[], w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){ const n=w.currentNode, p=n.parentElement; if(!p||p.closest('.term,script,style,textarea,input,select,option,svg')) continue; if(GLOSS_RE.test(n.nodeValue)) nodes.push(n); GLOSS_RE.lastIndex=0; }
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment(), s=n.nodeValue; let last=0, m;
    GLOSS_RE.lastIndex=0;
    while((m=GLOSS_RE.exec(s))){
      const g=glossOf(m[0]); if(!g) continue;
      if(g[0]===g[0].toUpperCase()&&m[0]!==g[0]) continue;   // acronyms must match their case
      frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const sp=document.createElement('span'); sp.className='term'; sp.dataset.tip=g[2];
      let txt=plain?g[1]:m[0]; if(plain&&m[0][0]===m[0][0].toUpperCase()&&m[0]!==m[0].toUpperCase()) txt=txt[0].toUpperCase()+txt.slice(1);
      sp.textContent=txt; frag.appendChild(sp); last=m.index+m[0].length;
    }
    frag.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(frag,n);
  });
}
function decorateAll(){ ['#panel','#boardSec','#objSec','#loadsH','#crewSec','#log','#newsSec','#wxSec','#legend','.bar .stats','#overlay','#coach'].forEach(s=>document.querySelectorAll(s).forEach(decorate)); }

// ---------- Switch previews ----------
function previewOp(sid,close){
  const res={sid,close,gain:[],lose:[],loads:[],risk:[],trip:false,block:null};
  if(locked(nodeOfSw(sid))){ res.block='this site is unsafe after the theft'; return res; }
  if(S.stuck&&S.stuck[sid]){ res.block='the switch is seized: send a crew to free it'; return res; }
  if(close&&primDead(sid)){ res.block=`${N[CB[sid].prim].name}'s transformer is out of service`; return res; }
  if(close){ const b=parallelBlock(sid); if(b){ res.block=b; return res; } }
  if(close&&docsOn()&&earthed(sid)){ res.block='its earth is on, and the switch is interlocked with it'; return res; }
  const sw2=Object.assign({},S.sw); sw2[sid]=close;
  const s0=solve(), s1=solve(sw2);
  RMUS.forEach(n=>{ if(S.lvOut[n]) return; const a=s0.island[n]!=null, b=s1.island[n]!=null; if(!a&&b) res.gain.push(n); if(a&&!b) res.lose.push(n); });
  CBIDS.forEach(id=>{ if(!sw2[id]) return; const a0=S.sw[id]?cbLoad(s0,id):0, a1=cbLoad(s1,id); if(Math.abs(a1-a0)>0.5||a1>rat(id)) res.loads.push({id,a:a1,r:rat(id)}); });
  const anyFault=S.faults.some(f=>f.active);
  CABLES.forEach(c=>{
    if(s0.cab[c.id]||!s1.cab[c.id]) return;
    const t=S.tested[c.id];
    if(t==='fault'&&faultOn(c.id)&&!faultOn(c.id).open) res.trip=true;
    else if(anyFault&&t!=='healthy'&&t!=='repaired') res.risk.push(c.id);
  });
  // earths are known to the control room, so this warning is always exact
  if(docsOn()) res.flash=CABLES.filter(c=>!s0.cab[c.id]&&s1.cab[c.id]&&cableEarthed(c.id)).map(c=>c.id);
  // trainees get the true answer
  if(S.diff==='trainee'){ res.trip=res.trip||S.faults.some(f=>f.active&&!(f.transient&&f.trips>0)&&!s0.cab[f.cable]&&s1.cab[f.cable]); res.risk=[]; }
  return res;
}

// ---------- Hints ----------
// Everything here uses the true state of the network, so hints are always right.
// the switch positions once every operation already ordered has been carried out
function projSw(){

// A rough "what an expert would have done": remote switching first, crews straight to the right place.
function expertCML(){
  const bad=new Set(S.faults.filter(f=>!f.transient).map(f=>f.cable)), onlyTransient=S.faults.length&&S.faults.every(f=>f.transient);
  const adj={}; Object.keys(N).forEach(k=>adj[k]=[]);
  CABLES.forEach(c=>{ if(bad.has(c.id)) return; adj[c.a].push(c.b); adj[c.b].push(c.a); });
  const reach=new Set(), q=[...PRIMS];
  while(q.length){ const n=q.shift(); adj[n].forEach(m=>{ if(!reach.has(m)&&N[m].kind!=='primary'){ reach.add(m); q.push(m); } }); }
  const nearRemote=n=>N[n].remote||INC[n].some(({c,end})=>N[c[other(end)]].remote);
  let cml=0;
  Object.keys(S.everOff||{}).forEach(n=>{
    let mins;
    if(onlyTransient) mins=3;
    else if(S.theft&&n in S.theft) mins=tt(NET.depot,N[n].m)+90;
    else if(!reach.has(n)){ const f=S.faults.find(f=>bad.has(f.cable)); mins=tt(NET.depot,N[n].m)+25+(f&&f.damage?DAMAGE[f.damage].mins:150); }
    else mins=nearRemote(n)?6:Math.min(50,tt(NET.depot,N[n].m)+10);
    cml+=N[n].cust*mins;
  });
  return Math.round(cml);
}
function pickTip(st,exp){
  if(st.safety||S.safety) return S.safetyTip||'A crew closed a switch onto a fault. Always prove a section is healthy (test or patrol it) before closing onto it by hand.';
  if(st.faultTrips) return 'Before switching a section back on, cut the fault off at both ends. Use the preview: hover a switch to see what it would do.';
  if(st.overloads) return 'Check the circuit loading before closing a spare link. If one neighbour can\'t take everyone, split the area between two.';
  if(S.media.some(m=>m.answered==='ignored')) return 'Answer the press when they call, even with a holding statement. Silence costs public confidence.';
  if(S.media.some(m=>m.result==='missed')) return 'Only promise restoration times you can keep. A missed promise does more harm than a cautious one.';
  if(exp&&st.cml>exp*1.8) return 'Get the healthy parts back first with remote switches (sites with a green dot only take 2 minutes), then send crews for the rest.';
  if(st.undos||st.hints) return 'Good work. Next time try it without hints or undo to earn every star.';
  return 'Nicely done. Try a harder difficulty or a storm shift next.';
}
function timelineSvg(){
  const hs=(S.hist||[]).concat([[S.t,offCount()]]); if(hs.length<2) return '';
  const W=420, H=110, t0=S.t0, t1=Math.max(S.t,t0+30), mx=Math.max(1,...hs.map(p=>p[1]));
  const L=46, x=t=>((t-t0)/(t1-t0))*(W-L-6)+L, y=v=>H-18-(v/mx)*(H-30);
  let d=`M${x(hs[0][0])},${y(0)} `+hs.map(p=>`L${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ')+` L${x(hs[hs.length-1][0])},${y(0)}Z`;
  const marks=S.log.filter(l=>l.kind==='bad'&&/tripped/.test(l.text)).map(l=>`<path class="tl-trip" d="M${x(l.t).toFixed(1)},${y(mx)-2} l-3.5,-6 h7z"/>`).join('');
  return `<svg class="tl" viewBox="0 0 ${W} ${H}" aria-label="Customers off over time"><path class="tl-a" d="${d}"/><line class="tl-ax" x1="${L}" x2="${W-4}" y1="${y(0)}" y2="${y(0)}"/>
    <text x="${L-5}" y="${y(mx)+4}" text-anchor="end">${fmtN(mx)}</text><text x="${L-5}" y="${y(0)}" text-anchor="end">0</text>

}

  const c=CAREER, season=seasonOf(c.week);
  SEED=seedFrom('career'+c.week+'-'+c.day+'-'+c.history.length);
  const list=SEASON_SCEN[season]; let scen=list[Math.floor(rand()*list.length)];
  if(c.day===4) scen=season==='Summer'?'festival':(rand()<0.5?'bigstorm':'storm');   // Fridays are the big ones
  const night=rand()<0.2&&!['planned','heatwave','festival','digin'].includes(scen);   // diggers work in daylight
  // now and then the season throws in some weather: heat in summer, wind in autumn and winter, snow in winter
  let wx=null; const roll=rand();
  if(!['planned','storm','bigstorm','heatwave','flood'].includes(scen)){
    if(season==='Summer') wx=roll<0.15?'heat':roll<0.25?'thunder':null;
    else if(season==='Winter') wx=roll<0.12?'snow':roll<0.24?'wind':null;
    else if(season==='Autumn'&&roll<0.12) wx='wind';
    else if(season==='Spring') wx=roll<0.05?'wind':roll<0.13?'thunder':null;
  }
  SEED=null;
  return {season,scen,night,wx,label:`Week ${c.week} · ${DAYNAMES[c.day]} · ${season}`};
}
function applyUpgrades(def,u){
  (u.remote||[]).forEach(n=>{ if(def.nodes[n]) def.nodes[n].remote=true; });
  (u.underground||[]).forEach(cid=>{ const c=def.cables.find(x=>x.id===cid); if(c) delete c.oh; });
  (u.backup||[]).forEach(n=>{ if(def.nodes[n]) def.nodes[n].backup=240; });
  if(u.depot2) def.depot2=[1228,334];
}
// ---------- Owning the network ----------
// Every cable has a condition out of 100 that wears down shift by shift; worn cables fail and seize more often.
// Each year brings a capital allowance for replacing worn assets and reinforcing busy circuits, developers ask for
// new connections, and demand creeps up.
const CAPEX_YEAR=60000, WEEKS_YEAR=16, REPLACE_COST={ug:18000,oh:12000}, REINFORCE={amps:80,cost:20000}, GROWTH_SHIFT=1.0004;
const yearOf = w=>Math.floor((w-1)/WEEKS_YEAR)+1;
function ensureAssets(c){
  if(!c.assets){ let s=seedFrom('assets'); const R=()=>(s=(s*16807)%2147483647,(s-1)/2147483646); c.assets={}; MEGAWATT.cables.forEach(x=>{ c.assets[x.id]=Math.round((x.oh?50:58)+R()*36); }); }
  MEGAWATT.cables.forEach(x=>{ if(c.assets[x.id]==null) c.assets[x.id]=90; });
  if(c.capital==null){ c.capital=CAPEX_YEAR; c.year=yearOf(c.week); }
  c.conns=c.conns||[]; c.reinforce=c.reinforce||[]; c.growth=c.growth||1; c.log=c.log||[];
}
// connections the career has agreed to, and feeders reinforced: applied to the network for every career shift
function applyCareerNet(def,ctx){
  (ctx.conns||[]).forEach(k=>{ const n=def.nodes[k.node]; if(!n) return; n.cust+=k.cust||0; n.xA=(n.xA||0)+(k.amps||0); });
  (ctx.reinforce||[]).forEach(cid=>{ const c=def.cables.find(x=>x.id===cid); if(c) c.rating=(c.rating||400)+REINFORCE.amps; });
}
const condBand = v=>v>=70?'good':v>=45?'fair':'poor';
// the kinds of new connection a developer might ask for
const CONN_KINDS=[
  {kind:'homes',label:'New housing estate',cust:[40,110],amps:0,fee:150,what:(n,k)=>`${k.cust} new homes on the edge of ${N[n].name}`},
  {kind:'ev',label:'Car charging hub',cust:[0,1],amps:[25,45],fee:220,what:(n,k)=>`a rapid car charging hub at ${N[n].name} drawing about ${k.amps} A at peak`},
  {kind:'business',label:'Business units',cust:[8,20],amps:[15,30],fee:260,what:(n,k)=>`${k.cust} business units at ${N[n].name} adding about ${k.amps} A`},
  {kind:'heat',label:'Heat pumps',cust:[0,1],amps:[20,35],fee:120,what:(n,k)=>`a street of homes at ${N[n].name} switching to heat pumps (about ${k.amps} A more in winter peaks)`},

// peak load on every breaker with the career network as it stands, with a request added if given
function careerPeak(extra){
  const prev=NET, def=clone(MEGAWATT); applyUpgrades(def,CAREER.upg); applyCareerNet(def,{conns:CAREER.conns.concat(extra?[extra]:[]),reinforce:CAREER.reinforce});
  useNetwork(def); const sol=solve(normalSw()), out={};
  CBIDS.forEach(id=>{ out[id]={a:Math.round(cbLoad(sol,id,CAREER.growth)),r:CB[id].rating,name:CB[id].name,feeder:CB[id].feeder,cable:id.split(':')[0]}; });
  const fed={}; if(extra) CBIDS.forEach(id=>{ const k=islandOfCB(sol,id); if(k!=null&&sol.islands[k].nodes.includes(extra.node)) fed.cb=id; });
  useNetwork(prev); return {cbs:out,cb:fed.cb};
}
function makeConnRequest(){
  const k=CONN_KINDS[Math.floor(Math.random()*CONN_KINDS.length)], nodes=Object.keys(MEGAWATT.nodes).filter(n=>MEGAWATT.nodes[n].kind!=='primary'&&MEGAWATT.nodes[n].cust>0);
  const node=nodes[Math.floor(Math.random()*nodes.length)], rr=a=>Array.isArray(a)?a[0]+Math.floor(Math.random()*(a[1]-a[0])):a;
  const r={kind:k.kind,node,cust:rr(k.cust),amps:rr(k.amps),week:CAREER.week}; r.fee=Math.round(((r.cust||0)*AMPS+(r.amps||0))*k.fee/10)*10+2000;
  return r;
}
function connText(r){ const prev=NET; useNetwork(MEGAWATT); const K=CONN_KINDS.find(k=>k.kind===r.kind), t=K.what(r.node,r); useNetwork(prev); return t; }
function acceptConn(yes){
  const r=CAREER.connReq; if(!r) return;
  if(yes){ CAREER.conns.push(r); CAREER.funds+=r.fee; toast(`Connection agreed: ${money(r.fee)} paid by the developer.`); sfx('chime'); }
  else { toast('Connection request declined.'); CAREER.declined=(CAREER.declined||0)+1; }
  CAREER.connReq=null; saveCareer(); renderOverlay();
}
function replaceAsset(cid){
  const c=MEGAWATT.cables.find(x=>x.id===cid); if(!c||!CAREER) return;
  const cost=c.oh?REPLACE_COST.oh:REPLACE_COST.ug;
  if(CAREER.capital<cost){ toast('Not enough capital left this year.'); return; }
  CAREER.capital-=cost; CAREER.assets[cid]=98; saveCareer(); toast(`${c.oh?'Line refurbished':'Cable replaced'}. Condition now 98.`); sfx('chime'); renderOverlay();
}
function reinforceFeeder(cid){
  if(!CAREER||CAREER.reinforce.includes(cid)) return;
  if(CAREER.capital<REINFORCE.cost){ toast('Not enough capital left this year.'); return; }
  CAREER.capital-=REINFORCE.cost; CAREER.reinforce.push(cid); saveCareer(); toast(`Circuit reinforced: +${REINFORCE.amps} A.`); sfx('chime'); renderOverlay();
}
// after every career shift: wear, growth, the end of the year, and the odd new request
function careerAfterShift(rep){
  const c=CAREER; ensureAssets(c);
  // repairs made during the shift (anything replaced from the register meanwhile is kept)
  if(S.cond&&S.cond0) Object.keys(S.cond).forEach(k=>{ if(c.assets[k]!=null) c.assets[k]=Math.min(100,c.assets[k]+S.cond[k]-S.cond0[k]); });
  // cables that broke down today are weaker for it; everything else wears a little
  const hit=new Set(S.faults.filter(f=>!f.transient||f.intermit).map(f=>f.cable));
  MEGAWATT.cables.forEach(x=>{ const v=c.assets[x.id]-(x.oh?0.4:0.25)-Math.random()*0.25-(hit.has(x.id)&&!S.faults.some(f=>f.cable===x.id&&f.repaired)?3:0); c.assets[x.id]=Math.max(5,Math.round(v*10)/10); });
  c.growth=Math.round(c.growth*GROWTH_SHIFT*100000)/100000;
  const y=yearOf(c.week);
  if(y>c.year){ const carry=Math.min(c.capital,15000); rep.year={year:y,lapsed:Math.max(0,c.capital-carry),carry}; c.capital=CAPEX_YEAR+carry; c.year=y; }
  if(!c.connReq&&Math.random()<0.3) c.connReq=makeConnRequest();
}

// A handover: the first trouble of the shift arrives before you do. The outgoing engineer works it for a while
// (not always the way you would), then you take the desk with things as they stand.
function handover(){
  const tStart=S.t, i=S.pending.findIndex(e=>INCIDENT_KINDS.has(e.kind)&&e.kind!=='workreq'); if(i<0) return false;
  const age=rint(25,75), pre=age+5, e0=S.pending[i], shift=e0.t-(tStart-age);
  // the outgoing shift began a little earlier, and the first incident came during it
  S.t=tStart-pre; S.t0=S.t;
  S.pending.forEach(e=>{ if(e===e0||e.t>=e0.t) ['t','at','until','failAt','back'].forEach(k=>{ if(e[k]!=null) e[k]-=shift; }); });
  S.pending.sort((a,b)=>a.t-b.t);
  UI.silent=true;
  try{
    for(let g=0;g<200&&S.t<tStart-0.01;g++){
      S.modal=null; S.pressPopup=null;
      // the outgoing engineer: right most of the time, a little slower than ideal, and leaves the paperwork to you
      if(!S.quiet&&rand()<0.6){ const p=hintPlan(), m=p.move; if(m&&(m.sw||['test','patrol','repair','clear','makesafe','lvfix','lvfuse','lvsafe','link','earth'].includes(m.kind))){ UI.hint={level:3,plan:p}; doHintMove(); } }
      S.paused=false; advance(Math.min(5,tStart-S.t)); S.paused=false; checkPhase();
      if(S.phase==='closed') break;
    }
  } finally { UI.silent=false; UI.hint=null; }
  if(S.phase==='closed'||S.quiet){ S.t=Math.max(S.t,tStart); return false; }
  // your shift starts now: the score, the log and the alarms are yours from here
  const off=RMUS.filter(n=>!S.on[n]), offN=offCount(), sol=solve();
  Object.assign(S,{t0:S.t,ci:0,cml:0,affected:0,ops:0,faultTrips:0,overloads:0,safety:0,hintsL3:0,undos:0,callsTotal:0,calls:{},everOff:{},maxOff:{},backAt:{},alarms:[],apDone:{}});
  off.forEach(n=>{ S.counted[n]=true; S.everOff[n]=S.t; });
  Object.keys(S.cost).forEach(k=>S.cost[k]=0);
  S.hist=[[S.t,offN]]; S.frames=[]; recordFrame();
  const found=S.faults.filter(f=>f.active&&!(f.transient&&f.trips>0)&&(f.found||S.tested[f.cable]==='fault')), unk=S.faults.filter(f=>f.active&&!(f.transient&&f.trips>0)&&!f.found&&S.tested[f.cable]!=='fault');
  const abn=Object.keys(S.sw).filter(s=>S.sw[s]!==!NOPS.has(s)).length, busy=S.crews.filter(cr=>cr.job||cr.queue.length);
  const notes=[];
  notes.push(offN?`${fmtN(offN)} customers are still off, at ${off.slice(0,3).map(n=>N[n].name).join(', ')}${off.length>3?' and more':''}.`:'Everyone is back on supply.');
  if(found.length) notes.push(`Damage found on ${found.map(f=>cableName(CBL[f.cable])).join(' and ')}.`);
  if(unk.length) notes.push(`${plural(unk.length,'fault')} not yet located: follow the fault flags.`);
  if(primsDown().length) notes.push(`${primsDown().map(p=>N[p].name).join(' and ')} transformer is out until about ${fmtT(S.primBack[primsDown()[0]])}.`);
  if(busy.length) notes.push(`Out on jobs: ${busy.map(cr=>`${cr.id} (${cr.job?jobText(cr.job).toLowerCase():'queued work'})`).join(', ')}.`);
  if(abn) notes.push(`${plural(abn,'switch','switches')} out of their normal position.`);
  if(docsOn()&&Object.keys(S.permits).length) notes.push(`Permits issued: ${Object.keys(S.permits).map(c=>S.permits[c].no).join(', ')}.`);
  S.handover=notes;
  S.log=[]; log(`Handover from the outgoing engineer at ${fmtT(S.t)}. ${notes.join(' ')}`,'warn');
  S.headline=`${fmtT(S.t)}: you take over the desk mid-incident. ${notes.join(' ')} It's yours now.`+headlineExtras();
  S.quiet=false; S.firstAt=S.t; S.paused=true; dirty=true;
  return true;
}

// what the shift cost against its budget, including the regulator's penalties for customers left without power
function shiftMoney(){
  const c=S.cost||{crew:0,overtime:0,contractors:0,welfare:0,materials:0,damage:0};
  const items=[['Crew time',Math.round(c.crew/60*120)],['Overtime (before 07:00 and after 17:00)',Math.round(c.overtime/60*210)],['Contractors',c.contractors],
    ['Welfare visits',c.welfare],['Welfare van',Math.round(c.van||0)],['Work requests stood down',c.wasted||0],['Planned work completed (credit)',-(S.worksDone||0)*WORK_CREDIT],['Mobile generator hire',Math.round(c.generators||0)],['Materials',c.materials],['Flood damage',c.damage],
    ['Regulator penalty: customer minutes lost',Math.round(S.cml*0.025)],['Regulator penalty: interruptions',Math.round(S.ci)]];
  // a severe storm counts as an exceptional event: the regulator waives most of the penalties
  if(exceptionalEvent()){ const pen=Math.round(S.cml*0.025)+Math.round(S.ci); items.push(['Exceptional event: storm penalties 75% waived',-Math.round(pen*0.75)]); }
  const spent=items.reduce((a,i)=>a+i[1],0), budget=shiftBudget(S.scen);
  return {items,spent,budget,result:budget-spent};
}

// ---------- End of a shift ----------
function onShiftEnd(){
  if(!S||S.ended) return; S.ended=true;
  const st=S.restored||snapshotStats(), sc=stars(st).s, rep={money:null,xp:0,promoted:false,ach:[],board:null};
  rep.ach=checkAchievements(st);
  rep.board=recordBoard(st,sc);
  if(S.ctx&&S.ctx.type==='career'&&CAREER){
    const m=shiftMoney(), objDone=(S.objectives||[]).filter(k=>OBJ[k]&&OBJ[k].fn()==='done').length, bonus=sc*1000;
    rep.money=m; rep.bonus=bonus; rep.xp=sc*100+objDone*40;
    CAREER.funds+=m.result+bonus; CAREER.xp+=rep.xp;
    CAREER.history.push({week:CAREER.week,day:CAREER.day,scen:S.scen,stars:sc,cml:Math.round(st.cml),result:m.result+bonus});
    if(m.result>0){ const a=unlock('budget'); if(a) rep.ach.push('budget'); }
    CAREER.day++; if(CAREER.day>=5){ CAREER.day=0; CAREER.week++; if(unlock('week')) rep.ach.push('week'); storyCheck('weekEnd'); }
    const nr=RANKS.reduce((r,x,i)=>CAREER.xp>=x.xp?i:r,0);
    if(nr>CAREER.rank){ CAREER.rank=nr; rep.promoted=RANKS[nr].name; if(unlock('promoted')) rep.ach.push('promoted'); storyCheck('promoted'); }
    if(CAREER.funds<0) storyCheck('broke');
    if(sc<=1) storyCheck('badShift'); else storyCheck('goodShift');
    if(CAREER.week>1&&CAREER.day===0&&(CAREER.week-1)%4===0) storyCheck('season');
    careerAfterShift(rep);
    saveCareer();
  }
  S.endReport=rep;
}
function finishEarly(){

  const open=S.faults.filter(f=>f.active).length+RMUS.filter(n=>S.theft[n]||S.flooded[n]).length+lvTodo().length;
  S.cost.materials+=open*3000;
  if(!isNormal()) S.cost.materials+=1000;
  if(docsOn()) recordStars();
  S.phase='closed'; S.closedAt=S.t; S.paused=true; S.modal='closed'; S.handedOver=true;
  log(`Shift handed over with ${plural(open,'job')} left for the next team.`,'warn');

}

// ---------- Achievements and leaderboards ----------
function unlock(id){
  const a=loadJ(ACH_KEY,{}); if(a[id]) return false;
  a[id]=Date.now(); saveJ(ACH_KEY,a);
  const d=ACH.find(x=>x[0]===id); if(d) toast(`Achievement unlocked: ${d[1]}`);
  return true;
}
function checkAchievements(st){
  const got=[], u=id=>{ if(unlock(id)) got.push(id); };
  u('first'); if(stars(st).s===3) u('three'); if(!st.hints&&!st.undos) u('nohint');
  RMUS.filter(n=>N[n].hospital).forEach(n=>{ if(S.everOff[n]!=null&&(S.maxOff[n]||0)<=10) u('hosp10'); });
  if((S.scen==='storm'||S.scen==='bigstorm')&&!st.faultTrips&&!S.handedOver) u('stormclean');
  if(S.scen==='planned'&&st.ci===0&&!S.handedOver) u('planned0');
  if(S.flood&&S.flood.state&&S.flood.state!=='damaged'&&S.flood.state!=='warned') u('floodsafe');

  if(S.shift==='s0') u('training'); if(S.ctx&&S.ctx.type==='daily') u('daily');

}
function boardKey(){ return S.ctx&&S.ctx.type==='daily'?'daily-'+S.ctx.date:S.ctx&&S.ctx.type==='career'?'career-'+S.scen:S.shift||('free-'+S.scen); }
function recordBoard(st,sc){

const SWKEYS = ()=>Object.keys(S.sw).sort();
function recordFrame(){
  if(!S||!S.frames) return;
  const sw=SWKEYS().map(k=>S.sw[k]?1:0).join(''), on=RMUS.map(n=>S.on[n]?1:0).join(''), last=S.frames[S.frames.length-1];
  if(last&&last.sw===sw&&last.on===on&&S.t-last.t<5) return;
  S.frames.push({t:S.t,sw,on,crews:S.crews.map(cr=>crewPos(cr).map(v=>Math.round(v))),off:offCount()});
  if(S.frames.length>800) S.frames.splice(1,1);
}
function startReplay(){
  if(!S||!S.frames||S.frames.length<2) return;
  UI.replay={i:0,playing:true,saved:JSON.stringify(Object.assign({},S,{def:null}))};
  UI.overlay=null; S.modal=null; S.sel=null; UI.hint=null; render(); showFrame(0);
}
function showFrame(i){
  const R=UI.replay; if(!R) return;
  R.i=Math.max(0,Math.min(S.frames.length-1,i));
  const f=S.frames[R.i], keys=SWKEYS();
  keys.forEach((k,j)=>S.sw[k]=f.sw[j]==='1'); RMUS.forEach((n,j)=>S.on[n]=f.on[j]==='1');
  S.t=f.t; S.crews.forEach((cr,j)=>{ cr.job=null; cr.queue=[]; if(f.crews[j]) cr.pos=f.crews[j]; });
  UI.pulse=null; renderStats(); renderSvg(false); renderReplayBar();
}
function exitReplay(){
  const R=UI.replay; if(!R) return;
  const def=S.def, s=JSON.parse(R.saved); s.def=def; S=s; UI.replay=null; S.modal='closed'; render();
}
function renderReplayBar(){
  const el=$('#replayBar'), R=UI.replay;

  const f=S.frames[R.i];

}

// ---------- Upgrades ----------
function upgradeChoices(u){
  if(u.pick==='node') return RMUS.filter(n=>!N[n].remote&&!(CAREER.upg.remote||[]).includes(n)).map(n=>[n,`${N[n].name} (${N[n].code})`]);
  if(u.pick==='ohline') return CABLES.filter(c=>c.oh&&!(CAREER.upg.underground||[]).includes(c.id)).map(c=>[c.id,cableName(c)]);
  if(u.pick==='feeder') return CBIDS.filter(id=>!(CAREER.upg.recloser||[]).includes(id)).map(id=>[id,`${CB[id].name} ${CB[id].feeder}`]);
  if(u.pick==='site') return RMUS.filter(n=>(N[n].hospital||N[n].site)&&!(CAREER.upg.backup||[]).includes(n)).map(n=>[n,N[n].hospital||N[n].site.name]);
  return null;
}
function upgradeOwned(u){
  const g=CAREER.upg;
  if(u.once) return !!g[u.id];
  if(u.max) return (g[u.id]||0)>=u.max;
  return false;
}
function buyUpgrade(id,choice){
  const u=UPGRADES.find(x=>x.id===id); if(!u||!CAREER) return;
  if(CAREER.funds<u.cost){ toast('Not enough funds for that yet.'); return; }
  const g=CAREER.upg;
  if(u.pick){ if(!choice) return; g[{node:'remote',ohline:'underground',feeder:'recloser',site:'backup'}[u.pick]].push(choice); }
  else if(u.once) g[u.id]=true; else g[u.id]=(g[u.id]||0)+1;
  CAREER.funds-=u.cost; saveCareer(); toast(`Bought: ${u.name}.`); sfx('chime'); renderOverlay();
}

function runFind(v){
  const q=v.trim().toLowerCase();
  // feeders, cables and teams as well as substations
  if(UI.mode==='play'&&S&&q){
    const fd=CBIDS.find(id=>`${CB[id].name} ${CB[id].feeder}`.toLowerCase()===q||CB[id].name.toLowerCase()===q||CB[id].feeder.toLowerCase()===q);
    if(fd){ S.sel={k:'node',id:CB[fd].prim,sw:fd}; render(); focusNode(CB[fd].prim); $('#find').value=''; $('#find').blur(); return; }
    const cb=CABLES.find(c=>cableName(c).toLowerCase()===q);
    if(cb){ S.sel={k:'cable',id:cb.id}; render(); focusNode(cb.a); $('#find').value=''; $('#find').blur(); return; }
    const ci=S.crews.findIndex(cr=>cr.id.toLowerCase()===q||cr.tag.toLowerCase()===q);
    if(ci>=0){ const cr=S.crews[ci], at=cr.job?cr.job.node:N[cr.at]?cr.at:null; showTab('teams'); if(at){ S.sel={k:'node',id:at}; render(); showTab('teams'); focusNode(at); } else toast(`${cr.id} is ${crewStatus(cr).toLowerCase()}.`); $('#find').value=''; $('#find').blur(); return; }
  }
  const id=findNode(v); if(!id){ if(v.trim()) toast(`Nothing called "${v}".`); return; }
  if(UI.mode==='play') S.sel={k:'node',id}; else E.sel={k:'node',id};
  render(); focusNode(id); $('#find').value=''; $('#find').blur();
}

function setSpeed(v){
  if(!S||S.phase==='closed') return;
  if(v===0) S.paused=!S.paused;
  else { S.speed=v; S.paused=false; }
  renderStats();
}
// sound may only start after the player has done something
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ UI.sfxReady=true; },{once:false,capture:true}));
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea')) return;
  const k=e.key, typing=e.ctrlKey||e.metaKey||e.altKey;
  if(k==='Escape'){
    const cm=$('#ctxMenu');
    if(cm&&!cm.hidden) hideCtx();
    else if(UI.alarmOpen){ UI.alarmOpen=false; renderAlarms(); }
    else if(UI.overlay==='pause') resumeFromPause();
    else if(UI.overlay==='title') {}
    else if(UI.overlay&&UI.overlay!=='home'&&UI.overlay!=='milestone'){ UI.overlay=null; render(); }
    else if(UI.hint){ UI.hint=null; render(); }
    else if(UI.mode==='play'&&S&&S.sel){ S.sel=null; render(); }
    // nothing left to close: Esc brings up the pause menu
    else if(!UI.overlay&&UI.mode==='play'&&S) openPause();
    hidePreview(); return;
  }
  if((k==='f'||k==='F')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ toggleFullscreen(); return; }
  if(UI.overlay) return;
  // Shift + 1–7 jumps to a side panel tab
  if(e.shiftKey&&/^Digit[1-7]$/.test(e.code)&&UI.mode==='play'){ const t=TABS[+e.code.slice(5)-1]; if(t){ e.preventDefault(); showTab(t[0]); } return; }
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'&&UI.mode==='play'){ e.preventDefault(); doUndo(); return; }
  if(typing) return;
  // the diagram from the keyboard: Enter selects what has focus, [ and ] step through a substation's switches, O and C open and close
  const fk=e.target.closest&&e.target.closest('#svg [data-k]');
  if(fk&&(k==='Enter'||k===' ')&&UI.mode==='play'){ e.preventDefault(); pick(fk); return; }
  if(UI.mode==='play'&&S&&S.sel&&S.sel.k==='node'&&(k==='['||k===']')){ const sws=INC[S.sel.id].map(({c,end})=>c.id+':'+end); const i=sws.indexOf(S.sel.sw); S.sel={k:'node',id:S.sel.id,sw:sws[(i+(k===']'?1:-1)+sws.length)%sws.length]}; render(); return; }
  if(UI.mode==='play'&&S&&(k==='o'||k==='O'||k==='c'||k==='C')){ const sid=S.sel&&S.sel.sw||(fk&&fk.dataset.k==='sw'?fk.dataset.id:null); if(sid){ orderOp(sid,k.toLowerCase()==='c'); } else toast('Select a switch first: click one, or select a substation and press [ or ].'); return; }
  if((k==='n'||k==='N')&&UI.mode==='play'){ skipAhead(); return; }
  if(k===' '&&UI.mode==='play'&&!e.target.closest('button,[data-k]')){ e.preventDefault(); setSpeed(0); return; }
  if(UI.mode==='play'&&['1','2','3'].includes(k)){ setSpeed(+k); return; }
  if(k==='s'||k==='S'){ UI.view='s'; render(); return; }
  if(k==='m'||k==='M'){ UI.view='m'; render(); return; }
  if((k==='h'||k==='H')&&UI.mode==='play'){ nextHint(); return; }
  if((k==='u'||k==='U')&&UI.mode==='play'){ doUndo(); return; }
  if(k==='+'||k==='='){ zoomAt(1/1.25); return; }
  if(k==='-'||k==='_'){ zoomAt(1.25); return; }
  if(k==='0'){ setVB(fullVB()); return; }
  if(k==='/'){ e.preventDefault(); $('#find').focus(); return; }
});
// arrow keys move between the side panel tabs
$('#sideTabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'&&e.key!=='Home'&&e.key!=='End') return;
  e.preventDefault(); e.stopPropagation();
  const i=TABS.findIndex(t=>t[0]===UI.tab), n=TABS.length;
  const j=e.key==='Home'?0:e.key==='End'?n-1:(i+(e.key==='ArrowRight'?1:-1)+n)%n;
  showTab(TABS[j][0]); $('#tab-'+TABS[j][0]).focus();
});

function editInput(e){
  if(UI.mode!=='edit') return;
  const t=e.target, d=E.def, sel=E.sel, n=sel&&sel.k==='node'?d.nodes[sel.id]:null, c=sel&&sel.k==='cable'?d.cables.find(x=>x.id===sel.id):null;
  switch(t.id){
    case 'e-name': d.name=clean(t.value,40)||'Untitled'; $('#netName').textContent=`Editing ${d.name}`; break;
    case 'e-size': { const S2={1000:560,1500:800,1600:900}; d.w=S2[+t.value]?+t.value:1000; d.h=S2[d.w]; break; }
    case 'e-open': if(e.type==='change') editLoad(t.value); return;
    case 'e-n-name': if(n) n.name=clean(t.value,32)||'Unnamed'; break;
    case 'e-n-code': if(n) n.code=clean(t.value,4).toUpperCase(); break;
    case 'e-n-cust': if(n) n.cust=Math.max(0,Math.min(5000,parseInt(t.value,10)||0)); break;
    case 'e-n-remote': if(n) n.remote=t.checked; break;
    case 'e-n-area': if(n){ const v=clean(t.value,24); if(v) n.area=v; else delete n.area; } break;
    case 'e-n-hosp': if(n){ const v=clean(t.value,40); if(v) n.hospital=v; else delete n.hospital; } break;
    case 'e-c-oh': if(c){ if(t.checked) c.oh=true; else delete c.oh; } break;
    case 'e-n-sl': if(n) n.sl=t.value; break;
    case 'e-c-nop': if(c){ if(t.value) c.nop=t.value; else delete c.nop; } break;
    case 'e-c-rating': if(c) c.rating=Math.max(50,Math.min(1000,parseInt(t.value,10)||400)); break;
    case 'e-c-feeder': if(c){ const v=clean(t.value,20); if(v) c.feeder=v; else delete c.feeder; } break;
    default: return;
  }
  editChanged(false);
}

// ======================= Main loop =======================
// A steady timer drives the clock. An error in one tick is reported but never stops the clock.
let lastTick=performance.now(), sideTimer=0, ticker=null;
function tick(){
  const now=performance.now(), dtReal=Math.min(0.25,(now-lastTick)/1000); lastTick=now;
  try{
    // the fault-current pulse fades after a few seconds, even with the clock paused
    if(UI.pulse&&now>UI.pulse.until){ UI.pulse=null; if(UI.mode==='play'&&S) renderSvg(false); }
    // if the browser isn't giving us animation frames, keep the boats and cars moving from here
    if(now-lastAnim>250) try{ moveMovers(); }catch(e){}
    updateWind();
    const R=UI.replay;
    if(R&&R.playing&&UI.mode==='play'){
      R.acc=(R.acc||0)+dtReal*6;
      if(R.acc>=1){ const n=Math.floor(R.acc); R.acc-=n; showFrame(R.i+n); if(R.i>=S.frames.length-1){ R.playing=false; renderReplayBar(); } }
    }
    if(UI.mode==='play'&&S&&!S.paused&&S.phase!=='closed'&&!UI.overlay){
      advance(dtReal*SPEEDS[S.speed]);
      checkAutoPause();
      sideTimer+=dtReal;
      if(dirty) render();
      else{
        lightUpdate();
        const ae=document.activeElement;
        if(sideTimer>2&&!(ae&&ae.closest&&ae.closest('.side'))){ sideTimer=0; renderSide(); }
      }
      if(UI.follow!=null) followStep();
    }
    if(UI.mode==='play') autoSave();
  }catch(err){ console.error('Open Point tick failed',err); }
}

function renderTimeline(){

  const used=[];

    const soon=it.dl&&it.t-S.t<=15;
